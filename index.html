  function applyTiling() {
    const config = Config.all();
    const gap = Number(config.gap) || 10;
    const layout = config.tilingLayout || 'master';
    const workspace = config.activeWorkspace;

    const tiled = [];
    windows.forEach(function (windowInstance) {
      if (windowInstance.mode === 'tiled' && windowInstance.workspace === workspace && !windowInstance.minimized) {
        tiled.push(windowInstance);
      }
    });

    if (!tiled.length) return;

    const area = workArea.width ? workArea : measureWorkArea();
    const count = tiled.length;
    const rects = [];

    if (layout === 'master' && count > 1) {
      const masterWidth = Math.round((area.width - gap) * 0.58);
      const stackWidth = area.width - masterWidth - gap;
      const stackHeight = Math.round((area.height - gap * (count - 2)) / (count - 1));
      rects.push({ x: area.x, y: area.y, w: masterWidth, h: area.height });
      for (let i = 1; i < count; i++) {
        rects.push({ x: area.x + masterWidth + gap, y: area.y + (i - 1) * (stackHeight + gap), w: stackWidth, h: stackHeight });
      }
    } else if (layout === 'columns') {
      const width = Math.round((area.width - gap * (count - 1)) / count);
      for (let i = 0; i < count; i++) rects.push({ x: area.x + i * (width + gap), y: area.y, w: width, h: area.height });
    } else if (layout === 'rows') {
      const height = Math.round((area.height - gap * (count - 1)) / count);
      for (let i = 0; i < count; i++) rects.push({ x: area.x, y: area.y + i * (height + gap), w: area.width, h: height });
    } else if (layout === 'stack') {
      for (let i = 0; i < count; i++) rects.push({ x: area.x + i * 14, y: area.y + i * 14, w: area.width - i * 28, h: area.height - i * 28 });
    } else {
      const columns = count === 1 ? 1 : count === 2 ? 2 : Math.ceil(Math.sqrt(count));
      const rows = Math.ceil(count / columns);
      const width = Math.round((area.width - gap * (columns - 1)) / columns);
      const height = Math.round((area.height - gap * (rows - 1)) / rows);
      for (let i = 0; i < count; i++) {
        const column = i % columns;
        const row = Math.floor(i / columns);
        rects.push({ x: area.x + column * (width + gap), y: area.y + row * (height + gap), w: width, h: height });
      }
    }

    tiled.forEach(function (windowInstance, index) {
      if (rects[index]) place(windowInstance, rects[index]);
    });

    scheduleSave();
  }

  function scheduleTiling() {
    clearTimeout(tilingTimer);
    tilingTimer = setTimeout(applyTiling, 30);
  }

  /* — 10.2. Фокус и порядок — */
  function focus(id) {
    const windowInstance = windows.get(id);
    if (!windowInstance) return;
    if (windowInstance.minimized) restore(id);
    if (windowInstance.workspace !== Config.get('activeWorkspace')) setWorkspaceOf(id, Config.get('activeWorkspace'));

    }

    if (mode === 'float') {
      windowInstance.element.classList.remove('is-maximized', 'is-tiled');
      const rect = windowInstance.savedRect || centerRect(windowInstance.app.defaultWidth || 760, windowInstance.app.defaultHeight || 520);
      place(windowInstance, rect);
    }

    if (mode === 'max') {
      windowInstance.element.classList.add('is-maximized');
      const area = workArea.width ? workArea : measureWorkArea();
      place(windowInstance, { x: 0, y: 0, w: window.innerWidth, h: window.innerHeight });
      windowInstance.element.classList.add('is-fullscreen-internal');
    } else {

    windowInstance.element.classList.add('is-minimized');

      windowInstance.element.classList.remove('is-active');

    scheduleSave();
  }

      Bus.emit('window:closed', windowInstance);

    };

    Bus.emit('window:closing', windowInstance);
    windowInstance.element.classList.add('is-closing');
    setTimeout(finish, Config.get('animations') ? 200 : 10);
  }

  /* — 10.4. Рабочие столы — */
  function setWorkspaceOf(id, workspace) {
    const windowInstance = windows.get(id);
    if (!windowInstance) return;
    windowInstance.workspace = workspace;
    applyWorkspaceVisibility();
    scheduleSave();
  }

  function setWorkspace(number) {
    const total = Number(Config.get('workspaces')) || 3;
    const target = Util.clamp(number, 1, total);
    Config.set('activeWorkspace', target);
    applyWorkspaceVisibility();
    Topbar.renderWorkspaces();
    scheduleTiling();
    Bus.emit('workspace:changed', target);
  }

  function applyWorkspaceVisibility() {
    const current = Config.get('activeWorkspace');
    windows.forEach(function (windowInstance) {
      const visible = windowInstance.workspace === current;
      windowInstance.element.style.visibility = visible ? 'visible' : 'hidden';
      windowInstance.element.style.pointerEvents = visible ? '' : 'none';
      if (!visible) windowInstance.element.classList.remove('is-active');
    });
    if (activeId && windows.get(activeId) && windows.get(activeId).workspace !== current) {
      const first = Array.from(windows.values()).find(function (w) { return w.workspace === current && !w.minimized; });
      if (first) focus(first.id);
      else activeId = null;
    }
    Dock.update();
  }

  function windowsOnWorkspace(number) {
    const target = number || Config.get('activeWorkspace');
    return Array.from(windows.values()).filter(function (w) { return w.workspace === target; });
  }

  /* — 10.5. Создание окна — */
  function create(app, options) {
    const opts = options || {};
    measureWorkArea();

    const id = Util.uniqueId('window');
    const element = document.createElement('section');
    element.className = 'pyos-window';
    element.dataset.id = id;
    element.dataset.app = app.id;

    const width = opts.width || app.defaultWidth || 780;
    const height = opts.height || app.defaultHeight || 540;

    let rect;
    if (opts.rect) rect = opts.rect;
    else if (opts.mode === 'max') rect = { x: 0, y: 0, w: window.innerWidth, h: window.innerHeight };
    else rect = centerRect(width, height);

    element.style.width = rect.w + 'px';
    element.style.height = rect.h + 'px';
    element.style.transform = 'translate3d(' + rect.x + 'px,' + rect.y + 'px,0)';
    element.style.zIndex = String(++zCounter);
    element.style.setProperty('--pyos-open-transform', 'translate3d(' + rect.x + 'px,' + rect.y + 'px,0)');

    element.innerHTML =
      '<header class="pyos-window__header">' +
        '<span class="pyos-window__icon">' + Icons.get(app.icon || 'window', 19) + '</span>' +
        '<h2 class="pyos-window__title">' + Util.escapeHtml(opts.title || app.name) + '</h2>' +
        '<span class="pyos-window__badge pyos-hidden"></span>' +
        '<div class="pyos-window__controls">' +
          '<button type="button" class="pyos-window__control" data-control="pin" data-tooltip="Поверх остальных окон">' + Icons.get('pin', 16) + '</button>' +
          '<button type="button" class="pyos-window__control" data-control="tile" data-tooltip="Закрепить в сетке">' + Icons.get(app.tileIcon || 'grid', 16) + '</button>' +
          '<button type="button" class="pyos-window__control" data-control="minimize" data-tooltip="Свернуть">' + Icons.get('minimize', 16) + '</button>' +
          '<button type="button" class="pyos-window__control pyos-window__control--max" data-control="maximize" data-tooltip="Развернуть">' + Icons.get('maximize', 16) + '</button>' +
          '<button type="button" class="pyos-window__control pyos-window__control--close" data-control="close" data-tooltip="Закрыть">' + Icons.get('close', 16) + '</button>' +
        '</div>' +
      '</header>' +
      '<div class="pyos-window__body"></div>' +
      ['north', 'south', 'east', 'west', 'north-east', 'north-west', 'south-east', 'south-west']
        .map(function (direction) { return '<div class="pyos-window__handle" data-direction="' + direction + '"></div>'; })
        .join('');

    const windowInstance = {
      id: id,
      app: app,
      element: element,
      header: element.querySelector('.pyos-window__header'),
      body: element.querySelector('.pyos-window__body'),
      titleElement: element.querySelector('.pyos-window__title'),
      badgeElement: element.querySelector('.pyos-window__badge'),
      rect: rect,
      savedRect: null,
      mode: opts.mode || (Util.isSmallScreen() && Config.get('mobileFullscreen') ? 'max' : (Config.get('defaultWindowMode') === 'tiled' ? 'tiled' : 'float')),
      workspace: opts.workspace || Config.get('activeWorkspace'),
      minimized: false,
      alwaysOnTop: false,
      minWidth: app.minWidth || 320,
      minHeight: app.minHeight || 200,
      onClose: opts.onClose || null,
      unmount: null
    };

    element.setAttribute('data-mode', windowInstance.mode);
    windows.set(id, windowInstance);
    desktop.appendChild(element);

    if (windowInstance.mode === 'max') {
      element.classList.add('is-maximized', 'is-fullscreen-internal');
      place(windowInstance, { x: 0, y: 0, w: window.innerWidth, h: window.innerHeight });
    } else if (windowInstance.mode === 'tiled') {
      element.classList.add('is-tiled');
    }

    requestAnimationFrame(function () { element.classList.add('is-opening'); });
    setTimeout(function () { element.classList.remove('is-opening'); }, 520);

    bindWindow(windowInstance);

    const api = {
      window: windowInstance,
      config: Config.all(),
      setTitle: function (title) { windowInstance.titleElement.textContent = title; windowInstance.title = title; Dock.update(); },
      setBadge: function (text) {
        if (!text) { windowInstance.badgeElement.classList.add('pyos-hidden'); windowInstance.badgeElement.textContent = ''; }
        else { windowInstance.badgeElement.classList.remove('pyos-hidden'); windowInstance.badgeElement.textContent = text; }
      },
      notify: Notifications,
      focus: function () { focus(windowInstance.id); },
      close: function () { close(windowInstance.id); },
      openApp: openApp,
      fs: FileSystem,
      bus: Bus,
      ui: UI,
      icons: Icons,
      util: Util
    };

    try {
      const mounted = app.mount ? app.mount(windowInstance.body, api) : null;
      if (mounted && typeof mounted.unmount === 'function') windowInstance.unmount = mounted.unmount;
    } catch (error) {
      console.error('[PyOS] Ошибка запуска приложения ' + app.id, error);
      windowInstance.body.innerHTML = '<div class="pyos-empty">' + Icons.get('error', 40) + '<div>Приложение не запустилось</div><div style="font-size:12px">' + Util.escapeHtml(error.message) + '</div></div>';
    }

    focus(id);
    if (windowInstance.mode === 'tiled') scheduleTiling();

    Bus.emit('window:created', windowInstance);
    Dock.update();
    scheduleSave();
    return windowInstance;
  }

  function bindWindow(windowInstance) {
    const element = windowInstance.element;
    const header = windowInstance.header;

    element.addEventListener('pointerdown', function () { focus(windowInstance.id); }, true);

    /* Кнопки управления */
    element.querySelectorAll('[data-control]').forEach(function (button) {
      button.addEventListener('click', function (event) {
        event.stopPropagation();
        const control = button.dataset.control;
        if (control === 'close') close(windowInstance.id);
        if (control === 'minimize') minimize(windowInstance.id);
        if (control === 'maximize') setMode(windowInstance.id, windowInstance.mode === 'max' ? 'float' : 'max');
        if (control === 'tile') setMode(windowInstance.id, windowInstance.mode === 'tiled' ? 'float' : 'tiled');
        if (control === 'pin') {
          windowInstance.alwaysOnTop = !windowInstance.alwaysOnTop;
          element.classList.toggle('is-always-on-top', windowInstance.alwaysOnTop);
          button.classList.toggle('is-active', windowInstance.alwaysOnTop);
          element.style.zIndex = String(windowInstance.alwaysOnTop ? 99999 : ++zCounter);
          Notifications.info(windowInstance.alwaysOnTop ? 'Окно закреплено поверх' : 'Закрепление снято', windowInstance.app.name);
        }
      });
    });

    /* Контекстное меню заголовка */
    function showHeaderMenu(event) {
      event.preventDefault();
      const workspaceItems = [];
      const total = Number(Config.get('workspaces')) || 3;
      for (let i = 1; i <= total; i++) {
        workspaceItems.push({
          label: 'Рабочий стол ' + i,
          icon: 'layers',
          active: windowInstance.workspace === i,
          action: function () { setWorkspaceOf(windowInstance.id, i); setWorkspace(i); }
        });
      }

      UI.openMenu([
        { type: 'title', label: windowInstance.app.name },
        { label: windowInstance.mode === 'float' ? 'Закрепить в сетке' : 'Сделать плавающим', icon: windowInstance.mode === 'float' ? 'grid' : 'window', action: function () { setMode(windowInstance.id, windowInstance.mode === 'float' ? 'tiled' : 'float'); } },
        { label: windowInstance.mode === 'max' ? 'Восстановить размер' : 'Развернуть на весь экран', icon: windowInstance.mode === 'max' ? 'fullscreen-exit' : 'fullscreen', action: function () { setMode(windowInstance.id, windowInstance.mode === 'max' ? 'float' : 'max'); } },
        { label: 'Прижать к левой половине', icon: 'columns', action: function () { setMode(windowInstance.id, 'float'); snapNow(windowInstance, 'left'); } },
        { label: 'Прижать к правой половине', icon: 'columns', action: function () { setMode(windowInstance.id, 'float'); snapNow(windowInstance, 'right'); } },
        { label: 'По центру экрана', icon: 'move', action: function () { setMode(windowInstance.id, 'float'); place(windowInstance, centerRect(windowInstance.rect.w, windowInstance.rect.h)); } },
        '-',
        { label: windowInstance.alwaysOnTop ? 'Снять закрепление поверх' : 'Поверх остальных окон', icon: 'pin', active: windowInstance.alwaysOnTop, action: function () { element.querySelector('[data-control="pin"]').click(); } },
        { label: 'Свернуть', icon: 'minimize', action: function () { minimize(windowInstance.id); } },
        { label: 'Переместить на рабочий стол', icon: 'layers', submenu: workspaceItems },
        '-',
        { label: 'Закрыть окно', icon: 'close', action: function () { close(windowInstance.id); } }
      ], event.clientX, event.clientY);
    }

    header.addEventListener('contextmenu', showHeaderMenu);
    UI.attachLongPress(header, showHeaderMenu, 520);

    /* Перетаскивание */
    let drag = null;

    header.addEventListener('pointerdown', function (event) {
      if (event.button !== 0 && event.pointerType === 'mouse') return;
      if (event.target.closest('button')) return;

      if (windowInstance.mode !== 'float') {
        setMode(windowInstance.id, 'float');
        place(windowInstance, Object.assign({}, windowInstance.rect, { x: event.clientX - windowInstance.rect.w / 2, y: Math.max(workArea.y, event.clientY - 22) }));
      }

      drag = {
        offsetX: event.clientX - windowInstance.rect.x,
        offsetY: event.clientY - windowInstance.rect.y,
        pointerX: event.clientX,
        pointerY: event.clientY,
        moved: false,
        pointerId: event.pointerId,
        snap: null
      };

      element.classList.add('is-dragging');
      header.setPointerCapture(event.pointerId);
      event.preventDefault();
    });

    header.addEventListener('pointermove', function (event) {
      if (!drag) return;
      drag.pointerX = event.clientX;
      drag.pointerY = event.clientY;
      if (!drag.moved && Math.abs(event.movementX) + Math.abs(event.movementY) > 0) drag.moved = true;

      Util.scheduleFrame('drag:' + windowInstance.id, function () {
        if (!drag) return;
        const x = Util.clamp(drag.pointerX - drag.offsetX, -windowInstance.rect.w + 90, window.innerWidth - 90);
        const y = Util.clamp(drag.pointerY - drag.offsetY, 0, window.innerHeight - 46);
        windowInstance.element.style.transform = 'translate3d(' + x + 'px,' + y + 'px,0)';
        windowInstance.rect.x = x;
        windowInstance.rect.y = y;

        if (Config.get('snapEnabled')) {
          const zone = detectSnapZone(drag.pointerX, drag.pointerY);
          drag.snap = zone;
          if (zone) showSnapPreview(zone); else hideSnapPreview();
        }
      });
    });

    header.addEventListener('pointerup', function (event) {
      if (!drag) return;
      const snapZone = drag.snap;
      drag = null;
      element.classList.remove('is-dragging');
      hideSnapPreview();

      if (snapZone) snapNow(windowInstance, snapZone);
      header.releasePointerCapture && header.hasPointerCapture && header.hasPointerCapture(event.pointerId)
        ? header.releasePointerCapture(event.pointerId)
        : null;
      scheduleSave();
    });

    header.addEventListener('pointercancel', function () {
      drag = null;
      element.classList.remove('is-dragging');
      hideSnapPreview();
    });

    header.addEventListener('dblclick', function (event) {
      if (event.target.closest('button')) return;
      setMode(windowInstance.id, windowInstance.mode === 'max' ? 'float' : 'max');
    });

    /* Изменение размера */
    element.querySelectorAll('.pyos-window__handle').forEach(function (handle) {
      let resize = null;

      handle.addEventListener('pointerdown', function (event) {
        if (windowInstance.mode === 'max' || windowInstance.mode === 'tiled') setMode(windowInstance.id, 'float');
        resize = {
          direction: handle.dataset.direction,
          startX: event.clientX,
          startY: event.clientY,
          rect: Object.assign({}, windowInstance.rect)
        };
        element.classList.add('is-resizing');
        handle.setPointerCapture(event.pointerId);
        event.preventDefault();
        event.stopPropagation();
      });

      handle.addEventListener('pointermove', function (event) {
        if (!resize) return;
        const deltaX = event.clientX - resize.startX;
        const deltaY = event.clientY - resize.startY;
        const direction = resize.direction;

        Util.scheduleFrame('resize:' + windowInstance.id, function () {
          if (!resize) return;
          let x = resize.rect.x;
          let y = resize.rect.y;
          let width = resize.rect.w;
          let height = resize.rect.h;

          if (direction.indexOf('east') !== -1) width = resize.rect.w + deltaX;
          if (direction.indexOf('south') !== -1) height = resize.rect.h + deltaY;
          if (direction.indexOf('west') !== -1) { width = resize.rect.w - deltaX; x = resize.rect.x + deltaX; }
          if (direction.indexOf('north') !== -1 && direction !== 'north-east' && direction !== 'north-west' || direction === 'north-east' || direction === 'north-west') {
            if (direction.indexOf('north') !== -1) { height = resize.rect.h - deltaY; y = resize.rect.y + deltaY; }
          }

          if (width < windowInstance.minWidth) {
            if (direction.indexOf('west') !== -1) x -= (windowInstance.minWidth - width);
            width = windowInstance.minWidth;
          }
          if (height < windowInstance.minHeight) {
            if (direction.indexOf('north') !== -1) y -= (windowInstance.minHeight - height);
            height = windowInstance.minHeight;
          }

          place(windowInstance, { x: x, y: y, w: width, h: height });
        });
      });

      const stopResize = function (event) {
        if (!resize) return;
        resize = null;
        element.classList.remove('is-resizing');
        if (handle.hasPointerCapture && handle.hasPointerCapture(event.pointerId)) handle.releasePointerCapture(event.pointerId);
        Bus.emit('window:resized', windowInstance);
        scheduleSave();
      };

      handle.addEventListener('pointerup', stopResize);
      handle.addEventListener('pointercancel', stopResize);
    });
  }

  /* — 10.6. Прижатие к краям — */
  function detectSnapZone(x, y) {
    const edge = 22;
    const area = workArea.width ? workArea : measureWorkArea();
    const cornerSize = 110;

    if (y <= area.y - 4) return 'maximize';
    if (x <= edge) return y <= cornerSize ? 'top-left' : (y >= window.innerHeight - cornerSize ? 'bottom-left' : 'left');
    if (x >= window.innerWidth - edge) return y <= cornerSize ? 'top-right' : (y >= window.innerHeight - cornerSize ? 'bottom-right' : 'right');
    return null;
  }

  function snapNow(windowInstance, zone) {
    const area = workArea.width ? workArea : measureWorkArea();
    const gap = Number(Config.get('gap')) || 10;
    const halfWidth = Math.round((area.width - gap) / 2);
    const halfHeight = Math.round((area.height - gap) / 2);

    if (!windowInstance.savedRect) windowInstance.savedRect = Object.assign({}, windowInstance.rect);

    const targets = {
      left: { x: area.x, y: area.y, w: halfWidth, h: area.height },
      right: { x: area.x + halfWidth + gap, y: area.y, w: halfWidth, h: area.height },
      'top-left': { x: area.x, y: area.y, w: halfWidth, h: halfHeight },
      'top-right': { x: area.x + halfWidth + gap, y: area.y, w: halfWidth, h: halfHeight },
      'bottom-left': { x: area.x, y: area.y + halfHeight + gap, w: halfWidth, h: halfHeight },
      'bottom-right': { x: area.x + halfWidth + gap, y: area.y + halfHeight + gap, w: halfWidth, h: halfHeight }
    };

    if (zone === 'maximize') { setMode(windowInstance.id, 'max'); return; }
    if (targets[zone]) {
      if (windowInstance.mode !== 'float') setMode(windowInstance.id, 'float');
      place(windowInstance, targets[zone]);
      Bus.emit('window:snapped', { window: windowInstance, zone });
    }
  }

  function showSnapPreview(zone) {
    const area = workArea.width ? workArea : measureWorkArea();
    const gap = Number(Config.get('gap')) || 10;
    const halfWidth = Math.round((area.width - gap) / 2);
    const halfHeight = Math.round((area.height - gap) / 2);

    let rect = null;
    if (zone === 'maximize') rect = { x: 0, y: 0, w: window.innerWidth, h: window.innerHeight };
    else if (zone === 'left') rect = { x: area.x, y: area.y, w: halfWidth, h: area.height };
    else if (zone === 'right') rect = { x: area.x + halfWidth + gap, y: area.y, w: halfWidth, h: area.height };
    else if (zone === 'top-left') rect = { x: area.x, y: area.y, w: halfWidth, h: halfHeight };
    else if (zone === 'top-right') rect = { x: area.x + halfWidth + gap, y: area.y, w: halfWidth, h: halfHeight };
    else if (zone === 'bottom-left') rect = { x: area.x, y: area.y + halfHeight + gap, w: halfWidth, h: halfHeight };
    else if (zone === 'bottom-right') rect = { x: area.x + halfWidth + gap, y: area.y + halfHeight + gap, w: halfWidth, h: halfHeight };

    if (!rect) { hideSnapPreview(); return; }

    snapPreview.style.width = rect.w + 'px';
    snapPreview.style.height = rect.h + 'px';
    snapPreview.style.transform = 'translate3d(' + rect.x + 'px,' + rect.y + 'px,0)';
    snapPreview.classList.add('is-visible');
  }

  function hideSnapPreview() { snapPreview.classList.remove('is-visible'); }

  /* — 10.7. Открытие приложений — */
  function openApp(appId, options) {
    const app = Apps.get(appId);
    if (!app) {
      Notifications.error('Приложение не найдено', appId);
      return null;
    }

    if (app.singleton !== false) {
      let existing = null;
      windows.forEach(function (windowInstance) { if (windowInstance.app.id === appId) existing = windowInstance; });
      if (existing) {
        if (existing.workspace !== Config.get('activeWorkspace')) { setWorkspaceOf(existing.id, Config.get('activeWorkspace')); }
        if (existing.minimized) restore(existing.id); else focus(existing.id);
        Bus.emit('app:reopen', existing);
        return existing;
      }
    }

    Dock.markLaunching(appId);
    return create(app, options || {});
  }

  function list() { return Array.from(windows.values()); }
  function get(id) { return windows.get(id); }
  function findByApp(appId) { return Array.from(windows.values()).find(function (w) { return w.app.id === appId; }); }
  function count() { return windows.size; }

  /* — 10.8. Сохранение и восстановление сессии — */
  const scheduleSave = Util.debounce(function () { saveSession(); }, 500);

  function saveSession() {
    if (!Config.get('restoreSession')) return;
    const snapshot = {
      activeWorkspace: Config.get('activeWorkspace'),
      activeApp: activeId && windows.get(activeId) ? windows.get(activeId).app.id : null,
      windows: Array.from(windows.values()).map(function (windowInstance) {
        return {
          app: windowInstance.app.id,
          mode: windowInstance.mode,
          minimized: windowInstance.minimized,
          workspace: windowInstance.workspace,
          alwaysOnTop: windowInstance.alwaysOnTop,
          rect: windowInstance.rect,
          savedRect: windowInstance.savedRect,
          z: Number(windowInstance.element.style.zIndex) || 100,
          title: windowInstance.titleElement.textContent
        };
      })
    };
    Store.setJson('session', snapshot);
  }

  function restoreSession() {
    if (!Config.get('restoreSession')) return;
    const snapshot = Store.getJson('session', null);
    if (!snapshot || !Array.isArray(snapshot.windows) || !snapshot.windows.length) return;

    let restored = 0;
    snapshot.windows.forEach(function (item) {
      const app = Apps.get(item.app);
      if (!app) return;
      try {
        const windowInstance = create(app, {
          rect: item.rect,
          mode: 'float',
          workspace: item.workspace || 1,
          title: item.title
        });
        if (item.mode && item.mode !== 'float') setMode(windowInstance.id, item.mode);
        if (item.minimized) minimize(windowInstance.id);
        if (item.alwaysOnTop) windowInstance.element.querySelector('[data-control="pin"]').click();
        if (item.savedRect) windowInstance.savedRect = item.savedRect;
        restored += 1;
      } catch (error) {
        console.warn('[PyOS] Не удалось восстановить окно', item.app, error);
      }
    });

    if (snapshot.activeWorkspace) setWorkspace(snapshot.activeWorkspace);
    if (restored) Notifications.info('Сессия восстановлена', 'Открыто окон: ' + restored);
  }

  function closeAll() {
    Array.from(windows.keys()).forEach(close);
  }

  function minimizeAll() {
    Array.from(windows.values()).forEach(function (windowInstance) {
      if (!windowInstance.minimized && windowInstance.workspace === Config.get('activeWorkspace')) minimize(windowInstance.id);
    });
  }

  function floatAll() {
    Array.from(windows.values()).forEach(function (windowInstance) {
      if (windowInstance.mode === 'tiled') setMode(windowInstance.id, 'float');
    });
  }

  function tileAll() {
    const onWorkspace = windowsOnWorkspace();
    onWorkspace.forEach(function (windowInstance) {
      if (windowInstance.mode !== 'tiled') setMode(windowInstance.id, 'tiled');
    });
    scheduleTiling();
  }

  /* — 10.9. Реакция на изменение окна браузера — */
  const onViewportChange = Util.debounce(function () {
    measureWorkArea();
    const area = workArea;

    windows.forEach(function (windowInstance) {
      if (windowInstance.mode === 'max') {
        place(windowInstance, { x: 0, y: 0, w: window.innerWidth, h: window.innerHeight });
      } else if (windowInstance.mode === 'float') {
        const width = Math.min(windowInstance.rect.w, area.width);
        const height = Math.min(windowInstance.rect.h, area.height);
        const x = Util.clamp(windowInstance.rect.x, -width + 90, window.innerWidth - 90);
        const y = Util.clamp(windowInstance.rect.y, 0, window.innerHeight - 46);
        place(windowInstance, { x: x, y: y, w: width, h: height });
      }
    });

    scheduleTiling();
    Bus.emit('viewport:changed', { width: window.innerWidth, height: window.innerHeight });
  }, 140);

  window.addEventListener('resize', onViewportChange, { passive: true });
  window.addEventListener('orientationchange', onViewportChange, { passive: true });

  Bus.on('config:changed', function (event) {
    if (event.path === 'tilingLayout' || event.path === 'gap') { measureWorkArea(); scheduleTiling(); }
    if (event.path === 'workspaces') Topbar.renderWorkspaces();
  });

  return {
    create, close, focus, minimize, restore, setMode, setWorkspace, setWorkspaceOf,
    windowsOnWorkspace, applyTiling: scheduleTiling, measureWorkArea, openApp,
    list, get, findByApp, getActive, count, saveSession, restoreSession,
    closeAll, minimizeAll, floatAll, tileAll, get workArea() { return measureWorkArea(); }
  };
})();

/* ─────────────────────────────────────────────────────────────────────────
   МОДУЛЬ 11. РЕЕСТР ПРИЛОЖЕНИЙ
   ───────────────────────────────────────────────────────────────────────── */
const Apps = (function () {
  const registry = new Map();

  function register(definition) {
    const app = Object.assign({
      id: definition.id,
      name: definition.name,
      description: definition.description || '',
      icon: definition.icon || 'window',
      color: definition.color || '#7c6cff',
      singleton: definition.singleton !== false,
      defaultWidth: definition.defaultWidth || 820,
      defaultHeight: definition.defaultHeight || 560,
      minWidth: definition.minWidth || 340,
      minHeight: definition.minHeight || 220,
      mount: definition.mount
    }, definition);
    registry.set(app.id, app);
    return app;
  }

  function get(id) { return registry.get(id); }
  function all() { return Array.from(registry.values()); }
  function has(id) { return registry.has(id); }

  return { register, get, all, has };
})();

/* ─────────────────────────────────────────────────────────────────────────
   МОДУЛЬ 12. ДОК
   ───────────────────────────────────────────────────────────────────────── */
const Dock = (function () {
  const dock = document.getElementById('pyos-dock');
  const items = new Map();

  function build() {
    dock.innerHTML = '';
    items.clear();

    const launcherItem = createItem({ id: '__launcher', name: 'Приложения', icon: 'apps', color: '#3b9dff' }, function () { Launcher.toggle(); });
    launcherItem.classList.add('is-static');
    dock.appendChild(launcherItem);

    const separator = document.createElement('div');
    separator.className = 'pyos-dock__separator';
    dock.appendChild(separator);

    Apps.all().forEach(function (app) {
      const item = createItem(app, function (event) { onDockItemClick(app, event); });
      items.set(app.id, item);
      dock.appendChild(item);
    });

    const terminalSeparator = document.createElement('div');
    terminalSeparator.className = 'pyos-dock__separator';
    dock.appendChild(terminalSeparator);

    const trashItem = createItem({ id: '__trash', name: 'Свернуть все окна', icon: 'move', color: '#64748b' }, function () { WindowManager.minimizeAll(); });
    dock.appendChild(trashItem);

    update();
  }

  function createItem(descriptor, onClick) {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'pyos-dock__item';
    button.dataset.app = descriptor.id;
    button.style.color = descriptor.color || 'var(--pyos-text)';
    button.innerHTML =
      '<span class="pyos-dock__label">' + Util.escapeHtml(descriptor.name) + '</span>' +
      '<span class="pyos-dock__icon">' + Icons.get(descriptor.icon || 'window', 26) + '</span>';

    button.addEventListener('click', function (event) { onClick(event); });

    const showMenu = function (event) {
      event.preventDefault();
      const app = Apps.get(descriptor.id);
      const menuItems = [
        { type: 'title', label: descriptor.name },
        { label: 'Открыть', icon: 'window', action: function () { onClick(event); } }
      ];

      if (app) {
        const existing = WindowManager.findByApp(app.id);
        if (existing) {
          menuItems.push({ label: 'Свернуть', icon: 'minimize', action: function () { WindowManager.minimize(existing.id); } });
          menuItems.push({ label: 'Развернуть на весь экран', icon: 'fullscreen', action: function () { WindowManager.setMode(existing.id, 'max'); WindowManager.focus(existing.id); } });
          menuItems.push({ label: 'Закрепить в сетке', icon: 'grid', action: function () { WindowManager.setMode(existing.id, 'tiled'); WindowManager.focus(existing.id); } });
          menuItems.push('-');
          menuItems.push({ label: 'Закрыть окно', icon: 'close', action: function () { WindowManager.close(existing.id); } });
        }
      }

      UI.openMenu(menuItems, event.clientX || button.getBoundingClientRect().left, (event.clientY || button.getBoundingClientRect().top) - 8);
    };

    button.addEventListener('contextmenu', showMenu);
    UI.attachLongPress(button, showMenu, 500);

    return button;
  }

  function onDockItemClick(app, event) {
    const existing = WindowManager.findByApp(app.id);
    if (!existing) { WindowManager.openApp(app.id); return; }
    if (existing.minimized) { WindowManager.restore(existing.id); return; }
    const active = WindowManager.getActive();
    if (active && active.id === existing.id) WindowManager.minimize(existing.id);
    else WindowManager.focus(existing.id);
  }

  function markLaunching(appId) {
    const item = items.get(appId);
    if (!item) return;
    item.classList.remove('is-launching');
    void item.offsetWidth;
    item.classList.add('is-launching');
    setTimeout(function () { item.classList.remove('is-launching'); }, 640);
  }

  function update() {
    const windows = WindowManager.list();
    const active = WindowManager.getActive();
    const workspace = Config.get('activeWorkspace');

    items.forEach(function (item, appId) {
      const related = windows.filter(function (windowInstance) { return windowInstance.app.id === appId && windowInstance.workspace === workspace; });
      item.classList.toggle('is-running', related.length > 0);
      item.classList.toggle('is-active', Boolean(active && active.app.id === appId && active.workspace === workspace && !active.minimized));
      item.setAttribute('data-tooltip', related.length ? (Apps.get(appId).name + ' · открыто: ' + related.length) : Apps.get(appId).name);
    });
  }

  return { build, update, markLaunching };
})();

/* ─────────────────────────────────────────────────────────────────────────
   МОДУЛЬ 13. ВЕРХНЯЯ ПАНЕЛЬ, РАБОЧИЕ СТОЛЫ, БЫСТРЫЕ НАСТРОЙКИ
   ───────────────────────────────────────────────────────────────────────── */
const Topbar = (function () {
  const workspacesElement = document.getElementById('pyos-workspaces');
  const clockTime = document.getElementById('pyos-clock-time');
  const clockDate = document.getElementById('pyos-clock-date');
  const statusChips = document.getElementById('pyos-status-chips');
  const launcherButton = document.getElementById('pyos-launcher-button');
  const layoutButton = document.getElementById('pyos-layout-button');
  const quickButton = document.getElementById('pyos-quick-button');
  const notificationsButton = document.getElementById('pyos-notifications-button');

  let quickPanel = null;
  let centerPanel = null;
  let layoutPanel = null;

  function init() {
    launcherButton.innerHTML = Icons.get('apps', 20);
    layoutButton.innerHTML = Icons.get('grid', 20);
    quickButton.innerHTML = Icons.get('palette', 20);
    notificationsButton.innerHTML = Icons.get('bell', 20) + '<span class="pyos-icon-button__badge pyos-hidden" id="pyos-notifications-dot"></span>';

    launcherButton.addEventListener('click', function () { Launcher.toggle(); });
    layoutButton.addEventListener('click', function (event) { toggleLayoutPanel(event); });
    quickButton.addEventListener('click', function (event) { toggleQuickPanel(event); });
    notificationsButton.addEventListener('click', function (event) { toggleCenterPanel(event); });
    document.getElementById('pyos-clock').addEventListener('click', function (event) { toggleCenterPanel(event); });

    renderWorkspaces();
    startClock();
    renderStatus();
    updateNotificationDot();

    Bus.on('notifications:changed', updateNotificationDot);
    Bus.on('window:created', renderStatus);
    Bus.on('window:closed', renderStatus);
    Bus.on('filesystem:changed', Util.debounce(renderStatus, 400));
    Bus.on('config:changed', function (event) {
      if (event.path === 'workspaces' || event.path === 'activeWorkspace') renderWorkspaces();
      if (event.path === 'tilingLayout') updateLayoutPanelState();
      renderStatus();
    });
  }

  function renderWorkspaces() {
    const total = Util.clamp(Number(Config.get('workspaces')) || 3, 1, 9);
    const active = Config.get('activeWorkspace');
    workspacesElement.innerHTML = '';

    for (let index = 1; index <= total; index++) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'pyos-workspace';
      button.textContent = String(index);
      button.dataset.workspace = String(index);
      if (index === active) button.classList.add('is-active');
      if (WindowManager.windowsOnWorkspace(index).length) button.classList.add('has-windows');
      button.setAttribute('data-tooltip', 'Рабочий стол ' + index);

      button.addEventListener('click', function () { WindowManager.setWorkspace(index); });

      const showMenu = function (event) {
        event.preventDefault();
        const movable = WindowManager.list().filter(function (windowInstance) { return windowInstance.workspace !== index; });
        UI.openMenu([
          { type: 'title', label: 'Рабочий стол ' + index },
          { label: 'Перейти', icon: 'layers', action: function () { WindowManager.setWorkspace(index); } },
          {
            label: 'Переместить окно сюда', icon: 'move',
            disabled: movable.length === 0,
            submenu: movable.map(function (windowInstance) {
              return {
                label: windowInstance.app.name,
                icon: windowInstance.app.icon,
                action: function () { WindowManager.setWorkspaceOf(windowInstance.id, index); WindowManager.setWorkspace(index); }
              };
            })
          },
          '-',
          { label: 'Закрыть все окна стола', icon: 'close', action: function () { WindowManager.windowsOnWorkspace(index).forEach(function (w) { WindowManager.close(w.id); }); } }
        ], event.clientX, event.clientY);
      };

      button.addEventListener('contextmenu', showMenu);
      UI.attachLongPress(button, showMenu, 500);

      workspacesElement.appendChild(button);
    }
  }

  function startClock() {
    const tick = function () {
      const now = new Date();
      clockTime.textContent = now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
      clockDate.textContent = now.toLocaleDateString('ru-RU', { weekday: 'short', day: 'numeric', month: 'long' });
    };
    tick();
    setInterval(tick, 1000);
  }

  function renderStatus() {
    const stats = FileSystem.stats();
    const windows = WindowManager.count();
    const chips = [
      { icon: 'file', text: stats.files + ' ' + Util.pluralize(stats.files, 'файл', 'файла', 'файлов'), optional: false },
      { icon: 'database', text: Util.formatBytes(stats.storageBytes), optional: true },
      { icon: 'window', text: windows + ' ' + Util.pluralize(windows, 'окно', 'окна', 'окон'), optional: true },
      { icon: 'cpu', text: window.innerWidth + '×' + window.innerHeight, optional: true }
    ];

    statusChips.innerHTML = chips.map(function (chip) {
      return '<span class="pyos-chip" data-optional="' + chip.optional + '">' + Icons.get(chip.icon, 14) + Util.escapeHtml(chip.text) + '</span>';
    }).join('');
  }

  function updateNotificationDot() {
    const dot = document.getElementById('pyos-notifications-dot');
    if (!dot) return;
    const unread = Notifications.getHistory().filter(function (item) { return !item.read; }).length;
    dot.classList.toggle('pyos-hidden', unread === 0);
  }

  function closePanels(except) {
    [quickPanel, centerPanel, layoutPanel].forEach(function (panel) {
      if (panel && panel !== except) {
        panel.classList.add('is-closing');
        const node = panel;
        setTimeout(function () { node.remove(); }, 160);
      }
    });
    if (except !== quickPanel) quickPanel = null;
    if (except !== centerPanel) centerPanel = null;
    if (except !== layoutPanel) layoutPanel = null;
    quickButton.classList.toggle('is-active', quickPanel !== null);
    notificationsButton.classList.toggle('is-active', centerPanel !== null);
    layoutButton.classList.toggle('is-active', layoutPanel !== null);
  }

  function positionPanel(panel, anchor, alignRight) {
    const rect = anchor.getBoundingClientRect();
    document.body.appendChild(panel);
    const panelRect = panel.getBoundingClientRect();
    const left = alignRight
      ? Util.clamp(rect.right - panelRect.width, 8, window.innerWidth - panelRect.width - 8)
      : Util.clamp(rect.left, 8, window.innerWidth - panelRect.width - 8);
    const top = rect.bottom + 8;
    panel.style.left = left + 'px';
    panel.style.top = Math.min(top, window.innerHeight - panelRect.height - 8) + 'px';
  }

  /* — Быстрые настройки — */
  function toggleQuickPanel(event) {
    if (quickPanel) { closePanels(null); return; }
    closePanels(null);

    const panel = document.createElement('div');
    panel.className = 'pyos-panel pyos-quick';
    const config = Config.all();

    panel.innerHTML =
      '<div class="pyos-quick__row"><span class="pyos-quick__label">Оформление</span>' +
        '<div style="display:flex;gap:6px">' +
          '<button type="button" class="pyos-button pyos-button--small" data-theme="dark">' + Icons.get('moon', 15) + 'Тёмная</button>' +
          '<button type="button" class="pyos-button pyos-button--small" data-theme="light">' + Icons.get('sun', 15) + 'Светлая</button>' +
        '</div>' +
      '</div>' +
      '<div class="pyos-quick__row"><span class="pyos-quick__label">Акцент</span></div>' +
      '<div class="pyos-quick__accents">' +
        Config.ACCENT_PRESETS.map(function (preset) {
          return '<button type="button" class="pyos-quick__accent' + (preset.value.toLowerCase() === config.accent.toLowerCase() ? ' is-active' : '') + '" data-accent="' + preset.value + '" style="background:' + preset.value + '" data-tooltip="' + Util.escapeAttribute(preset.name) + '"></button>';
        }).join('') +
      '</div>' +
      '<div class="pyos-quick__row"><span class="pyos-quick__label">Схема окон</span></div>' +
      '<div class="pyos-quick__grid">' +
        [['master', 'Ведущее', 'master'], ['grid', 'Сетка', 'grid'], ['columns', 'Столбцы', 'columns'], ['rows', 'Строки', 'rows']]
          .map(function (item) {
            return '<button type="button" class="pyos-quick__tile' + (config.tilingLayout === item[0] ? ' is-active' : '') + '" data-layout="' + item[0] + '">' + Icons.get(item[2], 18) + '<span>' + item[1] + '</span></button>';
          }).join('') +
      '</div>' +
      '<div class="pyos-quick__row"><span class="pyos-quick__label">Отступы между окнами</span><span class="pyos-chip" data-gap-value>' + config.gap + ' пикселей</span></div>' +
      '<input type="range" class="pyos-slider" data-gap min="0" max="28" step="1" value="' + config.gap + '">' +
      '<div class="pyos-quick__row"><span class="pyos-quick__label">Скорость анимаций</span><span class="pyos-chip" data-speed-value>' + config.animationSpeed.toFixed(2) + '×</span></div>' +
      '<input type="range" class="pyos-slider" data-speed min="0.4" max="2.4" step="0.05" value="' + config.animationSpeed + '">' +
      '<div class="pyos-quick__grid">' +
        '<button type="button" class="pyos-quick__tile' + (config.blur ? ' is-active' : '') + '" data-toggle="blur">' + Icons.get('eye', 18) + '<span>Размытие</span></button>' +
        '<button type="button" class="pyos-quick__tile' + (config.animations ? ' is-active' : '') + '" data-toggle="animations">' + Icons.get('bolt', 18) + '<span>Анимации</span></button>' +
        '<button type="button" class="pyos-quick__tile' + (config.particles ? ' is-active' : '') + '" data-toggle="particles">' + Icons.get('palette', 18) + '<span>Частицы</span></button>' +
        '<button type="button" class="pyos-quick__tile" data-fullscreen>' + Icons.get('fullscreen', 18) + '<span>Во весь экран</span></button>' +
      '</div>' +
      '<div class="pyos-quick__row" style="justify-content:flex-end">' +
        '<button type="button" class="pyos-button pyos-button--small pyos-button--tonal" data-open-settings>' + Icons.get('settings', 15) + 'Все настройки</button>' +
      '</div>';

    panel.querySelectorAll('[data-theme]').forEach(function (button) {
      button.addEventListener('click', function () {
        Config.set('theme', button.dataset.theme);
        panel.querySelectorAll('[data-theme]').forEach(function (other) {
          other.classList.toggle('pyos-button--filled', other.dataset.theme === button.dataset.theme);
        });
      });
    });
    panel.querySelectorAll('[data-theme="' + config.theme + '"]').forEach(function (b) { b.classList.add('pyos-button--filled'); });

    panel.querySelectorAll('[data-accent]').forEach(function (button) {
      button.addEventListener('click', function () {
        Config.set('accent', button.dataset.accent);
        panel.querySelectorAll('[data-accent]').forEach(function (other) { other.classList.toggle('is-active', other === button); });
      });
    });

    panel.querySelectorAll('[data-layout]').forEach(function (button) {
      button.addEventListener('click', function () {
        Config.set('tilingLayout', button.dataset.layout);
        WindowManager.tileAll();
        panel.querySelectorAll('[data-layout]').forEach(function (other) { other.classList.toggle('is-active', other === button); });
      });
    });

    const gapValue = panel.querySelector('[data-gap-value]');
    panel.querySelector('[data-gap]').addEventListener('input', function (event) {
      Config.set('gap', Number(event.target.value));
      gapValue.textContent = event.target.value + ' пикселей';
    });

    const speedValue = panel.querySelector('[data-speed-value]');
    panel.querySelector('[data-speed]').addEventListener('input', function (event) {
      Config.set('animationSpeed', Number(event.target.value));
      speedValue.textContent = Number(event.target.value).toFixed(2) + '×';
    });

    panel.querySelectorAll('[data-toggle]').forEach(function (button) {
      button.addEventListener('click', function () {
        const key = button.dataset.toggle;
        const next = !Config.get(key);
        Config.set(key, next);
        button.classList.toggle('is-active', next);
        if (key === 'particles') Wallpaper.setParticles(next);
      });
    });

    panel.querySelector('[data-fullscreen]').addEventListener('click', function () {
      if (!document.fullscreenElement) {
        if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(function () {});
      } else if (document.exitFullscreen) {
        document.exitFullscreen().catch(function () {});
      }
    });

    panel.querySelector('[data-open-settings]').addEventListener('click', function () {
      closePanels(null);
      WindowManager.openApp('settings');
    });

    quickPanel = panel;
    positionPanel(panel, quickButton, true);
    quickButton.classList.add('is-active');

    setTimeout(function () {
      document.addEventListener('pointerdown', onQuickOutside, true);
    }, 0);
  }

  function onQuickOutside(event) {
    if (quickPanel && !quickPanel.contains(event.target) && !quickButton.contains(event.target)) {
      closePanels(null);
      document.removeEventListener('pointerdown', onQuickOutside, true);
    }
  }

  /* — Схема расположения — */
  function toggleLayoutPanel(event) {
    if (layoutPanel) { closePanels(null); return; }
    closePanels(null);

    const panel = document.createElement('div');
    panel.className = 'pyos-panel pyos-menu';
    const layouts = [
      { id: 'master', name: 'Ведущее окно', icon: 'master', description: 'Одно крупное окно слева, остальные стопкой справа' },
      { id: 'grid', name: 'Сетка', icon: 'grid', description: 'Равномерная сетка по числу окон' },
      { id: 'columns', name: 'Столбцы', icon: 'columns', description: 'Окна в ряд по вертикали' },
      { id: 'rows', name: 'Строки', icon: 'rows', description: 'Окна в ряд по горизонтали' },
      { id: 'stack', name: 'Стопка', icon: 'stack', description: 'Окна каскадом друг над другом' }
    ];

    layouts.forEach(function (layout) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'pyos-menu__item' + (Config.get('tilingLayout') === layout.id ? ' is-active' : '');
      button.innerHTML =
        '<span class="pyos-menu__item-icon">' + Icons.get(layout.icon, 18) + '</span>' +
        '<span class="pyos-menu__item-label">' + layout.name + '<br><span style="font-size:11px;color:var(--pyos-text-faint);font-weight:400">' + layout.description + '</span></span>';
      button.addEventListener('click', function () {
        Config.set('tilingLayout', layout.id);
        WindowManager.tileAll();
        closePanels(null);
        Notifications.success('Схема изменена', layout.name);
      });
      panel.appendChild(button);
    });

    const separator = document.createElement('div');
    separator.className = 'pyos-menu__separator';
    panel.appendChild(separator);

    [
      { label: 'Разложить все окна по сетке', icon: 'grid', action: function () { WindowManager.tileAll(); } },
      { label: 'Сделать все окна плавающими', icon: 'window', action: function () { WindowManager.floatAll(); } },
      { label: 'Свернуть все окна', icon: 'minimize', action: function () { WindowManager.minimizeAll(); } },
      { label: 'Закрыть все окна', icon: 'close', action: function () { UI.confirmDialog('Закрыть все окна?', 'Все открытые окна будут закрыты. Несохранённые данные могут быть потеряны.', 'Закрыть все', true).then(function (ok) { if (ok) WindowManager.closeAll(); }); } }
    ].forEach(function (item) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'pyos-menu__item';
      button.innerHTML = '<span class="pyos-menu__item-icon">' + Icons.get(item.icon, 18) + '</span><span class="pyos-menu__item-label">' + item.label + '</span>';
      button.addEventListener('click', function () { closePanels(null); item.action(); });
      panel.appendChild(button);
    });

    layoutPanel = panel;
    positionPanel(panel, layoutButton, false);
    layoutButton.classList.add('is-active');
    updateLayoutPanelState();
  }

  function updateLayoutPanelState() { /* состояние обновляется при перерисовке панели */ }

  /* — Центр уведомлений — */
  function toggleCenterPanel(event) {
    if (centerPanel) { closePanels(null); return; }
    closePanels(null);

    const panel = document.createElement('div');
    panel.className = 'pyos-panel pyos-center';

    const items = Notifications.getHistory();
    panel.innerHTML =
      '<div class="pyos-center__header">' +
        '<span class="pyos-center__title">Центр уведомлений</span>' +
        '<button type="button" class="pyos-button pyos-button--small pyos-button--ghost" data-clear>' + Icons.get('trash', 14) + 'Очистить</button>' +
      '</div>' +
      '<div class="pyos-center__list"></div>';

    const list = panel.querySelector('.pyos-center__list');

    if (!items.length) {
      list.innerHTML = '<div class="pyos-empty">' + Icons.get('bell', 40) + '<div>Уведомлений пока нет</div></div>';
    } else {
      items.forEach(function (item) {
        const row = document.createElement('div');
        row.className = 'pyos-center__item';
        row.innerHTML =
          '<span style="color:var(--pyos-' + (item.type === 'error' ? 'danger' : item.type === 'success' ? 'success' : item.type === 'warning' ? 'warning' : 'info') + ')">' + Icons.get(item.type === 'success' ? 'check' : item.type === 'error' ? 'error' : item.type === 'warning' ? 'warning' : 'info', 18) + '</span>' +
          '<div style="flex:1;min-width:0">' +
            '<div class="pyos-center__item-title">' + Util.escapeHtml(item.title) + '</div>' +
            (item.message ? '<div class="pyos-center__item-text">' + Util.escapeHtml(item.message) + '</div>' : '') +
          '</div>' +
          '<span class="pyos-center__item-time">' + Util.formatDate(item.time) + '</span>';
        list.appendChild(row);
      });
      items.forEach(function (item) { item.read = true; });
      Store.setJson('notifications', items);
      updateNotificationDot();
    }

    panel.querySelector('[data-clear]').addEventListener('click', function () {
      Notifications.clearHistory();
      closePanels(null);
      Notifications.info('История очищена', 'Центр уведомлений пуст');
    });

    centerPanel = panel;
    positionPanel(panel, notificationsButton, true);
    notificationsButton.classList.add('is-active');
  }

  document.addEventListener('pointerdown', function (event) {
    if (layoutPanel && !layoutPanel.contains(event.target) && !layoutButton.contains(event.target)) {
      closePanels(null);
      document.removeEventListener('pointerdown', onQuickOutside, true);
    }
    if (centerPanel && !centerPanel.contains(event.target) && !notificationsButton.contains(event.target) && !document.getElementById('pyos-clock').contains(event.target)) {
      closePanels(null);
    }
  }, true);

  return { init, renderWorkspaces, renderStatus, closePanels: function () { closePanels(null); } };
})();

/* ─────────────────────────────────────────────────────────────────────────
   МОДУЛЬ 14. ПАНЕЛЬ ЗАПУСКА ПРИЛОЖЕНИЙ
   ───────────────────────────────────────────────────────────────────────── */
const Launcher = (function () {
  let element = null;

  function build() {
    const overlay = document.createElement('div');
    overlay.id = 'pyos-launcher';

    overlay.innerHTML =
      '<div class="pyos-launcher__search">' + Icons.get('search', 20) +
        '<input type="text" placeholder="Поиск приложений и файлов…" data-search>' +
      '</div>' +
      '<div class="pyos-launcher__section" data-section="apps">' +
        '<h3 class="pyos-launcher__section-title">Приложения</h3>' +
        '<div class="pyos-launcher__grid" data-apps></div>' +
      '</div>' +
      '<div class="pyos-launcher__section" data-section="files">' +
        '<h3 class="pyos-launcher__section-title">Недавние файлы</h3>' +
        '<div class="pyos-launcher__grid" data-files></div>' +
      '</div>';

    const appsContainer = overlay.querySelector('[data-apps]');
    const filesContainer = overlay.querySelector('[data-files]');
    const searchInput = overlay.querySelector('[data-search]');

    function renderApps(filter) {
      const needle = (filter || '').toLowerCase().trim();
      appsContainer.innerHTML = '';
      Apps.all()
        .filter(function (app) { return !needle || app.name.toLowerCase().indexOf(needle) !== -1 || (app.description || '').toLowerCase().indexOf(needle) !== -1; })
        .forEach(function (app, index) {
          const card = document.createElement('button');
          card.type = 'button';
          card.className = 'pyos-launcher__card';
          card.style.animationDelay = (index * 26) + 'ms';
          card.innerHTML =
            '<span class="pyos-launcher__card-icon" style="background:linear-gradient(145deg,' + app.color + ',' + app.color + '99)">' + Icons.get(app.icon, 26) + '</span>' +
            '<span class="pyos-launcher__card-name">' + Util.escapeHtml(app.name) + '</span>' +
            '<span class="pyos-launcher__card-desc">' + Util.escapeHtml(app.description || '') + '</span>';
          card.addEventListener('click', function () { hide(); WindowManager.openApp(app.id); });
          appsContainer.appendChild(card);
        });

      if (!appsContainer.children.length) {
        appsContainer.innerHTML = '<div class="pyos-empty" style="grid-column:1/-1">Ничего не найдено</div>';
      }
    }

    function renderFiles(filter) {
      const needle = (filter || '').toLowerCase().trim();
      const files = FileSystem.files('modified').slice(0, 10)
        .filter(function (file) { return !needle || file.name.toLowerCase().indexOf(needle) !== -1 || file.path.toLowerCase().indexOf(needle) !== -1; });

      filesContainer.innerHTML = '';
      files.forEach(function (file, index) {
        const card = document.createElement('button');
        card.type = 'button';
        card.className = 'pyos-launcher__card';
        card.style.animationDelay = (index * 22) + 'ms';
        card.innerHTML =
          '<span class="pyos-launcher__card-icon" style="background:linear-gradient(145deg,#64748b,#334155)">' + Icons.get('file', 24) + '</span>' +
          '<span class="pyos-launcher__card-name">' + Util.escapeHtml(file.name) + '</span>' +
          '<span class="pyos-launcher__card-desc">' + Util.escapeHtml(file.path) + '</span>';
        card.addEventListener('click', function () { hide(); WindowManager.openApp('editor', { openPath: file.path }); });
        filesContainer.appendChild(card);
      });

      if (!filesContainer.children.length) {
        filesContainer.innerHTML = '<div class="pyos-empty" style="grid-column:1/-1">Файлы не найдены</div>';
      }
    }

    searchInput.addEventListener('input', function () {
      renderApps(searchInput.value);
      renderFiles(searchInput.value);
    });

    searchInput.addEventListener('keydown', function (event) {
      if (event.key === 'Enter') {
        const firstCard = appsContainer.querySelector('.pyos-launcher__card') || filesContainer.querySelector('.pyos-launcher__card');
        if (firstCard) { hide(); firstCard.click(); }
      }
      if (event.key === 'Escape') hide();
    });

    overlay.addEventListener('pointerdown', function (event) { if (event.target === overlay) hide(); });

    const closeButton = document.createElement('button');
    closeButton.type = 'button';
    closeButton.className = 'pyos-button pyos-button--small';
    closeButton.style.position = 'absolute';
    closeButton.style.top = '14px';
    closeButton.style.right = '16px';
    closeButton.innerHTML = Icons.get('close', 16) + 'Закрыть панель запуска';
    closeButton.addEventListener('click', hide);
    overlay.appendChild(closeButton);

    renderApps('');
    renderFiles('');

    element = overlay;
    document.body.appendChild(overlay);
    setTimeout(function () { searchInput.focus(); }, 90);
  }

  function show() {
    if (element) { element.remove(); element = null; }
    build();
    Bus.emit('launcher:shown');
  }

  function hide() {
    if (!element) return;
    element.classList.add('is-closing');
    const node = element;
    element = null;
    setTimeout(function () { node.remove(); }, 160);
    Bus.emit('launcher:hidden');
  }

  function toggle() { if (element) hide(); else show(); }
  function isOpen() { return Boolean(element); }

  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape' && element) hide();
  });

  return { show, hide, toggle, isOpen };
})();

/* ─────────────────────────────────────────────────────────────────────────
   МОДУЛЬ 15. ОБОИ И ЧАСТИЦЫ
   ───────────────────────────────────────────────────────────────────────── */
const Wallpaper = (function () {
  const canvas = document.getElementById('pyos-canvas');
  const context = canvas.getContext('2d');
  let particles = [];
  let frame = null;
  let enabled = false;

  function resize() {
    if (!enabled) return;
    const ratio = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.floor(window.innerWidth * ratio);
    canvas.height = Math.floor(window.innerHeight * ratio);
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    context.setTransform(ratio, 0, 0, ratio, 0, 0);
  }

  function buildParticles() {
    const density = Util.isSmallScreen() ? 26 : 58;
    particles = [];
    for (let i = 0; i < density; i++) {
      particles.push({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        vx: (Math.random() - 0.5) * 0.24,
        vy: (Math.random() - 0.5) * 0.24,
        radius: Math.random() * 1.9 + 0.6
      });
    }
  }

  function draw() {
    if (!enabled) return;
    const accent = Config.get('accent');
    const rgb = Util.hexToRgb(accent);

    context.clearRect(0, 0, window.innerWidth, window.innerHeight);

    for (let i = 0; i < particles.length; i++) {
      const particle = particles[i];
      particle.x += particle.vx;
      particle.y += particle.vy;

      if (particle.x < -20) particle.x = window.innerWidth + 20;
      if (particle.x > window.innerWidth + 20) particle.x = -20;
      if (particle.y < -20) particle.y = window.innerHeight + 20;
      if (particle.y > window.innerHeight + 20) particle.y = -20;

      context.beginPath();
      context.arc(particle.x, particle.y, particle.radius, 0, Math.PI * 2);
      context.fillStyle = 'rgba(' + rgb.r + ',' + rgb.g + ',' + rgb.b + ',.5)';
      context.fill();

      for (let j = i + 1; j < particles.length; j++) {
        const other = particles[j];
        const dx = particle.x - other.x;
        const dy = particle.y - other.y;
        const distance = dx * dx + dy * dy;
        if (distance < 15000) {
          context.beginPath();
          context.moveTo(particle.x, particle.y);
          context.lineTo(other.x, other.y);
          context.strokeStyle = 'rgba(' + rgb.r + ',' + rgb.g + ',' + rgb.b + ',' + (0.14 * (1 - distance / 15000)) + ')';
          context.lineWidth = 1;
          context.stroke();
        }
      }
    }

    frame = requestAnimationFrame(draw);
  }

  function setParticles(state) {
    enabled = Boolean(state);
    canvas.style.display = enabled ? 'block' : 'none';
    if (enabled) {
      resize();
      buildParticles();
      if (!frame) frame = requestAnimationFrame(draw);
    } else if (frame) {
      cancelAnimationFrame(frame);
      frame = null;
      context.clearRect(0, 0, canvas.width, canvas.height);
    }
  }

  window.addEventListener('resize', Util.debounce(resize, 200), { passive: true });
  Bus.on('config:changed', function (event) { if (event.path === 'accent' && enabled) { /* цвет читается на каждом кадре */ } });

  return { setParticles, resize };
})();

          { label: 'Столбцы', icon: 'columns', active: Config.get('tilingLayout') === 'columns', action: function () { Config.set('tilingLayout', 'columns'); WindowManager.tileAll(); } },
          { label: 'Строки', icon: 'rows', active: Config.get('tilingLayout') === 'rows', action: function () { Config.set('tilingLayout', 'rows'); WindowManager.tileAll(); } }
        ]
      },

      { label: 'Настройки системы', icon: 'settings', action: function () { WindowManager.openApp('settings'); } },
      { label: 'Обновить рабочий стол', icon: 'refresh', action: function () { Topbar.renderStatus(); Topbar.renderWorkspaces(); Notifications.info('Рабочий стол обновлён'); } }
    ], event.clientX, event.clientY);
  }

  document.getElementById('pyos-desktop').addEventListener('contextmenu', showMenu);

  async function createNewFileFlow() {

    FileSystem.createDirectory(path);
    Notifications.success('Папка создана', path);
  }
}

Apps.register({
  id: 'editor',
  name: 'Редактор кода',
  description: 'Подсветка синтаксиса, вкладки, поиск и замена',
  icon: 'code',
  color: '#7c6cff',
  defaultWidth: 980,
  defaultHeight: 640,
  minWidth: 420,
  minHeight: 300,
  mount: function (container, api) {

    const state = {
      tabs: [],
      activePath: null,
      wrap: Boolean(Config.get('wordWrap')),
      outline: Boolean(Config.get('editorOutline')),
      findVisible: false,
      lastSaved: new Map()
    };

    container.innerHTML =
      '<div class="pyos-editor">' +
        '<div class="pyos-editor__toolbar">' +
          '<button type="button" class="pyos-button pyos-button--small" data-action="new">' + Icons.get('file-add', 15) + 'Новый файл</button>' +
