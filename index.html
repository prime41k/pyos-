          '<button type="button" class="pyos-button pyos-button--small" data-action="save-as">' + Icons.get('download', 15) + 'Скачать</button>' +
          '<span class="pyos-divider--vertical"></span>' +
          '<button type="button" class="pyos-button pyos-button--small" data-action="undo">' + Icons.get('undo', 15) + 'Отменить</button>' +
          '<button type="button" class="pyos-button pyos-button--small" data-action="redo">' + Icons.get('redo', 15) + 'Вернуть</button>' +
          '<button type="button" class="pyos-button pyos-button--small" data-action="find">' + Icons.get('search', 15) + 'Найти и заменить</button>' +
          '<span class="pyos-divider--vertical"></span>' +
          '<button type="button" class="pyos-button pyos-button--small" data-action="wrap">' + Icons.get('wrap', 15) + 'Перенос строк</button>' +
          '<button type="button" class="pyos-button pyos-button--small" data-action="outline">' + Icons.get('outline', 15) + 'Структура</button>' +
          '<button type="button" class="pyos-button pyos-button--small" data-action="font-down">A−</button>' +
          '<button type="button" class="pyos-button pyos-button--small" data-action="font-up">A+</button>' +
          '<span class="pyos-divider--vertical"></span>' +
          '<button type="button" class="pyos-button pyos-button--small pyos-button--tonal" data-action="run">' + Icons.get('play', 15) + 'Запустить Python</button>' +
          '<button type="button" class="pyos-button pyos-button--small" data-action="preview">' + Icons.get('eye', 15) + 'Предпросмотр</button>' +
          '<button type="button" class="pyos-button pyos-button--small" data-action="ask-ai">' + Icons.get('robot', 15) + 'Спросить Gemini</button>' +
        '</div>' +
        '<div class="pyos-editor__tabs" data-tabs></div>' +
        '<div class="pyos-editor__find pyos-hidden" data-find>' +
          '<input type="text" class="pyos-field" data-find-query placeholder="Найти…">' +
          '<input type="text" class="pyos-field" data-find-replace placeholder="Заменить на…">' +
          '<span class="pyos-chip" data-find-count>0 совпадений</span>' +
          '<button type="button" class="pyos-button pyos-button--small" data-find-prev>' + Icons.get('chevron-left', 15) + '</button>' +
          '<button type="button" class="pyos-button pyos-button--small" data-find-next>' + Icons.get('chevron-right', 15) + '</button>' +
          '<button type="button" class="pyos-button pyos-button--small" data-find-replace-one>Заменить</button>' +
          '<button type="button" class="pyos-button pyos-button--small pyos-button--tonal" data-find-replace-all>Заменить все</button>' +
          '<button type="button" class="pyos-button pyos-button--small pyos-button--ghost" data-find-close>' + Icons.get('close', 15) + '</button>' +
        '</div>' +
        '<div class="pyos-editor__main">' +
          '<aside class="pyos-editor__outline" data-outline></aside>' +
          '<div class="pyos-editor__area">' +
            '<div class="pyos-editor__gutter" data-gutter></div>' +
            '<div class="pyos-editor__stack">' +
              '<div class="pyos-editor__active-line" data-active-line></div>' +
              '<pre class="pyos-editor__highlight" aria-hidden="true"><code data-highlight></code></pre>' +
              '<textarea class="pyos-editor__input" data-input spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off"></textarea>' +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div class="pyos-editor__status">' +
          '<span class="pyos-editor__status-item is-accent" data-status-file>Файл не открыт</span>' +
          '<span class="pyos-editor__status-item" data-status-language>—</span>' +
          '<span class="pyos-editor__status-spacer"></span>' +
          '<span class="pyos-editor__status-item" data-status-position>Строка 1, столбец 1</span>' +
          '<span class="pyos-editor__status-item" data-status-size>0 символов</span>' +
          '<span class="pyos-editor__status-item" data-status-save>Сохранено</span>' +
        '</div>' +
      '</div>';

    const root = container.querySelector('.pyos-editor');
    const tabsElement = root.querySelector('[data-tabs]');
    const gutterElement = root.querySelector('[data-gutter]');
    const highlightElement = root.querySelector('[data-highlight]');
    const activeLineElement = root.querySelector('[data-active-line]');
    const inputElement = root.querySelector('[data-input]');
    const outlineElement = root.querySelector('[data-outline]');
    const findPanel = root.querySelector('[data-find]');
    const findQuery = root.querySelector('[data-find-query]');
    const findReplace = root.querySelector('[data-find-replace]');
    const findCount = root.querySelector('[data-find-count]');

    const statusFile = root.querySelector('[data-status-file]');
    const statusLanguage = root.querySelector('[data-status-language]');
    const statusPosition = root.querySelector('[data-status-position]');
    const statusSize = root.querySelector('[data-status-size]');
    const statusSave = root.querySelector('[data-status-save]');

    if (state.wrap) root.classList.add('is-wrapped');
    if (!state.outline) outlineElement.classList.add('pyos-hidden');

    /* — Вкладки и файлы — */
    function openPath(path, options) {
      const normalized = FileSystem.normalize(path);
      const node = FileSystem.get(normalized);
      if (!node || node.type !== 'file') {
        Notifications.error('Файл не найден', normalized);
        return;
      }

      let tab = state.tabs.find(function (item) { return item.path === normalized; });
      if (!tab) {
        tab = { path: normalized, dirty: false };
        state.tabs.push(tab);
      }
      tab.content = FileSystem.read(normalized);
      state.lastSaved.set(normalized, tab.content);
      state.activePath = normalized;

      inputElement.value = tab.content;
      inputElement.disabled = false;
      renderTabs();
      renderAll();
      if (options && options.line) gotoLine(options.line);
      Bus.emit('editor:opened', normalized);
    }

    function activeTab() { return state.tabs.find(function (item) { return item.path === state.activePath; }); }

    function closeTab(path) {
      const index = state.tabs.findIndex(function (item) { return item.path === path; });
      if (index === -1) return;
      const tab = state.tabs[index];

      const finish = function () {
        state.tabs.splice(index, 1);
        state.lastSaved.delete(path);
        if (state.activePath === path) {
          const next = state.tabs[Math.min(index, state.tabs.length - 1)];
          state.activePath = next ? next.path : null;
          if (next) {
            inputElement.value = next.content;
            inputElement.disabled = false;
          } else {
            inputElement.value = '';
            inputElement.disabled = true;
          }
        }
        renderTabs();
        renderAll();
      };

      if (tab.dirty) {
        UI.confirmDialog('Несохранённые изменения', 'Файл ' + FileSystem.baseName(path) + ' изменён. Закрыть без сохранения?', 'Закрыть без сохранения', true)
          .then(function (confirmed) { if (confirmed) finish(); });
      } else {
        finish();
      }
    }

    function renderTabs() {
      tabsElement.innerHTML = '';
      if (!state.tabs.length) {
        tabsElement.innerHTML = '<div style="padding:9px 12px;font-size:12px;color:var(--pyos-text-faint)">Нет открытых файлов — нажмите «Открыть» или выберите файл в менеджере</div>';
        return;
      }

      state.tabs.forEach(function (tab) {
        const element = document.createElement('div');
        element.className = 'pyos-editor__tab' + (tab.path === state.activePath ? ' is-active' : '');
        element.title = tab.path;
        element.innerHTML =
          '<span style="color:var(--pyos-accent);display:flex">' + Icons.get('file', 14) + '</span>' +
          '<span class="pyos-editor__tab-name">' + Util.escapeHtml(FileSystem.baseName(tab.path)) + '</span>' +
          (tab.dirty ? '<span class="pyos-editor__tab-dot"></span>' : '') +
          '<button type="button" class="pyos-editor__tab-close" data-close="' + Util.escapeAttribute(tab.path) + '">' + Icons.get('close', 12) + '</button>';

        element.addEventListener('click', function (event) {
          if (event.target.closest('[data-close]')) return;
          switchTo(tab.path);
        });

        element.querySelector('[data-close]').addEventListener('click', function (event) {
          event.stopPropagation();
          closeTab(tab.path);
        });

        element.addEventListener('contextmenu', function (event) {
          event.preventDefault();
          UI.openMenu([
            { type: 'title', label: tab.path },
            { label: 'Сохранить', icon: 'save', action: function () { switchTo(tab.path); saveActive(); } },
            { label: 'Переименовать', icon: 'pencil', action: function () { renameFile(tab.path); } },
            { label: 'Скачать файл', icon: 'download', action: function () { downloadFile(tab.path); } },
            '-',
            { label: 'Закрыть вкладку', icon: 'close', action: function () { closeTab(tab.path); } },
            { label: 'Закрыть остальные вкладки', icon: 'window', action: function () { state.tabs.slice().forEach(function (other) { if (other.path !== tab.path) closeTab(other.path); }); } }
          ], event.clientX, event.clientY);
        });

        tabsElement.appendChild(element);
      });
    }

    function switchTo(path) {
      const current = activeTab();
      if (current) current.content = inputElement.value;
      state.activePath = path;
      const tab = activeTab();
      if (tab) inputElement.value = tab.content;
      renderTabs();
      renderAll();
      inputElement.focus();
    }

    /* — Отрисовка — */
    const scheduleHighlight = Util.debounce(function () { renderHighlight(); }, 70);
    const scheduleGutter = Util.debounce(function () { renderGutter(); }, 120);

    function renderHighlight() {
      const language = state.activePath ? FileSystem.language(state.activePath) : 'python';
      highlightElement.innerHTML = Highlight.render(inputElement.value, language) + '\n';
    }

    function renderGutter() {
      const lineCount = Math.max(1, inputElement.value.split('\n').length);
      const currentLine = getCaretLine();
      let html = '';
      for (let i = 1; i <= lineCount; i++) {
        html += '<div class="pyos-editor__gutter-line' + (i === currentLine ? ' is-current' : '') + '">' + i + '</div>';
      }
      gutterElement.innerHTML = html;
      syncScroll();
    }

    function renderOutline() {
      if (!state.outline) return;
      const language = state.activePath ? FileSystem.language(state.activePath) : 'python';
      const lines = inputElement.value.split('\n');
      const items = [];

      lines.forEach(function (line, index) {
        if (language === 'python') {
          const classMatch = /^\s*class\s+([A-Za-z_][\w]*)/.exec(line);
          if (classMatch) items.push({ label: classMatch[1], line: index + 1, icon: 'grid', nested: false });
          const functionMatch = /^\s*(?:async\s+)?def\s+([A-Za-z_][\w]*)/.exec(line);
          if (functionMatch) items.push({ label: functionMatch[1] + '()', line: index + 1, icon: 'code', nested: /^\s+/.test(line) });
        } else if (language === 'javascript') {
          const functionMatch = /^\s*(?:export\s+)?(?:async\s+)?function\s+([A-Za-z_$][\w$]*)/.exec(line);
          if (functionMatch) items.push({ label: functionMatch[1] + '()', line: index + 1, icon: 'code', nested: false });
          const classMatch = /^\s*(?:export\s+)?class\s+([A-Za-z_$][\w$]*)/.exec(line);
          if (classMatch) items.push({ label: classMatch[1], line: index + 1, icon: 'grid', nested: false });
          const constantMatch = /^\s*(?:export\s+)?const\s+([A-Za-z_$][\w$]*)\s*=\s*(?:\(|async)/.exec(line);
          if (constantMatch) items.push({ label: constantMatch[1] + '()', line: index + 1, icon: 'code', nested: true });
        } else if (language === 'html') {
          const tagMatch = /^\s*<(h[1-6]|section|main|header|footer|nav|article)\b[^>]*>/i.exec(line);
          if (tagMatch) items.push({ label: tagMatch[1].toLowerCase(), line: index + 1, icon: 'window', nested: false });
        } else if (language === 'markdown') {
          const headingMatch = /^(#{1,6})\s+(.*)$/.exec(line);
          if (headingMatch) items.push({ label: headingMatch[2].slice(0, 40), line: index + 1, icon: 'book', nested: headingMatch[1].length > 1 });
        }
      });

      if (!items.length) {
        outlineElement.innerHTML = '<div class="pyos-editor__outline-title">Структура</div><div class="pyos-empty" style="padding:20px 10px;font-size:12px">Элементы не найдены</div>';
        return;
      }

      outlineElement.innerHTML = '<div class="pyos-editor__outline-title">Структура файла · ' + items.length + '</div>' +
        items.map(function (item) {
          return '<button type="button" class="pyos-editor__outline-item' + (item.nested ? ' is-nested' : '') + '" data-line="' + item.line + '">' + Icons.get(item.icon, 15) + '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + Util.escapeHtml(item.label) + '</span></button>';
        }).join('');

      outlineElement.querySelectorAll('[data-line]').forEach(function (button) {
        button.addEventListener('click', function () { gotoLine(Number(button.dataset.line)); });
      });
    }

    function renderStatus() {
      const tab = activeTab();
      const value = inputElement.value;
      const caret = getCaretPosition();

      statusFile.textContent = tab ? tab.path : 'Файл не открыт';
      statusLanguage.textContent = tab ? labelForLanguage(FileSystem.language(tab.path)) : '—';
      statusPosition.textContent = 'Строка ' + caret.line + ', столбец ' + caret.column;
      statusSize.textContent = value.length + ' символов · ' + value.split('\n').length + ' строк';
      statusSave.textContent = tab ? (tab.dirty ? 'Есть несохранённые изменения' : 'Сохранено') : '—';
      statusSave.style.color = tab && tab.dirty ? 'var(--pyos-warning)' : '';

      api.setBadge(tab && tab.dirty ? 'изменён' : '');
    }

    function labelForLanguage(language) {
      return { python: 'Python', javascript: 'JavaScript', html: 'HTML', css: 'CSS', json: 'JSON', markdown: 'Markdown' }[language] || language;
    }

    function renderActiveLine() {
      const caret = getCaretPosition();
      const lineHeight = parseFloat(getComputedStyle(inputElement).lineHeight) || 22;
      activeLineElement.style.transform = 'translateY(' + ((caret.line - 1) * lineHeight - inputElement.scrollTop + 12) + 'px)';
      gutterElement.querySelectorAll('.pyos-editor__gutter-line').forEach(function (line, index) {
        line.classList.toggle('is-current', index + 1 === caret.line);
      });
    }

    function renderAll() {
      renderHighlight();
      renderGutter();
      renderOutline();
      renderStatus();
      renderActiveLine();
      syncScroll();
    }

    function syncScroll() {
      highlightElement.parentElement.scrollTop = inputElement.scrollTop;
      highlightElement.parentElement.scrollLeft = inputElement.scrollLeft;
      gutterElement.scrollTop = inputElement.scrollTop;
      const lineHeight = parseFloat(getComputedStyle(inputElement).lineHeight) || 22;
      gutterElement.scrollTop = inputElement.scrollTop;
      highlightElement.style.transform = 'translate(' + (-inputElement.scrollLeft) + 'px,' + (-inputElement.scrollTop) + 'px)';
      highlightElement.parentElement.scrollTop = 0;
      highlightElement.parentElement.scrollLeft = 0;
      renderActiveLine();
    }

    function getCaretPosition() {
      const value = inputElement.value.slice(0, inputElement.selectionStart || 0);
      const lines = value.split('\n');
      return { line: lines.length, column: lines[lines.length - 1].length + 1 };
    }

    function getCaretLine() { return getCaretPosition().line; }

    function gotoLine(line) {
      const lines = inputElement.value.split('\n');
      const target = Util.clamp(line, 1, lines.length);
      let position = 0;
      for (let i = 0; i < target - 1; i++) position += lines[i].length + 1;
      inputElement.focus();
      inputElement.setSelectionRange(position, position);
      const lineHeight = parseFloat(getComputedStyle(inputElement).lineHeight) || 22;
      inputElement.scrollTop = Math.max(0, (target - 5) * lineHeight);
      renderActiveLine();
      renderStatus();
      syncScroll();
    }

    /* — Сохранение — */
    let autosaveTimer = null;

    function markDirty() {
      const tab = activeTab();
      if (!tab) return;
      tab.content = inputElement.value;
      const saved = state.lastSaved.get(tab.path) || '';
      tab.dirty = tab.content !== saved;
      renderTabs();
      renderStatus();

      if (Config.get('autosave') && tab.dirty) {
        clearTimeout(autosaveTimer);
        autosaveTimer = setTimeout(function () { saveActive(true); }, Number(Config.get('autosaveDelay')) || 900);
      }
    }

    function saveActive(silent) {
      const tab = activeTab();
      if (!tab) { Notifications.warning('Нечего сохранять', 'Откройте файл'); return; }
      FileSystem.write(tab.path, inputElement.value);
      tab.dirty = false;
      state.lastSaved.set(tab.path, tab.content);
      renderTabs();
      renderStatus();
      if (!silent) Notifications.success('Файл сохранён', tab.path);
      Bus.emit('editor:saved', tab.path);
    }

    async function newFileFlow() {
      const name = await UI.promptDialog('Новый файл', 'Имя файла с расширением', 'новый-скрипт.py');
      if (!name) return;
      const path = FileSystem.joinPath('/', name);
      if (FileSystem.exists(path)) { Notifications.warning('Файл уже существует', path); return; }
      FileSystem.createFile(path, '# ' + name + '\n\n');
      openPath(path);
      Notifications.success('Файл создан', path);
    }

    async function saveAsFlow() {
      const tab = activeTab();
      const defaultName = tab ? FileSystem.baseName(tab.path) : 'файл.py';
      const name = await UI.promptDialog('Скачать файл', 'Имя файла', defaultName);
      if (!name) return;
      Util.downloadText(name, inputElement.value, 'text/plain;charset=utf-8');
      Notifications.success('Файл скачан', name);
    }

    function downloadFile(path) {
      Util.downloadText(FileSystem.baseName(path), FileSystem.read(path) || '', 'text/plain;charset=utf-8');
    }

    async function renameFile(path) {
      const name = await UI.promptDialog('Переименовать файл', 'Новое имя', FileSystem.baseName(path));
      if (!name) return;
      const target = FileSystem.rename(path, name);
      if (!target) { Notifications.error('Не удалось переименовать', 'Возможно, такое имя уже занято'); return; }
      const tab = state.tabs.find(function (item) { return item.path === path; });
      if (tab) {
        tab.path = target;
        if (state.activePath === path) state.activePath = target;
        const saved = state.lastSaved.get(path);
        state.lastSaved.delete(path);
        if (saved !== undefined) state.lastSaved.set(target, saved);
        renderTabs();
        renderStatus();
      }
      Notifications.success('Файл переименован', target);
    }

    function openFileFlow() {
      const files = FileSystem.files('name');
      const wrapper = document.createElement('div');
      wrapper.innerHTML =
        '<input class="pyos-field" type="text" placeholder="Поиск файла…" data-search style="margin-bottom:10px">' +
        '<div style="max-height:340px;overflow:auto;display:grid;gap:5px" data-list></div>';

      const list = wrapper.querySelector('[data-list]');
      const search = wrapper.querySelector('[data-search]');

      function render(filter) {
        const needle = (filter || '').toLowerCase();
        list.innerHTML = '';
        files.filter(function (file) { return !needle || file.path.toLowerCase().indexOf(needle) !== -1; })
          .forEach(function (file) {
            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'pyos-menu__item';
            button.innerHTML = '<span class="pyos-menu__item-icon">' + Icons.get('file', 17) + '</span><span class="pyos-menu__item-label">' + Util.escapeHtml(file.path) + '</span><span class="pyos-menu__item-hint">' + Util.formatBytes((file.node.content || '').length * 2) + '</span>';
            button.addEventListener('click', function () {
              const dialog = button.closest('.pyos-modal-backdrop');
              if (dialog) dialog.querySelector('[data-close]').click();
              openPath(file.path);
            });
            list.appendChild(button);
          });
      }

      search.addEventListener('input', function () { render(search.value); });
      render('');

      UI.modal({ title: 'Открыть файл', subtitle: 'Виртуальная файловая система проекта', icon: 'folder-open', body: wrapper, wide: true, actions: [{ label: 'Отмена', value: false }] });
    }

    /* — Поиск и замена — */
    function matchesOf(query) {
      if (!query) return [];
      const value = inputElement.value;
      const matches = [];
      let index = value.indexOf(query);
      while (index !== -1 && matches.length < 5000) {
        matches.push(index);
        index = value.indexOf(query, index + query.length);
      }
      return matches;
    }

    let matchIndex = -1;

    function updateFind() {
      const query = findQuery.value;
      const matches = matchesOf(query);
      findCount.textContent = matches.length + ' ' + Util.pluralize(matches.length, 'совпадение', 'совпадения', 'совпадений');
      if (matches.length && (matchIndex < 0 || matchIndex >= matches.length)) matchIndex = 0;
      if (query && matches.length) selectMatch(matches, matchIndex);
    }

    function selectMatch(matches, index) {
      const query = findQuery.value;
      const start = matches[index];
      inputElement.focus();
      inputElement.setSelectionRange(start, start + query.length);
      const lineHeight = parseFloat(getComputedStyle(inputElement).lineHeight) || 22;
      const linesBefore = inputElement.value.slice(0, start).split('\n').length;
      inputElement.scrollTop = Math.max(0, (linesBefore - 6) * lineHeight);
      renderActiveLine();
      syncScroll();
    }

    function stepFind(delta) {
      const matches = matchesOf(findQuery.value);
      if (!matches.length) return;
      matchIndex = (matchIndex + delta + matches.length) % matches.length;
      selectMatch(matches, matchIndex);
      findCount.textContent = (matchIndex + 1) + ' из ' + matches.length;
    }

    function replaceOne() {
      const matches = matchesOf(findQuery.value);
      if (!matches.length) return;
      const start = matches[Util.clamp(matchIndex, 0, matches.length - 1)];
      const value = inputElement.value;
      inputElement.value = value.slice(0, start) + findReplace.value + value.slice(start + findQuery.value.length);
      markDirty();
      renderHighlight();
      scheduleGutter();
      updateFind();
    }

    function replaceAll() {
      const query = findQuery.value;
      if (!query) return;
      const count = matchesOf(query).length;
      inputElement.value = inputElement.value.split(query).join(findReplace.value);
      markDirty();
      renderHighlight();
      scheduleGutter();
      updateFind();
      Notifications.success('Замена выполнена', 'Заменено совпадений: ' + count);
    }

    findQuery.addEventListener('input', function () { matchIndex = 0; updateFind(); });
    findReplace.addEventListener('input', updateFind);
    root.querySelector('[data-find-next]').addEventListener('click', function () { stepFind(1); });
    root.querySelector('[data-find-prev]').addEventListener('click', function () { stepFind(-1); });
    root.querySelector('[data-find-replace-one]').addEventListener('click', replaceOne);
    root.querySelector('[data-find-replace-all]').addEventListener('click', replaceAll);
    root.querySelector('[data-find-close]').addEventListener('click', function () { state.findVisible = false; findPanel.classList.add('pyos-hidden'); });

    /* — События редактора — */
    inputElement.addEventListener('input', function () {
      markDirty();
      scheduleHighlight();
      scheduleGutter();
      renderStatus();
      renderActiveLine();
    });

    inputElement.addEventListener('scroll', syncScroll, { passive: true });
    inputElement.addEventListener('click', function () { renderActiveLine(); renderStatus(); });
    inputElement.addEventListener('keyup', function () { renderActiveLine(); renderStatus(); });

    inputElement.addEventListener('keydown', function (event) {
      if (event.key === 'Tab') {
        event.preventDefault();
        const start = inputElement.selectionStart;
        const end = inputElement.selectionEnd;
        const spaces = ' '.repeat(Number(Config.get('tabSize')) || 4);
        inputElement.value = inputElement.value.slice(0, start) + spaces + inputElement.value.slice(end);
        inputElement.selectionStart = inputElement.selectionEnd = start + spaces.length;
        markDirty();
        scheduleHighlight();
        scheduleGutter();
      }
      if (event.key === 'Enter') {
        const start = inputElement.selectionStart;
        const before = inputElement.value.slice(0, start);
        const currentLine = before.slice(before.lastIndexOf('\n') + 1);
        const indent = /^\s*/.exec(currentLine)[0];
        const needsExtra = /[:\[{(]\s*$/.test(currentLine);
        if (indent || needsExtra) {
          event.preventDefault();
          const insertion = '\n' + indent + (needsExtra ? ' '.repeat(Number(Config.get('tabSize')) || 4) : '');
          const end = inputElement.selectionEnd;
          inputElement.value = inputElement.value.slice(0, start) + insertion + inputElement.value.slice(end);
          inputElement.selectionStart = inputElement.selectionEnd = start + insertion.length;
          markDirty();
          scheduleHighlight();
          scheduleGutter();
        }
      }
    });

    /* — Панель инструментов — */
    root.querySelector('.pyos-editor__toolbar').addEventListener('click', function (event) {
      const button = event.target.closest('[data-action]');
      if (!button) return;
      const action = button.dataset.action;

      if (action === 'new') newFileFlow();
      if (action === 'open') openFileFlow();
      if (action === 'save') saveActive(false);
      if (action === 'save-as') saveAsFlow();
      if (action === 'undo') { inputElement.focus(); document.execCommand('undo'); markDirty(); renderHighlight(); scheduleGutter(); }
      if (action === 'redo') { inputElement.focus(); document.execCommand('redo'); markDirty(); renderHighlight(); scheduleGutter(); }
      if (action === 'find') {
        state.findVisible = !state.findVisible;
        findPanel.classList.toggle('pyos-hidden', !state.findVisible);
        if (state.findVisible) { findQuery.focus(); updateFind(); }
      }
      if (action === 'wrap') {
        state.wrap = !state.wrap;
        root.classList.toggle('is-wrapped', state.wrap);
        Config.set('wordWrap', state.wrap);
        button.classList.toggle('pyos-button--tonal', state.wrap);
        scheduleGutter();
        syncScroll();
      }
      if (action === 'outline') {
        state.outline = !state.outline;
        outlineElement.classList.toggle('pyos-hidden', !state.outline);
        Config.set('editorOutline', state.outline);
        button.classList.toggle('pyos-button--tonal', state.outline);
        renderOutline();
      }
      if (action === 'font-up' || action === 'font-down') {
        const next = Util.clamp(Number(Config.get('fontSizeCode')) + (action === 'font-up' ? 1 : -1), 10, 26);
        Config.set('fontSizeCode', next);
        scheduleGutter();
        syncScroll();
      }
      if (action === 'run') {
        if (!activeTab()) { Notifications.warning('Откройте файл', 'Запуск доступен для открытого файла Python'); return; }
        saveActive(true);
        WindowManager.openApp('python');
        Bus.emit('python:run', { path: state.activePath, code: inputElement.value });
      }
      if (action === 'preview') {
        if (!activeTab()) { Notifications.warning('Откройте файл', 'Предпросмотр доступен для HTML-файлов'); return; }
        WindowManager.openApp('preview');
        Bus.emit('preview:open', state.activePath);
      }
      if (action === 'ask-ai') {
        const selection = inputElement.value.slice(inputElement.selectionStart, inputElement.selectionEnd);
        WindowManager.openApp('gemini');
        setTimeout(function () { Bus.emit('gemini:prompt', selection ? 'Объясни этот код и найди возможные ошибки:\n\n' + selection : 'Объясни структуру файла ' + (state.activePath || '') + ' и предложи улучшения'); }, 260);
      }
    });

    root.querySelector('[data-action="wrap"]').classList.toggle('pyos-button--tonal', state.wrap);
    root.querySelector('[data-action="outline"]').classList.toggle('pyos-button--tonal', state.outline);

    /* — Внешние события — */
    const offOpen = Bus.on('files:open', function (payload) { openPath(payload.path); });
    const offGoTo = Bus.on('editor:goto', function (payload) { openPath(payload.path, { line: payload.line }); });

    Bus.on('filesystem:changed', function () {
      const tab = activeTab();
      if (tab && !tab.dirty) {
        const fresh = FileSystem.read(tab.path);
        if (fresh !== null && fresh !== tab.content) {
          tab.content = fresh;
          state.lastSaved.set(tab.path, fresh);
          if (tab.path === state.activePath) { inputElement.value = fresh; renderAll(); }
        }
      }
    });

    /* — Первичная инициализация — */
    inputElement.disabled = true;
    inputElement.value = '';

    if (api.window.options && api.window.options.openPath) openPath(api.window.options.openPath);
    else {
      const recent = Store.getString('editor:recent', '');
      const files = FileSystem.files('modified');
      const first = (recent && FileSystem.exists(recent)) ? recent : (files[0] ? files[0].path : null);
      if (first) openPath(first);
    }

    renderTabs();
    renderAll();

    Bus.on('editor:opened', function (path) { Store.setString('editor:recent', path); });

    return {
      unmount: function () {
        offOpen();
        offGoTo();
        clearTimeout(autosaveTimer);
        const tab = activeTab();
        if (tab && tab.dirty && Config.get('autosave')) FileSystem.write(tab.path, inputElement.value);
        WindowManager.saveSession();
      }
    };
  }
});

/* ─────────────────────────────────────────────────────────────────────────
   МОДУЛЬ 18. ПРИЛОЖЕНИЕ «ФАЙЛОВЫЙ МЕНЕДЖЕР»
   ───────────────────────────────────────────────────────────────────────── */
Apps.register({
  id: 'files',
  name: 'Файлы',
  description: 'Дерево проекта, перетаскивание, импорт и экспорт',
  icon: 'folder',
  color: '#f59e0b',
  defaultWidth: 900,
  defaultHeight: 600,
  minWidth: 420,
  minHeight: 320,
  mount: function (container, api) {

    const state = {
      path: '/',
      expanded: new Set(['/']),
      selection: null,
      view: Store.getString('files:view', 'list'),
      sort: Store.getString('files:sort', 'name'),
      query: ''
    };

    container.innerHTML =
      '<div class="pyos-files">' +
        '<aside class="pyos-files__sidebar">' +
          '<div class="pyos-files__sidebar-header"><span>Проводник</span>' +
            '<button type="button" class="pyos-button pyos-button--small pyos-button--ghost" data-collapse>' + Icons.get('chevron-left', 14) + '</button>' +
          '</div>' +
          '<div class="pyos-files__tree" data-tree></div>' +
          '<div class="pyos-files__storage">' +
            '<div class="pyos-files__storage-label"><span>Хранилище</span><span data-storage-value>—</span></div>' +
            '<div class="pyos-progress"><div class="pyos-progress__bar" data-storage-bar style="width:0%"></div></div>' +
          '</div>' +
        '</aside>' +
        '<div class="pyos-files__main">' +
          '<div class="pyos-files__toolbar">' +
            '<button type="button" class="pyos-button pyos-button--small pyos-button--icon" data-up data-tooltip="На уровень вверх">' + Icons.get('chevron-left', 16) + '</button>' +
            '<div class="pyos-files__breadcrumbs" data-breadcrumbs></div>' +
            '<input type="text" class="pyos-field" data-search placeholder="Поиск в проекте…" style="height:32px;width:170px">' +
            '<button type="button" class="pyos-button pyos-button--small pyos-button--icon" data-sort data-tooltip="Сортировка">' + Icons.get('sort', 16) + '</button>' +
            '<button type="button" class="pyos-button pyos-button--small pyos-button--icon" data-view data-tooltip="Вид: список или плитки">' + Icons.get('list', 16) + '</button>' +
            '<button type="button" class="pyos-button pyos-button--small" data-new-file>' + Icons.get('file-add', 15) + 'Файл</button>' +
            '<button type="button" class="pyos-button pyos-button--small" data-new-folder>' + Icons.get('folder-add', 15) + 'Папка</button>' +
            '<button type="button" class="pyos-button pyos-button--small pyos-button--icon" data-more data-tooltip="Дополнительные действия">' + Icons.get('more', 16) + '</button>' +
          '</div>' +
          '<div class="pyos-files__list" data-list></div>' +
        '</div>' +
      '</div>';

    const treeElement = container.querySelector('[data-tree]');
    const listElement = container.querySelector('[data-list]');
    const breadcrumbsElement = container.querySelector('[data-breadcrumbs]');
    const searchElement = container.querySelector('[data-search]');
    const storageValue = container.querySelector('[data-storage-value]');
    const storageBar = container.querySelector('[data-storage-bar]');

    listElement.classList.toggle('is-grid', state.view === 'grid');

    /* — Дерево — */
    function renderTree() {
      treeElement.innerHTML = '';
      treeElement.appendChild(buildTreeNode('/', 'Проект', 0));
      updateStorage();
    }

    function buildTreeNode(path, label, depth) {
      const wrapper = document.createElement('div');
      const node = FileSystem.get(path);
      const isDirectory = path === '/' || (node && node.type === 'directory');

      const row = document.createElement('button');
      row.type = 'button';
      row.className = 'pyos-tree__row' + (state.path === path ? ' is-active' : '');
      row.style.paddingLeft = (8 + depth * 6) + 'px';
      row.dataset.path = path;

      const expanded = state.expanded.has(path);
      row.innerHTML =
        (isDirectory
          ? '<span class="pyos-tree__caret' + (expanded ? ' is-open' : '') + '">' + Icons.get('chevron-right', 15) + '</span>' + Icons.get(expanded ? 'folder-open' : 'folder', 16)
          : '<span style="width:16px"></span>' + Icons.get('file', 16)) +
        '<span class="pyos-tree__row-name">' + Util.escapeHtml(label) + '</span>';

      row.addEventListener('click', function (event) {
        if (isDirectory) {
          if (event.target.closest('.pyos-tree__caret')) {
            if (expanded) state.expanded.delete(path); else state.expanded.add(path);
            renderTree();
            return;
          }
          navigate(path);
          if (!expanded) state.expanded.add(path);
          renderTree();
        } else {
          openFile(path);
        }
      });

      row.addEventListener('contextmenu', function (event) { showItemMenu(event, path); });
      UI.attachLongPress(row, function (event) { showItemMenu(event, path); });

      row.addEventListener('pointerover', function () { if (dragPayload) row.classList.add('is-drop-target'); });
      row.addEventListener('pointerout', function () { row.classList.remove('is-drop-target'); });

      wrapper.appendChild(row);

      if (isDirectory && expanded) {
        const children = document.createElement('div');
        children.className = 'pyos-tree__children';
        FileSystem.list(path).forEach(function (child) {
          children.appendChild(buildTreeNode(child.path, child.name, depth + 1));
        });
        wrapper.appendChild(children);
      }

      return wrapper;
    }

    function updateStorage() {
      const stats = FileSystem.stats();
      storageValue.textContent = Util.formatBytes(stats.storageBytes);
      const percent = Util.clamp((stats.storageBytes / (5 * 1024 * 1024)) * 100, 1, 100);
      storageBar.style.width = percent + '%';
    }

    /* — Список — */
    function renderList() {
      const query = state.query.trim().toLowerCase();
      let entries;

      if (query) {
        entries = FileSystem.search(query);
      } else {
        entries = FileSystem.list(state.path);
        if (state.sort === 'modified') entries.sort(function (a, b) { return b.node.modified - a.node.modified; });
        if (state.sort === 'size') entries.sort(function (a, b) { return (b.node.content || '').length - (a.node.content || '').length; });
      }

      listElement.innerHTML = '';

      if (!entries.length) {
        listElement.innerHTML = '<div class="pyos-empty">' + Icons.get('folder-open', 44) + '<div>' + (query ? 'Ничего не найдено по запросу «' + Util.escapeHtml(state.query) + '»' : 'Папка пуста') + '</div><div style="font-size:12px">Создайте файл или перетащите сюда</div></div>';
        return;
      }

      entries.forEach(function (entry, index) {
        const row = document.createElement('div');
        row.className = 'pyos-file-row' + (state.selection === entry.path ? ' is-selected' : '');
        row.dataset.path = entry.path;
        row.style.animationDelay = Math.min(index * 14, 260) + 'ms';

        const isDirectory = entry.node.type === 'directory';
        const size = isDirectory ? FileSystem.list(entry.path).length + ' элементов' : Util.formatBytes((entry.node.content || '').length * 2);

        row.innerHTML =
          '<div class="pyos-file-row__icon">' + Icons.get(isDirectory ? 'folder' : 'file', 19) + '</div>' +
          '<div class="pyos-file-row__info">' +
            '<div class="pyos-file-row__name">' + Util.escapeHtml(entry.name) + '</div>' +
            '<div class="pyos-file-row__meta">' + size + ' · ' + Util.formatDate(entry.node.modified) + '</div>' +
          '</div>' +
          '<div class="pyos-file-row__actions">' +
            '<button type="button" class="pyos-button pyos-button--small pyos-button--icon" data-act="open" data-tooltip="Открыть">' + Icons.get(isDirectory ? 'folder-open' : 'code', 14) + '</button>' +
            '<button type="button" class="pyos-button pyos-button--small pyos-button--icon" data-act="menu" data-tooltip="Действия">' + Icons.get('more', 14) + '</button>' +
          '</div>';

        row.addEventListener('click', function (event) {
          const action = event.target.closest('[data-act]');
          if (action && action.dataset.act === 'menu') { showItemMenu(event, entry.path); return; }
          if (action && action.dataset.act === 'open') { isDirectory ? navigate(entry.path) : openFile(entry.path); return; }
          state.selection = entry.path;
          renderList();
          if (isDirectory) navigate(entry.path);
          else openFile(entry.path);
        });

        row.addEventListener('dblclick', function () { isDirectory ? navigate(entry.path) : openFile(entry.path); });
        row.addEventListener('contextmenu', function (event) { event.preventDefault(); showItemMenu(event, entry.path); });
        UI.attachLongPress(row, function (event) { showItemMenu(event, entry.path); });

        attachRowDrag(row, entry);
        listElement.appendChild(row);
      });
    }

    function renderBreadcrumbs() {
      const parts = state.path.split('/').filter(Boolean);
      let html = '<button type="button" class="pyos-files__crumb' + (state.path === '/' ? ' is-current' : '') + '" data-path="/">' + Icons.get('home', 14) + 'Проект</button>';
      let current = '';
      parts.forEach(function (part, index) {
        current += '/' + part;
        html += '<span class="pyos-files__crumb-separator">' + Icons.get('chevron-right', 13) + '</span>' +
          '<button type="button" class="pyos-files__crumb' + (index === parts.length - 1 ? ' is-current' : '') + '" data-path="' + Util.escapeAttribute(current) + '">' + Util.escapeHtml(part) + '</button>';
      });
      breadcrumbsElement.innerHTML = html;
      breadcrumbsElement.querySelectorAll('[data-path]').forEach(function (button) {
        button.addEventListener('click', function () { navigate(button.dataset.path); });
      });
    }

    function renderAll() { renderTree(); renderList(); renderBreadcrumbs(); updateStorage(); }

    function navigate(path) {
      state.path = FileSystem.normalize(path);
      state.query = '';
      searchElement.value = '';
      state.expanded.add(state.path);
      let cursor = state.path;
      while (cursor && cursor !== '/') { state.expanded.add(cursor); cursor = FileSystem.parentOf(cursor); }
      renderAll();
    }

    function openFile(path) {
      const node = FileSystem.get(path);
      if (!node || node.type !== 'file') return;
      if (/\.(png|jpe?g|gif|webp|svg)$/i.test(path)) {
        Notifications.info('Просмотр изображений', 'Файл открыт в предпросмотре', { actionLabel: 'Открыть', onAction: function () { WindowManager.openApp('preview'); Bus.emit('preview:open', path); } });
        WindowManager.openApp('preview');
        Bus.emit('preview:open', path);
        return;
      }
      WindowManager.openApp('editor', { openPath: path });
      Bus.emit('files:open', { path: path });
    }

    /* — Контекстное меню элемента — */
    function showItemMenu(event, path) {
      event.preventDefault();
      event.stopPropagation();
      const node = FileSystem.get(path);
      if (!node) return;
      const isDirectory = node.type === 'directory';

      UI.openMenu([
        { type: 'title', label: path },
        isDirectory
          ? { label: 'Открыть папку', icon: 'folder-open', action: function () { navigate(path); } }
          : { label: 'Открыть в редакторе', icon: 'code', action: function () { openFile(path); } },
        { label: 'Переименовать', icon: 'pencil', action: function () { renameFlow(path); } },
        { label: 'Создать копию', icon: 'copy', action: function () {
            const copy = FileSystem.duplicate(path);
            if (copy) { Notifications.success('Копия создана', copy); renderAll(); }
          } },
        { label: 'Скачать', icon: 'download', disabled: isDirectory, action: function () { Util.downloadText(FileSystem.baseName(path), FileSystem.read(path) || '', 'text/plain;charset=utf-8'); } },
        { label: 'Копировать путь', icon: 'copy', action: function () { Util.copyText(path).then(function () { Notifications.success('Путь скопирован', path); }); } },
        '-',
        { label: 'Переместить в…', icon: 'move', submenu: directoryMenuItems(path) },
        { label: 'Удалить', icon: 'trash', action: function () { deleteFlow(path); } }
      ], event.clientX, event.clientY);
    }

    function directoryMenuItems(excludePath) {
      const directories = [{ path: '/', name: 'Проект (корень)' }].concat(
        Object.keys(FileSystem.listRecursive('/').reduce(function (acc, item) {
          if (item.node.type === 'directory') acc[item.path] = item;
          return acc;
        }, {})).map(function (path) { return { path: path, name: path }; })
      );

      return directories
        .filter(function (item) { return item.path !== excludePath && item.path !== FileSystem.parentOf(excludePath); })
        .map(function (item) {
          return {
            label: item.name, icon: 'folder',
            action: function () {
              const target = FileSystem.joinPath(item.path, FileSystem.baseName(excludePath));
              const moved = FileSystem.move(excludePath, target);
              if (moved) { Notifications.success('Перемещено', moved); renderAll(); }
              else Notifications.error('Перемещение не удалось', 'Возможно, файл уже существует');
            }
          };
        });
    }

    async function renameFlow(path) {
      const name = await UI.promptDialog('Переименовать', 'Новое имя для ' + FileSystem.baseName(path), FileSystem.baseName(path));
      if (!name) return;
      const result = FileSystem.rename(path, name);
      if (result) { Notifications.success('Переименовано', result); renderAll(); }
      else Notifications.error('Не удалось переименовать', 'Имя занято или недопустимо');
    }

    async function deleteFlow(path) {
      const confirmed = await UI.confirmDialog('Удалить ' + (FileSystem.get(path).type === 'directory' ? 'папку' : 'файл') + '?', path + ' будет удалён безвозвратно.', 'Удалить', true);
      if (!confirmed) return;
      FileSystem.remove(path);
      Notifications.success('Удалено', path);
      renderAll();
    }

    /* — Перетаскивание (мышь и палец) — */
    let dragPayload = null;

    function attachRowDrag(row, entry) {
      let ghost = null;
      let startX = 0;
      let startY = 0;
      let active = false;

      row.addEventListener('pointerdown', function (event) {
        if (event.target.closest('button')) return;
        if (event.button !== undefined && event.pointerType === 'mouse' && event.button !== 0) return;
        startX = event.clientX;
        startY = event.clientY;
        active = false;
        dragPayload = { path: entry.path };

        const move = function (moveEvent) {
          if (!active && (Math.abs(moveEvent.clientX - startX) > 8 || Math.abs(moveEvent.clientY - startY) > 8)) {
            active = true;
            row.classList.add('is-dragging');
            ghost = document.createElement('div');
            ghost.className = 'pyos-drag-ghost';
            ghost.textContent = entry.name;
            document.body.appendChild(ghost);
          }
          if (!active) return;
          ghost.style.left = moveEvent.clientX + 'px';
          ghost.style.top = moveEvent.clientY + 'px';

          const target = Util.elementFromPoint(moveEvent.clientX, moveEvent.clientY, [ghost]);
          document.querySelectorAll('.is-drop-target').forEach(function (node) { node.classList.remove('is-drop-target'); });
          const dropRow = target && target.closest ? target.closest('.pyos-file-row, .pyos-tree__row') : null;
          if (dropRow) {
            const targetPath = dropRow.dataset.path;
            const node = FileSystem.get(targetPath);
            if (node && node.type === 'directory' && targetPath !== entry.path) dropRow.classList.add('is-drop-target');
          }
        };

        const up = function (upEvent) {
          window.removeEventListener('pointermove', move);
          window.removeEventListener('pointerup', up);
          row.classList.remove('is-dragging');
          document.querySelectorAll('.is-drop-target').forEach(function (node) { node.classList.remove('is-drop-target'); });
          if (ghost) { ghost.remove(); ghost = null; }

          if (!active) { dragPayload = null; return; }

          const target = Util.elementFromPoint(upEvent.clientX, upEvent.clientY);
          const dropRow = target && target.closest ? target.closest('.pyos-file-row, .pyos-tree__row') : null;
          dragPayload = null;

          if (dropRow) {
            const targetPath = dropRow.dataset.path;
            const node = FileSystem.get(targetPath);
            if (node && node.type === 'directory' && targetPath !== entry.path && !entry.path.startsWith(targetPath + '/')) {
              const moved = FileSystem.move(entry.path, FileSystem.joinPath(targetPath, entry.name));
              if (moved) { Notifications.success('Перемещено', moved); renderAll(); }
              else Notifications.error('Перемещение не удалось', 'Такой элемент уже существует в папке');
            }
          }
        };

        window.addEventListener('pointermove', move, { passive: true });
        window.addEventListener('pointerup', up);
      });
    }

    /* — Инструменты — */
    container.querySelector('[data-up]').addEventListener('click', function () {
      if (state.path === '/') return;
      navigate(FileSystem.parentOf(state.path));
    });

    searchElement.addEventListener('input', Util.debounce(function () {
      state.query = searchElement.value;
      renderList();
    }, 180));

    container.querySelector('[data-sort]').addEventListener('click', function (event) {
      UI.dropdown(event.currentTarget, [
        { type: 'title', label: 'Сортировка' },
        { label: 'По имени', icon: 'sort', active: state.sort === 'name', action: function () { state.sort = 'name'; Store.setString('files:sort', 'name'); renderList(); } },
        { label: 'По дате изменения', icon: 'clock', active: state.sort === 'modified', action: function () { state.sort = 'modified'; Store.setString('files:sort', 'modified'); renderList(); } },
        { label: 'По размеру', icon: 'database', active: state.sort === 'size', action: function () { state.sort = 'size'; Store.setString('files:sort', 'size'); renderList(); } }
      ]);
    });

    container.querySelector('[data-view]').addEventListener('click', function () {
      state.view = state.view === 'list' ? 'grid' : 'list';
      Store.setString('files:view', state.view);
      listElement.classList.toggle('is-grid', state.view === 'grid');
    });

    container.querySelector('[data-new-file]').addEventListener('click', async function () {
      const name = await UI.promptDialog('Новый файл', 'Имя файла', 'новый-файл.py');
      if (!name) return;
      const path = FileSystem.joinPath(state.path, name);
      if (FileSystem.exists(path)) { Notifications.warning('Файл уже существует', path); return; }
      FileSystem.createFile(path, '');
      renderAll();
      Notifications.success('Файл создан', path, { actionLabel: 'Открыть', onAction: function () { openFile(path); } });
    });

    container.querySelector('[data-new-folder]').addEventListener('click', async function () {
      const name = await UI.promptDialog('Новая папка', 'Имя папки', 'новая-папка');
      if (!name) return;
      const path = FileSystem.joinPath(state.path, name);
      if (FileSystem.exists(path)) { Notifications.warning('Папка уже существует', path); return; }
      FileSystem.createDirectory(path);
      state.expanded.add(state.path);
      renderAll();
      Notifications.success('Папка создана', path);
    });

    container.querySelector('[data-more]').addEventListener('click', function (event) {
      UI.dropdown(event.currentTarget, [
        { type: 'title', label: 'Действия с проектом' },
        { label: 'Загрузить файл с устройства', icon: 'upload', action: uploadFlow },
        { label: 'Экспортировать проект (JSON)', icon: 'download', action: exportFlow },
        { label: 'Импортировать проект (JSON)', icon: 'upload', action: importFlow },
        '-',
        { label: 'Обновить дерево', icon: 'refresh', action: function () { renderAll(); } },
        { label: 'Сбросить к исходному проекту', icon: 'warning', action: resetFlow }
      ]);
    });

    function uploadFlow() {
      const input = document.createElement('input');
      input.type = 'file';
      input.multiple = true;
      input.addEventListener('change', async function () {
        const filesList = Array.from(input.files || []);
        for (const file of filesList) {
          try {
            const text = await Util.readFile(file);
            const path = FileSystem.joinPath(state.path, file.name);
            FileSystem.write(path, text);
            Notifications.success('Файл загружен', path);
          } catch (error) {
            Notifications.error('Ошибка загрузки', file.name + ': ' + error.message);
          }
        }
        renderAll();
      });
      input.click();
    }

    function exportFlow() {
      Util.downloadText('pyos-project.json', FileSystem.exportProject(), 'application/json');
      Notifications.success('Проект экспортирован', 'pyos-project.json');
    }

    function importFlow() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.json,application/json';
      input.addEventListener('change', async function () {
        const file = input.files && input.files[0];
        if (!file) return;
        try {
          const text = await Util.readFile(file);
          const stats = FileSystem.importProject(text);
          renderAll();
          Notifications.success('Проект импортирован', 'Файлов: ' + stats.files + ', папок: ' + stats.directories);
        } catch (error) {
          Notifications.error('Ошибка импорта', error.message);
        }
      });
      input.click();
    }

    async function resetFlow() {
      const confirmed = await UI.confirmDialog('Сбросить файловую систему?', 'Текущий проект будет заменён исходным набором файлов. Действие необратимо.', 'Сбросить', true);
      if (!confirmed) return;
      FileSystem.reset();
      navigate('/');
      Notifications.success('Файловая система сброшена');
    }

    container.querySelector('[data-collapse]').addEventListener('click', function () {
      const sidebar = container.querySelector('.pyos-files__sidebar');
      sidebar.classList.toggle('pyos-hidden');
    });

    listElement.addEventListener('contextmenu', function (event) {
      if (event.target.closest('.pyos-file-row')) return;
      event.preventDefault();
      UI.openMenu([
        { type: 'title', label: state.path },
        { label: 'Создать файл', icon: 'file-add', action: function () { container.querySelector('[data-new-file]').click(); } },
        { label: 'Создать папку', icon: 'folder-add', action: function () { container.querySelector('[data-new-folder]').click(); } },
        '-',
        { label: 'Загрузить с устройства', icon: 'upload', action: uploadFlow },
        { label: 'Обновить', icon: 'refresh', action: function () { renderAll(); } }
      ], event.clientX, event.clientY);
    });

    const offChanged = Bus.on('filesystem:changed', Util.debounce(renderAll, 220));
    renderAll();

    return { unmount: function () { offChanged(); } };
  }
});

/* ─────────────────────────────────────────────────────────────────────────
   МОДУЛЬ 19. ПРИЛОЖЕНИЕ «ТЕРМИНАЛ»
   ───────────────────────────────────────────────────────────────────────── */
Apps.register({
  id: 'terminal',
  name: 'Терминал',
  description: 'Оболочка среды с командами и автодополнением',
  icon: 'terminal',
  color: '#22c55e',
  defaultWidth: 820,
  defaultHeight: 480,
  minWidth: 380,
  minHeight: 240,
  mount: function (container, api) {

    const state = {
      cwd: '/',
      history: Store.getJson('terminal:history', []),
      historyIndex: -1,
      pythonReady: false
    };

    const COMMANDS = {
      help: { description: 'Список команд и справка', usage: 'help [команда]' },
      ls: { description: 'Содержимое текущей папки', usage: 'ls [путь]' },
      cd: { description: 'Перейти в папку', usage: 'cd <путь>' },
      pwd: { description: 'Текущий путь', usage: 'pwd' },
      cat: { description: 'Показать содержимое файла', usage: 'cat <файл>' },
      touch: { description: 'Создать пустой файл', usage: 'touch <файл>' },
      mkdir: { description: 'Создать папку', usage: 'mkdir <папка>' },
      rm: { description: 'Удалить файл или папку', usage: 'rm <путь>' },
      mv: { description: 'Переместить или переименовать', usage: 'mv <источник> <назначение>' },
      cp: { description: 'Скопировать файл', usage: 'cp <источник> <назначение>' },
      tree: { description: 'Дерево проекта', usage: 'tree' },
      find: { description: 'Поиск файлов', usage: 'find <запрос>' },
      open: { description: 'Открыть файл в редакторе', usage: 'open <файл>' },
      run: { description: 'Запустить Python-файл', usage: 'run <файл>' },
      python: { description: 'Выполнить код Python', usage: 'python <код>' },
      echo: { description: 'Вывести текст', usage: 'echo <текст>' },
      clear: { description: 'Очистить терминал', usage: 'clear' },
      theme: { description: 'Переключить тему', usage: 'theme [dark|light]' },
      accent: { description: 'Сменить акцентный цвет', usage: 'accent <#rrggbb>' },
      layout: { description: 'Схема тайлинга окон', usage: 'layout <master|grid|columns|rows|stack>' },
      tile: { description: 'Разложить окна по сетке', usage: 'tile' },
      float: { description: 'Сделать окна плавающими', usage: 'float' },
      ws: { description: 'Переключить рабочий стол', usage: 'ws <номер>' },
      stats: { description: 'Статистика системы', usage: 'stats' },
      save: { description: 'Сохранить все файлы', usage: 'save' },
      export: { description: 'Экспортировать проект', usage: 'export' },
      about: { description: 'О системе', usage: 'about' },
      date: { description: 'Текущая дата и время', usage: 'date' },
      history: { description: 'История команд', usage: 'history' }
    };

    container.innerHTML =
      '<div class="pyos-terminal">' +
        '<div class="pyos-terminal__toolbar">' +
          '<button type="button" class="pyos-button pyos-button--small" data-chip="ls">ls</button>' +
          '<button type="button" class="pyos-button pyos-button--small" data-chip="tree">tree</button>' +
          '<button type="button" class="pyos-button pyos-button--small" data-chip="stats">stats</button>' +
          '<button type="button" class="pyos-button pyos-button--small" data-chip="help">help</button>' +
          '<span class="pyos-divider--vertical"></span>' +
          '<button type="button" class="pyos-button pyos-button--small pyos-button--icon" data-history data-tooltip="История команд">' + Icons.get('history', 15) + '</button>' +
          '<button type="button" class="pyos-button pyos-button--small pyos-button--icon" data-copy data-tooltip="Скопировать вывод">' + Icons.get('copy', 15) + '</button>' +
          '<button type="button" class="pyos-button pyos-button--small pyos-button--icon" data-export data-tooltip="Скачать журнал">' + Icons.get('download', 15) + '</button>' +
          '<button type="button" class="pyos-button pyos-button--small pyos-button--icon" data-clear data-tooltip="Очистить">' + Icons.get('trash', 15) + '</button>' +
        '</div>' +
        '<pre class="pyos-terminal__output" data-output></pre>' +
        '<div class="pyos-terminal__input-row">' +
          '<span class="pyos-terminal__prompt" data-prompt>~ $</span>' +
          '<input type="text" class="pyos-terminal__input" data-input placeholder="Введите команду и нажмите «Выполнить»" spellcheck="false" autocomplete="off">' +
          '<button type="button" class="pyos-button pyos-button--small pyos-button--filled" data-run>' + Icons.get('play', 15) + 'Выполнить</button>' +
        '</div>' +
      '</div>';

    const output = container.querySelector('[data-output]');
    const input = container.querySelector('[data-input]');
    const promptLabel = container.querySelector('[data-prompt]');
    const terminalRoot = container.querySelector('.pyos-terminal');

    let logText = [];

    function write(text, kind) {
      const line = document.createElement('div');
      line.className = 'pyos-terminal__line' + (kind ? ' pyos-terminal__line--' + kind : '');
      line.textContent = text;
      output.appendChild(line);
      logText.push(text);
      if (output.children.length > 900) output.removeChild(output.firstChild);
      output.scrollTop = output.scrollHeight;
    }

    function writeCommand(command) {
      const line = document.createElement('div');
      line.className = 'pyos-terminal__line pyos-terminal__line--command';
      line.innerHTML = '<span class="pyos-terminal__prompt">' + Util.escapeHtml(promptLabel.textContent) + '</span> ' + Util.escapeHtml(command);
      output.appendChild(line);
      logText.push('$ ' + command);
      output.scrollTop = output.scrollHeight;
    }

    function updatePrompt() {
      promptLabel.textContent = (state.cwd === '/' ? '~' : '~' + state.cwd) + ' $';
    }

    function resolvePath(argument) {
      if (!argument) return state.cwd;
      if (argument === '~' || argument === '/') return '/';
      if (argument === '..') return FileSystem.parentOf(state.cwd);
      if (argument.startsWith('/')) return FileSystem.normalize(argument);
      return FileSystem.normalize(FileSystem.joinPath(state.cwd, argument));
    }

    async function execute(rawLine) {
      const line = String(rawLine || '').trim();
      if (!line) return;

      writeCommand(line);
      state.history.unshift(line);
      if (state.history.length > 120) state.history.pop();
      Store.setJson('terminal:history', state.history);
      state.historyIndex = -1;

      const parts = line.split(/\s+/);
      const command = parts.shift().toLowerCase();
      const args = parts;

      switch (command) {
        case 'help': {
          if (args[0] && COMMANDS[args[0]]) {
            write(args[0] + ' — ' + COMMANDS[args[0]].description, 'info');
            write('Использование: ' + COMMANDS[args[0]].usage, 'muted');
          } else {
            write('Доступные команды оболочки PyOS:', 'info');
            Object.keys(COMMANDS).forEach(function (name) {
              write('  ' + name.padEnd(10) + COMMANDS[name].description, 'output');
            });
            write('Нажмите «help <команда>» для подробностей.', 'muted');
          }
          break;
        }
        case 'ls': {
          const target = resolvePath(args[0]);
          const node = FileSystem.get(target);
          if (target !== '/' && (!node || node.type !== 'directory')) { write('Папка не найдена: ' + target, 'error'); break; }
          const entries = FileSystem.list(target);
          if (!entries.length) write('(пусто)', 'muted');
          entries.forEach(function (entry) {
            write((entry.node.type === 'directory' ? '📁 ' : '📄 ') + entry.name + (entry.node.type === 'file' ? '  (' + Util.formatBytes((entry.node.content || '').length * 2) + ')' : ''), 'output');
          });
          break;
        }
        case 'cd': {
          const target = resolvePath(args[0]);
          const node = FileSystem.get(target);
          if (target !== '/' && (!node || node.type !== 'directory')) { write('Папка не найдена: ' + target, 'error'); break; }
          state.cwd = target;
          updatePrompt();
          write('Текущая папка: ' + target, 'success');
          break;
        }
        case 'pwd': write(state.cwd, 'output'); break;
        case 'cat': {
          const target = resolvePath(args[0]);
          const content = FileSystem.read(target);
          if (content === null) { write('Файл не найден: ' + target, 'error'); break; }
          content.split('\n').forEach(function (line) { write(line, 'output'); });
          break;
        }
        case 'touch': {
          if (!args[0]) { write('Укажите имя файла', 'warning'); break; }
          const target = resolvePath(args[0]);
          if (FileSystem.exists(target)) { write('Файл уже существует: ' + target, 'warning'); break; }
          FileSystem.createFile(target, '');
          write('Создан файл: ' + target, 'success');
          break;
        }
        case 'mkdir': {
          if (!args[0]) { write('Укажите имя папки', 'warning'); break; }
          const target = resolvePath(args[0]);
          if (FileSystem.createDirectory(target)) write('Создана папка: ' + target, 'success');
          else write('Папка уже существует: ' + target, 'warning');
          break;
        }
        case 'rm': {
          const target = resolvePath(args[0]);
          if (target === '/') { write('Отказано: корень проекта удалить нельзя', 'error'); break; }
          if (FileSystem.remove(target)) write('Удалено: ' + target, 'success');
          else write('Не найдено: ' + target, 'error');
          break;
        }
        case 'mv': {
          if (args.length < 2) { write('Использование: mv <источник> <назначение>', 'warning'); break; }
          const result = FileSystem.move(resolvePath(args[0]), resolvePath(args[1]));
          write(result ? 'Перемещено в ' + result : 'Перемещение не удалось', result ? 'success' : 'error');
          break;
        }
        case 'cp': {
          if (args.length < 2) { write('Использование: cp <источник> <назначение>', 'warning'); break; }
          const source = resolvePath(args[0]);
          const content = FileSystem.read(source);
          if (content === null) { write('Файл не найден: ' + source, 'error'); break; }
          FileSystem.write(resolvePath(args[1]), content);
          write('Скопировано: ' + source + ' → ' + resolvePath(args[1]), 'success');
          break;
        }
        case 'tree': {
          const entries = FileSystem.listRecursive('/');
          write('Проект (' + entries.length + ' элементов)', 'info');
          entries.slice(0, 300).forEach(function (entry) {
            const depth = entry.path.split('/').length - 2;
            write('  '.repeat(depth) + (entry.node.type === 'directory' ? '├─ ' : '└─ ') + entry.name, 'output');
          });
          break;
        }
        case 'find': {
          const results = FileSystem.search(args.join(' '));
          if (!results.length) write('Ничего не найдено', 'muted');
          results.slice(0, 60).forEach(function (item) { write(item.path, 'output'); });
          break;
        }
        case 'open': {
          const target = resolvePath(args[0]);
          if (!FileSystem.exists(target)) { write('Не найдено: ' + target, 'error'); break; }
          WindowManager.openApp('editor', { openPath: target });
          Bus.emit('files:open', { path: target });
          write('Открыто в редакторе: ' + target, 'success');
          break;
        }
        case 'run': {
          const target = resolvePath(args[0] || 'main.py');
          const code = FileSystem.read(target);
          if (code === null) { write('Файл не найден: ' + target, 'error'); break; }
          write('Запуск ' + target + '…', 'info');
          WindowManager.openApp('python');
          Bus.emit('python:run', { path: target, code: code });
          break;
        }
        case 'python': {
          const code = args.join(' ');
          if (!code) { write('Использование: python <код>', 'warning'); break; }
          WindowManager.openApp('python');
          Bus.emit('python:run', { path: null, code: code });
          write('Код передан в исполнитель Python', 'info');
          break;
        }
        case 'echo': write(args.join(' '), 'output'); break;
        case 'clear': output.innerHTML = ''; logText = []; break;
        case 'theme': {
          const theme = args[0] === 'light' ? 'light' : args[0] === 'dark' ? 'dark' : (Config.get('theme') === 'dark' ? 'light' : 'dark');
          Config.set('theme', theme);
          write('Тема переключена: ' + theme, 'success');
          break;
        }
        case 'accent': {
          if (!/^#[0-9a-fA-F]{6}$/.test(args[0] || '')) { write('Ожидался цвет в формате #rrggbb', 'warning'); break; }
          Config.set('accent', args[0]);
          write('Акцентный цвет: ' + args[0], 'success');
          break;
        }
        case 'layout': {
          const allowed = ['master', 'grid', 'columns', 'rows', 'stack'];
          if (allowed.indexOf(args[0]) === -1) { write('Доступные схемы: ' + allowed.join(', '), 'warning'); break; }
          Config.set('tilingLayout', args[0]);
          WindowManager.tileAll();
          write('Схема расположения: ' + args[0], 'success');
          break;
        }
        case 'tile': WindowManager.tileAll(); write('Окна разложены по сетке', 'success'); break;
        case 'float': WindowManager.floatAll(); write('Окна переведены в плавающий режим', 'success'); break;
        case 'ws': {
          const number = parseInt(args[0], 10);
          if (!number) { write('Использование: ws <номер стола>', 'warning'); break; }
          WindowManager.setWorkspace(number);
          write('Активный рабочий стол: ' + Config.get('activeWorkspace'), 'success');
          break;
        }
        case 'stats': {
          const stats = FileSystem.stats();
          write('Файлов: ' + stats.files + ', папок: ' + stats.directories, 'output');
          write('Символов в проекте: ' + stats.characters, 'output');
          write('Занято в хранилище: ' + Util.formatBytes(stats.storageBytes), 'output');
          write('Открыто окон: ' + WindowManager.count(), 'output');
          write('Экран: ' + window.innerWidth + '×' + window.innerHeight + ', плотность ' + (window.devicePixelRatio || 1).toFixed(2), 'output');
          break;
        }
        case 'save': {
          Bus.emit('editor:save-all');
          write('Запрошено сохранение открытых файлов', 'success');
          break;
        }
        case 'export': {
          Util.downloadText('pyos-project.json', FileSystem.exportProject(), 'application/json');
          write('Проект экспортирован в pyos-project.json', 'success');
          break;
        }
        case 'about': {
          write('PyOS Studio — операционная среда разработки', 'info');
          write('Версия ядра 1.0.0 · оконный менеджер, тайлинг, рабочие столы', 'output');
          write('Приложения: ' + Apps.all().map(function (app) { return app.name; }).join(', '), 'output');
          break;
        }
        case 'date': write(new Date().toLocaleString('ru-RU'), 'output'); break;
        case 'history': {
          if (!state.history.length) write('История пуста', 'muted');
          state.history.slice(0, 40).reverse().forEach(function (item, index) { write((index + 1) + '  ' + item, 'output'); });
          break;
        }
        default:
          write('Неизвестная команда: ' + command, 'error');
          write('Введите «help» для списка команд', 'muted');
      }
    }

    /* — Автодополнение — */
    const suggest = document.createElement('div');
    suggest.className = 'pyos-terminal__suggest pyos-hidden';
    terminalRoot.appendChild(suggest);

    function updateSuggest() {
      const value = input.value.trim();
      if (!value || value.indexOf(' ') !== -1) { hideSuggest(); return; }
      const matches = Object.keys(COMMANDS).filter(function (name) { return name.indexOf(value.toLowerCase()) === 0; });
      if (!matches.length || matches.length > 8) { hideSuggest(); return; }

      suggest.innerHTML = matches.map(function (name) {
        return '<button type="button" class="pyos-terminal__suggest-item" data-command="' + name + '"><span class="pyos-terminal__suggest-item-name">' + name + '</span><span class="pyos-terminal__suggest-item-desc">' + COMMANDS[name].description + '</span></button>';
      }).join('');
      suggest.classList.remove('pyos-hidden');

      suggest.querySelectorAll('[data-command]').forEach(function (button) {
        button.addEventListener('click', function () {
          input.value = button.dataset.command + ' ';
          hideSuggest();
          input.focus();
        });
      });
    }

    function hideSuggest() { suggest.classList.add('pyos-hidden'); }

    input.addEventListener('input', updateSuggest);
    input.addEventListener('focus', updateSuggest);
    input.addEventListener('blur', function () { setTimeout(hideSuggest, 160); });
    input.addEventListener('keydown', function (event) {
      if (event.key === 'Enter') { const value = input.value; input.value = ''; hideSuggest(); execute(value); }
      if (event.key === 'ArrowUp') {
        event.preventDefault();
        if (state.history.length) {
          state.historyIndex = Math.min(state.historyIndex + 1, state.history.length - 1);
          input.value = state.history[state.historyIndex];
        }
      }
      if (event.key === 'ArrowDown') {
        event.preventDefault();
        state.historyIndex = Math.max(state.historyIndex - 1, -1);
        input.value = state.historyIndex === -1 ? '' : state.history[state.historyIndex];
      }
    });

    container.querySelector('[data-run]').addEventListener('click', function () {
      const value = input.value;
      input.value = '';
      hideSuggest();
      execute(value);
      input.focus();
    });

    container.querySelectorAll('[data-chip]').forEach(function (button) {
      button.addEventListener('click', function () { execute(button.dataset.chip); input.focus(); });
    });

    container.querySelector('[data-clear]').addEventListener('click', function () { output.innerHTML = ''; logText = []; });
    container.querySelector('[data-copy]').addEventListener('click', function () {
      Util.copyText(output.innerText).then(function () { Notifications.success('Вывод скопирован'); });
    });
    container.querySelector('[data-export]').addEventListener('click', function () {
      Util.downloadText('pyos-terminal.log', logText.join('\n'), 'text/plain;charset=utf-8');
    });
    container.querySelector('[data-history]').addEventListener('click', function (event) {
      const items = state.history.slice(0, 25).map(function (command) {
        return { label: command, icon: 'history', action: function () { input.value = command; input.focus(); } };
      });
      UI.dropdown(event.currentTarget, items.length ? [{ type: 'title', label: 'История команд' }].concat(items) : [{ label: 'История пуста', disabled: true }]);
    });

    output.addEventListener('contextmenu', function (event) {
      event.preventDefault();
      UI.openMenu([
        { label: 'Копировать вывод', icon: 'copy', action: function () { Util.copyText(output.innerText); } },
        { label: 'Скачать журнал', icon: 'download', action: function () { container.querySelector('[data-export]').click(); } },
        { label: 'Очистить', icon: 'trash', action: function () { output.innerHTML = ''; logText = []; } }
      ], event.clientX, event.clientY);
    });

    write('PyOS Shell · оболочка среды разработки', 'info');
    write('Введите «help» для списка команд. Все действия доступны кнопками — клавиатура нужна только для ввода текста.', 'muted');
    write('');
    updatePrompt();

    const offSaveAll = Bus.on('editor:save-all', function () { write('Событие сохранения получено редактором', 'muted'); });

    return { unmount: function () { offSaveAll(); Store.setJson('terminal:history', state.history); } };
  }
});

    /* — Упрощённый рендер разметки — */
    function renderMarkdown(text) {
      const source = String(text || '');
      const blocks = [];
      let html = Util.escapeHtml(source);

      html = html.replace(/```(\w+)?\n?([\s\S]*?)```/g, function (match, language, code) {
        const token = '%%CODE' + blocks.length + '%%';
        blocks.push({ language: language || 'python', code: code.replace(/\n$/, '') });
        return token;
      });

      html = html.replace(/`([^`\n]+)`/g, '<code>$1</code>');
      html = html.replace(/^######\s+(.*)$/gm, '<h3>$1</h3>');
      html = html.replace(/^###\s+(.*)$/gm, '<h3>$1</h3>');
      html = html.replace(/^##\s+(.*)$/gm, '<h2>$1</h2>');
      html = html.replace(/^#\s+(.*)$/gm, '<h1>$1</h1>');
      html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      html = html.replace(/(^|\s)\*([^*\n]+)\*/g, '$1<em>$2</em>');
      html = html.replace(/^\s*[-*]\s+(.*)$/gm, '<li>$1</li>');
      html = html.replace(/(<li>[\s\S]*?<\/li>)(?!\s*<li>)/g, '<ul>$1</ul>');
      html = html.replace(/^\s*(\d+)\.\s+(.*)$/gm, '<li>$2</li>');
      html = html.split(/\n{2,}/).map(function (part) {
        if (/^<(h\d|ul|ol|li|pre)/.test(part.trim())) return part;
        return part.trim() ? '<p>' + part.replace(/\n/g, '<br>') + '</p>' : '';
      }).join('');

      html = html.replace(/%%CODE(\d+)%%/g, function (match, index) {
        const block = blocks[Number(index)];
        const highlighted = Highlight.render(block.code, Highlight.languageForPath('file.' + (block.language === 'python' ? 'py' : block.language === 'javascript' ? 'js' : block.language)));
        return '<div class="pyos-gemini__code">' +
          '<div class="pyos-gemini__code-header"><span>' + Util.escapeHtml(block.language) + ' · ' + block.code.split('\n').length + ' строк</span>' +
          '<span style="display:flex;gap:5px">' +
            '<button type="button" class="pyos-button pyos-button--small" data-copy-code>' + Icons.get('copy', 13) + 'Копировать</button>' +
            '<button type="button" class="pyos-button pyos-button--small pyos-button--tonal" data-open-code>' + Icons.get('code', 13) + 'В редактор</button>' +
          '</span></div>' +
          '<pre class="pyos-gemini__code-body"><code>' + highlighted + '</code></pre>' +
        '</div>';
      });

      return { html: html, blocks: blocks };
    }

    function renderMessages() {
      const chat = activeChat();
      messagesElement.innerHTML = '';

      if (!chat.messages.length) {
        messagesElement.innerHTML =
          '<div class="pyos-empty" style="height:100%">' + Icons.get('robot', 48) +
          '<div style="font-size:15px;font-weight:600;color:var(--pyos-text)">Диалог пуст</div>' +
