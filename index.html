/* ══════════ [EXP-JS-7] APP-1 · SN-TUNES (МУЗЫКА) ══════════ */
var TRACKS=[
  {t:'Небула',a:'PyOS FM',d:214},
  {t:'Сверхновая',a:'Kernel Panic',d:187},
  {t:'Ночной компилятор',a:'def night():',d:243},
  {t:'Пиксельный дождь',a:'SN-84',d:165},
  {t:'Гравитация нуля',a:'Void Module',d:228},
  {t:'Синтаксис свободы',a:'Lambda Band',d:198},
  {t:'Орбитальный джем',a:'Astro Shell',d:256},
  {t:'Рассвет 4.0',a:'Supernova Collective',d:172}
];
var musicState={idx:0,playing:false,pos:0,shuffle:false,repeat:false,vol:.8};
var musicEqOn=false;
function regMusic(){
  regPlugin({
    id:'sn-music',name:'Музыка SN-Tunes',icon:'sn-music',
    width:780,height:500,
    init:function(app){
      musicState.timer=setInterval(tick,1000);
      app.window.onClose=function(){clearInterval(musicState.timer);};
      var favs=snStore.get('favs',[]);
      var wrap=h('div',{class:'sn-music'});
      var left=h('div',{class:'sn-mleft'});
      var disc=h('div',{class:'sn-disc'});
      var tt=h('div',{class:'sn-track-t'});
      var ta=h('div',{class:'sn-track-a'});
      var prog=h('div',{class:'sn-prog'},h('i'));
      var times=h('div',{class:'sn-times'},h('span',null,'0:00'),h('span',null,'0:00'));
      prog.addEventListener('click',function(e){
        var r=prog.getBoundingClientRect();
        musicState.pos=Math.floor((e.clientX-r.left)/r.width*TRACKS[musicState.idx].d);
        drawNow();
      });
      var bPlay=snBtn('','play','big',function(){togglePlay();});
      var bPrev=snBtn('','restart','',function(){prev();});
      var bNext=snBtn('','play','',function(){next();});
      var bSh=snBtn('','refresh','tog',function(){musicState.shuffle=!musicState.shuffle;bSh.classList.toggle('on',musicState.shuffle);});
      var bRp=snBtn('','save','tog',function(){musicState.repeat=!musicState.repeat;bRp.classList.toggle('on',musicState.repeat);});
      var trans=h('div',{class:'sn-transport'},bPrev,bPlay,bNext,bSh,bRp);
      var eq=h('div',{class:'sn-eqbars'});
      for(var i=0;i<12;i++){eq.appendChild(h('i'));}
      var osc=h('canvas',{class:'sn-osc',width:'200',height:'60'});
      var vol=h('input',{class:'sn-vol',type:'range',min:'0',max:'1',step:'.05',value:String(musicState.vol)});
      vol.addEventListener('input',function(){musicState.vol=parseFloat(vol.value);});
      left.append(disc,tt,ta,prog,times,trans,eq,osc,h('div',{style:{display:'flex',alignItems:'center',gap:'8px'}},ic('vol'),vol));
      var list=h('div',{class:'sn-playlist'});
      wrap.append(left,list);
      app.body.innerHTML='';
      app.body.appendChild(wrap);
      function drawList(){
        list.innerHTML='';
        TRACKS.forEach(function(tr,i){
          var heart=h('span',{class:'sn-heart'+(favs.indexOf(i)>=0?' fav':'')},ic('sn-heart'));
          heart.addEventListener('click',function(e){
            e.stopPropagation();
            var p=favs.indexOf(i);
            if(p>=0){favs.splice(p,1);}else{favs.push(i);}
            snStore.set('favs',favs);
            heart.classList.toggle('fav',favs.indexOf(i)>=0);
          });
          var it=h('div',{class:'sn-pl-item'+(i===musicState.idx?' cur':''),style:{animationDelay:(i*.03)+'s'},
            onclick:function(){musicState.idx=i;musicState.pos=0;musicState.playing=true;drawNow();drawList();snd.click();}},
            h('span',{class:'n'},String(i+1)),
            h('span',{class:'ti'},h('b',null,tr.t),h('i',null,tr.a)),
            h('span',{class:'du'},mmss(tr.d)),heart);
          list.appendChild(it);
        });
      }
      function drawNow(){
        var tr=TRACKS[musicState.idx];
        tt.textContent=tr.t;
        ta.textContent=tr.a;
        $('.sn-prog i',left).style.width=(musicState.pos/tr.d*100)+'%';
        times.firstChild.textContent=mmss(musicState.pos);
        times.lastChild.textContent=mmss(tr.d);
        disc.classList.toggle('spin',musicState.playing);
        eq.classList.toggle('on',musicState.playing);
        bPlay.innerHTML='';
        bPlay.appendChild(ic(musicState.playing?'minus':'play'));
        $$('.sn-pl-item',list).forEach(function(el2,i2){el2.classList.toggle('cur',i2===musicState.idx);});
        musicEqOn=musicState.playing;
        app.window.setTitle('SN-Tunes — '+(musicState.playing?'▶ ':'')+tr.t);
      }
      function togglePlay(){musicState.playing=!musicState.playing;drawNow();}
      function next(){
        if(musicState.shuffle){musicState.idx=ri(0,TRACKS.length-1);}
        else{musicState.idx=(musicState.idx+1)%TRACKS.length;}
        musicState.pos=0;drawNow();drawList();
      }
      function prev(){
        if(musicState.pos>4){musicState.pos=0;}
        else{musicState.idx=(musicState.idx-1+TRACKS.length)%TRACKS.length;musicState.pos=0;}
        drawNow();drawList();
      }
      function tick(){
        if(!musicState.playing||!document.body.contains(left)){return;}
        musicState.pos++;
        if(musicState.pos>=TRACKS[musicState.idx].d){
          if(musicState.repeat){musicState.pos=0;}
          else{next();}
        }
        drawNow();
      }
      /* осциллограф */
      var octx=osc.getContext('2d');
      var ph=0;
      (function loop(){
        if(!document.body.contains(osc)){return;}
        octx.clearRect(0,0,200,60);
        octx.beginPath();
        var cs=getComputedStyle(document.documentElement);
        octx.strokeStyle=(cs.getPropertyValue('--acc')||'#4f8cff').trim();
        octx.lineWidth=1.8;
        octx.shadowColor=octx.strokeStyle;
        octx.shadowBlur=7;
        for(var x=0;x<=200;x+=3){
          var amp=musicState.playing?(16+6*Math.sin(ph*.7+x*.05))*musicState.vol:2;
          var y=30+Math.sin(x*.06+ph)*amp*(musicState.playing?1:.15)+ (musicState.playing?Math.sin(x*.17+ph*2.2)*4:0);
          if(x===0){octx.moveTo(x,y);}else{octx.lineTo(x,y);}
        }
        octx.stroke();
        ph+=musicState.playing?.14:.02;
        requestAnimationFrame(loop);
      })();
      drawList();
      drawNow();
    }
  });
}

/* ══════════ [EXP-JS-8] APP-2 · SN-CANVAS (ДОСКА) ══════════ */
function regCanvas(){
  regPlugin({
    id:'sn-canvas',name:'Доска SN-Canvas',icon:'sn-brush',
    width:760,height:560,
    init:function(app){
      app.body.innerHTML='';
      var tool='brush',color='#4f8cff',size=4,layer=0;
      var wrap=h('div',{class:'sn-cv-wrap gridbg'});
      var cvs=[];
      for(var i=0;i<3;i++){
        var c=h('canvas',{width:'640',height:'400'});
        c.style.zIndex=String(i+1);
        wrap.appendChild(c);
        cvs.push(c);
      }
      var undoS=[],redoS=[];
      function ctxs(){return cvs[layer].getContext('2d');}
      function snap(){
        undoS.push(cvs[layer].toDataURL());
        if(undoS.length>18){undoS.shift();}
        redoS.length=0;
      }
      /* загрузка сохранённого */
      var saved=snStore.get('canvas.layers',null);
      if(saved){
        saved.forEach(function(durl,i2){
          if(!durl||!cvs[i2]){return;}
          var img=new Image();
          img.onload=function(){cvs[i2].getContext('2d').drawImage(img,0,0);};
          img.src=durl;
        });
      }
      var drawing=false,last=null;
      wrap.addEventListener('pointerdown',function(e){
        if(e.target!==cvs[layer]){return;}
        drawing=true;snap();
        last=pos(e);
        stroke(last,last);
      });
      wrap.addEventListener('pointermove',function(e){
        if(!drawing){return;}
        var p=pos(e);
        stroke(last,p);
        last=p;
      });
      window.addEventListener('pointerup',function(){drawing=false;});
      function pos(e){
        var r=cvs[layer].getBoundingClientRect();
        return {x:(e.clientX-r.left)*(640/r.width),y:(e.clientY-r.top)*(400/r.height)};
      }
      function stroke(a,b){
        var cx=ctxs();
        cx.globalCompositeOperation=tool==='eraser'?'destination-out':'source-over';
        cx.strokeStyle=color;
        cx.lineWidth=size*(tool==='eraser'?2.2:1);
        cx.lineCap='round';
        cx.lineJoin='round';
        cx.beginPath();
        cx.moveTo(a.x,a.y);
        cx.lineTo(b.x,b.y);
        cx.stroke();
      }
      var bar=h('div',{class:'sn-appbar'});
      var bBrush=snBtn('Кисть','sn-brush','on',function(){tool='brush';markTool();});
      var bEr=snBtn('Ластик','trash','',function(){tool='eraser';markTool();});
      function markTool(){
        bBrush.classList.toggle('on',tool==='brush');
        bEr.classList.toggle('on',tool==='eraser');
      }
      var colIn=h('input',{type:'color',value:'#4f8cff',style:{width:'34px',height:'30px',border:'none',background:'transparent',cursor:'pointer'}});
      colIn.addEventListener('input',function(){color=colIn.value;});
      var sws=h('div',{style:{display:'flex',gap:'4px'}});
      ['#4f8cff','#8a5cff','#ff5c7a','#ffb454','#3ddc84','#22d3ee','#ffffff','#111111'].forEach(function(cc){
        var s=h('span',{class:'sn-sw2'+(cc===color?' sel':''),style:{background:cc},
          onclick:function(){color=cc;colIn.value=cc;$$('.sn-sw2',sws).forEach(function(x){x.classList.remove('sel');});s.classList.add('sel');}});
        sws.appendChild(s);
      });
      var th=h('input',{type:'range',min:'1',max:'24',value:'4',style:{width:'84px',accentColor:'var(--acc)'}});
      th.addEventListener('input',function(){size=parseInt(th.value,10);});
      var layBtns=[];
      var layBox=h('div',{class:'sn-layers'});
      for(i=0;i<3;i++){
        (function(i3){
          var b=h('button',{class:'sn-layer-b'+(i3===0?' on':''),onclick:function(){
            layer=i3;
            layBtns.forEach(function(x,j){x.classList.toggle('on',j===i3);});
            cvs.forEach(function(cv,j){cv.style.pointerEvents=j===i3?'auto':'none';});
            snd.click();
          }},'С'+(i3+1));
          layBtns.push(b);
          layBox.appendChild(b);
        })(i);
      }
      cvs[1].style.pointerEvents='none';
      cvs[2].style.pointerEvents='none';
      var stickers=h('div',{style:{display:'flex',gap:'4px'}});
      ['😀','🚀','⭐','🔥','💙','🐍'].forEach(function(em){
        var b=h('button',{class:'sn-hbtn',style:{padding:'4px 8px'},onclick:function(){
          var cx=ctxs();
          snap();
          cx.font='28px serif';
          cx.fillText(em,rnd(60,520),rnd(60,340));
        }},em);
        stickers.appendChild(b);
      });
      bar.append(bBrush,bEr,colIn,sws,th,layBox,stickers,
        snBtn('Undo','restart','',function(){
          if(!undoS.length){return;}
          redoS.push(cvs[layer].toDataURL());
          var img=new Image();
          img.onload=function(){var cx=ctxs();cx.clearRect(0,0,640,400);cx.drawImage(img,0,0);};
          img.src=undoS.pop();
        }),
        snBtn('Redo','refresh','',function(){
          if(!redoS.length){return;}
          undoS.push(cvs[layer].toDataURL());
          var img=new Image();
          img.onload=function(){var cx=ctxs();cx.clearRect(0,0,640,400);cx.drawImage(img,0,0);};
          img.src=redoS.pop();
        }),
        snBtn('Сетка','sn-grid','on',function(e){
          wrap.classList.toggle('gridbg');
          e.currentTarget.classList.toggle('on',wrap.classList.contains('gridbg'));
        }),
        snBtn('Очистить','trash','',function(){
          snap();
          ctxs().clearRect(0,0,640,400);
        }),
        snBtn('PNG','save','acc',function(){
          var out=h('canvas',{width:'640',height:'400'});
          var oc=out.getContext('2d');
          oc.fillStyle='#ffffff';
          oc.fillRect(0,0,640,400);
          cvs.forEach(function(cv){oc.drawImage(cv,0,0);});
          var a=h('a',{href:out.toDataURL('image/png'),download:'sn-canvas.png'});
          document.body.appendChild(a);a.click();a.remove();
          PYOS.notify('SN-Canvas','PNG экспортирован','save');
        }),
        snBtn('Сохранить','sn-vault','',function(){
          snStore.set('canvas.layers',cvs.map(function(cv){return cv.toDataURL();}));
          PYOS.notify('SN-Canvas','Сохранено в системе','save');
        }));
      app.body.append(bar,wrap,
        h('div',{class:'sn-statusbar'},h('span',null,'Слой '+(layer+1)+'/3 · кисть '+size+'px · undo: '+undoS.length)));
    }
  });
}

/* ══════════ [EXP-JS-9] APP-3 · SN-CAL (КАЛЕНДАРЬ) ══════════ */
var EV_FILE='/Документы/события.json';
function calLoad(){
  var raw=PYOS.vfs.read(EV_FILE);
  if(raw===null){
    if(!PYOS.vfs.resolve('/Документы')){PYOS.vfs.mkdir('/','Документы');}
    PYOS.vfs.write('/Документы','события.json','{}');
    return {};
  }
  try{return JSON.parse(raw)||{};}
  catch(e){return {};}
}
function calSave(ev){
  PYOS.vfs.write('/Документы','события.json',JSON.stringify(ev,null,1));
}
function regCal(){
  regPlugin({
    id:'sn-cal',name:'Календарь SN-Cal',icon:'sn-calendar',
    width:740,height:520,
    init:function(app){
      app.body.innerHTML='';
      var view=new Date();
      view.setDate(1);
      var sel=iso(new Date());
      var MON=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
      var main=h('div',{class:'sn-cal-main'});
      var side=h('div',{class:'sn-cal-side'});
      var head=h('div',{class:'sn-cal-head'});
      var title=h('b');
      head.append(
        snBtn('◀','restart','',function(){view.setMonth(view.getMonth()-1);draw();}),
        title,
        snBtn('Сегодня','sn-calendar','',function(){view=new Date();view.setDate(1);sel=iso(new Date());draw();}),
        snBtn('▶','play','',function(){view.setMonth(view.getMonth()+1);draw();}));
      var grid=h('div',{class:'sn-cal-grid'});
      main.append(head,grid);
      function draw(){
        title.textContent=MON[view.getMonth()]+' '+view.getFullYear();
        grid.innerHTML='';
        ['пн','вт','ср','чт','пт','сб','вс'].forEach(function(w){
          grid.appendChild(h('div',{class:'sn-cal-wd'},w));
        });
        var first=new Date(view);
        var startDow=(first.getDay()+6)%7;
        var days=new Date(view.getFullYear(),view.getMonth()+1,0).getDate();
        var prevDays=new Date(view.getFullYear(),view.getMonth(),0).getDate();
        var ev=calLoad();
        var today=iso(new Date());
        for(var i=0;i<42;i++){
          var dnum,cls='sn-cal-d',dIso;
          if(i<startDow){
            dnum=prevDays-startDow+i+1;
            cls+=' out';
            dIso=iso(new Date(view.getFullYear(),view.getMonth()-1,dnum));
          }else if(i-startDow<days){
            dnum=i-startDow+1;
            dIso=iso(new Date(view.getFullYear(),view.getMonth(),dnum));
            if(dIso===today){cls+=' today';}
            if(dIso===sel){cls+=' sel2';}
          }else{
            dnum=i-startDow-days+1;
            cls+=' out';
            dIso=iso(new Date(view.getFullYear(),view.getMonth()+1,dnum));
          }
          (function(dIso2){
            var cell=h('div',{class:cls,onclick:function(){sel=dIso2;draw();drawSide();}},
              h('span',null,String(dnum)));
            if(ev[dIso2]&&ev[dIso2].length){cell.appendChild(h('span',{class:'evdot'}));}
            grid.appendChild(cell);
          })(dIso);
          if(i>=startDow+days-1&&(i+1)%7===0&&i-startDow>=days){break;}
        }
      }
      function drawSide(){
        var ev=calLoad();
        side.innerHTML='';
        side.appendChild(h('div',{class:'sn-w-title'},'Выбранный день · '+sel));
        var list=ev[sel]||[];
        list.forEach(function(e2,i2){
          side.appendChild(h('div',{class:'sn-ev'},
            h('span',{class:'x',onclick:function(){
              list.splice(i2,1);calSave(ev);draw();drawSide();
            }},'✕'),
            h('time',null,e2.time||'—'),e2.title));
        });

/* ══════════ [EXP-JS-14] APP-8 · SN-PIXEL (ПИКСЕЛЬ-АРТ) ══════════ */
var PX_COLORS=['#111111','#ffffff','#4f8cff','#8a5cff','#ff5c7a','#ff9d5c','#ffd166','#3ddc84','#22d3ee','#7a5c3e','#8b96a9','#1c2a45'];
function regPixel(){
  regPlugin({
    id:'sn-pixel',name:'Пиксель-арт SN-Pixel',icon:'sn-pixel',
    width:560,height:560,
    init:function(app){
      app.body.innerHTML='';
      var N=16,cell=22;
      var gridData=[];
      for(var y=0;y<N;y++){gridData.push(new Array(N).fill(null));}
      var savedTxt=PYOS.vfs.read('/Проекты/pixel-art.json');
      if(savedTxt){try{gridData=JSON.parse(savedTxt);}catch(e){}}
      var color=PX_COLORS[2],tool='pen';
      var cv=h('canvas',{class:'sn-px-canvas',width:String(N*cell),height:String(N*cell)});
      var cx=cv.getContext('2d');
      function draw(){
        cx.fillStyle='#11161f';
        cx.fillRect(0,0,N*cell,N*cell);
        for(var yy=0;yy<N;yy++){
          for(var xx=0;xx<N;xx++){
            if(gridData[yy][xx]){
              cx.fillStyle=gridData[yy][xx];
              cx.fillRect(xx*cell,yy*cell,cell,cell);
            }
          }
        }
        cx.strokeStyle='rgba(255,255,255,.06)';
        for(var g2=0;g2<=N;g2++){
          cx.beginPath();cx.moveTo(g2*cell,0);cx.lineTo(g2*cell,N*cell);cx.stroke();
          cx.beginPath();cx.moveTo(0,g2*cell);cx.lineTo(N*cell,g2*cell);cx.stroke();
        }
      }
      function fill(px,py,nc){
        var target=gridData[py][px];
        if(target===nc){return;}
        var stack=[[px,py]];
        while(stack.length){
          var p=stack.pop(),x=p[0],y2=p[1];
          if(x<0||y2<0||x>=N||y2>=N){continue;}
          if(gridData[y2][x]!==target){continue;}
          gridData[y2][x]=nc;
          stack.push([x+1,y2],[x-1,y2],[x,y2+1],[x,y2-1]);
        }
      }
      var painting=false;
      function at(e){
        var r=cv.getBoundingClientRect();
        return [clamp(Math.floor((e.clientX-r.left)/r.width*N),0,N-1),
          clamp(Math.floor((e.clientY-r.top)/r.height*N),0,N-1)];
      }
      cv.addEventListener('pointerdown',function(e){
        var p=at(e);
        if(tool==='fill'){fill(p[0],p[1],color);}
        else if(tool==='eraser'){gridData[p[1]][p[0]]=null;}
        else{gridData[p[1]][p[0]]=color;}
        painting=true;draw();
      });
      cv.addEventListener('pointermove',function(e){
        if(!painting||tool==='fill'){return;}
        var p=at(e);
        if(tool==='eraser'){gridData[p[1]][p[0]]=null;}
        else{gridData[p[1]][p[0]]=color;}
        draw();
      });
      window.addEventListener('pointerup',function(){painting=false;});
      var pal=h('div',{class:'sn-palette'});
      PX_COLORS.forEach(function(cc,i2){
        var s=h('span',{class:'sn-sw2'+(i2===2?' sel':''),style:{background:cc,width:'26px',height:'26px'},
          onclick:function(){color=cc;$$('.sn-sw2',pal).forEach(function(x){x.classList.remove('sel');});s.classList.add('sel');}});
        pal.appendChild(s);
      });
      var bPen=snBtn('Кисть','sn-brush','on',function(){tool='pen';tmark();});
      var bFill=snBtn('Заливка','save','',function(){tool='fill';tmark();});
      var bEr=snBtn('Ластик','trash','',function(){tool='eraser';tmark();});
      function tmark(){
        bPen.classList.toggle('on',tool==='pen');
        bFill.classList.toggle('on',tool==='fill');
        bEr.classList.toggle('on',tool==='eraser');
      }
      app.body.append(
        h('div',{class:'sn-appbar'},bPen,bFill,bEr,
          snBtn('Очистить','trash','',function(){
            for(var yy=0;yy<N;yy++){for(var xx=0;xx<N;xx++){gridData[yy][xx]=null;}}
            draw();
          }),
          snBtn('В Файлы','files','',function(){
            PYOS.vfs.write('/Проекты','pixel-art.json',JSON.stringify(gridData));
            PYOS.notify('SN-Pixel','Сохранено в /Проекты/pixel-art.json','save');
          }),
          snBtn('PNG ×16','save','acc',function(){
            var out=h('canvas',{width:'256',height:'256'});
            var oc=out.getContext('2d');
            for(var yy=0;yy<N;yy++){
              for(var xx=0;xx<N;xx++){
                if(gridData[yy][xx]){
                  oc.fillStyle=gridData[yy][xx];
                  oc.fillRect(xx*16,yy*16,16,16);
                }
              }
            }
            var a=h('a',{href:out.toDataURL('image/png'),download:'sn-pixel.png'});
            document.body.appendChild(a);a.click();a.remove();
          })),
        pal,cv);
      draw();
    }
  });
}

/* ══════════ [EXP-JS-16] APP-10 · ЗМЕЙКА ══════════ */
function regSnake(){
  regPlugin({
    id:'sn-snake',name:'Змейка SN-Neon',icon:'sn-game',
    width:520,height:600,
    init:function(app){
      app.body.innerHTML='';
      var N=20,cell=20;
      var cv=h('canvas',{class:'sn-game-cv',width:String(N*cell),height:String(N*cell)});
      var cx=cv.getContext('2d');
      var snake,dir,ndir,food,score,best=snStore.get('snake.best',0),level,alive,paused,timer;
      function reset(){
        snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];
        dir={x:1,y:0};ndir=dir;
        score=0;level=1;alive=true;paused=false;
        placeFood();
        clearInterval(timer);
        timer=setInterval(step,130);
        draw();
      }
      function placeFood(){
        do{food={x:ri(0,N-1),y:ri(0,N-1)};}
        while(snake.some(function(s){return s.x===food.x&&s.y===food.y;}));
      }
      function step(){
        if(!alive||paused||!document.body.contains(cv)){return;}
        dir=ndir;
        var head={x:(snake[0].x+dir.x+N)%N,y:(snake[0].y+dir.y+N)%N};
        if(snake.some(function(s){return s.x===head.x&&s.y===head.y;})){
          alive=false;
          clearInterval(timer);
          if(score>best){best=score;snStore.set('snake.best',best);}
          snd.error();
          draw();
          return;
        }
        snake.unshift(head);
        if(head.x===food.x&&head.y===food.y){
          score+=10;
          if(score%50===0){
            level++;
            clearInterval(timer);
            timer=setInterval(step,Math.max(55,130-level*10));
          }
          placeFood();
          snd.tone(1100,.07,'square',.04);
        }else{snake.pop();}
        draw();
      }
      function draw(){
        var cs=getComputedStyle(document.documentElement);
        var acc=(cs.getPropertyValue('--acc')||'#4f8cff').trim();
        var acc2=(cs.getPropertyValue('--acc2')||'#8a5cff').trim();
        cx.fillStyle='#05070d';
        cx.fillRect(0,0,N*cell,N*cell);
        cx.strokeStyle='rgba(255,255,255,.04)';
        for(var g2=0;g2<=N;g2++){
          cx.beginPath();cx.moveTo(g2*cell,0);cx.lineTo(g2*cell,N*cell);cx.stroke();
          cx.beginPath();cx.moveTo(0,g2*cell);cx.lineTo(N*cell,g2*cell);cx.stroke();
        }
        cx.shadowBlur=14;
        cx.shadowColor='#ff5c7a';
        cx.fillStyle='#ff5c7a';
        cx.beginPath();
        cx.arc(food.x*cell+cell/2,food.y*cell+cell/2,cell/2-3,0,7);
        cx.fill();
        snake.forEach(function(s,i){
          cx.shadowColor=i===0?acc:acc2;
          cx.fillStyle=i===0?acc:acc2;
          cx.globalAlpha=1-i/(snake.length+14);
          cx.fillRect(s.x*cell+2,s.y*cell+2,cell-4,cell-4);
        });
        cx.globalAlpha=1;
        cx.shadowBlur=0;
        hud.innerHTML='';
        hud.append(
          h('span',null,'Счёт: ',h('b',null,String(score))),
          h('span',null,'Уровень: ',h('b',null,String(level))),
          h('span',null,'Рекорд: ',h('b',null,String(best)))));
        if(!alive||paused){
          over.innerHTML='';
          over.append(
            h('h3',null,alive?'ПАУЗА':'ИГРА ОКОНЧЕНА'),
            h('div',null,'Счёт: '+score),
            snBtn('Заново','restart','acc',function(){over.innerHTML='';over.style.display='none';reset();}));
          over.style.display='flex';
        }
      }
      var hud=h('div',{class:'sn-game-hud'});
      var over=h('div',{class:'sn-game-over',style:{display:'none'}});
      var gw=h('div',{class:'sn-game-wrap'},hud,cv,over,
        h('div',{style:{fontSize:'11px',color:'var(--mut)'}},'Стрелки/WASD · Space — пауза'));
      app.body.appendChild(gw);
      function key(e){
        if(!document.body.contains(cv)){document.removeEventListener('keydown',key);return;}
        var k=e.key.toLowerCase();
        if(k===' '){paused=!paused;draw();e.preventDefault();return;}
        var map={arrowup:{x:0,y:-1},w:{x:0,y:-1},arrowdown:{x:0,y:1},s:{x:0,y:1},
          arrowleft:{x:-1,y:0},a:{x:-1,y:0},arrowright:{x:1,y:0},d:{x:1,y:0}};
        var nd=map[k];
        if(nd&&(nd.x!==-dir.x||nd.y!==-dir.y)){ndir=nd;e.preventDefault();}
      }
      document.addEventListener('keydown',key);
      app.window.onClose=function(){
        clearInterval(timer);
        alive=false;
        document.removeEventListener('keydown',key);
      };
      reset();
    }
  });
}

/* ══════════ [EXP-JS-17] APP-11 · 2048 ══════════ */
function reg2048(){
  regPlugin({
    id:'sn-2048',name:'Игра 2048',icon:'sn-grid',
    width:440,height:560,
    init:function(app){
      app.body.innerHTML='';
      var g2=new Array(16).fill(0);
      var best=snStore.get('g2048.best',0);
      var won=false;
      function addTile(){
        var empty=[];
        g2.forEach(function(v,i){if(!v){empty.push(i);}});
        if(!empty.length){return;}
        g2[empty[ri(0,empty.length-1)]]=Math.random()<.9?2:4;
      }
      function slide(row){
        var a=row.filter(function(v){return v;});
        var merged=false;
        for(var i=0;i<a.length-1;i++){
          if(a[i]===a[i+1]){a[i]*=2;a.splice(i+1,1);merged=true;}
        }
        while(a.length<4){a.push(0);}
        return {row:a,moved:merged||row.some(function(v,i2){return v!==a[i2];})};
      }
      function move(dxx){
        var moved=false;
        var old=g2.slice();
        function get(r,c){return g2[r*4+c];}
        function set(r,c,v){g2[r*4+c]=v;}
        if(dxx==='l'||dxx==='r'){
          for(var r=0;r<4;r++){
            var row=[get(r,0),get(r,1),get(r,2),get(r,3)];
            if(dxx==='r'){row.reverse();}
            var res=slide(row);
            if(dxx==='r'){res.row.reverse();}
            for(var c=0;c<4;c++){set(r,c,res.row[c]);}
          }
        }else{
          for(var c2=0;c2<4;c2++){
            var col=[get(0,c2),get(1,c2),get(2,c2),get(3,c2)];
            if(dxx==='d'){col.reverse();}
            var res2=slide(col);
            if(dxx==='d'){res2.row.reverse();}
            for(var r2=0;r2<4;r2++){set(r2,c2,res2.row[r2]);}
          }
        }
        moved=g2.some(function(v,i){return v!==old[i];});
        if(moved){
          addTile();
          snd.tone(520,.04,'triangle',.03);
        }
        draw(moved);
      }
      function scoreNow(){
        return g2.reduce(function(a,b){return a+b;},0);
      }
      function canMove(){
        if(g2.indexOf(0)>=0){return true;}
        for(var r=0;r<4;r++){
          for(var c=0;c<4;c++){
            var v=g2[r*4+c];
            if(c<3&&g2[r*4+c+1]===v){return true;}
            if(r<3&&g2[(r+1)*4+c]===v){return true;}
          }
        }
        return false;
      }
      var gridEl=h('div',{class:'sn-g2048'});
      var hud=h('div',{class:'sn-game-hud'});
      var over=h('div',{class:'sn-game-over',style:{display:'none'}});
      function draw(moved){
        gridEl.innerHTML='';
        g2.forEach(function(v,i){
          var cls='sn-t2048'+(v?' v'+Math.min(v,2048):'');
          var t=h('div',{class:cls},v?String(v):'');
          if(v&&moved){t.classList.add('new');}
          gridEl.appendChild(t);
        });
        var sc=scoreNow();
        if(sc>best){best=sc;snStore.set('g2048.best',best);}
        hud.innerHTML='';
        hud.append(h('span',null,'Очки: ',h('b',null,String(sc))),
          h('span',null,'Рекорд: ',h('b',null,String(best))));
        if(g2.indexOf(2048)>=0&&!won){
          won=true;
          over.innerHTML='';
          over.append(h('h3',null,'ПОБЕДА! 2048'),
            snBtn('Продолжить','play','acc',function(){over.style.display='none';}));
          over.style.display='flex';
          snd.start();
        }
        if(!canMove()){
          over.innerHTML='';
          over.append(h('h3',null,'ИГРА ОКОНЧЕНА'),h('div',null,'Очки: '+sc),
            snBtn('Заново','restart','acc',restart));
          over.style.display='flex';
          snd.error();
        }
      }
      function restart(){
        g2=new Array(16).fill(0);
        won=false;
        over.style.display='none';
        addTile();addTile();
        draw(false);
      }
      function key(e){
        if(!document.body.contains(gridEl)){document.removeEventListener('keydown',key);return;}
        var map={arrowleft:'l',a:'l',arrowright:'r',d:'r',arrowup:'u',w:'u',arrowdown:'d',s:'d'};
        var dxx=map[e.key.toLowerCase()];
        if(dxx){e.preventDefault();move(dxx);}
      }
      document.addEventListener('keydown',key);
      app.window.onClose=function(){document.removeEventListener('keydown',key);};
      var gw=h('div',{class:'sn-game-wrap'},hud,gridEl,over,
        h('div',{style:{display:'flex',gap:'8px'}},
          snBtn('Заново','restart','acc',restart)),
        h('div',{style:{fontSize:'11px',color:'var(--mut)'}},'Стрелки / WASD'));
      app.body.appendChild(gw);
      restart();
    }
  });
}

/* ══════════ [EXP-JS-18] APP-12 · SN-QR (ГЕНЕРАТОР) ══════════ */
function regQR(){
  regPlugin({
    id:'sn-qr',name:'QR-генератор SN-QR',icon:'sn-qr',
    width:480,height:600,
    init:function(app){
      app.body.innerHTML='';
      function hash32(str){
        var hsh=2166136261;
        for(var i=0;i<str.length;i++){
          hsh^=str.charCodeAt(i);
          hsh=Math.imul(hsh,16777619);
        }
        return hsh>>>0;
      }
      function mulberry(a){
        return function(){
          a|=0;a=a+0x6D2B79F5|0;
          var t=Math.imul(a^a>>>15,1|a);
          t=t+Math.imul(t^t>>>7,61|t)^t;
          return ((t^t>>>14)>>>0)/4294967296;
        };
      }
      var inp=h('input',{class:'py-input',placeholder:'Текст или ссылка…',value:'https://pyos.local'});
      var sizeSel=h('select',{class:'py-input',style:{width:'130px'}},
        h('option',{value:'21'},'21×21 (S)'),
        h('option',{value:'25',selected:'selected'},'25×25 (M)'),
        h('option',{value:'29'},'29×29 (L)'));
      var lvlSel=h('select',{class:'py-input',style:{width:'150px'}},
        h('option',{value:'.42'},'L · 7%'),
        h('option',{value:'.5',selected:'selected'},'M · 15%'),
        h('option',{value:'.58'},'Q · 25%'),
        h('option',{value:'.66'},'H · 30%'));
      var cv=h('canvas',{class:'sn-qr-cv'});
      var hist=snStore.get('qr.hist',[]);
      var histBox=h('div',{class:'sn-qr-hist'});
      function drawHist(){
        histBox.innerHTML='';
        hist.forEach(function(hs){
          var c=h('span',{class:'py-chip',style:{maxWidth:'150px',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'},
            onclick:function(){inp.value=hs;gen();}},hs);
          histBox.appendChild(c);
        });
      }
      function gen(){
        var txt=inp.value||' ';
        var n=parseInt(sizeSel.value,10);
        var density=parseFloat(lvlSel.value);
        var seed=hash32(txt+n+density);
        var rg=mulberry(seed);
        var sc=Math.floor(240/n);
        cv.width=n*sc;
        cv.height=n*sc;
        var cx=cv.getContext('2d');
        cx.fillStyle='#fff';
        cx.fillRect(0,0,cv.width,cv.height);
        cx.fillStyle='#0a0d13';
        var m=[];
        for(var y=0;y<n;y++){
          m.push([]);
          for(var x=0;x<n;x++){m[y].push(rg()<density?1:0);}
        }
        function finder(ox,oy){
          for(var y=oy;y<oy+7;y++){
            for(var x=ox;x<ox+7;x++){
              var edge=y===oy||y===oy+6||x===ox||x===ox+6;
              var core=y>=oy+2&&y<=oy+4&&x>=ox+2&&x<=ox+4;
              m[y][x]=(edge||core)?1:0;
            }
          }
        }
        finder(0,0);finder(n-7,0);finder(0,n-7);
        for(y=0;y<n;y++){
          for(var x2=0;x2<n;x2++){
            if(m[y][x2]){cx.fillRect(x2*sc,y*sc,sc,sc);}
          }
        }
        hist=[txt].concat(hist.filter(function(x3){return x3!==txt;})).slice(0,5);
        snStore.set('qr.hist',hist);
        drawHist();
      }
      inp.addEventListener('change',gen);
      app.body.append(
        h('div',{class:'sn-appbar'},inp,sizeSel,lvlSel,
          snBtn('Сгенерировать','sn-qr','acc',gen),
          snBtn('PNG','save','',function(){
            var a=h('a',{href:cv.toDataURL('image/png'),download:'sn-qr.png'});
            document.body.appendChild(a);a.click();a.remove();
          })),
        h('div',{style:{padding:'6px 14px',fontSize:'11px',color:'var(--mut)'}},
          '⚠ Псевдо-QR: детерминированная матрица из хеша строки. Не сканируется настоящими ридерами.'),
        cv,
        h('div',{class:'sn-w-title',style:{textAlign:'center'}},'История'),
        histBox);
      gen();
    }
  });
}

          labelHtml=it.label.slice(0,idx)+'<mark>'+it.label.slice(idx,idx+q.length)+'</mark>'+it.label.slice(idx+q.length);
        }

      row.appendChild(h('span',{class:'cat'},it.cat));

    });

    if(selEl){selEl.scrollIntoView({block:'nearest'});}
  }
  inp.addEventListener('input',function(){sel=0;render();});
  inp.addEventListener('keydown',function(e){
    if(e.key==='ArrowDown'){sel=Math.min(sel+1,filtered.length-1);render();e.preventDefault();}
    else if(e.key==='ArrowUp'){sel=Math.max(sel-1,0);render();e.preventDefault();}
    else if(e.key==='Enter'){
      if(filtered[sel]){filtered[sel].run();close();snd.click();}
      e.preventDefault();
    }else if(e.key==='Escape'){close();}
  });
  document.body.appendChild(ov);

function clipPush(txt){

  var arr=snStore.get('clip',[]);

  snStore.set('clip',arr);
}

var snapGrid=null,snapActive=null,snapHot=null,snapTimer=null;
function initSnap(){
  snapGrid=h('div',{class:'sn-snapgrid mode-half'},
    h('div',{class:'sn-zone z-l'}),h('div',{class:'sn-zone z-r'}),
    h('div',{class:'sn-zone z-tl'}),h('div',{class:'sn-zone z-tr'}),
    h('div',{class:'sn-zone z-bl'}),h('div',{class:'sn-zone z-br'}));
  document.getElementById('pyos-root').appendChild(snapGrid);
  document.addEventListener('pointermove',function(e){
    if(!(e.buttons&1)||!e.target.closest||!e.target.closest('.py-titlebar')){return;}
    var win=e.target.closest('.py-win');
    if(!win||win.classList.contains('maxed')){return;}
    snapActive=win;
    snapGrid.classList.add('on');
    var x=e.clientX,y=e.clientY;
    var W=innerWidth,H=innerHeight-52;
    var zone=null;
    if(x<60){zone='l';snapGrid.className='sn-snapgrid on mode-half';}
    else if(x>W-60){zone='r';snapGrid.className='sn-snapgrid on mode-half';}
    else if(y<56){
      zone=x<W/2?'tl':'tr';
      snapGrid.className='sn-snapgrid on mode-quad';
    }
    if(zone!==snapHot){
      snapHot=zone;
      $$('.sn-zone',snapGrid).forEach(function(z2){z2.classList.remove('hot');});
      if(zone){
        $('.z-'+zone,snapGrid).classList.add('hot');
        clearTimeout(snapTimer);
        snapTimer=setTimeout(function(){
          if(snapHot&&snapActive){doSnap(snapActive,snapHot);}
        },400);
      }else{clearTimeout(snapTimer);}
    }
  },{passive:true});
  document.addEventListener('pointerup',function(){
    if(snapHot&&snapActive){doSnap(snapActive,snapHot);}
    clearTimeout(snapTimer);
    snapGrid.classList.remove('on');
    $$('.sn-zone',snapGrid).forEach(function(z2){z2.classList.remove('hot');});
    snapHot=null;snapActive=null;
  });
}
function doSnap(win,zone){
  var dl=$('.py-desktop');
  if(!dl){return;}
  var r=dl.getBoundingClientRect();
  var hw=Math.floor(r.width/2),hh=Math.floor(r.height/2);
  win.classList.remove('maxed');
  win.style.transition='left .22s cubic-bezier(.3,.8,.3,1),top .22s cubic-bezier(.3,.8,.3,1),width .22s,height .22s';
  var geo={
    l:[0,0,hw,r.height],r:[hw,0,hw,r.height],
    tl:[0,0,hw,hh],tr:[hw,0,hw,hh],bl:[0,hh,hw,hh],br:[hw,hh,hw,hh]
  }[zone];
  win.style.left=geo[0]+'px';
  win.style.top=geo[1]+'px';
  win.style.width=geo[2]+'px';
  win.style.height=geo[3]+'px';
  setTimeout(function(){win.style.transition='';},260);
  snd.snap();
}

function runCommand(v){
  if(!v){return;}
  var low=v.toLowerCase();
  var mm;
  if((mm=low.match(/^theme\s+(\w+)/))){PYOS.theme.setAccent(mm[1]);return;}
  if((mm=low.match(/^wallpaper\s+(\w+)/))){snSetWallCmd(mm[1]);return;}
  if(low==='lock'){doLock();return;}
  if((mm=low.match(/^desk\s+([1-4])/))){setDesk(parseInt(mm[1],10));return;}
  if(low==='reboot'){location.reload();return;}
  if(apps2().indexOf(low)>=0){PYOS.launch(low);return;}
  var plist=PYOS.store.get('plugins.list',[]);
  var found=null;
  plist.forEach(function(p){
    if(p.id===low||('plug-'+p.id)===low||p.name.toLowerCase()===low){found='plug-'+p.id;}
  });
  if(found){PYOS.launch(found);return;}
  PYOS.notify('Выполнить','Не понял команду: '+v,'close');
  snd.error();
}

var hkOverlay=null;
function initHotkeys(){
  document.addEventListener('keydown',function(e){
    var tag=(e.target.tagName||'').toLowerCase();
    var typing=tag==='input'||tag==='textarea'||e.target.isContentEditable;
    if(e.key==='Meta'){showHk(true);}
    if(typing){
      if(e.key==='Escape'&&SN.palOpen){}
      return;
    }
    if(e.ctrlKey&&!e.altKey&&['1','2','3','4'].indexOf(e.key)>=0){
      e.preventDefault();
      setDesk(parseInt(e.key,10));
      return;
    }
    if(e.ctrlKey&&e.key==='ArrowRight'){e.preventDefault();setDesk(Math.min(4,SN.desk+1));return;}
    if(e.ctrlKey&&e.key==='ArrowLeft'){e.preventDefault();setDesk(Math.max(1,SN.desk-1));return;}
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openPalette();return;}
    if(e.ctrlKey&&e.altKey&&e.key.toLowerCase()==='t'){e.preventDefault();PYOS.launch('terminal');return;}
    if(e.altKey&&e.key==='Tab'){
      e.preventDefault();
      var wins=$$('.py-win').filter(function(w){return deskOf(w)===SN.desk&&w.style.display!=='none';});
      if(wins.length>1){
        var cur=wins.filter(function(w){return w.classList.contains('focused');})[0];
        var i2=wins.indexOf(cur);
        var nxt=wins[(i2+1)%wins.length];
        nxt.dispatchEvent(new PointerEvent('pointerdown',{bubbles:true}));
        if(nxt.style.display==='none'){nxt.style.display='flex';}
      }
      return;
    }
    if(e.metaKey||e.key==='OS'){
      var k2=e.key.toLowerCase();
      if(k2==='d'){e.preventDefault();toggleShowDesktop();}
      else if(k2==='e'){e.preventDefault();PYOS.launch('files');}
      else if(k2==='r'){e.preventDefault();openRun();}
      else if(k2==='l'){e.preventDefault();doLock();}
      else if(k2==='v'){e.preventDefault();openClip();}
      else if(k2===' '){e.preventDefault();var orb3=$('.py-orb');if(orb3){orb3.click();}}
      else if(e.shiftKey&&(k2==='s'||e.code==='KeyS')){e.preventDefault();startShot();}
    }
    if(e.shiftKey&&e.metaKey&&e.code==='KeyS'){e.preventDefault();startShot();}
  });
  document.addEventListener('keyup',function(e){
    if(e.key==='Meta'){showHk(false);}
  });
  window.addEventListener('blur',function(){showHk(false);});
}

function snWeather(){
  var d=new Date();
  var seed=d.getHours()+d.getDate()*24+d.getMonth()*744;
  var r=mulberry2(seed);
  var doy=Math.floor((d-new Date(d.getFullYear(),0,0))/864e5);
  var base=Math.round(8+14*Math.sin((doy-105)/365*2*Math.PI)+(r()-.5)*7);
  var conds=['Ясно','Облачно','Небольшой дождь','Ветрено','Переменная облачность'];
  var ci=Math.floor(r()*conds.length);
  if(base<0&&ci===2){conds[2]='Снег';}
  var night=d.getHours()<6||d.getHours()>=21;
  return {t:base,c:conds[ci],night:night};
}
function mulberry2(a){
  return function(){
    a|=0;a=a+0x6D2B79F5|0;
    var t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
}
function weatherIconHTML(night){
  return night?'sn-moon':'sn-sun';
}
function updateWPill(){
  var pill=$('.sn-wpill');

}

  m.body.appendChild(h('div',{class:'sn-w-title'},'Прогноз на 5 дней (генерация)'));
  for(var i=1;i<=5;i++){
    var d2=new Date(Date.now()+i*864e5);
    var r2=mulberry2(d2.getDate()*31+d2.getMonth()*7);
    var t2=Math.round(w.t+(r2()-.5)*8);
    var cs=['Ясно','Облачно','Дождь','Ветер','Ясно'];

        h('i',null,cs[Math.floor(r2()*cs.length)])),

function startShot(){
  var ov=h('div',{class:'sn-shot-ov'});
  var rect=h('div',{class:'sn-shot-rect',style:{display:'none'}});
  ov.appendChild(rect);
  var s=null;
  ov.addEventListener('pointerdown',function(e){
    s={x:e.clientX,y:e.clientY};
    rect.style.display='block';
  });
  ov.addEventListener('pointermove',function(e){
    if(!s){return;}
    var x=Math.min(s.x,e.clientX),y=Math.min(s.y,e.clientY);
    var w=Math.abs(e.clientX-s.x),hh=Math.abs(e.clientY-s.y);
    rect.style.left=x+'px';rect.style.top=y+'px';
    rect.style.width=w+'px';rect.style.height=hh+'px';
  });
  ov.addEventListener('pointerup',function(e){
    if(!s){ov.remove();return;}
    var x=Math.min(s.x,e.clientX),y=Math.min(s.y,e.clientY);
    var w=Math.abs(e.clientX-s.x),hh=Math.abs(e.clientY-s.y);
    ov.remove();

    if(w<12||hh<12){return;}
    shotResult(x,y,w,hh);

}

function addMinimap(ed){

  var ta=$('textarea',ed);

  var cv=h('canvas',{class:'sn-minimap'});
  cv.width=64;

  function draw(){
    if(!document.body.contains(cv)){return;}
    cv.height=ed.clientHeight||300;
    cx.clearRect(0,0,64,cv.height);
    var lines=ta.value.split('\n');
    var scale=Math.min(3,cv.height/Math.max(lines.length,1));
    lines.forEach(function(l,i){
      var wdt=clamp(l.length*0.9,2,58);
      cx.fillStyle='rgba(120,160,255,.4)';
      cx.fillRect(3,i*scale,wdt,Math.max(1,scale-1));
    });
    var ratio=ta.scrollTop/Math.max(1,ta.scrollHeight-ta.clientHeight);
    var vh=(ta.clientHeight/Math.max(1,ta.scrollHeight))*cv.height;
    cx.fillStyle='rgba(255,255,255,.1)';
    cx.fillRect(0,ratio*(cv.height-vh),64,vh);
  }
  ta.addEventListener('input',draw);
  ta.addEventListener('scroll',draw);
  setInterval(function(){
    if(document.body.contains(cv)){draw();}
  },2000);
  draw();
}

  function tickClock(){
    var d=new Date();
    var s=d.getSeconds(),m2=d.getMinutes(),hh=d.getHours()%12;
    sHand.setAttribute('transform','rotate('+(s*6)+' 50 50)');

  var mc=h('div',{class:'sn-minical'});

      mc.appendChild(h('div',{class:'wd'},wd));
    });
    var first=new Date(now.getFullYear(),now.getMonth(),1);
    var sd=(first.getDay()+6)%7;
    var days=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();
    var ev=calLoad();
    for(var i=0;i<sd;i++){

  setInterval(drawMini,60000);
  /* производительность */
  var w3=h('div',{class:'sn-widget'},h('div',{class:'sn-w-title'},'Производительность'));
  var pc=h('canvas',{class:'sn-perf',width:'218',height:'52'});
  w3.appendChild(pc);
  var cpuRow=h('div',{class:'sn-perf-row'},h('span',null,'CPU'),h('span',{class:'v'},'0%'));
  var memRow=h('div',{class:'sn-perf-row'},h('span',null,'Память'),h('span',{class:'v2'},'0%'));
  w3.append(cpuRow,memRow);
  var pcx=pc.getContext('2d');
  var hist2=[];
  var ph2=0;
  function drawPerf(){
    ph2+=.35;
    var v=clamp(38+Math.sin(ph2*.21)*24+Math.sin(ph2*.73)*10+rnd(-7,7),4,96);
    hist2.push(v);
    if(hist2.length>60){hist2.shift();}
    pcx.clearRect(0,0,218,52);
    var cs=getComputedStyle(document.documentElement);
    var acc=(cs.getPropertyValue('--acc')||'#4f8cff').trim();
    var grd=pcx.createLinearGradient(0,0,218,0);
    grd.addColorStop(0,'transparent');
    grd.addColorStop(1,acc);
    pcx.strokeStyle=grd;
    pcx.lineWidth=1.6;
    pcx.beginPath();
    hist2.forEach(function(v2,i){
      var x=i/(59)*218,y=52-(v2/100)*48;
      if(i===0){pcx.moveTo(x,y);}else{pcx.lineTo(x,y);}
    });
    pcx.stroke();
    pcx.lineTo(218,52);
    pcx.lineTo(0,52);
    pcx.closePath();
    pcx.fillStyle='color-mix(in srgb,'+acc+' 12%,transparent)';
    pcx.globalAlpha=.25;
    pcx.fill();
    pcx.globalAlpha=1;
    $('.v',cpuRow).textContent=v.toFixed(0)+'%';
    $('.v2',memRow).textContent=clamp(45+Math.sin(ph2*.07)*16+rnd(-3,3),20,90).toFixed(0)+'%';
  }
  setInterval(drawPerf,700);
  drawPerf();
  /* погода */
  var w4=h('div',{class:'sn-widget'});
  function drawW(){
    var w=snWeather();
    w4.innerHTML='';
    w4.append(h('div',{class:'sn-w-title'},'Погода · демо'),
      h('div',{class:'sn-wcard'+(w.night?' night':'')},
        ic(weatherIconHTML(w.night)),
        h('div',null,h('div',{class:'t'},w.t+'°'),h('div',{class:'c'},w.c))));
  }
  drawW();
  setInterval(drawW,60000);
  w4.addEventListener('click',openWeatherModal);
  box.append(w1,w2,w3,w4);
  dl.appendChild(box);
}

    })(i);

  });

  var clock=$('.py-clock',tray);

  }
}

var SN_WALLS=[
  {id:'none',name:'Системные'},
  {id:'blackhole',name:'Чёрная дыра'},
  {id:'cyber',name:'Киберпанк'},
  {id:'minimal',name:'Минимал'},
  {id:'galaxy',name:'Галактика'},
  {id:'pixel',name:'Пиксель'},
  {id:'living',name:'Живой градиент'}
];
function buildWallDOM(id){
  var l=h('div',{class:'sn-wp-layer sn-wp-'+id});
  if(id==='blackhole'){l.append(h('div',{class:'bh-disk'}),h('div',{class:'bh-core'}));}
  if(id==='cyber'){l.append(h('div',{class:'cy-sun'}),h('div',{class:'cy-city'}),h('div',{class:'cy-rain'}));}
  if(id==='galaxy'){l.append(h('div',{class:'gx-neb1'}),h('div',{class:'gx-neb2'}));}
  return l;
}
function snApplyWall(){
  var wall=$('.py-wall');
  if(!wall){return;}
  $$('.sn-wp-layer',wall).forEach(function(n){n.remove();});
  var id=snStore.get('wall','blackhole');
  if(id&&id!=='none'){wall.appendChild(buildWallDOM(id));}
}
function snSetWall(id){
  snStore.set('wall',id);
  if(id!=='none'){
    PYOS.theme.setWall('carbon');
  }
  setTimeout(function(){snApplyWall();snWave();},40);
  snd.theme();
}
function snSetWallCmd(name){
  var map={'blackhole':'blackhole','чёрная дыра':'blackhole','черная дыра':'blackhole',
    'cyber':'cyber','киберпанк':'cyber','minimal':'minimal','минимал':'minimal',
    'galaxy':'galaxy','галактика':'galaxy','pixel':'pixel','пиксель':'pixel',
    'living':'living','живой':'living','gradient':'living','none':'none','системные':'none'};
  var id=map[name.toLowerCase()];
  if(id){snSetWall(id);}
  else{
    PYOS.notify('Обои','Доступны: '+SN_WALLS.map(function(w){return w.name;}).join(', '),'palette');
  }
}
function openWallPicker(){
  var m=snModal('Обои Supernova','palette');
  var grid=h('div',{class:'sn-wp-grid'});
  var cur=snStore.get('wall','blackhole');
  SN_WALLS.forEach(function(w,i){
    var pv=h('div',{class:'sn-wp-prev'+(w.id===cur?' sel':'')});
    if(w.id!=='none'){pv.appendChild(buildWallDOM(w.id));}
    else{pv.style.background='linear-gradient(135deg,#101828,#1c2a45)';}
    pv.appendChild(h('b',null,w.name));
    pv.style.animation='snPop .4s var(--sn-ease) '+(i*.05)+'s backwards';
    pv.addEventListener('click',function(){
      snSetWall(w.id);
      $$('.sn-wp-prev',grid).forEach(function(x){x.classList.remove('sel');});
      pv.classList.add('sel');
    });
    grid.appendChild(pv);
  });
  m.body.appendChild(grid);

function snWave(){

function toggleNight(){

/* ══════════ [EXP-JS-35] ЧАСТИЦЫ КЛИКА / ТОOLTIPЫ / МАГНЕТИЗМ ══════════ */
function initClickBurst(){
  document.addEventListener('pointerdown',function(e){
    if(e.target.closest&&e.target.closest('.py-win,.py-start,.py-taskbar,.sn-modal,.sn-trayc,input,textarea,button')){return;}
    for(var i=0;i<6;i++){
      var p=h('div',{class:'sn-burst',style:{
        left:e.clientX+'px',top:e.clientY+'px',
        '--bx':(rnd(-46,46)).toFixed(0)+'px',
        '--by':(rnd(-52,26)).toFixed(0)+'px'}});
      document.body.appendChild(p);
      setTimeout(function(pp){return function(){pp.remove();};}(p),600);
    }
  },{passive:true});
}
function initTooltips(){
  var tip=null;
  document.addEventListener('pointerover',function(e){
    var t=e.target.closest?e.target.closest('[data-sn-tip]'):null;
    if(tip){tip.remove();tip=null;}
    if(!t){return;}
    tip=h('div',{class:'sn-tip'},t.getAttribute('data-sn-tip'));
    document.body.appendChild(tip);
    var r=t.getBoundingClientRect(),tr=tip.getBoundingClientRect();
    var left=clamp(r.left+r.width/2-tr.width/2,6,innerWidth-tr.width-6);
    tip.style.left=left+'px';
    tip.style.top=(r.bottom+8)+'px';
    tip.style.setProperty('--ta',(r.left+r.width/2-left)+'px');
  },{passive:true});
}
function initMagnetDock(){
  var tb=$('.py-taskbar');
  if(!tb){return;}
  tb.addEventListener('pointermove',function(e){
    $$('.py-tb-item,.py-startbtn',tb).forEach(function(it){
      var r=it.getBoundingClientRect();
      var cx=r.left+r.width/2;
      var d=Math.abs(e.clientX-cx);
      var f=clamp(1-d/150,0,1);
      it.style.transform='scale('+(1+.16*f).toFixed(3)+') translateY('+(-9*f).toFixed(1)+'px)';
    });
  },{passive:true});
  tb.addEventListener('pointerleave',function(){
    $$('.py-tb-item,.py-startbtn',tb).forEach(function(it){it.style.transform='';});
  });
}
function initMagButtons(){
  document.addEventListener('pointermove',function(e){
    var t=e.target.closest?e.target.closest('.sn-hbtn'):null;
    if(!t){return;}
    var r=t.getBoundingClientRect();
    t.style.setProperty('--mgx',((e.clientX-(r.left+r.width/2))/r.width*4).toFixed(2)+'px');
    t.style.setProperty('--mgy',((e.clientY-(r.top+r.height/2))/r.height*3).toFixed(2)+'px');
  },{passive:true});
}

/* ══════════ [EXP-JS-36] НАБЛЮДАТЕЛИ ЗА СУЩЕСТВУЮЩИМ DOM ══════════ */
function initObservers(){
  var rootEl=document.getElementById('pyos-root');
  var mo=new MutationObserver(function(records){
    records.forEach(function(r){
      Array.prototype.forEach.call(r.addedNodes,function(n){
        if(n.nodeType!==1){return;}
        /* окна */
        if(n.classList&&n.classList.contains('py-win')){polishWin(n);}
        if(n.querySelectorAll){
          $$('.py-win',n).forEach(polishWin);
          $$('.py-term',n).forEach(applyTermTheme);
          $$('.py-ed',n).forEach(addMinimap);
          $$('.py-calc',n).forEach(addSciMode);
          $$('.py-set-nav',n).forEach(addHotkeySection);
          $$('.py-about',n).forEach(addStorageChart);
          $$('.py-start-apps',n).forEach(addStartBadges);
        }
        if(n.classList&&n.classList.contains('py-term')){applyTermTheme(n);}
        if(n.classList&&n.classList.contains('py-ed')){addMinimap(n);}
        if(n.classList&&n.classList.contains('py-calc')){addSciMode(n);}
        if(n.classList&&n.classList.contains('py-set-nav')){addHotkeySection(n);}
        if(n.classList&&n.classList.contains('py-about')){addStorageChart(n);}
        if(n.classList&&n.classList.contains('py-start-apps')){addStartBadges(n);}
        if(n.classList&&n.classList.contains('py-toast')){logNotif(n);}
        if(n.classList&&n.classList.contains('py-off')){snd.tone(300,.3,'sine',.05);}
        /* версия */
        if(n.classList&&(n.classList.contains('py-about')||n.classList.contains('py-start'))){
          setTimeout(versionize,60);
        }
      });
      if(r.type==='characterData'||r.type==='childList'){
        var tgt=r.target;
        if(tgt&&(tgt.classList&&(tgt.classList.contains('ver')||tgt.classList.contains('badge')))){
          setTimeout(versionize,30);
        }
      }
    });
    assignNewWins();
  });
  mo.observe(rootEl,{childList:true,subtree:true,characterData:true});
  /* первичный проход */
  $$('.py-win',rootEl).forEach(polishWin);
  $$('.py-term',rootEl).forEach(applyTermTheme);
  $$('.py-ed',rootEl).forEach(addMinimap);
  $$('.py-calc',rootEl).forEach(addSciMode);
  $$('.py-set-nav',rootEl).forEach(addHotkeySection);
  $$('.py-about',rootEl).forEach(addStorageChart);
  versionize();
  assignNewWins();
  applyDesks();
}
function polishWin(win){
  if(win.dataset.snOpen){return;}
  win.dataset.snOpen='1';
  win.dataset.snDesk=win.dataset.snDesk||String(SN.desk);
  win.classList.add('sn-open-'+ri(0,5));
  var tb=$('.py-titlebar',win);
  if(tb&&!$('.sn-savedot',tb)){
    var dot=h('span',{class:'sn-savedot','data-sn-tip':'Сохранено'});
    tb.insertBefore(dot,$('.ttl',tb).nextSibling);
    win.addEventListener('input',function(){
      dot.classList.add('dirty');
      dot.setAttribute('data-sn-tip','Есть несохранённые изменения');
    });
    win.addEventListener('click',function(e){
      if(e.target.closest('.py-tbtn.acc,.py-btn')){
        dot.classList.remove('dirty');
        dot.setAttribute('data-sn-tip','Сохранено');
        retrigger(dot,'snPop');
      }
    });
  }
  snd.win();
  setTimeout(function(){
    var wins=$$('.py-win');
    if(wins.indexOf(win)>=0){applyDesks();}
  },50);
}
function addStartBadges(gridEl){
  $$('.py-sapp',gridEl).forEach(function(tile){
    var sp=$('span',tile);
    if(!sp){return;}
    var name=sp.textContent;
    var cnt=$$('.py-win').filter(function(w){
      var t=$('.ttl',w);
      return t&&t.textContent.indexOf(name)===0&&w.style.display!=='none';
    }).length;
    var old=$('.sn-badge',tile);
    if(old){old.remove();}
    if(cnt>0){tile.appendChild(h('span',{class:'sn-badge'},String(cnt)));}
  });
}
function logNotif(toast){
  var b=$('b',toast),p=$('p',toast);
  SN.notifs.push({
    title:b?b.textContent.trim():'Уведомление',
    text:p?p.textContent:'',
    time:new Date().toLocaleTimeString('ru-RU')
  });
  if(SN.notifs.length>14){SN.notifs.shift();}
  snd.toast();
  if(trayEl){
    var nb=$('.sn-notifs',trayEl);
    if(nb){
      nb.insertBefore(h('div',{class:'sn-notif'},
        h('b',null,SN.notifs[SN.notifs.length-1].title),
        h('i',null,SN.notifs[SN.notifs.length-1].text),
        h('time',null,SN.notifs[SN.notifs.length-1].time)),nb.firstChild);
      while(nb.children.length>5){nb.lastChild.remove();}
    }
  }
}

    var m=phrase.match(/напомни\s+(.+?)\s+через\s+(\d+)\s*мин/i);
    if(!m){return null;}
    var d=new Date(Date.now()+parseInt(m[2],10)*60000);

  });
  J.addCommand(/погода/i,function(){

    openWeatherModal();
    return 'Сейчас '+w.t+' градусов, '+w.c.toLowerCase()+'. Данные локальные.';

/* ══════════ [EXP-JS-39] ИНИЦИАЛИЗАЦИЯ ══════════ */
function boot(){
  var rootEl=document.getElementById('pyos-root');
  if(!rootEl||!window.PYOS){
    setTimeout(boot,150);
    return;
  }
  injectIcons();
  rootEl.classList.add('py-supernova');
  /* восстановление состояния */
  if(snStore.get('dock',true)){rootEl.classList.add('sn-dock');}
  if(snStore.get('focus',false)){rootEl.classList.add('sn-focus');SN.focus=true;}
  if(snStore.get('widgets',true)===false){rootEl.classList.add('sn-widgets-off');}
  if(snStore.get('dnd',false)){SN.dnd=true;}
  SN.desk=clamp(snStore.get('desk',1),1,4);
  var brt=snStore.get('bright',100);
  if(brt<100){rootEl.style.filter='brightness('+(brt/100)+')';}
  if(snStore.get('night',false)){
    var nl=h('div',{class:'sn-nightlight on'});
    document.body.appendChild(nl);
  }else{
    document.body.appendChild(h('div',{class:'sn-nightlight'}));
  }
  /* аура-блоб */
  var dl=$('.py-desktop');
  if(dl&&!$('.sn-aurora')){
    dl.appendChild(h('div',{class:'sn-aurora'}));
  }
  registerAllApps();
  initSnap();
  initHotkeys();
  initClickBurst();
  initTooltips();
  initBus();
  initObservers();
  buildTrayExtras();
  initMagnetDock();
  initMagButtons();
  buildWidgets();
  snApplyWall();
  initJarvis();
  versionize();
  setTimeout(function(){
    snd.start();
    PYOS.notify('PyOS 4.0 «Supernova»',
      '12 приложений, 4 рабочих стола, Ctrl+K — палитра команд. Удерживайте Win для списка хоткеев.','star');
  },1200);
  setTimeout(buildTrayExtras,1500);
  setTimeout(buildWidgets,1500);
  /* fullscreen: автоскрытие дока */
  document.addEventListener('fullscreenchange',function(){
    var r=document.getElementById('pyos-root');
    if(document.fullscreenElement&&r.classList.contains('sn-dock')){
      r.classList.add('sn-dock-hide');
    }else{
      r.classList.remove('sn-dock-hide');
    }
  });
  document.addEventListener('mousemove',function(e){
    var r=document.getElementById('pyos-root');
    if(!r.classList.contains('sn-dock-hide')){return;}
    if(e.clientY>innerHeight-16){r.classList.remove('sn-dock-hide');}
    else if(e.clientY<innerHeight-90&&document.fullscreenElement){r.classList.add('sn-dock-hide');}
  },{passive:true});
  /* перехват кликов по таскбар-элементам других столов */
  document.addEventListener('click',function(e){
    var item=e.target.closest?e.target.closest('.py-tb-item'):null;
    if(!item){return;}
    setTimeout(function(){
      var wins=$$('.py-win');
      var items=$$('.py-tb-item');
      var idx=items.indexOf(item);
      if(idx>=0&&wins[idx]){
        var d=deskOf(wins[idx]);
        if(d!==SN.desk){
          wins[idx].dataset.snWasMin='0';
          setDesk(d);
        }
      }
    },60);
  });
}
if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded',function(){boot();});
}else{
  boot();
}
})();
</script>
<script>
/* ═══════════════════════════════════════════════════════════════════
   SN-ICONFIX + SN-DOCTOR · Починка иконок и диагностика
   ═══════════════════════════════════════════════════════════════════ */
(function(){
'use strict';
if(window.__SN_ICONFIX__)return;
window.__SN_ICONFIX__=true;

var $=function(s,r){return (r||document).querySelector(s);};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));};
var NS='http://www.w3.org/2000/svg';

/* ─── 1. Гарантируем, что SN-иконки есть в спрайте ─── */
var SN_SYMBOLS=[
 ['sn-music','<path d="M20 3 9 5.5v10.9A3.4 3.4 0 1 0 11 19.6V8.2l7-1.6v6.9a3.4 3.4 0 1 0 2 3.1V3z" fill="currentColor"/>'],
 ['sn-brush','<path d="M4 20c2.2.8 4.2-1 5.2-3L18 7l-2.5-2.5L6 14c-2 1-3.6 3-2 6zM17.5 2.5a2.1 2.1 0 0 1 3 3L18 8l-3-3 2.5-2.5z" fill="currentColor"/>'],
 ['sn-calendar','<path d="M7 2v2H4v18h16V4h-3V2h-2v2H9V2H7zM6 10h12v10H6V10zm3 2v2h2v-2H9zm4 0v2h2v-2h-2zm-4 4v2h2v-2H9zm4 0v2h2v-2h-2z" fill="currentColor"/>'],
 ['sn-mail','<path d="M2 5h20v14H2V5zm2 2.2v.5l8 4.8 8-4.8v-.5H4zm16 2.9-8 4.8-8-4.8V17h16V10.1z" fill="currentColor"/>'],
 ['sn-tasks','<path d="M4 4h7v7H4V4zm9 0h7v3h-7V4zm0 5h7v2h-7V9zM4 13h7v7H4v-7zm9 0h7v3h-7v-3zm0 5h7v2h-7v-2z" fill="currentColor"/>'],
 ['sn-vault','<path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5l-8-3zm0 5.5A2.8 2.8 0 1 1 9.2 10.3 2.8 2.8 0 0 1 12 7.5z" fill="currentColor"/>'],
 ['sn-lang','<path d="M4 4h9v2h-3.2v1.6H15v2h-3.6c-.6 1.7-1.6 3.2-3 4.3 1 .7 2.2 1.3 3.6 1.7l-.7 1.9a11 11 0 0 1-4.2-2.5 11 11 0 0 1-4.2 2.5l-.7-1.9c1.4-.4 2.6-1 3.6-1.7A8.6 8.6 0 0 1 3 9.6H5c.5 1.3 1.3 2.4 2.4 3.3 1-1 1.8-2.2 2.3-3.6H4V7.6h5.8V6H4V4z" fill="currentColor"/>'],
 ['sn-pixel','<path d="M3 3h6v6H3V3zm12 0h6v6h-6V3zM3 15h6v6H3v-6zm12 0h6v6h-6v-6zm-6-6h6v6H9V9z" fill="currentColor"/>'],
 ['sn-alarm','<path d="M12 5a8 8 0 1 0 8 8 8 8 0 0 0-8-8zm1 8.2h4v1.8h-6V8h2v5.2zM4.6 2.6 3.2 4 6 6.6 7.4 5.2 4.6 2.6z" fill="currentColor"/>'],
 ['sn-game','<path d="M7.5 7h9A5.5 5.5 0 0 1 22 12.5v2a3 3 0 0 1-5.3 1.9L15 14.5H9l-1.7 1.9A3 3 0 0 1 2 14.5v-2A5.5 5.5 0 0 1 7.5 7zM6 10H5v2h1v1h2v-1h1v-2H8V9H6v1zm9.5 1.2a1.1 1.1 0 1 0 2.2 0 1.1 1.1 0 1 0-2.2 0z" fill="currentColor"/>'],
 ['sn-grid','<path d="M3 3h8v8H3V3zm10 0h8v8h-8V3zM3 13h8v8H3v-8zm10 0h8v8h-8v-8z" fill="currentColor"/>'],
 ['sn-qr','<path d="M3 3h8v8H3V3zm2 2v4h4V5H5zm8-2h8v8h-8V3zm2 2v4h4V5h-4zM3 13h8v8H3v-8zm2 2v4h4v-4H5z" fill="currentColor"/>'],
 ['sn-sun','<path d="M12 6.5A5.5 5.5 0 1 0 17.5 12 5.5 5.5 0 0 0 12 6.5zM11 1h2v4h-2V1zm0 18h2v4h-2v-4zM1 11h4v2H1v-2zm18 0h4v2h-4v-2zM4.9 6.3 3.5 4.9 6.3 2.1l1.4 1.4L4.9 6.3zM17.7 19.1l-1.4-1.4 2.8-2.8 1.4 1.4-2.8 2.8zM4.9 17.7l2.8-2.8 1.4 1.4-2.8 2.8-1.4-1.4zM16.3 6.3l-1.4-1.4 2.8-2.8 1.4 1.4-2.8 2.8z" fill="currentColor"/>'],
 ['sn-moon','<path d="M13.5 2A9.5 9.5 0 1 0 22 14.8 7.5 7.5 0 0 1 13.5 2z" fill="currentColor"/>'],
 ['sn-bell','<path d="M12 2a6 6 0 0 0-6 6v4l-2 3v1h16v-1l-2-3V8a6 6 0 0 0-6-6zm0 20a3 3 0 0 0 3-3H9a3 3 0 0 0 3 3z" fill="currentColor"/>'],
 ['sn-wifi','<path d="M12 18.5 8.8 15a4.5 4.5 0 0 1 6.4 0l-3.2 3.5zM12 3C7.9 3 4.2 4.6 1.5 7.2l1.8 1.9A11.8 11.8 0 0 1 12 5.5a11.8 11.8 0 0 1 8.7 3.6l1.8-1.9A14.7 14.7 0 0 0 12 3zm0 5c-2.6 0-5 1-6.8 2.7l1.8 1.9A7.4 7.4 0 0 1 12 10.5a7.4 7.4 0 0 1 5 2.8l1.8-1.9A9.9 9.9 0 0 0 12 8z" fill="currentColor"/>'],
 ['sn-bright','<path d="M12 7a5 5 0 1 0 5 5 5 5 0 0 0-5-5zm-1-6h2v4h-2V1zm0 18h2v4h-2v-4zM1 11h4v2H1v-2zm18 0h4v2h-4v-2zM4.2 5.6 2.8 4.2 5.6 1.4 7 2.8 4.2 5.6z" fill="currentColor"/>'],
 ['sn-shot','<path d="M9 3h6l1.3 2H20a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h3.7L9 3zm3 4.5A5 5 0 1 0 17 12.5a5 5 0 0 0-5-5z" fill="currentColor"/>'],
 ['sn-update','<path d="M12 2a10 10 0 0 1 9.8 8h-2.1A8 8 0 1 0 12 20a7.9 7.9 0 0 0 6.3-3.1h2.5A10 10 0 1 1 12 2zm7 9 3 4h-6l3-4z" fill="currentColor"/>'],
 ['sn-dnd','<path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm5 11H7v-2h10v2z" fill="currentColor"/>'],
 ['sn-plane','<path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z" fill="currentColor"/>'],
 ['sn-vol','<path d="M4 9h4l5-4v14l-5-4H4V9zm12.5-.5a4.2 4.2 0 0 1 0 7v-2a2.2 2.2 0 0 0 0-3v-2z" fill="currentColor"/>']
];
function ensureIcons(){
  var sprite=document.querySelector('body > svg');
  if(!sprite){console.warn('[SN-FIX] SVG-спрайт не найден');return;}
  var added=0;
  SN_SYMBOLS.forEach(function(d){
    if(sprite.querySelector('#ic-'+d[0]))return;
    var s=document.createElementNS(NS,'symbol');
    s.setAttribute('id','ic-'+d[0]);
    s.setAttribute('viewBox','0 0 24 24');
    s.innerHTML=d[1];
    sprite.appendChild(s);
    added++;
  });
  if(added){console.log('[SN-FIX] Добавлено иконок:',added);}
}

/* ─── 2. Угадать SN-иконку по имени приложения ─── */
function guessSNIcon(name){
  if(!name)return null;
  if(/SN-Tunes|Музык/i.test(name))return 'sn-music';
  if(/SN-Canvas|Доска/i.test(name))return 'sn-brush';
  if(/SN-Cal|Календар/i.test(name))return 'sn-calendar';
  if(/SN-Mail|Почт/i.test(name))return 'sn-mail';
  if(/SN-Tasks|Задачи/i.test(name))return 'sn-tasks';
  if(/SN-Vault|Парол/i.test(name))return 'sn-vault';
  if(/SN-Trans|Перевод/i.test(name))return 'sn-lang';
  if(/SN-Pixel|Пиксел/i.test(name))return 'sn-pixel';
  if(/SN-Assist|Секретар/i.test(name))return 'sn-alarm';
  if(/Змейк|SN-Neon/i.test(name))return 'sn-game';
  if(/^Игра 2048|2048/i.test(name))return 'sn-grid';
  if(/SN-QR|QR-ген/i.test(name))return 'sn-qr';
  return null;
}

/* ─── 3. Пройтись по DOM и заменить plug → sn-* ─── */
function fixIcons(){
  ensureIcons();
  var fixed=0;
  // Ярлыки стола, Пуск, таскбар, плагины
  $$('.py-dicon, .py-sapp, .py-tb-item, .py-plug-item').forEach(function(el){
    var u=$('use',el);
    if(!u)return;
    var href=u.getAttribute('href')||u.getAttribute('xlink:href')||'';
    if(href!=='#ic-plug')return;
    var nameEl=$('span',el)||$('b',el);
    var name=nameEl?nameEl.textContent:'';
    var guess=guessSNIcon(name);
    if(guess){
      u.setAttribute('href','#ic-'+guess);
      u.removeAttribute('xlink:href');
      fixed++;
    }
  });
  // Плитки внутри .pi-ic в Студии плагинов
  $$('.py-plug-item .pi-ic').forEach(function(el){
    var u=$('use',el);
    if(!u)return;
    var href=u.getAttribute('href')||'';
    if(href!=='#ic-plug')return;
    var item=el.closest('.py-plug-item');
    if(!item)return;
    var nameEl=$('b',item);
    var guess=guessSNIcon(nameEl?nameEl.textContent:'');
    if(guess){
      u.setAttribute('href','#ic-'+guess);
      fixed++;
    }
  });
  return fixed;
}

/* ─── 4. Хук на всё ─── */
function installHooks(){
  // MutationObserver
  var root=document.getElementById('pyos-root');
  if(root){
    new MutationObserver(function(){fixIcons();})
      .observe(root,{childList:true,subtree:true});
  }
  // Клик по Пуску
  document.addEventListener('click',function(){
    setTimeout(fixIcons,50);
    setTimeout(fixIcons,250);
  },true);
  // Шина событий
  if(window.PYOS&&window.PYOS.bus){
    window.PYOS.bus.on('apps',function(){setTimeout(fixIcons,30);});
    window.PYOS.bus.on('wm',function(){setTimeout(fixIcons,80);});
  }
  // Первичный прогон
  fixIcons();
  setTimeout(fixIcons,400);
  setTimeout(fixIcons,1200);
  setTimeout(fixIcons,3000);
}

/* ─── 5. Диагностика из консоли ─── */
window.__SN_DOCTOR__=function(){
  var root=document.getElementById('pyos-root');
  var snSymbols=$$('symbol[id^="ic-sn-"]').length;
  var list=window.PYOS?PYOS.store.get('plugins.list',[]):[];
  var snPlugs=list.filter(function(p){return /^sn-/.test(p.id);});
  var diag={
    'Supernova-патч загружен': !!window.__PYOS_SN__,
    'PYOS API доступен': !!window.PYOS,
    'pyos-root существует': !!root,
    'OOBE пройден': window.PYOS?PYOS.store.get('oobe.done',false):null,
    'Всего плагинов': list.length,
    'SN-плагинов': snPlugs.length,
    'SN-иконок в спрайте': snSymbols,
    'Ярлыков на столе': $$('.py-dicon').length,
    'Серых plug-иконок осталось': $$('use[href="#ic-plug"]').length
  };
  console.table(diag);
  if(snPlugs.length<12){
    console.warn('⚠ Зарегистрировано только '+snPlugs.length+'/12 SN-плагинов.',
      'Запустите: PYOS.store.wipe(); location.reload();');
  }
  if(snSymbols===0){
    console.warn('⚠ Иконки SN не попали в спрайт.');
  }
  return diag;
};

/* ─── 6. Кнопка "Починить всё" на всякий случай ─── */
window.__SN_REPAIR__=function(){
  if(!confirm('Сброс localStorage + перезагрузка. Все файлы и настройки PyOS будут удалены. Продолжить?'))return;
  if(window.PYOS&&PYOS.store){PYOS.store.wipe();}
  location.reload(true);
};

/* ─── 7. Старт ─── */
if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded',installHooks);
}else{
  installHooks();
}

console.log('[SN-FIX] Установлен. В консоли: __SN_DOCTOR__() — диагностика, __SN_REPAIR__() — полный сброс.');
})();
</script>
