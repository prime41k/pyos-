<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PyOS Studio 3.0 · Операционная среда разработки</title>
<!-- ══════════════════════════════════════════════════════════════════
     PYOS STUDIO 3.0 — ПОЛНЫЙ ФАЙЛ
     Структура:
       [CSS-1]  токены темы
       [CSS-2]  сброс и утилиты
       [CSS-3]  анимации
       [CSS-4]  обои
       [CSS-5]  рабочий стол
       [CSS-6]  панель задач
       [CSS-7]  меню Пуск
       [CSS-8]  окна
       [CSS-9]  контекстные меню и тосты
       [CSS-10] OOBE установка
       [CSS-11] экран загрузки
       [CSS-12] Jarvis
       [CSS-13] приложения
       [JS-A]   утилиты
       [JS-B]   хранилище
       [JS-C]   константы
       [JS-D]   спрайт SVG (лого, иконки)
       [JS-E]   тема
       [JS-F]   виртуальная файловая система
       [JS-G]   уведомления и контекстные меню
       [JS-H]   оконный менеджер
       [JS-I]   реестр приложений
       [JS-J]   терминал
       [JS-K]   файлы
       [JS-L]   редактор
       [JS-M]   калькулятор
       [JS-N]   заметки
       [JS-O]   настройки
       [JS-P]   о системе
       [JS-Q]   плагины + документация
       [JS-R]   студия плагинов
       [JS-S]   Jarvis
       [JS-T]   оболочка (стол, панель, Пуск, трей)
       [JS-U]   блокировка / выключение / сброс
       [JS-V]   экран загрузки
       [JS-W]   OOBE
       [JS-X]   вход на рабочий стол
       [JS-Y]   инициализация
     ══════════════════════════════════════════════════════════════════ -->
<style>
/* ══════════ [CSS-1] ТОКЕНЫ ТЕМЫ ══════════ */
:root{
  --acc:#4f8cff;
  --acc2:#8a5cff;
  --bg:#0a0d13;
  --panel:rgba(17,22,31,.86);
  --panel2:#151c28;
  --line:#243044;
  --txt:#e9eef7;
  --mut:#8b96a9;
  --ok:#3ddc84;
  --warn:#ffb454;
  --err:#ff5c7a;
  --rad:14px;
  --shadow:0 24px 70px rgba(0,0,0,.55);
  --fast:.16s;
  --med:.34s;
  --blur:saturate(160%) blur(18px);
}
/* ══════════ [CSS-2] СБРОС И УТИЛИТЫ ══════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  background:var(--bg);
  color:var(--txt);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
.py-root{
  position:fixed;inset:0;z-index:1;
  user-select:none;overflow:hidden;
}
.py-root input,.py-root textarea{user-select:text;font-family:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{
  background:#2b3850;border-radius:8px;
  border:2px solid transparent;background-clip:content-box;
}
::-webkit-scrollbar-thumb:hover{background:#3b4a68;background-clip:content-box;border:2px solid transparent}
.py-hidden{display:none !important}
.py-flex1{flex:1}
button{font-family:inherit;cursor:pointer}
.py-note{
  font-size:11.5px;color:var(--mut);line-height:1.5;
  padding:10px 13px;border:1px dashed var(--line);
  border-radius:10px;margin-top:12px;
}
/* ══════════ [CSS-3] АНИМАЦИИ ══════════ */
@keyframes pyFade{from{opacity:0}to{opacity:1}}
@keyframes pyUp{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:translateY(0)}}
@keyframes pyPop{0%{opacity:0;transform:scale(.82)}70%{transform:scale(1.04)}100%{opacity:1;transform:scale(1)}}
@keyframes pySlideL{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:translateX(0)}}
@keyframes pySlideR{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
@keyframes pyGlow{
  0%,100%{filter:drop-shadow(0 0 12px rgba(79,140,255,.55))}
  50%{filter:drop-shadow(0 0 34px rgba(138,92,255,.9))}
}
@keyframes pyFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes pyBreath{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.06);opacity:1}}
@keyframes pyShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes pyBlink{0%,100%{opacity:1}50%{opacity:.15}}
@keyframes pyToastIn{from{opacity:0;transform:translateX(60px) scale(.92)}to{opacity:1;transform:translateX(0) scale(1)}}
@keyframes pyToastOut{to{opacity:0;transform:translateX(60px) scale(.92)}}
@keyframes pyRipple{to{transform:scale(3.2);opacity:0}}
@keyframes pyOrbRing{0%{transform:scale(.8);opacity:.9}100%{transform:scale(1.9);opacity:0}}
@keyframes pyScan{from{transform:translateY(-120%)}to{transform:translateY(1400%)}}
@keyframes pyBootSlide{0%{transform:translateX(-110%)}100%{transform:translateX(560%)}}
@keyframes pyWaveBar{0%,100%{height:6px}50%{height:22px}}
.py-anim-none *{animation-duration:.001s !important;transition-duration:.001s !important}
.py-ripple{
  position:absolute;border-radius:50%;
  background:rgba(255,255,255,.4);
  transform:scale(0);
  animation:pyRipple .55s ease-out forwards;
  pointer-events:none;
}
/* ══════════ [CSS-4] ОБОИ ══════════ */
.py-wall{position:absolute;inset:0;transition:opacity .8s ease}
.py-wall.wp-aurora{
  background:linear-gradient(125deg,#071022,#0c2b4e,#0e4d4a,#123,#071022);
  background-size:300% 300%;animation:pyShift 26s ease infinite;
}
.py-wall.wp-sunset{
  background:linear-gradient(125deg,#1a0b2e,#45163f,#7a1f3d,#2a0f22,#1a0b2e);
  background-size:300% 300%;animation:pyShift 30s ease infinite;
}
.py-wall.wp-ocean{
  background:linear-gradient(125deg,#03131f,#06304a,#0a4f66,#062033,#03131f);
  background-size:300% 300%;animation:pyShift 24s ease infinite;
}
.py-wall.wp-matrix{
  background:linear-gradient(125deg,#020d06,#052812,#0a3d1c,#031407,#020d06);
  background-size:300% 300%;animation:pyShift 22s ease infinite;
}
.py-wall.wp-carbon{
  background:
    radial-gradient(1100px 560px at 72% 18%,rgba(79,140,255,.16),transparent 60%),
    radial-gradient(900px 500px at 18% 82%,rgba(138,92,255,.14),transparent 60%),
    #0a0d13;
}
.py-wall.wp-grid{
  background:
    linear-gradient(rgba(79,140,255,.07) 1px,transparent 1px),
    linear-gradient(90deg,rgba(79,140,255,.07) 1px,transparent 1px),
    linear-gradient(160deg,#0a0f18,#101a2c);
  background-size:44px 44px,44px 44px,100% 100%;
}
.py-wall-glow{
  position:absolute;width:46vw;height:46vw;border-radius:50%;
  filter:blur(90px);opacity:.35;pointer-events:none;
}
.py-wall-glow.g1{background:var(--acc);top:-12vw;right:-8vw;animation:pyFloat 11s ease-in-out infinite}
.py-wall-glow.g2{background:var(--acc2);bottom:-14vw;left:-10vw;animation:pyFloat 14s ease-in-out infinite reverse}
/* ══════════ [CSS-5] РАБОЧИЙ СТОЛ ══════════ */
.py-desktop{position:absolute;inset:0 0 52px 0;overflow:hidden}
.py-icons{
  position:absolute;inset:14px;
  display:flex;flex-direction:column;flex-wrap:wrap;
  align-content:flex-start;gap:6px;
}
.py-dicon{
  width:96px;padding:10px 6px;border-radius:12px;
  display:flex;flex-direction:column;align-items:center;gap:7px;
  cursor:pointer;border:1px solid transparent;
  transition:background var(--fast),transform var(--fast),border var(--fast);
  animation:pyPop .5s ease backwards;
}
.py-dicon:hover{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.09);transform:translateY(-2px)}
.py-dicon:active{transform:scale(.96)}
.py-dicon .ic{width:42px;height:42px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.45))}
.py-dicon span{font-size:12px;text-align:center;line-height:1.25;text-shadow:0 2px 6px rgba(0,0,0,.8)}
/* ══════════ [CSS-6] ПАНЕЛЬ ЗАДАЧ ══════════ */
.py-taskbar{
  position:absolute;left:0;right:0;bottom:0;height:52px;
  background:var(--panel);
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border-top:1px solid var(--line);
  display:flex;align-items:center;padding:0 10px;gap:6px;
  z-index:800;animation:pyUp .6s ease backwards;
}
.py-startbtn{
  width:42px;height:42px;border-radius:11px;
  display:grid;place-items:center;cursor:pointer;
  border:1px solid transparent;transition:all var(--fast);flex:none;
}
.py-startbtn:hover{background:rgba(255,255,255,.08);border-color:var(--line);transform:translateY(-2px)}
.py-startbtn:active{transform:scale(.92)}
.py-startbtn svg{width:27px;height:27px}
.py-tb-apps{display:flex;gap:5px;flex:1;overflow-x:auto;padding:0 4px;scrollbar-width:none}
.py-tb-apps::-webkit-scrollbar{display:none}
.py-tb-item{
  height:40px;min-width:44px;padding:0 12px;border-radius:10px;
  display:flex;align-items:center;gap:8px;cursor:pointer;
  border:1px solid transparent;position:relative;
  transition:all var(--fast);flex:none;font-size:12.5px;color:var(--mut);
}
.py-tb-item:hover{background:rgba(255,255,255,.07)}
.py-tb-item.on{background:rgba(255,255,255,.09);border-color:var(--line);color:var(--txt)}
.py-tb-item.min{opacity:.55}
.py-tb-item .dot{
  position:absolute;bottom:3px;left:50%;transform:translateX(-50%);
  width:16px;height:3px;border-radius:3px;
  background:var(--acc);box-shadow:0 0 8px var(--acc);
}
.py-tb-item svg{width:20px;height:20px;flex:none}
.py-tray{display:flex;align-items:center;gap:4px;flex:none}
.py-tray-btn{
  height:40px;padding:0 9px;border-radius:10px;
  display:flex;align-items:center;gap:7px;cursor:pointer;
  color:var(--mut);transition:all var(--fast);border:1px solid transparent;
}
.py-tray-btn:hover{background:rgba(255,255,255,.07);color:var(--txt)}
.py-tray-btn svg{width:17px;height:17px}
.py-clock{
  text-align:right;line-height:1.25;font-size:12px;color:var(--txt);
  padding:0 8px;cursor:pointer;border-radius:10px;height:40px;
  display:flex;flex-direction:column;justify-content:center;
  transition:background var(--fast);
}
.py-clock:hover{background:rgba(255,255,255,.07)}
.py-clock b{font-size:13px;font-weight:600}
.py-clock i{font-style:normal;color:var(--mut);font-size:11px}
.py-jdot{width:9px;height:9px;border-radius:50%;background:var(--mut);flex:none}
.py-jdot.live{background:var(--ok);box-shadow:0 0 10px var(--ok);animation:pyBreath 2s infinite}
/* ══════════ [CSS-7] МЕНЮ ПУСК ══════════ */
.py-start{
  position:absolute;left:10px;bottom:62px;
  width:560px;max-width:calc(100vw - 20px);
  height:560px;max-height:calc(100vh - 80px);
  background:var(--panel);
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border:1px solid var(--line);border-radius:20px;
  box-shadow:var(--shadow);z-index:850;
  display:flex;flex-direction:column;overflow:hidden;
  transform-origin:bottom left;
  animation:pyPop .28s cubic-bezier(.2,.9,.3,1.2);
}
.py-start-head{padding:20px 22px 12px;display:flex;align-items:center;gap:14px}
.py-start-head svg{width:44px;height:44px;animation:pyGlow 4s ease infinite;flex:none}
.py-start-head .t b{font-size:16px;display:block}
.py-start-head .t i{font-style:normal;font-size:11.5px;color:var(--mut)}
.py-search{margin:4px 22px 14px;position:relative}
.py-search svg{
  position:absolute;left:12px;top:50%;transform:translateY(-50%);
  width:16px;height:16px;color:var(--mut);pointer-events:none;
}
.py-search input{
  width:100%;height:40px;border-radius:12px;border:1px solid var(--line);
  background:rgba(0,0,0,.28);color:var(--txt);
  padding:0 14px 0 38px;font-size:13.5px;outline:none;
  transition:border var(--fast),box-shadow var(--fast);
}
.py-search input:focus{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 25%,transparent)}
.py-start-apps{
  flex:1;overflow-y:auto;padding:2px 16px 12px;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));
  gap:8px;align-content:start;
}
.py-sapp{
  padding:14px 8px 12px;border-radius:14px;
  display:flex;flex-direction:column;align-items:center;gap:9px;
  cursor:pointer;border:1px solid transparent;
  transition:all var(--fast);animation:pyUp .4s ease backwards;
}
.py-sapp:hover{background:rgba(255,255,255,.07);border-color:var(--line);transform:translateY(-3px)}
.py-sapp svg{width:32px;height:32px}
.py-sapp span{font-size:12px;text-align:center;color:var(--txt)}
.py-start-foot{
  border-top:1px solid var(--line);padding:11px 18px;
  display:flex;align-items:center;justify-content:space-between;
  background:rgba(0,0,0,.22);
}
.py-userchip{
  display:flex;align-items:center;gap:10px;
  padding:6px 10px;border-radius:11px;cursor:pointer;
  transition:background var(--fast);
}
.py-userchip:hover{background:rgba(255,255,255,.08)}
.py-ava{
  width:34px;height:34px;border-radius:50%;
  display:grid;place-items:center;font-weight:700;font-size:14px;color:#fff;
  background:linear-gradient(135deg,var(--acc),var(--acc2));
  box-shadow:0 4px 14px color-mix(in srgb,var(--acc) 50%,transparent);
  flex:none;
}
.py-userchip span{font-size:13px}
.py-power{display:flex;gap:4px}
.py-pbtn{
  width:38px;height:38px;border-radius:10px;
  display:grid;place-items:center;cursor:pointer;
  color:var(--mut);border:1px solid transparent;transition:all var(--fast);
}
.py-pbtn:hover{color:var(--err);background:rgba(255,92,122,.12);border-color:rgba(255,92,122,.3)}
.py-pbtn svg{width:18px;height:18px}
/* ══════════ [CSS-8] ОКНА ══════════ */
.py-win{
  position:absolute;min-width:340px;min-height:220px;
  background:var(--panel2);border:1px solid var(--line);
  border-radius:var(--rad);box-shadow:var(--shadow);
  display:flex;flex-direction:column;overflow:hidden;
  animation:pyPop .3s cubic-bezier(.2,.9,.3,1.15);
  transition:box-shadow var(--fast);
}
.py-win.focused{
  border-color:color-mix(in srgb,var(--acc) 55%,var(--line));
  box-shadow:0 30px 90px rgba(0,0,0,.65),0 0 0 1px color-mix(in srgb,var(--acc) 30%,transparent);
}
.py-win.maxed{border-radius:0}
.py-win.closing{animation:pyWinOut .22s ease forwards}
@keyframes pyWinOut{to{opacity:0;transform:scale(.9) translateY(18px)}}
.py-win.mini{animation:pyWinMin .25s ease forwards}
@keyframes pyWinMin{to{opacity:0;transform:scale(.7) translateY(120px)}}
.py-titlebar{
  height:40px;display:flex;align-items:center;gap:10px;
  padding:0 8px 0 14px;background:rgba(0,0,0,.28);
  border-bottom:1px solid var(--line);flex:none;
}
.py-titlebar .tic{width:17px;height:17px;flex:none}
.py-titlebar .ttl{
  font-size:13px;font-weight:600;flex:1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:grab;
}
.py-wbtn{
  width:30px;height:28px;border-radius:8px;
  display:grid;place-items:center;cursor:pointer;
  color:var(--mut);flex:none;transition:all var(--fast);
}
.py-wbtn:hover{background:rgba(255,255,255,.1);color:var(--txt)}
.py-wbtn.close:hover{background:var(--err);color:#fff}
.py-wbtn svg{width:13px;height:13px}
.py-wbody{flex:1;overflow:auto;position:relative}
.py-resize{position:absolute;width:18px;height:18px;right:0;bottom:0;cursor:nwse-resize;z-index:5}
.py-resize::after{
  content:"";position:absolute;right:5px;bottom:5px;width:8px;height:8px;
  border-right:2px solid var(--mut);border-bottom:2px solid var(--mut);opacity:.6;
}
.py-snap{
  position:absolute;top:0;bottom:52px;width:50%;
  background:color-mix(in srgb,var(--acc) 14%,transparent);
  border:2px dashed color-mix(in srgb,var(--acc) 60%,transparent);
  z-index:790;display:none;pointer-events:none;animation:pyFade .2s ease;
}
.py-snap.l{left:0;border-radius:0 18px 18px 0}
.py-snap.r{right:0;border-radius:18px 0 0 18px}
.py-snap.on{display:block}
/* ══════════ [CSS-9] КОНТЕКСТНЫЕ МЕНЮ И ТОСТЫ ══════════ */
.py-ctx{
  position:fixed;min-width:210px;
  background:var(--panel);
  backdrop-filter:var(--blur);
  border:1px solid var(--line);border-radius:12px;
  box-shadow:var(--shadow);z-index:2000;padding:6px;
  animation:pyPop .16s ease;transform-origin:top left;
}
.py-ctx .ci{
  display:flex;align-items:center;gap:10px;
  padding:8px 11px;border-radius:8px;font-size:13px;
  cursor:pointer;color:var(--txt);transition:background var(--fast);
}
.py-ctx .ci:hover{background:color-mix(in srgb,var(--acc) 22%,transparent)}
.py-ctx .ci.danger{color:var(--err)}
.py-ctx .ci svg{width:15px;height:15px;flex:none}
.py-ctx .sep{height:1px;background:var(--line);margin:5px 8px}
.py-toasts{
  position:fixed;top:14px;right:14px;
  display:flex;flex-direction:column;gap:10px;
  z-index:3000;pointer-events:none;
}
.py-toast{
  width:320px;background:var(--panel);
  backdrop-filter:var(--blur);
  border:1px solid var(--line);border-left:3px solid var(--acc);
  border-radius:13px;padding:13px 15px;box-shadow:var(--shadow);
  animation:pyToastIn .35s cubic-bezier(.2,.9,.3,1.2);pointer-events:auto;
}
.py-toast.bye{animation:pyToastOut .3s ease forwards}
.py-toast b{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:4px}
.py-toast b svg{width:15px;height:15px;color:var(--acc)}
.py-toast p{font-size:12.5px;color:var(--mut);line-height:1.45}
/* ══════════ [CSS-10] OOBE УСТАНОВКА ══════════ */
.py-oobe{
  position:absolute;inset:0;z-index:900;
  display:flex;align-items:center;justify-content:center;
  background:
    radial-gradient(900px 500px at 80% 10%,color-mix(in srgb,var(--acc) 20%,transparent),transparent 60%),
    radial-gradient(800px 500px at 15% 90%,color-mix(in srgb,var(--acc2) 18%,transparent),transparent 60%),
    var(--bg);
  animation:pyFade .6s ease;
}
.py-oobe-card{
  width:860px;max-width:calc(100vw - 40px);
  height:600px;max-height:calc(100vh - 40px);
  background:var(--panel);
  backdrop-filter:var(--blur);
  border:1px solid var(--line);border-radius:24px;
  box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;
  animation:pyPop .5s cubic-bezier(.2,.9,.3,1.15);
}
.py-oobe-top{padding:20px 30px 0;display:flex;align-items:center;gap:13px}
.py-oobe-top svg{width:34px;height:34px}
.py-oobe-top b{font-size:15px}
.py-oobe-top .step{margin-left:auto;font-size:12px;color:var(--mut)}
.py-oobe-prog{margin:14px 30px 0;height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.py-oobe-prog i{
  display:block;height:100%;width:0%;border-radius:4px;
  background:linear-gradient(90deg,var(--acc),var(--acc2));
  transition:width .6s cubic-bezier(.3,.8,.3,1);
  box-shadow:0 0 12px var(--acc);
}
.py-oobe-body{flex:1;overflow-y:auto;padding:26px 34px}
.py-oobe-step{animation:pySlideR .45s cubic-bezier(.25,.8,.3,1)}
.py-oobe-step.back{animation:pySlideL .45s cubic-bezier(.25,.8,.3,1)}
.py-oobe-step h1{
  font-size:27px;margin-bottom:8px;
  background:linear-gradient(90deg,#fff,#b9c8e6);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
.py-oobe-step .sub{color:var(--mut);font-size:14px;margin-bottom:22px;line-height:1.5}
.py-oobe-foot{
  border-top:1px solid var(--line);padding:16px 30px;
  display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.2);
}
.py-oobe-foot .hint{font-size:12px;color:var(--mut);flex:1}
.py-btn{
  border:none;outline:none;font-size:13.5px;font-weight:600;color:#fff;
  padding:11px 26px;border-radius:11px;
  background:linear-gradient(135deg,var(--acc),var(--acc2));
  box-shadow:0 8px 22px color-mix(in srgb,var(--acc) 45%,transparent);
  transition:all var(--fast);position:relative;overflow:hidden;
}
.py-btn:hover{transform:translateY(-2px);box-shadow:0 12px 28px color-mix(in srgb,var(--acc) 60%,transparent)}
.py-btn:active{transform:scale(.96)}
.py-btn.ghost{background:rgba(255,255,255,.06);box-shadow:none;border:1px solid var(--line);color:var(--txt)}
.py-btn.ghost:hover{background:rgba(255,255,255,.11)}
.py-btn.small{padding:8px 16px;font-size:12.5px}
.py-choice{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.py-card{
  border:2px solid var(--line);background:rgba(255,255,255,.03);
  border-radius:15px;padding:16px;cursor:pointer;
  transition:all var(--fast);animation:pyUp .4s ease backwards;
}
.py-card:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--acc) 50%,var(--line));background:rgba(255,255,255,.05)}
.py-card.sel{
  border-color:var(--acc);
  background:color-mix(in srgb,var(--acc) 14%,transparent);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 22%,transparent);
}
.py-card b{display:block;font-size:13.5px;margin-bottom:4px}
.py-card i{font-style:normal;font-size:11.5px;color:var(--mut);line-height:1.4;display:block}
.py-swatch{width:100%;height:56px;border-radius:10px;margin-bottom:10px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.py-wprev{width:100%;height:66px;border-radius:10px;margin-bottom:10px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.py-field{margin-bottom:18px}
.py-field label{display:block;font-size:12.5px;color:var(--mut);margin-bottom:7px;font-weight:600;letter-spacing:.3px}
.py-input{
  width:100%;height:42px;border-radius:11px;border:1px solid var(--line);
  background:rgba(0,0,0,.3);color:var(--txt);padding:0 14px;
  font-size:14px;outline:none;
  transition:border var(--fast),box-shadow var(--fast);
}
.py-input:focus{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 25%,transparent)}
.py-toggle{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px;border:1px solid var(--line);border-radius:13px;
  margin-bottom:11px;background:rgba(255,255,255,.03);
  transition:border var(--fast);
}
.py-toggle:hover{border-color:color-mix(in srgb,var(--acc) 40%,var(--line))}
.py-toggle .tl b{font-size:13.5px;display:block;margin-bottom:3px}
.py-toggle .tl i{font-style:normal;font-size:11.5px;color:var(--mut)}
.py-sw{
  width:48px;height:26px;border-radius:20px;background:var(--line);
  position:relative;cursor:pointer;transition:background var(--med);flex:none;
}
.py-sw::after{
  content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;
  border-radius:50%;background:#fff;transition:transform var(--med) cubic-bezier(.3,1.4,.5,1);
}
.py-sw.on{background:linear-gradient(90deg,var(--acc),var(--acc2))}
.py-sw.on::after{transform:translateX(22px)}
.py-install{text-align:center;padding-top:40px}
.py-install svg{width:110px;height:110px;animation:pyGlow 3s ease infinite,pyFloat 5s ease-in-out infinite}
.py-install h2{margin-top:22px;font-size:22px}
.py-install .stage{color:var(--mut);font-size:13px;margin-top:8px;height:18px}
.py-install .bar{width:420px;max-width:80%;height:8px;margin:26px auto 0;border-radius:8px;background:var(--line);overflow:hidden}
.py-install .bar i{
  display:block;height:100%;width:0%;border-radius:8px;
  background:linear-gradient(90deg,var(--acc),var(--acc2),var(--acc));
  background-size:200% 100%;animation:pyShift 2s linear infinite;
  transition:width .4s ease;
}
.py-install .pct{margin-top:10px;font-size:12px;color:var(--mut)}
/* ══════════ [CSS-11] ЭКРАН ЗАГРУЗКИ ══════════ */
.py-boot{
  position:absolute;inset:0;z-index:950;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:26px;animation:pyFade .5s ease;
}
.py-boot .scan{
  position:absolute;left:0;right:0;height:90px;
  background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--acc) 12%,transparent),transparent);
  animation:pyScan 3.2s linear infinite;pointer-events:none;
}
.py-boot svg.big{width:130px;height:130px;animation:pyPop 1s cubic-bezier(.2,.9,.3,1.3),pyGlow 3.5s ease infinite}
.py-boot .name{font-size:26px;font-weight:700;letter-spacing:3px;animation:pyUp .8s ease .2s backwards}
.py-boot .name span{
  background:linear-gradient(90deg,var(--acc),var(--acc2));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
.py-boot .loader{width:220px;height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.py-boot .loader i{
  display:block;height:100%;width:40%;border-radius:4px;
  background:linear-gradient(90deg,var(--acc),var(--acc2));
  animation:pyBootSlide 1.1s ease-in-out infinite;
}
.py-boot .st{font-size:12px;color:var(--mut);letter-spacing:1px;animation:pyBlink 1.6s infinite}
/* ══════════ [CSS-12] JARVIS ══════════ */
.py-orb{
  position:absolute;right:22px;bottom:74px;width:58px;height:58px;
  border-radius:50%;cursor:pointer;z-index:860;
  display:grid;place-items:center;
  background:radial-gradient(circle at 32% 30%,#fff3,transparent 40%),linear-gradient(135deg,var(--acc),var(--acc2));
  box-shadow:0 10px 30px color-mix(in srgb,var(--acc) 55%,transparent);
  transition:transform var(--fast);animation:pyFloat 5s ease-in-out infinite;
}
.py-orb:hover{transform:scale(1.08)}
.py-orb:active{transform:scale(.94)}
.py-orb svg{width:26px;height:26px;color:#fff}
.py-orb .ring{position:absolute;inset:0;border-radius:50%;border:2px solid var(--acc);opacity:0}
.py-orb.listening .ring{animation:pyOrbRing 1.2s ease-out infinite}
.py-orb.listening{animation:pyBreath 1s ease-in-out infinite}
.py-jarvis{
  position:absolute;right:22px;bottom:140px;
  width:400px;max-width:calc(100vw - 30px);
  height:540px;max-height:calc(100vh - 180px);
  background:var(--panel);
  backdrop-filter:var(--blur);
  border:1px solid var(--line);border-radius:20px;
  box-shadow:var(--shadow);z-index:870;
  display:flex;flex-direction:column;overflow:hidden;
  transform-origin:bottom right;
  animation:pyPop .3s cubic-bezier(.2,.9,.3,1.2);
}
.py-jv-head{
  padding:15px 18px;display:flex;align-items:center;gap:12px;
  border-bottom:1px solid var(--line);background:rgba(0,0,0,.22);
}
.py-jv-head .core{
  width:38px;height:38px;border-radius:50%;flex:none;
  background:radial-gradient(circle at 32% 30%,#fff4,transparent 40%),linear-gradient(135deg,var(--acc),var(--acc2));
  animation:pyBreath 2.4s infinite;
}
.py-jv-head b{font-size:14.5px;display:block}
.py-jv-head i{font-style:normal;font-size:11px;color:var(--mut)}
.py-jv-wave{margin-left:auto;display:flex;gap:3px;align-items:center;height:24px}
.py-jv-wave s{width:3px;height:6px;border-radius:3px;background:var(--acc);text-decoration:none}
.py-jv-wave.on s{animation:pyWaveBar .7s ease-in-out infinite}
.py-jv-wave s:nth-child(2){animation-delay:.12s}
.py-jv-wave s:nth-child(3){animation-delay:.24s}
.py-jv-wave s:nth-child(4){animation-delay:.36s}
.py-jv-wave s:nth-child(5){animation-delay:.48s}
.py-jv-log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.py-jv-msg{
  max-width:86%;padding:10px 13px;border-radius:14px;
  font-size:13px;line-height:1.5;
  animation:pyUp .3s ease backwards;
  white-space:pre-wrap;word-break:break-word;
}
.py-jv-msg.j{
  background:rgba(255,255,255,.07);border:1px solid var(--line);
  border-bottom-left-radius:4px;align-self:flex-start;
}
.py-jv-msg.u{
  background:linear-gradient(135deg,var(--acc),var(--acc2));
  color:#fff;border-bottom-right-radius:4px;align-self:flex-end;
}
.py-jv-dots span{
  display:inline-block;width:6px;height:6px;margin-right:4px;
  border-radius:50%;background:var(--mut);
  animation:pyFloat 1s ease-in-out infinite;
}
.py-jv-dots span:nth-child(2){animation-delay:.15s}
.py-jv-dots span:nth-child(3){animation-delay:.3s}
.py-jv-in{
  border-top:1px solid var(--line);padding:12px;
  display:flex;gap:8px;align-items:center;background:rgba(0,0,0,.2);
}
.py-jv-in input{
  flex:1;height:40px;border-radius:20px;border:1px solid var(--line);
  background:rgba(0,0,0,.3);color:var(--txt);padding:0 16px;
  font-size:13px;outline:none;transition:border var(--fast);
}
.py-jv-in input:focus{border-color:var(--acc)}
.py-mic{
  width:42px;height:42px;border-radius:50%;
  display:grid;place-items:center;
  background:rgba(255,255,255,.08);color:var(--txt);
  border:1px solid var(--line);transition:all var(--fast);flex:none;
}
.py-mic:hover{background:rgba(255,255,255,.14)}
.py-mic.rec{background:linear-gradient(135deg,var(--err),#c2335a);border-color:transparent;animation:pyBreath .9s infinite}
.py-mic svg{width:18px;height:18px}
.py-jv-cmds{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 12px}
.py-chip{
  font-size:11px;padding:6px 11px;border-radius:20px;
  border:1px solid var(--line);color:var(--mut);cursor:pointer;
  transition:all var(--fast);background:rgba(255,255,255,.03);
}
.py-chip:hover{
  color:#fff;border-color:var(--acc);
  background:color-mix(in srgb,var(--acc) 18%,transparent);
  transform:translateY(-2px);
}
/* ══════════ [CSS-13] ПРИЛОЖЕНИЯ ══════════ */
.py-app{height:100%;display:flex;flex-direction:column;animation:pyFade .3s ease}
.py-toolbar{
  display:flex;align-items:center;gap:7px;padding:9px 12px;
  border-bottom:1px solid var(--line);background:rgba(0,0,0,.18);
  flex:none;flex-wrap:wrap;
}
.py-tbtn{
  display:flex;align-items:center;gap:7px;padding:7px 13px;
  border-radius:9px;font-size:12.5px;color:var(--mut);
  border:1px solid transparent;transition:all var(--fast);
  background:transparent;font-weight:600;
}
.py-tbtn:hover{background:rgba(255,255,255,.08);color:var(--txt);border-color:var(--line)}
.py-tbtn.acc{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border-color:transparent}
.py-tbtn svg{width:14px;height:14px}
.py-status{
  border-top:1px solid var(--line);padding:6px 13px;font-size:11.5px;
  color:var(--mut);display:flex;gap:16px;background:rgba(0,0,0,.18);flex:none;
}
/* терминал */
.py-term{
  height:100%;background:#060910;
  font-family:"Cascadia Code","JetBrains Mono",Consolas,monospace;
  font-size:13px;padding:14px;overflow-y:auto;
  display:flex;flex-direction:column;
}
.py-term .ln{white-space:pre-wrap;word-break:break-word;line-height:1.55;animation:pyFade .2s ease}
.py-term .ln.ok{color:var(--ok)}
.py-term .ln.err{color:var(--err)}
.py-term .ln.warn{color:var(--warn)}
.py-term .ln.info{color:var(--acc)}
.py-term .ln.dim{color:var(--mut)}
.py-term-in{display:flex;gap:8px;align-items:baseline}
.py-term-in .ps{color:var(--ok);font-weight:700;flex:none}
.py-term-in input{
  flex:1;background:transparent;border:none;outline:none;
  color:var(--txt);font-family:inherit;font-size:inherit;
}
/* файлы */
.py-files-crumbs{display:flex;align-items:center;gap:4px;flex:1;overflow-x:auto;font-size:12.5px;scrollbar-width:none}
.py-files-crumbs::-webkit-scrollbar{display:none}
.py-crumb{padding:5px 10px;border-radius:7px;cursor:pointer;color:var(--mut);white-space:nowrap;transition:all var(--fast)}
.py-crumb:hover{background:rgba(255,255,255,.08);color:var(--txt)}
.py-crumb.cur{color:var(--acc);font-weight:700}
.py-files-grid{
  flex:1;overflow-y:auto;padding:16px;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));
  gap:8px;align-content:start;
}
.py-fitem{
  padding:14px 6px 11px;border-radius:12px;
  display:flex;flex-direction:column;align-items:center;gap:8px;
  cursor:pointer;border:1px solid transparent;
  transition:all var(--fast);animation:pyUp .3s ease backwards;
}
.py-fitem:hover{background:rgba(255,255,255,.06);border-color:var(--line);transform:translateY(-2px)}
.py-fitem svg{width:38px;height:38px}
.py-fitem span{font-size:11.5px;text-align:center;word-break:break-all;line-height:1.3}
.py-fitem em{font-style:normal;font-size:10px;color:var(--mut)}
/* редактор */
.py-ed{flex:1;display:flex;min-height:0}
.py-ed-gutter{
  padding:12px 8px;text-align:right;color:#3d4a63;
  font-family:Consolas,monospace;font-size:13px;line-height:1.6;
  background:rgba(0,0,0,.25);border-right:1px solid var(--line);
  min-width:46px;overflow:hidden;flex:none;
}
.py-ed textarea{
  flex:1;background:transparent;border:none;outline:none;resize:none;
  color:#dbe4f3;font-family:"Cascadia Code",Consolas,monospace;
  font-size:13px;line-height:1.6;padding:12px 14px;white-space:pre;overflow:auto;
}
/* калькулятор */
.py-calc{padding:18px;height:100%;display:flex;flex-direction:column;gap:12px}
.py-calc-disp{
  background:rgba(0,0,0,.35);border:1px solid var(--line);
  border-radius:14px;padding:16px 18px;text-align:right;min-height:88px;
  display:flex;flex-direction:column;justify-content:flex-end;gap:4px;
}
.py-calc-disp .ex{font-size:12px;color:var(--mut);min-height:16px;word-break:break-all}
.py-calc-disp .res{font-size:34px;font-weight:700;word-break:break-all;animation:pyFade .2s ease}
.py-calc-grid{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.py-calc-k{
  border:1px solid var(--line);border-radius:12px;
  background:rgba(255,255,255,.05);color:var(--txt);
  font-size:18px;font-weight:600;cursor:pointer;
  transition:all var(--fast);
}
.py-calc-k:hover{background:rgba(255,255,255,.12);transform:translateY(-2px)}
.py-calc-k:active{transform:scale(.94)}
.py-calc-k.op{color:var(--acc)}
.py-calc-k.eq{background:linear-gradient(135deg,var(--acc),var(--acc2));border-color:transparent;color:#fff}
/* настройки */
.py-set{flex:1;display:flex;min-height:0}
.py-set-nav{
  width:190px;border-right:1px solid var(--line);padding:12px;
  display:flex;flex-direction:column;gap:4px;flex:none;
  overflow-y:auto;background:rgba(0,0,0,.14);
}
.py-set-nav .ni{
  display:flex;align-items:center;gap:10px;padding:10px 12px;
  border-radius:10px;font-size:13px;cursor:pointer;color:var(--mut);
  transition:all var(--fast);
}
.py-set-nav .ni:hover{background:rgba(255,255,255,.06);color:var(--txt)}
.py-set-nav .ni.on{background:color-mix(in srgb,var(--acc) 20%,transparent);color:#fff;font-weight:600}
.py-set-nav .ni svg{width:16px;height:16px;flex:none}
.py-set-body{flex:1;overflow-y:auto;padding:22px 26px}
.py-set-body h2{font-size:19px;margin-bottom:4px}
.py-set-body .dsc{color:var(--mut);font-size:12.5px;margin-bottom:20px}
.py-set-body h3{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--mut);margin:22px 0 12px}
/* о системе */
.py-about{padding:30px;display:flex;flex-direction:column;align-items:center;text-align:center;overflow-y:auto;height:100%}
.py-about svg{width:120px;height:120px;animation:pyGlow 4s ease infinite,pyFloat 6s ease-in-out infinite}
.py-about h1{margin-top:20px;font-size:26px}
.py-about .ver{margin-top:6px;font-size:12.5px;color:var(--mut)}
.py-about .badge{
  margin-top:12px;padding:5px 14px;border-radius:20px;
  border:1px solid var(--line);font-size:11px;color:var(--acc);
  background:color-mix(in srgb,var(--acc) 10%,transparent);
}
.py-specs{margin-top:26px;width:100%;max-width:460px;display:flex;flex-direction:column;gap:8px}
.py-spec{
  display:flex;justify-content:space-between;gap:14px;
  padding:11px 16px;border:1px solid var(--line);border-radius:11px;
  background:rgba(255,255,255,.03);font-size:12.5px;
  animation:pyUp .4s ease backwards;
}
.py-spec b{color:var(--mut);font-weight:600;flex:none}
.py-spec span{text-align:right;word-break:break-word}
/* студия плагинов */
.py-plug-tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 12px;background:rgba(0,0,0,.18);flex:none}
.py-ptab{
  padding:11px 18px;font-size:12.5px;font-weight:600;color:var(--mut);
  cursor:pointer;border-bottom:2px solid transparent;transition:all var(--fast);
}
.py-ptab:hover{color:var(--txt)}
.py-ptab.on{color:var(--acc);border-bottom-color:var(--acc)}
.py-plug{flex:1;display:flex;min-height:0}
.py-plug-docs-nav{width:230px;border-right:1px solid var(--line);overflow-y:auto;padding:12px;flex:none;background:rgba(0,0,0,.14)}
.py-doc-cat{font-size:10.5px;text-transform:uppercase;letter-spacing:1.2px;color:var(--mut);padding:12px 10px 6px}
.py-doc-link{display:block;padding:8px 11px;border-radius:9px;font-size:12.5px;cursor:pointer;color:#b9c4d6;transition:all var(--fast)}
.py-doc-link:hover{background:rgba(255,255,255,.06);color:#fff}
.py-doc-link.on{background:color-mix(in srgb,var(--acc) 22%,transparent);color:#fff;font-weight:600}
.py-plug-main{flex:1;overflow-y:auto;padding:24px 28px;min-width:0}
.py-doc h2{font-size:21px;margin-bottom:6px}
.py-doc .lead{color:var(--mut);font-size:13px;margin-bottom:18px;line-height:1.55}
.py-doc h3{font-size:15px;margin:20px 0 9px;color:var(--acc)}
.py-doc p{font-size:13px;line-height:1.65;margin-bottom:10px;color:#ccd5e4}
.py-doc ul,.py-doc ol{margin:0 0 12px 20px;font-size:13px;line-height:1.7;color:#ccd5e4}
.py-doc code{
  font-family:Consolas,monospace;font-size:12px;
  background:rgba(79,140,255,.14);border:1px solid rgba(79,140,255,.25);
  padding:2px 6px;border-radius:6px;color:#9fc1ff;
}
.py-doc pre{
  background:#070b12;border:1px solid var(--line);border-radius:12px;
  padding:15px 17px;overflow-x:auto;margin:12px 0 16px;
  font-family:Consolas,monospace;font-size:12.3px;line-height:1.6;color:#c8e0ff;
}
.py-doc table{width:100%;border-collapse:collapse;margin:12px 0 16px;font-size:12.5px}
.py-doc th{text-align:left;padding:9px 12px;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--acc)}
.py-doc td{padding:9px 12px;border:1px solid var(--line);color:#ccd5e4;vertical-align:top}
.py-plug-item{
  display:flex;align-items:center;gap:13px;
  border:1px solid var(--line);border-radius:13px;
  padding:14px 16px;margin-bottom:10px;background:rgba(255,255,255,.03);
  animation:pyUp .3s ease backwards;
}
.py-plug-item .pi-ic{
  width:40px;height:40px;border-radius:11px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--acc),var(--acc2));flex:none;
}
.py-plug-item .pi-ic svg{width:20px;height:20px;color:#fff}
.py-plug-item .pi-t{flex:1;min-width:0}
.py-plug-item .pi-t b{font-size:13.5px;display:block}
.py-plug-item .pi-t i{font-style:normal;font-size:11.5px;color:var(--mut)}
/* блокировка и выключение */
.py-lock{
  position:absolute;inset:0;z-index:980;
  background:rgba(5,7,12,.82);
  backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:18px;cursor:pointer;animation:pyFade .4s ease;
}
.py-lock svg{width:90px;height:90px;animation:pyFloat 5s ease-in-out infinite}
.py-lock .lt{font-size:44px;font-weight:200}
.py-lock .ld{color:var(--mut);font-size:14px}
.py-lock .hint{margin-top:22px;color:var(--mut);font-size:12px;animation:pyBlink 2s infinite}
.py-off{

  var t=h('div',{class:'py-toast'},
    h('b',null,icon(iconId||'info'),title),
    h('p',null,text||''));
  toastBox.appendChild(t);
  setTimeout(function(){
    t.classList.add('bye');
    setTimeout(function(){t.remove();},320);
  },4200);
  t.addEventListener('click',function(){
    t.classList.add('bye');
    setTimeout(function(){t.remove();},320);
  });
}
var ctxEl=null;
function closeCtx(){if(ctxEl){ctxEl.remove();ctxEl=null;}}
document.addEventListener('pointerdown',function(e){
  if(ctxEl&&!ctxEl.contains(e.target)){closeCtx();}
},true);
function ctxMenu(x,y,items){
  closeCtx();
  var m=h('div',{class:'py-ctx'});
  items.forEach(function(it){
    if(it==='-'){m.appendChild(h('div',{class:'sep'}));return;}
    m.appendChild(h('div',{class:'ci'+(it.danger?' danger':''),
      onclick:function(e){e.stopPropagation();closeCtx();if(it.run){it.run();}}
    },it.icon?icon(it.icon):null,it.label));
  });
  root.appendChild(m);
  var r=m.getBoundingClientRect();
  m.style.left=clamp(x,4,innerWidth-r.width-6)+'px';
  m.style.top=clamp(y,4,innerHeight-r.height-6)+'px';
  ctxEl=m;
}

/* ══════════ [JS-H] ОКОННЫЙ МЕНЕДЖЕР ══════════ */
var deskLayer=null;
var wm={
  z:100,
  wins:{},
  order:[],
  create:function(opts){
    var self=this;
    var id=opts.id||('w'+Math.random().toString(36).slice(2,9));
    if(this.wins[id]){
      if(this.wins[id].minimized){this.restore(id);}
      this.focus(id);
      return this.wins[id];
    }
    var w=opts.width||640,hh=opts.height||440;
    var ox=60+(this.order.length%6)*36;
    var oy=40+(this.order.length%6)*28;
    var el=h('div',{class:'py-win',style:{
      width:w+'px',height:hh+'px',
      left:clamp(ox,10,innerWidth-w-10)+'px',
      top:clamp(oy,10,innerHeight-hh-90)+'px',
      zIndex:++this.z}});
    var tb=h('div',{class:'py-titlebar'},
      icon(opts.icon||'square','tic'),
      h('span',{class:'ttl'},opts.title||'Окно'),
      h('div',{class:'py-wbtn',title:'Свернуть',onclick:function(){self.minimize(id);}},icon('minus')),
      h('div',{class:'py-wbtn',title:'Развернуть',onclick:function(){self.toggleMax(id);}},icon('square')),
      h('div',{class:'py-wbtn close',title:'Закрыть',onclick:function(){self.close(id);}},icon('close')));
    var body=h('div',{class:'py-wbody'});
    var rz=h('div',{class:'py-resize'});
    el.append(tb,body,rz);
    deskLayer.appendChild(el);
    var handle={
      id:id,el:el,body:body,
      title:opts.title,icon:opts.icon||'square',
      minimized:false,maxed:false,prevRect:null,
      onClose:opts.onClose||null,
      setTitle:function(t){this.title=t;$('.ttl',tb).textContent=t;bus.emit('wm');},
      setIcon:function(i){this.icon=i;tb.replaceChild(safeIcon(i),$('.tic',tb));}
    };
    this.wins[id]=handle;
    this.order.push(id);
    el.addEventListener('pointerdown',function(){self.focus(id);});
    /* перетаскивание */
    var drag=null;
    tb.addEventListener('pointerdown',function(e){
      if(e.target.closest('.py-wbtn')||handle.maxed){return;}
      drag={dx:e.clientX-el.offsetLeft,dy:e.clientY-el.offsetTop};
      tb.setPointerCapture(e.pointerId);
      $('.ttl',tb).style.cursor='grabbing';
    });
    tb.addEventListener('pointermove',function(e){
      if(!drag){return;}
      el.style.left=clamp(e.clientX-drag.dx,-el.offsetWidth+90,innerWidth-90)+'px';
      el.style.top=clamp(e.clientY-drag.dy,0,innerHeight-110)+'px';
      snapHint(e.clientX);
    });
    tb.addEventListener('pointerup',function(e){
      if(!drag){return;}
      drag=null;
      $('.ttl',tb).style.cursor='grab';
      var s=consumeSnap();
      if(s){self.snapTo(id,s);}
    });
    /* ресайз */
    var rs=null;
    rz.addEventListener('pointerdown',function(e){
      rs={x:e.clientX,y:e.clientY,w:el.offsetWidth,h:el.offsetHeight};
      rz.setPointerCapture(e.pointerId);
      e.stopPropagation();
    });
    rz.addEventListener('pointermove',function(e){
      if(!rs){return;}
      el.style.width=Math.max(340,rs.w+e.clientX-rs.x)+'px';
      el.style.height=Math.max(220,rs.h+e.clientY-rs.y)+'px';
    });
    rz.addEventListener('pointerup',function(){rs=null;});
    tb.addEventListener('dblclick',function(e){
      if(!e.target.closest('.py-wbtn')){self.toggleMax(id);}
    });
    this.focus(id);
    bus.emit('wm');
    if(opts.init){
      try{opts.init(body,handle);}
      catch(err){
        body.innerHTML='';
        body.appendChild(h('div',{style:{padding:'20px',color:'var(--err)'}},
          'Ошибка инициализации: '+err.message));
      }
    }
    return handle;
  },
  focus:function(id){
    var w=this.wins[id];
    if(!w){return;}
    w.el.style.zIndex=++this.z;
    Object.keys(this.wins).forEach(function(k){
      this.wins[k].el.classList.toggle('focused',k===id);
    },this);
  },
  close:function(id){
    var w=this.wins[id];
    if(!w){return;}
    if(w.onClose){try{w.onClose();}catch(e){}}
    w.el.classList.add('closing');
    delete this.wins[id];
    this.order=this.order.filter(function(x){return x!==id;});
    setTimeout(function(){w.el.remove();},230);
    bus.emit('wm');
  },
  minimize:function(id){
    var w=this.wins[id];
    if(!w){return;}
    w.minimized=true;
    w.el.classList.add('mini');
    setTimeout(function(){w.el.style.display='none';w.el.classList.remove('mini');},250);
    bus.emit('wm');
  },
  restore:function(id){
    var w=this.wins[id];
    if(!w){return;}
    w.minimized=false;
    w.el.style.display='flex';
    this.focus(id);
    bus.emit('wm');
  },
  toggleMax:function(id){
    var w=this.wins[id];
    if(!w){return;}
    if(!w.maxed){
      w.prevRect={l:w.el.style.left,t:w.el.style.top,w:w.el.style.width,h:w.el.style.height};
      w.el.style.left='0';w.el.style.top='0';
      w.el.style.width='100%';w.el.style.height='100%';
      w.el.classList.add('maxed');w.maxed=true;
    }else{
      var r=w.prevRect||{l:'80px',t:'60px',w:'640px',h:'440px'};
      w.el.style.left=r.l;w.el.style.top=r.t;
      w.el.style.width=r.w;w.el.style.height=r.h;
      w.el.classList.remove('maxed');w.maxed=false;
    }
  },
  snapTo:function(id,side){
    var w=this.wins[id];
    if(!w||side==='max'){return;}
    var d=deskLayer.getBoundingClientRect();
    var half=Math.floor(d.width/2);
    w.el.classList.remove('maxed');w.maxed=false;
    w.el.style.top='0';
    w.el.style.height=d.height+'px';
    w.el.style.left=side==='l'?'0':half+'px';
    w.el.style.width=half+'px';
  },
  closeTop:function(){
    if(this.order.length){this.close(this.order[this.order.length-1]);return true;}
    return false;
  },
  closeAll:function(){
    var self=this;
    Object.keys(this.wins).forEach(function(id){self.close(id);});
  }
};
var snapL=h('div',{class:'py-snap l'});
var snapR=h('div',{class:'py-snap r'});
var snapState=null;
function snapHint(x){
  if(x<14){snapL.classList.add('on');snapR.classList.remove('on');snapState='l';}
  else if(x>innerWidth-14){snapR.classList.add('on');snapL.classList.remove('on');snapState='r';}
  else{snapL.classList.remove('on');snapR.classList.remove('on');snapState=null;}
}
function consumeSnap(){
  var s=snapState;snapState=null;
  snapL.classList.remove('on');snapR.classList.remove('on');
  return s;
}

registerApp({
  id:'terminal',name:'Терминал',icon:'term',
  width:680,height:430,single:true,
  launch:function(body){
    body.innerHTML='';
    var term=h('div',{class:'py-term'});
    body.appendChild(term);
    var inRow=h('div',{class:'py-term-in'},
      h('span',{class:'ps'},'pyos $'),
      h('input',{placeholder:'введите help…',autocomplete:'off'}));
    term.appendChild(inRow);
    var api={
      print:function(text,cls){
        term.insertBefore(h('div',{class:'ln'+(cls?' '+cls:'')},text),inRow);
        term.scrollTop=term.scrollHeight;
      },
      clear:function(){$$('.ln',term).forEach(function(n){n.remove();});}
    };
    var input=$('input',inRow);
    var history=[],hIdx=-1;
    api.print(SYS.name+' '+SYS.version+' · терминал','info');
    api.print('Команды: help · neofetch · plugins · jarvis say привет','dim');
    input.addEventListener('keydown',function(e){
      if(e.key==='ArrowUp'){
        e.preventDefault();
        if(hIdx<history.length-1){hIdx++;input.value=history[history.length-1-hIdx];}
        return;
      }
      if(e.key==='ArrowDown'){
        e.preventDefault();
        if(hIdx>0){hIdx--;input.value=history[history.length-1-hIdx];}
        else{hIdx=-1;input.value='';}
        return;
      }
      if(e.key!=='Enter'){return;}
      var raw=input.value.trim();
      input.value='';
      if(!raw){return;}
      history.push(raw);hIdx=-1;
      api.print('pyos $ '+raw,'dim');
      var parts=raw.split(/\s+/);
      var cmd=parts[0].toLowerCase();
      var c=termCommands[cmd];
      if(!c){api.print('Неизвестная команда: '+cmd+'. Введите help.','err');return;}
      try{c.run(api,parts.slice(1));}
      catch(err){api.print('Ошибка: '+err.message,'err');}
    });
    body.addEventListener('click',function(){input.focus();});
    setTimeout(function(){input.focus();},120);
  }
});

registerApp({
  id:'files',name:'Файлы',icon:'files',
  width:720,height:480,single:true,
  launch:function(body,win){
    var cwd='/';
    body.innerHTML='';
    var app=h('div',{class:'py-app'});
    var crumbs=h('div',{class:'py-files-crumbs'});
    var grid=h('div',{class:'py-files-grid'});
    var status=h('div',{class:'py-status'});
    function render(){
      crumbs.innerHTML='';
      var parts=cwd.split('/').filter(Boolean);
      crumbs.appendChild(h('span',{class:'py-crumb'+(cwd==='/'?' cur':''),
        onclick:function(){cwd='/';render();}},'⌂ Система'));
      var acc='';
      parts.forEach(function(p,i){
        acc+='/'+p;
        var isCur=i===parts.length-1;
        (function(path){
          crumbs.appendChild(h('span',{class:'py-crumb'+(isCur?' cur':''),
            onclick:function(){cwd=path;render();}},p));
        })(acc);
      });
      grid.innerHTML='';
      var items=vfs.list(cwd);
      items.forEach(function(f,idx){
        var ic=f.type==='dir'?'folder':(/\.py$/.test(f.name)?'pyfile':'file');
        var item=h('div',{class:'py-fitem',style:{animationDelay:(idx*0.02)+'s'}},
          icon(ic),h('span',null,f.name),
          h('em',null,f.type==='dir'?'папка':fmtBytes((f.content||'').length)));
        item.addEventListener('dblclick',function(){
          if(f.type==='dir'){cwd=cwd==='/'?'/'+f.name:cwd+'/'+f.name;render();}
          else{openInEditor((cwd==='/'?'':cwd)+'/'+f.name);}
        });
        item.addEventListener('contextmenu',function(e){
          e.preventDefault();
          ctxMenu(e.clientX,e.clientY,[
            {label:'Открыть',icon:'play',run:function(){
              if(f.type==='dir'){cwd=cwd==='/'?'/'+f.name:cwd+'/'+f.name;render();}
              else{openInEditor((cwd==='/'?'':cwd)+'/'+f.name);}
            }},
            {label:'Переименовать',icon:'edit',run:function(){
              var nn=prompt('Новое имя:',f.name);
              if(nn&&vfs.rename(cwd,f.name,nn.trim())){render();}
            }},
            '-',
            {label:'Удалить',icon:'trash',danger:true,run:function(){
              vfs.remove(cwd,f.name);
              notify('Файлы','Удалено: '+f.name,'trash');
              render();
            }}]);
        });
        grid.appendChild(item);
      });
      if(!items.length){
        grid.appendChild(h('div',{style:{gridColumn:'1/-1',textAlign:'center',
          color:'var(--mut)',padding:'40px 0',fontSize:'13px'}},'Каталог пуст.'));
      }
      var dirs=items.filter(function(x){return x.type==='dir';}).length;
      status.textContent='Объектов: '+items.length+' · Папок: '+dirs+' · Файлов: '+(items.length-dirs);
      win.setTitle('Файлы — '+(cwd==='/'?'Система':cwd));
    }
    app.appendChild(h('div',{class:'py-toolbar'},
      h('button',{class:'py-tbtn',onclick:function(){
        var name=prompt('Имя новой папки:','Новая папка');
        if(name&&vfs.mkdir(cwd,name.trim())){notify('Файлы','Папка создана','files');}
        render();
      }},icon('plus'),'Папка'),
      h('button',{class:'py-tbtn',onclick:function(){
        var name=prompt('Имя нового файла (.txt/.py):','новый.txt');
        if(name){vfs.write(cwd,name.trim(),'');render();}
      }},icon('plus'),'Файл'),
      h('button',{class:'py-tbtn',onclick:render},icon('refresh'),'Обновить'),
      crumbs));
    app.append(grid,status);
    body.appendChild(app);
    render();
  }
});

/* ══════════ [JS-L] РЕДАКТОР ══════════ */
function editorApp(body,win,openPath){
  var path=openPath||null;
  body.innerHTML='';
  var app=h('div',{class:'py-app'});
  var ta=h('textarea',{spellcheck:'false',placeholder:'// новый код…'});
  var gutter=h('div',{class:'py-ed-gutter'});
  var st=h('div',{class:'py-status'});
  function lines(){
    var n=ta.value.split('\n').length,s='';
    for(var i=1;i<=n;i++){s+=i+'\n';}
    gutter.textContent=s;
  }
  function stat(){
    st.textContent=(path||'новый файл')+'   ·   '+ta.value.length+
      ' симв.   ·   '+ta.value.split('\n').length+' строк';
  }
  function save(){
    if(!path){saveAs();return;}
    var parts=path.split('/');
    var name=parts.pop();
    vfs.write(parts.join('/')||'/',name,ta.value);
    notify('Редактор','Сохранено: '+path,'save');
    stat();
  }
  function saveAs(){
    var p=prompt('Путь (например /Проекты/script.py):',path||'/Проекты/файл.py');
    if(!p){return;}
    if(p.indexOf('/')!==0){p='/'+p;}
    var parts=p.split('/');
    var name=parts.pop();
    var dir=parts.join('/')||'/';
    if(!vfs.resolve(dir)){notify('Редактор','Каталог не найден: '+dir,'close');return;}
    vfs.write(dir,name,ta.value);
    path=p;
    win.setTitle('Редактор — '+name);
    stat();
    notify('Редактор','Сохранено: '+p,'save');
  }
  app.appendChild(h('div',{class:'py-toolbar'},
    h('button',{class:'py-tbtn acc',onclick:save},icon('save'),'Сохранить'),
    h('button',{class:'py-tbtn',onclick:saveAs},icon('plus'),'Сохранить как…')));

registerApp({
  id:'calc',name:'Калькулятор',icon:'calc',
  width:360,height:520,single:true,
  launch:function(body){
    body.innerHTML='';
    var expr='';
    var disp=h('div',{class:'py-calc-disp'},
      h('div',{class:'ex'},'\u00a0'),
      h('div',{class:'res'},'0'));
    var grid=h('div',{class:'py-calc-grid'});
    function refresh(){
      $('.ex',disp).textContent=expr||'\u00a0';
      var out=expr;
      try{
        if(expr){
          out=String(Function('"use strict";return('+expr+')')());
          if(!isFinite(Function('"use strict";return('+expr+')')())){out='∞';}
        }
      }catch(e){out='…';}
      $('.res',disp).textContent=out||'0';
    }
    function press(k){
      if(k==='C'){expr='';}
      else if(k==='⌫'){expr=expr.slice(0,-1);}
      else if(k==='='){
        try{
          var v=Function('"use strict";return('+expr+')')();
          expr=isFinite(v)?String(v):'';
        }catch(e){expr='';}
      }else{expr+=k;}
      refresh();
    }
    var keys=['C','⌫','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','0','.','(',')','−/+','='];
    keys.forEach(function(k,i){
      var cls='py-calc-k';
      if('÷×−+%⌫C'.indexOf(k)>=0){cls+=' op';}
      if(k==='='){cls+=' eq';grid.appendChild(
        h('button',{class:cls,style:{gridColumn:'span 2'},onclick:function(){press('=');}},'='));return;}
      if(k==='−/+'){grid.appendChild(h('button',{class:cls,onclick:function(){
        if(expr){expr='('+expr+')*(-1)';refresh();}
      }},k));return;}
      var sym=k==='÷'?'/':k==='×'?'*':k==='−'?'-':k;
      grid.appendChild(h('button',{class:cls,style:{animationDelay:(i*0.02)+'s'},
        onclick:function(){press(k==='⌫'||k==='C'?k:sym);}},k));
    });
    body.appendChild(h('div',{class:'py-calc'},disp,grid));
    refresh();
  }
});

var plugins={
  registry:{},
  list:function(){return store.get('plugins.list',[]);},
  saveList:function(a){store.set('plugins.list',a);},
  getCode:function(id){return store.get('plugins.code.'+id,'');},
  setCode:function(id,c){store.set('plugins.code.'+id,c);},
  remove:function(id){
    this.saveList(this.list().filter(function(p){return p.id!==id;}));
    store.del('plugins.code.'+id);
    delete this.registry[id];
    delete apps['plug-'+id];
    bus.emit('apps');
  },
  setEnabled:function(id,on){
    var arr=this.list();
    arr.forEach(function(p){if(p.id===id){p.enabled=on;}});
    this.saveList(arr);
    if(on){this.loadOne(id);}
    else{
      delete apps['plug-'+id];
      wm.close('app-plug-'+id);
      bus.emit('apps');
    }
  },
  loadOne:function(id){
    var meta=this.list().filter(function(p){return p.id===id;})[0];
    if(!meta||!meta.enabled){return;}
    var code=this.getCode(id);
    if(!code){return;}
    try{
      var fn=new Function('PYOS','window','document','"use strict";\n'+code+'\n');
      fn(pluginAPI,window,document);
    }catch(e){
      console.error('[PYOS plugin]',id,e);
      notify('Плагины','Ошибка загрузки «'+(meta.name||id)+'»: '+e.message,'plug');
    }
  },
  loadAll:function(){
    var self=this;
    this.list().forEach(function(p){if(p.enabled){self.loadOne(p.id);}});
  }
};
var pluginAPI={
  version:SYS.version,
  plugins:{
    register:function(def){
      if(!def||!def.id||!def.name){throw new Error('Плагин обязан передать id и name');}
      var meta={id:def.id,name:def.name,version:def.version||'1.0',
        icon:def.icon||'plug',author:def.author||'—',enabled:true};
      var arr=plugins.list().filter(function(p){return p.id!==def.id;});
      arr.push(meta);
      plugins.saveList(arr);
      plugins.registry[def.id]=def;
      registerApp({
        id:'plug-'+def.id,name:def.name,
        icon:safeIconName(def.icon),
        width:def.width||600,height:def.height||420,single:true,
        launch:function(body,win){
          body.innerHTML='';
          var holder=h('div',{class:'py-app'});
          body.appendChild(holder);
          try{
            if(def.init){def.init({body:holder,window:win,title:meta.name});}
          }catch(e){
            holder.appendChild(h('div',{style:{padding:'18px',color:'var(--err)'}},
              'Ошибка плагина: '+e.message));
          }
        }});
      bus.emit('apps');
    }},
  store:store,notify:notify,launch:launch,theme:theme,vfs:vfs,bus:bus,
  jarvis:{
    addCommand:function(re,fn){jarvis.custom.push({re:re,fn:fn});},
    say:function(t){jarvis.say(t);}
  }
};
function safeIconName(n){return ICON_SET.indexOf(n)>=0?n:'plug';}

'<tr><td><code>app.title</code></td><td>Имя плагина из манифеста.</td></tr>'+
'</table>'+
'<h3>Стилизация</h3>'+
'<p>Доступны системные CSS-классы: <code>py-btn</code>, <code>py-tbtn</code>, <code>py-card</code>, <code>py-field</code>, <code>py-input</code>, <code>py-toggle</code>, <code>py-note</code>. Цвета — через переменные <code>var(--acc)</code>, <code>var(--txt)</code>, <code>var(--mut)</code>, <code>var(--line)</code>.</p>'+
'<pre>app.body.innerHTML =\n  "&lt;div style=\'padding:20px;color:var(--txt)\'&gt;" +\n  "&lt;button class=\'py-btn\'&gt;Кнопка&lt;/button&gt;&lt;/div&gt;";</pre>'},
{cat:'API',id:'api-store',title:'PYOS.store',html:
'<h2>PYOS.store — хранилище</h2>'+
'<p class="lead">Обёртка над localStorage с JSON-сериализацией.</p>'+
'<pre>PYOS.store.set("mykey", {a: 1});\nvar v = PYOS.store.get("mykey");   // {a:1}\nvar d = PYOS.store.get("нет", 42); // 42\nPYOS.store.del("mykey");</pre>'+
'<h3>Правила</h3>'+
'<ul>'+
'<li>Начинайте ключи со своего префикса («counter.»), чтобы не пересечься с другими плагинами;</li>'+
'<li>Лимит localStorage ≈ 5 МБ, бинарники не храните;</li>'+
'<li>Запись синхронная — не дёргайте в горячих циклах.</li>'+
'</ul>'},
{cat:'API',id:'api-notify',title:'PYOS.notify',html:
'<h2>PYOS.notify — уведомления</h2>'+
'<pre>PYOS.notify("Заголовок", "Текст", "star");</pre>'+
'<table>'+
'<tr><th>Аргумент</th><th>Описание</th></tr>'+
'<tr><td>title</td><td>Жирная строка тоста.</td></tr>'+
'<tr><td>text</td><td>Основной текст (необязательно).</td></tr>'+
'<tr><td>iconId</td><td>Имя иконки: info, star, plug, mic, save, trash, close (необязательно).</td></tr>'+
'</table>'+
'<p>Тост живёт 4 секунды и закрывается по клику.</p>'},
{cat:'API',id:'api-vfs',title:'PYOS.vfs — файлы',html:
'<h2>PYOS.vfs — виртуальная файловая система</h2>'+
'<pre>PYOS.vfs.list("/Проекты");\nPYOS.vfs.read("/Проекты/hello.py");\nPYOS.vfs.write("/Проекты", "a.txt", "текст");\nPYOS.vfs.mkdir("/", "Новая папка");\nPYOS.vfs.rename("/", "a.txt", "b.txt");\nPYOS.vfs.remove("/", "b.txt");\nPYOS.vfs.resolve("/Проекты");</pre>'+
'<h3>Пути</h3>'+
'<ul>'+
'<li>всегда начинаются с «/»;</li>'+
'<li>каталоги должны существовать до записи;</li>'+
'<li>это та же ФС, что в приложении «Файлы».</li>'+
'</ul>'},
{cat:'API',id:'api-bus',title:'PYOS.bus — события',html:
'<h2>PYOS.bus — шина событий</h2>'+
'<pre>var off = PYOS.bus.on("wall", function(){\n  PYOS.notify("Обои", "Пользователь сменил обои");\n});\nPYOS.bus.emit("my-event", {data: 1});\nPYOS.bus.off("wall", off);</pre>'+
'<h3>Системные события</h3>'+
'<table>'+
'<tr><th>Событие</th><th>Когда</th></tr>'+
'<tr><td><code>theme</code></td><td>сменился акцент</td></tr>'+
'<tr><td><code>wall</code></td><td>сменились обои</td></tr>'+
'<tr><td><code>apps</code></td><td>изменился реестр приложений</td></tr>'+
'<tr><td><code>wm</code></td><td>открыто/закрыто/свёрнуто окно</td></tr>'+
'<tr><td><code>user</code></td><td>сменилось имя пользователя</td></tr>'+
'<tr><td><code>jarvis</code></td><td>Jarvis включён/выключен</td></tr>'+
'</table>'},
{cat:'API',id:'api-jarvis',title:'PYOS.jarvis',html:
'<h2>PYOS.jarvis — голос и команды</h2>'+
'<pre>PYOS.jarvis.addCommand(/погода/i, function(phrase){\n  return "Сегодня отличный день для кода.";\n});\n\nPYOS.jarvis.say("Готово");</pre>'+
'<h3>Порядок матча команд</h3>'+
'<ol>'+
'<li>команды плагинов (<code>addCommand</code>);</li>'+
'<li>встроенные системные команды;</li>'+
'<li>Gemini (если задан ключ), иначе локальный ответ.</li>'+
'</ol>'+
'<p>Обработчик может вернуть строку — её озвучат и покажут.</p>'},
{cat:'API',id:'api-launch',title:'PYOS.launch / theme',html:
'<h2>Запуск приложений и тема</h2>'+
'<pre>PYOS.launch("terminal");\nPYOS.launch("plug-counter");\n\nPYOS.theme.setAccent("green");\nPYOS.theme.setWall("matrix");\nPYOS.theme.setFx(false);</pre>'+
'<p>Id встроенных приложений: <code>terminal</code>, <code>files</code>, <code>editor</code>, <code>calc</code>, <code>notes</code>, <code>settings</code>, <code>about</code>, <code>plugin-studio</code>. Плагины: <code>plug-&lt;id&gt;</code>.</p>'},
{cat:'Примеры',id:'ex1',title:'Пример: Счётчик',html:
'<h2>Пример 1 — Счётчик с состоянием</h2>'+
'<pre>PYOS.plugins.register({\n  id: "counter",\n  name: "Счётчик",\n  icon: "star",\n  width: 380,\n  height: 300,\n  init: function(app){\n    var n = PYOS.store.get("counter.n", 0);\n    app.body.innerHTML =\n      "&lt;div style=\'padding:34px;text-align:center\'&gt;" +\n      "&lt;div id=\'v\' style=\'font-size:56px;font-weight:700\'&gt;" + n + "&lt;/div&gt;" +\n      "&lt;div style=\'display:flex;gap:8px;justify-content:center;margin-top:18px\'&gt;" +\n      "&lt;button class=\'py-btn\' id=\'p\'&gt;+1&lt;/button&gt;" +\n      "&lt;button class=\'py-btn ghost\' id=\'m\'&gt;−1&lt;/button&gt;" +\n      "&lt;button class=\'py-btn ghost\' id=\'r\'&gt;сброс&lt;/button&gt;" +\n      "&lt;/div&gt;&lt;/div&gt;";\n    var v = app.body.querySelector("#v");\n    function set(x){ n = x; v.textContent = n; PYOS.store.set("counter.n", n); }\n    app.body.querySelector("#p").onclick = function(){ set(n + 1); };\n    app.body.querySelector("#m").onclick = function(){ set(n - 1); };\n    app.body.querySelector("#r").onclick = function(){ set(0); };\n  }\n});</pre>'},
{cat:'Примеры',id:'ex2',title:'Пример: Заметки в VFS',html:
'<h2>Пример 2 — Плагин пишет в общую ФС</h2>'+
'<pre>PYOS.plugins.register({\n  id: "quick-notes",\n  name: "Быстрые заметки",\n  icon: "doc",\n  init: function(app){\n    if(!PYOS.vfs.resolve("/Заметки")){ PYOS.vfs.mkdir("/", "Заметки"); }\n    app.body.innerHTML =\n      "&lt;div style=\'padding:20px\'&gt;" +\n      "&lt;input id=\'t\' class=\'py-input\' placeholder=\'Текст заметки\' style=\'margin-bottom:10px\'&gt;" +\n      "&lt;button class=\'py-btn\' id=\'add\'&gt;Сохранить&lt;/button&gt;" +\n      "&lt;div id=\'ls\' style=\'margin-top:14px\'&gt;&lt;/div&gt;&lt;/div&gt;";\n    function draw(){\n      app.body.querySelector("#ls").innerHTML =\n        PYOS.vfs.list("/Заметки").map(function(f){\n          return "&lt;div style=\'padding:8px 12px;border:1px solid var(--line);" +\n            "border-radius:9px;margin-bottom:6px;font-size:13px\'&gt;" +\n            f.content + "&lt;/div&gt;";\n        }).join("") || "&lt;i style=\'color:var(--mut)\'&gt;пусто&lt;/i&gt;";\n    }\n    app.body.querySelector("#add").onclick = function(){\n      var t = app.body.querySelector("#t").value.trim();\n      if(!t){ return; }\n      PYOS.vfs.write("/Заметки", "заметка-" + Date.now() + ".txt", t);\n      app.body.querySelector("#t").value = "";\n      draw();\n      PYOS.notify("Заметки", "Сохранено");\n    };\n    draw();\n  }\n});</pre>'},
{cat:'Примеры',id:'ex3',title:'Пример: Голосовая команда',html:
'<h2>Пример 3 — Плагин + фраза для Jarvis</h2>'+
'<pre>PYOS.plugins.register({\n  id: "coin",\n  name: "Монетка",\n  icon: "play",\n  init: function(app){\n    app.body.innerHTML = "&lt;div style=\'padding:40px;text-align:center\'&gt;" +\n      "&lt;div id=\'r\' style=\'font-size:28px\'&gt;Скажите Jarvis: «подбрось монетку»&lt;/div&gt;&lt;/div&gt;";\n    window.__coinEl = app.body.querySelector("#r");\n  }\n});\n\nPYOS.jarvis.addCommand(/подбрось монетку|монетка/i, function(){\n  var side = Math.random() &lt; 0.5 ? "орёл" : "решка";\n  if(window.__coinEl){ window.__coinEl.textContent = "Выпало: " + side.toUpperCase(); }\n  return "Выпал " + side + ".";\n});</pre>'},
{cat:'Прочее',id:'errors',title:'Ошибки и отладка',html:
'<h2>Ошибки и отладка</h2>'+
'<h3>Где смотреть</h3>'+
'<ul>'+
'<li>Консоль браузера — ошибки плагинов логируются с меткой <code>[PYOS plugin]</code>;</li>'+
'<li>падение при загрузке — системное уведомление, оболочка продолжает работать;</li>'+
'<li>падение внутри <code>init</code> — текст ошибки в окне плагина.</li>'+
'</ul>'+
'<h3>Типовые проблемы</h3>'+
'<table>'+
'<tr><th>Симптом</th><th>Причина</th></tr>'+
'<tr><td>Ярлык не появился</td><td>Нет id или name, либо исключение при выполнении кода.</td></tr>'+
'<tr><td>Пустое окно</td><td><code>init</code> ничего не добавил в <code>app.body</code>.</td></tr>'+
'<tr><td>Пропали данные</td><td>Ключи store без префикса пересеклись с другим плагином.</td></tr>'+
'<tr><td>Иконка-заглушка</td><td>Имя иконки не из системного набора.</td></tr>'+
'</table>'},
{cat:'Прочее',id:'security',title:'Безопасность',html:
'<h2>Модель безопасности</h2>'+
'<ul>'+
'<li>Код плагина выполняется в контексте страницы — это не песочница. Устанавливайте только прочитанный код.</li>'+
'<li>Сетевые запросы плагинов подчиняются обычной политике CORS браузера.</li>'+
'<li>API-ключ Gemini хранится в открытом виде в localStorage — это демо-система, не продакшен.</li>'+
'</ul>'+
'<h3>Что система делает сама</h3>'+
'<ul>'+
'<li>оборачивает загрузку каждого плагина в try/catch;</li>'+
'<li>отключённые плагины не выполняются при старте;</li>'+
'<li>дубликат id заменяет предыдущую версию.</li>'+
'</ul>'}
];

/* ══════════ [JS-R] СТУДИЯ ПЛАГИНОВ ══════════ */
var PLUGIN_TEMPLATE=
'// ─── Новый плагин PyOS ───────────────────────────────\n'+
'// Документация: вкладка «Документация» слева.\n'+
'// «Запустить» — выполнить и создать ярлык в меню Пуск.\n\n'+
'PYOS.plugins.register({\n'+
'  id: "my-plugin",\n'+
'  name: "Мой плагин",\n'+
'  version: "1.0",\n'+
'  icon: "star",\n'+
'  width: 560,\n'+
'  height: 400,\n'+
'  init: function(app){\n'+
'    app.body.innerHTML =\n'+
'      "<div style=\\\'padding:30px;text-align:center\\\'>" +\n'+
'      "<h2>Привет из плагина!</h2>" +\n'+
'      "<p style=\\\'color:var(--mut);margin-top:8px\\\'>" +\n'+
'      "Отредактируйте код и нажмите «Запустить» снова." +\n'+
'      "</p></div>";\n'+
'  }\n'+
'});\n';
registerApp({
  id:'plugin-studio',name:'Студия плагинов',icon:'plug',
  width:980,height:620,single:true,
  launch:function(body){
    body.innerHTML='';
    var app=h('div',{class:'py-app'});
    var tabs=h('div',{class:'py-plug-tabs'});
    var main=h('div',{class:'py-flex1',style:{display:'flex',minHeight:'0'}});
    app.append(tabs,main);
    body.appendChild(app);
    var curTab='docs',docSel=DOCS[0].id;
    function tabBtn(id,label){
      var b=h('div',{class:'py-ptab'+(curTab===id?' on':'')},label);
      b.addEventListener('click',function(){curTab=id;render();});
      return b;
    }
    function render(){
      tabs.innerHTML='';
      tabs.append(tabBtn('docs','Документация'),tabBtn('code','Редактор'),tabBtn('list','Плагины'));
      main.innerHTML='';
      if(curTab==='docs'){renderDocs();}
      if(curTab==='code'){renderCode();}
      if(curTab==='list'){renderList();}
    }
    function renderDocs(){
      var nav=h('div',{class:'py-plug-docs-nav'});
      var pane=h('div',{class:'py-plug-main'});
      main.append(nav,pane);
      var cats=[];
      DOCS.forEach(function(d){if(cats.indexOf(d.cat)<0){cats.push(d.cat);}});
      cats.forEach(function(cat){
        nav.appendChild(h('div',{class:'py-doc-cat'},cat));
        DOCS.filter(function(d){return d.cat===cat;}).forEach(function(d){
          var l=h('div',{class:'py-doc-link'+(d.id===docSel?' on':'')},d.title);
          l.addEventListener('click',function(){
            docSel=d.id;
            $$('.py-doc-link',nav).forEach(function(x){x.classList.remove('on');});
            l.classList.add('on');
            drawDoc(pane,d);
          });
          nav.appendChild(l);
        });
      });
      drawDoc(pane,DOCS.filter(function(d){return d.id===docSel;})[0]||DOCS[0]);
    }
    function drawDoc(pane,d){
      pane.innerHTML='';
      var box=h('div',{class:'py-doc',html:d.html});
      box.style.animation='pyUp .35s ease';
      pane.appendChild(box);
      pane.scrollTop=0;
    }
    function detectId(code){
      var m=code.match(/id\s*:\s*["']([\w-]+)["']/);
      return m?m[1]:null;
    }
    function renderCode(){
      var wrap=h('div',{class:'py-flex1',style:{display:'flex',flexDirection:'column',minWidth:'0'}});
      main.appendChild(wrap);
      var ta=h('textarea',{spellcheck:'false',style:{
        flex:'1',background:'#070b12',border:'none',outline:'none',resize:'none',
        color:'#c8e0ff',fontFamily:'Consolas,monospace',fontSize:'13px',
        lineHeight:'1.6',padding:'16px',whiteSpace:'pre'}});
      ta.value=store.get('plugins.draft',PLUGIN_TEMPLATE);
      ta.addEventListener('input',function(){store.set('plugins.draft',ta.value);});
      var st=h('div',{class:'py-status'});
      function runCode(){
        try{
          var fn=new Function('PYOS','window','document','"use strict";\n'+ta.value+'\n');
          fn(pluginAPI,window,document);
          st.textContent='Выполнено без ошибок.';
          notify('Студия плагинов','Код выполнен. Ярлык обновлён в меню Пуск.','plug');
          var pid=detectId(ta.value);
          if(pid){plugins.setCode(pid,ta.value);}
        }catch(e){
          st.textContent='Ошибка: '+e.message;
          notify('Студия плагинов','Ошибка выполнения: '+e.message,'close');
        }
      }
      wrap.appendChild(h('div',{class:'py-toolbar'},
        h('button',{class:'py-tbtn acc',onclick:runCode},icon('play'),'Запустить'),
        h('button',{class:'py-tbtn',onclick:function(){
          ta.value=PLUGIN_TEMPLATE;store.set('plugins.draft',PLUGIN_TEMPLATE);
        }},icon('refresh'),'Шаблон'),
        h('button',{class:'py-tbtn',onclick:function(){
          var c=vfs.read('/Проекты/my_plugin.js');
          if(c!==null){ta.value=c;}
          else{notify('Студия','Файл /Проекты/my_plugin.js не найден','close');}
        }},icon('files'),'Из файла'),
        h('span',{class:'py-flex1'}),st));
      wrap.appendChild(ta);
      st.append('Черновик сохраняется автоматически');
    }
    function renderList(){
      var wrap=h('div',{class:'py-plug-main'});
      main.appendChild(wrap);
      wrap.appendChild(h('div',{class:'py-doc'},
        h('h2',null,'Установленные плагины'),
        h('p',{class:'lead'},'Включение, запуск и удаление.')));
      var list=plugins.list();
      if(!list.length){
        wrap.appendChild(h('div',{class:'py-note'},
          'Пока пусто. Вкладка «Редактор» → «Запустить» создаст первый плагин.'));
      }
      list.forEach(function(p,i){
        wrap.appendChild(h('div',{class:'py-plug-item',style:{animationDelay:(i*0.05)+'s'}},
          h('div',{class:'pi-ic'},safeIcon(p.icon)),
          h('div',{class:'pi-t'},h('b',null,p.name),
            h('i',null,p.id+' · v'+(p.version||'1.0')+' · автор: '+(p.author||'—'))),
          (function(pp){
            var b1=h('button',{class:'py-tbtn'},icon('play'),'Открыть');
            b1.addEventListener('click',function(){launch('plug-'+pp.id);});
            var b2=h('button',{class:'py-tbtn',style:{color:'var(--err)'}},icon('trash'),'Удалить');
            b2.addEventListener('click',function(){
              if(confirm('Удалить плагин «'+pp.name+'»?')){
                plugins.remove(pp.id);
                render();
                notify('Студия плагинов','Удалён: '+pp.name,'trash');
              }
            });
            var frag=document.createDocumentFragment();
            frag.append(b1,b2);
            return frag;
          })(p)));
      });
    }
    render();
  }
});

/* ══════════ [JS-S] JARVIS ══════════ */
var jarvis={
  rec:null,
  listening:false,
  custom:[],
  enable:function(on){
    store.set('jarvis.on',on);
    if(orb){orb.style.display=on?'grid':'none';}
    if(!on){this.stopListen();closeJarvis();}
    bus.emit('jarvis');
  },
  say:function(text){
    if(!store.get('jarvis.speak',true)||!('speechSynthesis' in window)){return;}
    try{
      speechSynthesis.cancel();
      var u=new SpeechSynthesisUtterance(text);
      u.lang='ru-RU';
      u.rate=store.get('jarvis.rate',1);
      var ru=speechSynthesis.getVoices().filter(function(v){return v.lang.indexOf('ru')===0;})[0];
      if(ru){u.voice=ru;}
      speechSynthesis.speak(u);
    }catch(e){}
  },
  replyLocal:function(text){
    var t=(text||'').toLowerCase().trim(),m;
    for(var i=0;i<this.custom.length;i++){
      var c=this.custom[i];
      if(c.re.test(t)){
        try{
          var r=c.fn(text);
          return typeof r==='string'?r:'Выполняю.';
        }catch(e){return 'Ошибка команды плагина.';}
      }
    }
    if((m=t.match(/открой\s+(.+)/))){
      var target=m[1].trim(),found=null;
      Object.keys(apps).forEach(function(id){
        if(apps[id].name.toLowerCase().indexOf(target)>=0||id.indexOf(target)>=0){found=id;}
      });
      if(found){launch(found);return 'Открываю: '+apps[found].name+'.';}
      return 'Не нашёл приложение «'+target+'».';
    }
    if(/сколько времени|который час|время/.test(t)){
      var d=new Date();
      return 'Сейчас '+fmtTime(d)+', '+fmtDate(d)+'.';
    }
    if((m=t.match(/обои\s+(\w+)/))){
      var w=WALLS.filter(function(x){return x.id===m[1];})[0];
      if(w){theme.setWall(w.id);return 'Обои «'+w.name+'» применены.';}
      return 'Доступны: '+WALLS.map(function(x){return x.name;}).join(', ')+'.';
    }
    if((m=t.match(/(?:тему|цвет|акцент)\s+(\w+)/))){
      var a=ACCENTS.filter(function(x){return x.id===m[1];})[0];
      if(a){theme.setAccent(a.id);return 'Акцент «'+a.name+'» применён.';}
      return 'Доступны: '+ACCENTS.map(function(x){return x.id;}).join(', ')+'.';
    }
    if(/закрой окно|закрыть окно/.test(t)){
      return wm.closeTop()?'Закрыл.':'Окон нет.';
    }
    if(/перезагрузи|перезагрузка/.test(t)){
      setTimeout(systemReboot,800);return 'Перезагружаю систему.';
    }
    if(/выключи|заверши работу/.test(t)){
      setTimeout(powerOff,800);return 'Выключаю.';
    }
    if(/кто ты|что ты такое/.test(t)){
      return 'Я Jarvis — системный ассистент '+SYS.name+'. Управляю окнами, темой, файлами. Подключите Gemini в настройках для свободных диалогов.';
    }
    if(/расскажи о системе|о системе/.test(t)){
      return SYS.name+' '+SYS.version+', кодовое имя '+SYS.codename+'. Ядро '+SYS.kernel+'. Пользователь: '+store.get('user.name','Пользователь')+'.';
    }
    if(/привет|здравствуй|хай/.test(t)){
      return 'Привет, '+store.get('user.name','Пользователь')+'. Чем помочь?';
    }
    if(/помощь|что ты умеешь/.test(t)){
      return 'Умею: открыть приложение, сменить обои и цвет, показать время, закрыть окно, перезагрузить или выключить систему. С ключом Gemini отвечаю на свободные вопросы.';
    }
    return null;
  },
  askGemini:function(text,cb){
    var key=store.get('jarvis.key','');
    if(!key){cb(null);return;}
    var url='https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key='+encodeURIComponent(key);
    var payload={
      contents:[{parts:[{text:text}]}],
      systemInstruction:{parts:[{text:
        'Ты — Jarvis, встроенный голосовой ассистент операционной среды PyOS Studio '+SYS.version+
        '. Отвечай на русском, кратко (до 3 предложений), дружелюбно. Пользователя зовут '+
        store.get('user.name','Пользователь')+'.'}]}};
    fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify(payload)})
    .then(function(r){return r.ok?r.json():null;})
    .then(function(j){
      var out=null;
      try{out=j.candidates[0].content.parts[0].text;}
      catch(e){out=null;}
      cb(out);
    })
    .catch(function(){cb(null);});
  },
  testGemini:function(){
    if(!store.get('jarvis.key','')){notify('Jarvis','Сначала вставьте API-ключ','mic');return;}
    notify('Jarvis','Проверяю соединение с Gemini…','wave');
    this.askGemini('Скажи одно слово: онлайн.',function(ans){
      if(ans){notify('Jarvis','Gemini на связи: '+ans.slice(0,60),'info');}
      else{notify('Jarvis','Не удалось достучаться до Gemini. Проверьте ключ и сеть.','close');}
    });
  },
  process:function(text){
    var self=this;
    if(!text){return;}
    jvUserMsg(text);
    var local=this.replyLocal(text);
    if(local){jvBotMsg(local);this.say(local);return;}
    var pending=jvPending();
    this.askGemini(text,function(ans){
      pending.remove();
      if(ans){jvBotMsg(ans);self.say(ans);}
      else{
        jvBotMsg('Локальный ответ не найден, а ключ Gemini не задан или недоступен. Скажите «помощь» или добавьте ключ в Настройках.');
      }
    });
  },
  startListen:function(){
    var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){
      notify('Jarvis','Браузер не поддерживает распознавание речи. Пишите текстом.','close');
      return;
    }
    var self=this;
    this.stopListen();
    this.rec=new SR();
    this.rec.lang='ru-RU';
    this.rec.interimResults=false;
    this.rec.maxAlternatives=1;
    this.rec.onresult=function(e){
      var text=e.results[0][0].transcript;
      self.listening=false;
      updateMicUI(false);
      self.process(text);
    };
    this.rec.onerror=function(){self.listening=false;updateMicUI(false);};
    this.rec.onend=function(){self.listening=false;updateMicUI(false);};
    try{this.rec.start();this.listening=true;updateMicUI(true);}
    catch(e){}
  },
  stopListen:function(){
    if(this.rec){try{this.rec.stop();}catch(e){}this.rec=null;}
    this.listening=false;
    updateMicUI(false);
  }
};

function bootSequence(fast){
  var stages=['Инициализация ядра…','Загрузка оболочки…','Монтирование VFS…',
    'Подъём оконного менеджера…','Запуск Jarvis…','Применение темы…',

    logo('big'),
    h('div',{class:'name'},'PY',h('span',null,'OS'),' STUDIO'),
    h('div',{class:'loader'},h('i')),
    h('div',{class:'st'},stages[0]));
  root.appendChild(b);
  var stEl=$('.st',b);
  var i=0;
  var dur=fast?260:520;
  var timer=setInterval(function(){
    i++;
    if(i>=stages.length){
      clearInterval(timer);
      setTimeout(function(){
        b.style.transition='opacity .6s ease, transform .6s ease';
        b.style.opacity='0';
        b.style.transform='scale(1.06)';
        setTimeout(function(){b.remove();},620);
      },300);
      return;
    }
    stEl.textContent=stages[i];
  },dur);
}
