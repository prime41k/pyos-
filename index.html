    key.addEventListener('input',function(){state.gkey=key.value.trim();});
    box.append(r1,r2,
      h('div',{class:'py-field',style:{marginTop:'14px'}},
        h('label',null,'API-КЛЮЧ GEMINI (МОЖНО ПОТОМ)'),key));
    box.appendChild(h('div',{class:'py-note'},
      'Без ключа Jarvis выполняет системные команды локально. Ключ бесплатный — Google AI Studio. Хранится только в этом браузере.'));
  });
  step('Приватность','Коротко и честно.',function(box){
    box.appendChild(h('div',{class:'py-toggle'},
      h('div',{class:'tl'},h('b',null,'Телеметрия'),
        h('i',null,'Отключена навсегда. Никаких внешних запросов от оболочки.'))));
    box.appendChild(h('div',{class:'py-toggle'},
      h('div',{class:'tl'},h('b',null,'Хранение данных'),
        h('i',null,'Настройки, файлы и плагины живут в localStorage этого браузера.'))));
    box.appendChild(h('div',{class:'py-note'},
      'Сетевые запросы делает только Jarvis и только на адрес Gemini, если указан ключ.'));
  });
  step('Установка','Применяем конфигурацию…',function(){},true);
  function drawStep(){
    body.innerHTML='';
    var s=steps[idx];
    $('.step',top).textContent='Шаг '+(idx+1)+' из '+steps.length;
    $('.py-oobe-prog i',card).style.width=(((idx+1)/steps.length)*100)+'%';
    backBtn.style.visibility=idx===0?'hidden':'visible';
    if(s.isLast){
      foot.classList.add('py-hidden');
      runInstall();
      return;
    }
    foot.classList.remove('py-hidden');
    nextBtn.textContent='Далее';
    hint.textContent='Шаг '+(idx+1)+' · '+s.title;
    var wrap=h('div',{class:'py-oobe-step'+(back?' back':'')});
    wrap.append(h('h1',null,s.title),h('div',{class:'sub'},s.sub));
    s.build(wrap);
    body.appendChild(wrap);
    back=false;
  }
  backBtn.addEventListener('click',function(){
    if(idx===0){return;}
    idx--;back=true;drawStep();
  });
  nextBtn.addEventListener('click',function(){
    if(idx<steps.length-1){idx++;drawStep();}
  });
  function runInstall(){
    var stages=['Создание профиля…','Применение темы…','Раскладка обоев…',
      'Калибровка Jarvis…','Форматирование VFS…','Регистрация приложений…','Финальные штрихи…'];
    var inst=h('div',{class:'py-install'});
    inst.appendChild(logo());
    inst.appendChild(h('h2',null,'Устанавливаем '+SYS.name));
    var st=h('div',{class:'stage'},stages[0]);
    var bar=h('div',{class:'bar'},h('i'));
    var pct=h('div',{class:'pct'},'0%');
    inst.append(st,bar,pct);
    body.appendChild(inst);
    var i=0,p=0;
    var timer=setInterval(function(){
      i=(i+1)%stages.length;
      st.textContent=stages[i];
      p=clamp(p+Math.floor(Math.random()*9)+5,0,100);
      $('.bar i',inst).style.width=p+'%';
      pct.textContent=p+'%';
      if(p>=100){
        clearInterval(timer);
        st.textContent='Готово.';
        setTimeout(finishOOBE,700);
      }
    },420);
  }
  function finishOOBE(){
    store.set('user.name',state.name.trim()||'Пользователь');
    store.set('user.avatar',state.avatar);
    store.set('accent',state.accent);
    store.set('wall',state.wall);
    store.set('fx',state.fx);
    store.set('jarvis.on',state.jarvisOn);
    store.set('jarvis.speak',state.speak);
    store.set('jarvis.key',state.gkey);
    store.set('oobe.done',true);
    oobe.style.transition='opacity .6s ease, transform .6s ease';
    oobe.style.opacity='0';
    oobe.style.transform='scale(1.04)';
    setTimeout(function(){
      oobe.remove();
      theme.apply();
      enterDesktop(true);
    },640);
  }
  drawStep();
}

/* ══════════ [JS-X] ВХОД НА РАБОЧИЙ СТОЛ ══════════ */
function enterDesktop(firstRun){
  bootTime=Date.now();
  theme.apply();
  renderDesktopIcons();
  bus.emit('wm');
  if(orb){orb.remove();}
  orb=h('div',{class:'py-orb',title:'Jarvis'});
  orb.append(h('span',{class:'ring'}),icon('mic'));
  orb.addEventListener('click',function(){
    if(jvPanel){closeJarvis();}else{openJarvis();}
  });
  orb.style.display=store.get('jarvis.on',true)?'grid':'none';
  root.appendChild(orb);
  jdot.classList.toggle('live',!!store.get('jarvis.on',true));
  if(firstRun){
    setTimeout(function(){
      notify(SYS.name,'Добро пожаловать, '+store.get('user.name','Пользователь')+'! Система готова.','star');
    },900);
    setTimeout(function(){
      notify('Jarvis','Орб в правом углу — кликните и скажите «помощь».','mic');
    },3400);
  }
}

/* ══════════ [JS-Y] ИНИЦИАЛИЗАЦИЯ ══════════ */
plugins.loadAll();
theme.apply();
vfs.load();
if(!store.get('oobe.done',false)){
  runOOBE();
}else{
  bootSequence(false);
  enterDesktop(false);
}
if('speechSynthesis' in window){
  try{speechSynthesis.getVoices();}catch(e){}
  speechSynthesis.onvoiceschanged=function(){
    try{speechSynthesis.getVoices();}catch(e){}
  };
}
root.addEventListener('contextmenu',function(e){
  if(e.target.closest('.py-term,textarea,input')){return;}
  if(!e.defaultPrevented&&!e.target.closest('.py-desktop')){e.preventDefault();}
});
/* публичный API для плагинов и консоли */
window.PYOS={
  version:SYS.version,
  store:store,notify:notify,launch:launch,theme:theme,vfs:vfs,bus:bus,
  jarvis:{
    addCommand:function(re,fn){jarvis.custom.push({re:re,fn:fn});},
    say:function(t){jarvis.say(t);}
  },
  plugins:{register:pluginAPI.plugins.register}
};
})();
</script>
