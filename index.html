          '<div style="display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin-top:6px">' +
            ['Объясни активный файл', 'Найди ошибки в коде', 'Напиши тесты для main.py', 'Оптимизируй этот алгоритм']
              .map(function (suggestion) { return '<button type="button" class="pyos-chip pyos-chip--button" data-suggestion="' + Util.escapeAttribute(suggestion) + '">' + suggestion + '</button>'; }).join('') +
          '</div></div>';

        messagesElement.querySelectorAll('[data-suggestion]').forEach(function (button) {
          button.addEventListener('click', function () { promptElement.value = button.dataset.suggestion; send(); });
        });
        tokenInfo.textContent = 'Токены: —';
        return;
      }

      chat.messages.forEach(function (message, index) {
        const element = document.createElement('div');
        element.className = 'pyos-gemini__message pyos-gemini__message--' + message.role;
        element.style.animationDelay = Math.min(index * 22, 220) + 'ms';

        const rendered = message.role === 'model' ? renderMarkdown(message.text) : { html: '<p>' + Util.escapeHtml(message.text).replace(/\n/g, '<br>') + '</p>', blocks: [] };

        element.innerHTML =
          '<div class="pyos-gemini__avatar">' + Icons.get(message.role === 'user' ? 'user' : 'robot', 18) + '</div>' +
          '<div style="flex:1;min-width:0">' +
            '<div class="pyos-gemini__bubble">' + rendered.html + '</div>' +
            (message.error ? '<div class="pyos-gemini__message-actions"><span class="pyos-chip" style="color:var(--pyos-danger)">' + Icons.get('error', 13) + Util.escapeHtml(message.error) + '</span></div>' : '') +
            (message.role === 'model' && !message.error ? '<div class="pyos-gemini__message-actions">' +
              '<button type="button" class="pyos-chip pyos-chip--button" data-copy>' + Icons.get('copy', 13) + 'Копировать</button>' +
              '<button type="button" class="pyos-chip pyos-chip--button" data-regenerate>' + Icons.get('refresh', 13) + 'Перегенерировать</button>' +
              (message.tokens ? '<span class="pyos-chip">' + Icons.get('bolt', 13) + message.tokens + ' токенов</span>' : '') +
            '</div>' : '') +
          '</div>';

        const copyButton = element.querySelector('[data-copy]');
        if (copyButton) copyButton.addEventListener('click', function () { Util.copyText(message.text).then(function () { Notifications.success('Ответ скопирован'); }); });

        const regenerateButton = element.querySelector('[data-regenerate]');
        if (regenerateButton) regenerateButton.addEventListener('click', function () {
          chat.messages = chat.messages.slice(0, index);
          persist();
          renderMessages();
          send(true);
        });

        element.querySelectorAll('[data-copy-code]').forEach(function (button, blockIndex) {
          button.addEventListener('click', function () {
            const block = rendered.blocks[blockIndex];
            if (block) Util.copyText(block.code).then(function () { Notifications.success('Код скопирован'); });
          });
        });

        element.querySelectorAll('[data-open-code]').forEach(function (button, blockIndex) {
          button.addEventListener('click', async function () {
            const block = rendered.blocks[blockIndex];
            if (!block) return;
            const extension = { python: 'py', javascript: 'js', html: 'html', css: 'css', json: 'json' }[block.language] || 'py';
            const path = FileSystem.joinPath('/generated', 'gemini-' + Date.now() + '.' + extension);
            FileSystem.write(path, block.code);
            WindowManager.openApp('editor', { openPath: path });
            Bus.emit('files:open', { path: path });
            Notifications.success('Код сохранён в проект', path);
          });
        });

        messagesElement.appendChild(element);
      });

      const lastModel = chat.messages.filter(function (m) { return m.role === 'model' && m.tokens; }).pop();
      tokenInfo.textContent = 'Токены: ' + (lastModel ? lastModel.tokens : '—');
      messagesElement.scrollTop = messagesElement.scrollHeight;
    }

    function appendTyping() {
      const element = document.createElement('div');
      element.className = 'pyos-gemini__message pyos-gemini__message--model';
      element.dataset.typing = '1';
      element.innerHTML =
        '<div class="pyos-gemini__avatar">' + Icons.get('robot', 18) + '</div>' +
        '<div class="pyos-gemini__bubble"><div class="pyos-gemini__typing"><span></span><span></span><span></span></div></div>';
      messagesElement.appendChild(element);
      messagesElement.scrollTop = messagesElement.scrollHeight;
      return element;
    }

    async function send(isRegenerate) {
      const text = promptElement.value.trim();
      if (!text && !isRegenerate) { Notifications.warning('Введите сообщение', 'Поле запроса пустое'); return; }

      const apiKey = (Config.get('gemini.apiKey') || '').trim();
      if (!apiKey) {
        Notifications.error('Ключ Gemini не задан', 'Откройте настройки и укажите API-ключ', { actionLabel: 'Открыть настройки', onAction: function () { WindowManager.openApp('settings'); Bus.emit('settings:section', 'gemini'); } });
        return;
      }

      const chat = activeChat();
      if (text) chat.messages.push({ role: 'user', text: text, time: Date.now() });
      if (chat.messages.length === 1 || chat.title === 'Новый диалог') {
        chat.title = (text || chat.messages[0].text || 'Диалог').slice(0, 42);
      }
      promptElement.value = '';
      promptElement.style.height = 'auto';
      persist();
      renderChats();
      renderMessages();

      const typing = appendTyping();
      sendButton.classList.add('pyos-hidden');
      stopButton.classList.remove('pyos-hidden');

      controller = new AbortController();

      const contents = [{ role: 'user', parts: [{ text: Config.get('gemini.systemPrompt') || '' }] },
                        { role: 'model', parts: [{ text: 'Понял. Буду отвечать подробно, на русском, с примерами кода.' }] }];

      chat.messages.forEach(function (message) {
        contents.push({ role: message.role === 'user' ? 'user' : 'model', parts: [{ text: message.text }] });
      });

      const url = 'https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(modelSelect.value) + ':generateContent?key=' + encodeURIComponent(apiKey);

      try {
        const response = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: contents,
            generationConfig: {
              temperature: Number(Config.get('gemini.temperature')),
              maxOutputTokens: Number(Config.get('gemini.maxTokens'))
            }
          }),
          signal: controller.signal
        });

        const data = await response.json();
        typing.remove();

        if (!response.ok) {
          const message = (data && data.error && data.error.message) || ('Ошибка HTTP ' + response.status);
          chat.messages.push({ role: 'model', text: '', error: message, time: Date.now() });
          persist();
          renderMessages();
          Notifications.error('Gemini вернул ошибку', message);
          return;
        }

        const answer = data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts
          ? data.candidates[0].content.parts.map(function (part) { return part.text || ''; }).join('\n')
          : '(пустой ответ модели)';

        const tokens = data.usageMetadata ? data.usageMetadata.totalTokenCount : null;
        chat.messages.push({ role: 'model', text: answer, tokens: tokens, time: Date.now() });
        persist();
        renderMessages();
        Bus.emit('gemini:answer', { chat: chat.id, tokens: tokens });
      } catch (error) {
        typing.remove();
        const aborted = error && error.name === 'AbortError';
        chat.messages.push({ role: 'model', text: '', error: aborted ? 'Генерация остановлена пользователем' : ('Сеть недоступна: ' + error.message), time: Date.now() });
        persist();
        renderMessages();
        if (!aborted) Notifications.error('Запрос не выполнен', 'Проверьте ключ и доступ к сети');
      } finally {
        controller = null;
        sendButton.classList.remove('pyos-hidden');
        stopButton.classList.add('pyos-hidden');
      }
    }

    sendButton.addEventListener('click', function () { send(false); });
    stopButton.addEventListener('click', function () { if (controller) controller.abort(); });

    promptElement.addEventListener('keydown', function (event) {
      if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); send(false); }
    });
    promptElement.addEventListener('input', function () {
      promptElement.style.height = 'auto';
      promptElement.style.height = Math.min(promptElement.scrollHeight, 170) + 'px';
    });

    container.querySelector('[data-new-chat]').addEventListener('click', function () {
      const chat = { id: Util.uniqueId('chat'), title: 'Новый диалог', created: Date.now(), messages: [] };
      chats.unshift(chat);
      activeChatId = chat.id;
      persist();
      renderChats();
      renderMessages();
      promptElement.focus();
    });

    container.querySelector('[data-clear-chat]').addEventListener('click', async function () {
      const confirmed = await UI.confirmDialog('Очистить диалог?', 'Все сообщения текущего диалога будут удалены.', 'Очистить', true);
      if (!confirmed) return;
      activeChat().messages = [];
      persist();
      renderMessages();
    });

    container.querySelector('[data-export-chat]').addEventListener('click', function () {
      const chat = activeChat();
      const markdown = '# ' + chat.title + '\n\n' + chat.messages.map(function (message) {
        return '## ' + (message.role === 'user' ? 'Пользователь' : 'Gemini') + '\n\n' + message.text + (message.error ? '\n\n> Ошибка: ' + message.error : '');
      }).join('\n\n');
      Util.downloadText(chat.title.replace(/[^\wа-яА-ЯёЁ -]/g, '') + '.md', markdown, 'text/markdown;charset=utf-8');
    });

    container.querySelector('[data-export-chats]').addEventListener('click', function () {
      Util.downloadText('pyos-gemini-chats.json', JSON.stringify(chats, null, 2), 'application/json');
    });

    container.querySelector('[data-api-key]').addEventListener('click', async function () {
      const wrapper = document.createElement('div');
      wrapper.innerHTML =
        '<p style="margin:0 0 10px">Ключ хранится только в этом браузере и отправляется исключительно на generativelanguage.googleapis.com.</p>' +
        '<input class="pyos-field" type="password" placeholder="AIza…" value="' + Util.escapeAttribute(Config.get('gemini.apiKey') || '') + '">';
      const input = wrapper.querySelector('input');

      const result = await UI.modal({
        title: 'Ключ Gemini API',
        subtitle: 'Получить ключ можно в Google AI Studio',
        icon: 'key',
        body: wrapper,
        actions: [
          { label: 'Отмена', value: null },
          { label: 'Сохранить', variant: 'filled', value: function (dialog) { return dialog.querySelector('input').value.trim(); } }
        ]
      });

      if (result !== null) {
        Config.set('gemini.apiKey', result);
        updateApiStatus();
        Notifications.success(result ? 'Ключ сохранён' : 'Ключ удалён');
      }
    });

    modelSelect.addEventListener('change', function () {
      Config.set('gemini.model', modelSelect.value);
      updateApiStatus();
    });

    container.querySelector('[data-attach-code]').addEventListener('click', function () {
      const recent = Store.getString('editor:recent', '');
      if (!recent || !FileSystem.exists(recent)) { Notifications.warning('Нет активного файла', 'Откройте файл в редакторе'); return; }
      const content = FileSystem.read(recent) || '';
      promptElement.value += (promptElement.value ? '\n\n' : '') + 'Файл ' + recent + ':\n```\n' + content.slice(0, 12000) + '\n```';
      promptElement.dispatchEvent(new Event('input'));
      Notifications.info('Файл добавлен в запрос', recent);
    });

    const offPrompt = Bus.on('gemini:prompt', function (text) {
      promptElement.value = text;
      promptElement.dispatchEvent(new Event('input'));
      promptElement.focus();
    });

    renderChats();
    renderMessages();
    updateApiStatus();

    return { unmount: function () { offPrompt(); persist(); } };
  }
});

/* ─────────────────────────────────────────────────────────────────────────
   МОДУЛЬ 21. ПРИЛОЖЕНИЕ «PYTHON» (исполнитель Pyodide)
   ───────────────────────────────────────────────────────────────────────── */
Apps.register({
  id: 'python',
  name: 'Python',
  description: 'Выполнение кода в браузере через Pyodide',
  icon: 'python',
  color: '#22c55e',
  defaultWidth: 880,
  defaultHeight: 620,
  minWidth: 420,
  minHeight: 320,
  mount: function (container, api) {

    const PYODIDE_URL = 'https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js';
    let pyodide = null;
    let loading = false;
    let running = false;

    container.innerHTML =
      '<div class="pyos-python">' +
        '<div class="pyos-python__toolbar">' +
          '<button type="button" class="pyos-button pyos-button--small pyos-button--filled" data-load>' + Icons.get('download', 15) + 'Загрузить Python</button>' +
          '<button type="button" class="pyos-button pyos-button--small pyos-button--tonal" data-run disabled>' + Icons.get('play', 15) + 'Выполнить</button>' +
          '<button type="button" class="pyos-button pyos-button--small" data-take>' + Icons.get('code', 15) + 'Взять файл из редактора</button>' +
          '<button type="button" class="pyos-button pyos-button--small" data-install>' + Icons.get('plus', 15) + 'Установить пакет</button>' +
          '<button type="button" class="pyos-button pyos-button--small pyos-button--icon" data-clear data-tooltip="Очистить вывод">' + Icons.get('trash', 15) + '</button>' +
          '<span style="flex:1"></span>' +
          '<span class="pyos-chip" data-status>Среда не загружена</span>' +
        '</div>' +
        '<div class="pyos-progress" data-progress style="border-radius:0"><div class="pyos-progress__bar"></div></div>' +
        '<div class="pyos-python__split">' +
          '<textarea class="pyos-python__code" data-code spellcheck="false" placeholder="# Код Python"></textarea>' +
          '<pre class="pyos-python__output" data-output>Вывод программы появится здесь.</pre>' +
          '<div class="pyos-python__variables" data-variables></div>' +
        '</div>' +
      '</div>';

    const codeArea = container.querySelector('[data-code]');
    const output = container.querySelector('[data-output]');
    const statusChip = container.querySelector('[data-status]');
    const progressBar = container.querySelector('[data-progress] .pyos-progress__bar');
    const variablesPanel = container.querySelector('[data-variables]');
    const loadButton = container.querySelector('[data-load]');
    const runButton = container.querySelector('[data-run]');

    codeArea.value = Store.getString('python:code', FileSystem.read('/main.py') || 'print("Привет из PyOS Studio")\n');

    codeArea.addEventListener('input', Util.debounce(function () {
      Store.setString('python:code', codeArea.value);
    }, 500));

    function setStatus(text, kind) {
      statusChip.textContent = text;
      statusChip.style.color = kind === 'ok' ? 'var(--pyos-success)' : kind === 'error' ? 'var(--pyos-danger)' : '';
    }

    function print(text, kind) {
      const span = document.createElement('span');
      span.style.color = kind === 'error' ? 'var(--pyos-danger)' : kind === 'info' ? 'var(--pyos-info)' : 'var(--pyos-text-dim)';
      span.textContent = text + '\n';
      output.appendChild(span);
      output.scrollTop = output.scrollHeight;
    }

    function loadScript(url) {
      return new Promise(function (resolve, reject) {
        const script = document.createElement('script');
        script.src = url;
        script.async = true;
        script.onload = resolve;
        script.onerror = function () { reject(new Error('Не удалось загрузить ' + url)); };
        document.head.appendChild(script);
      });
    }

    async function loadRuntime() {
      if (loading || pyodide) return;
      loading = true;
      loadButton.disabled = true;
      setStatus('Загрузка среды Python…');
      progressBar.style.width = '15%';

      try {
        await loadScript(PYODIDE_URL);
        progressBar.style.width = '45%';
        print('Загрузчик Pyodide получен, инициализация ядра…', 'info');

        pyodide = await window.loadPyodide({ indexURL: 'https://cdn.jsdelivr.net/pyodide/v0.26.2/full/' });
        progressBar.style.width = '100%';

        pyodide.setStdout({ batched: function (message) { print(String(message)); } });
        pyodide.setStderr({ batched: function (message) { print(String(message), 'error'); } });

        runButton.disabled = false;
        setStatus('Python ' + pyodide.runPython('import sys; sys.version.split()[0]'), 'ok');
        Notifications.success('Среда Python готова', 'Можно выполнять код прямо в браузере');
        setTimeout(function () { progressBar.style.width = '0%'; }, 900);
      } catch (error) {
        pyodide = null;
        setStatus('Ошибка загрузки', 'error');
        print('Не удалось загрузить Pyodide: ' + error.message, 'error');
        print('Проверьте подключение к сети — среда загружается из CDN.', 'error');
        Notifications.error('Среда Python недоступна', error.message);
        loadButton.disabled = false;
        progressBar.style.width = '0%';
      } finally {
        loading = false;
      }
    }

    async function runCode() {
      if (!pyodide) { await loadRuntime(); if (!pyodide) return; }
      if (running) return;

      running = true;
      runButton.disabled = true;
      output.innerHTML = '';
      setStatus('Выполнение…');
      const started = performance.now();

      try {
        const result = await pyodide.runPythonAsync(codeArea.value);
        if (result !== undefined && result !== null) print('→ ' + String(result), 'info');
        const elapsed = Math.round(performance.now() - started);
        setStatus('Готово за ' + elapsed + ' мс', 'ok');
        inspectVariables();
      } catch (error) {
        print(String(error && error.message ? error.message : error), 'error');
        setStatus('Ошибка выполнения', 'error');
      } finally {
        running = false;
        runButton.disabled = false;
      }
    }

    function inspectVariables() {
      if (!pyodide) return;
      try {
        const raw = pyodide.runPython(
          'import json\n' +
          '_skip = {"__name__","__doc__","__package__","__loader__","__spec__","__builtins__","_skip","json"}\n' +
          'json.dumps({k: [type(v).__name__, repr(v)[:80]] for k, v in list(globals().items()) if not k.startswith("_") and k not in _skip})'
        );
        const data = JSON.parse(String(raw));
        const keys = Object.keys(data);
        if (!keys.length) { variablesPanel.innerHTML = '<div class="pyos-muted" style="font-size:12px">Глобальные переменные не найдены</div>'; return; }
        variablesPanel.innerHTML = keys.slice(0, 60).map(function (key) {
          return '<div class="pyos-python__variable"><span class="pyos-python__variable-name">' + Util.escapeHtml(key) + '</span><span class="pyos-python__variable-type">' + Util.escapeHtml(data[key][0]) + '</span><span class="pyos-python__variable-value">' + Util.escapeHtml(data[key][1]) + '</span></div>';
        }).join('');
      } catch (error) {
        variablesPanel.innerHTML = '<div class="pyos-muted" style="font-size:12px">Не удалось прочитать переменные</div>';
      }
    }

    loadButton.addEventListener('click', loadRuntime);
    runButton.addEventListener('click', runCode);

    container.querySelector('[data-take]').addEventListener('click', function () {
      const recent = Store.getString('editor:recent', '');
      const path = recent && FileSystem.exists(recent) ? recent : '/main.py';
      const content = FileSystem.read(path);
      if (content === null) { Notifications.warning('Файл не найден', path); return; }
      codeArea.value = content;
      Store.setString('python:code', content);
      setStatus('Загружен файл ' + path);
      print('Код взят из ' + path, 'info');
    });

    container.querySelector('[data-install]').addEventListener('click', async function () {
      const name = await UI.promptDialog('Установка пакета', 'Название пакета для micropip, например requests', 'requests');
      if (!name) return;
      if (!pyodide) { await loadRuntime(); if (!pyodide) return; }
      setStatus('Установка ' + name + '…');
      print('Установка пакета ' + name + '…', 'info');
      try {
        await pyodide.loadPackage('micropip');
        await pyodide.runPythonAsync('import micropip\nawait micropip.install("' + name.replace(/"/g, '') + '")');
        setStatus('Пакет установлен: ' + name, 'ok');
        print('Пакет ' + name + ' установлен', 'info');
        Notifications.success('Пакет установлен', name);
      } catch (error) {
        setStatus('Ошибка установки', 'error');
        print('Не удалось установить ' + name + ': ' + error.message, 'error');
        Notifications.error('Установка не удалась', error.message);
      }
    });

    container.querySelector('[data-clear]').addEventListener('click', function () { output.innerHTML = ''; });

    codeArea.addEventListener('keydown', function (event) {
      if (event.key === 'Tab') {
        event.preventDefault();
        const start = codeArea.selectionStart;
        const end = codeArea.selectionEnd;
        codeArea.value = codeArea.value.slice(0, start) + '    ' + codeArea.value.slice(end);
        codeArea.selectionStart = codeArea.selectionEnd = start + 4;
      }
    });

    const offRun = Bus.on('python:run', function (payload) {
      if (payload.code) {
        codeArea.value = payload.code;
        Store.setString('python:code', payload.code);
      }
      print('Получен код' + (payload.path ? ' из ' + payload.path : '') + ', запуск…', 'info');
      runCode();
    });

    if (Config.get('python.autoLoadRuntime')) setTimeout(loadRuntime, 400);

    return { unmount: function () { offRun(); Store.setString('python:code', codeArea.value); } };
  }
});

/* ─────────────────────────────────────────────────────────────────────────
   МОДУЛЬ 22. ПРИЛОЖЕНИЕ «ПРЕДПРОСМОТР»

Apps.register({
  id: 'preview',
  name: 'Предпросмотр',

  icon: 'eye',
  color: '#fb7185',

  mount: function (container, api) {

        '<div class="pyos-preview__toolbar">' +
          '<select class="pyos-field" data-file style="height:32px;width:auto;min-width:190px"></select>' +
          '<button type="button" class="pyos-button pyos-button--small pyos-button--icon" data-refresh data-tooltip="Обновить">' + Icons.get('refresh', 15) + '</button>' +
          '<span class="pyos-divider--vertical"></span>' +
          '<button type="button" class="pyos-button pyos-button--small" data-device="mobile">' + Icons.get('phone', 15) + 'Телефон</button>' +

          '<button type="button" class="pyos-button pyos-button--small pyos-button--tonal" data-device="desktop">' + Icons.get('monitor', 15) + 'Компьютер</button>' +
          '<span class="pyos-divider--vertical"></span>' +
          '<button type="button" class="pyos-button pyos-button--small pyos-button--icon" data-zoom-out data-tooltip="Уменьшить">−</button>' +
          '<span class="pyos-chip" data-zoom-value>100%</span>' +
          '<button type="button" class="pyos-button pyos-button--small pyos-button--icon" data-zoom-in data-tooltip="Увеличить">+</button>' +
          '<span style="flex:1"></span>' +
          '<button type="button" class="pyos-button pyos-button--small" data-open-tab>' + Icons.get('upload', 15) + 'Открыть отдельно</button>' +
        '</div>' +
        '<div class="pyos-preview__stage" data-stage>' +
          '<div class="pyos-preview__frame-wrapper" data-wrapper>' +
            '<iframe class="pyos-preview__frame" data-frame sandbox="allow-scripts allow-modals allow-forms allow-popups" title="Предпросмотр"></iframe>' +
          '</div>' +
        '</div>' +
      '</div>';

    const select = container.querySelector('[data-file]');
    const frame = container.querySelector('[data-frame]');
    const wrapper = container.querySelector('[data-wrapper]');
    const zoomValue = container.querySelector('[data-zoom-value]');

    function renderFileOptions() {
      const list = FileSystem.files('name').filter(function (file) { return /\.(html?|svg)$/i.test(file.path); });
      select.innerHTML = list.length
        ? list.map(function (file) { return '<option value="' + Util.escapeAttribute(file.path) + '"' + (file.path === currentPath ? ' selected' : '') + '>' + Util.escapeHtml(file.path) + '</option>'; }).join('')
        : '<option value="">HTML-файлы не найдены</option>';
      if (list.length && !list.some(function (file) { return file.path === currentPath; })) currentPath = list[0].path;
    }

    function render() {
      applyDevice();
      zoomValue.textContent = Math.round(zoom * 100) + '%';
      wrapper.style.transform = 'scale(' + zoom + ')';
      wrapper.style.transformOrigin = 'top center';

      if (!currentPath) {
        frame.removeAttribute('srcdoc');
        return;
      }

      const content = FileSystem.read(currentPath) || '';
      frame.srcdoc = content;
      api.setBadge(FileSystem.baseName(currentPath));
    }

    function applyDevice() {
      const widths = { mobile: 390, tablet: 820, desktop: null };
      const width = widths[device];
      container.querySelectorAll('[data-device]').forEach(function (button) {
        button.classList.toggle('pyos-button--tonal', button.dataset.device === device);
      });
      if (width) { wrapper.style.width = width + 'px'; wrapper.style.maxWidth = '100%'; }
      else { wrapper.style.width = '100%'; wrapper.style.maxWidth = '100%'; }
    }

    select.addEventListener('change', function () { currentPath = select.value || null; render(); });
    container.querySelector('[data-refresh]').addEventListener('click', render);

    container.querySelectorAll('[data-device]').forEach(function (button) {
      button.addEventListener('click', function () { device = button.dataset.device; render(); });
    });

    container.querySelector('[data-zoom-in]').addEventListener('click', function () { zoom = Util.clamp(zoom + 0.1, 0.4, 2); render(); });
    container.querySelector('[data-zoom-out]').addEventListener('click', function () { zoom = Util.clamp(zoom - 0.1, 0.4, 2); render(); });

    container.querySelector('[data-open-tab]').addEventListener('click', function () {
      if (!currentPath) return;
      const blob = new Blob([FileSystem.read(currentPath) || ''], { type: 'text/html' });
      const url = URL.createObjectURL(blob);
      window.open(url, '_blank', 'noopener');
      setTimeout(function () { URL.revokeObjectURL(url); }, 20000);
    });

    const offOpen = Bus.on('preview:open', function (path) {
      if (!/\.(html?|svg)$/i.test(path)) { Notifications.warning('Предпросмотр поддерживает HTML и SVG', path); return; }
      currentPath = path;
      renderFileOptions();
      render();
    });

    const offChanged = Bus.on('filesystem:changed', Util.debounce(function () { renderFileOptions(); render(); }, 400));

    renderFileOptions();
    render();

    return { unmount: function () { offOpen(); offChanged(); } };
  }
});

        '<div class="pyos-settings__content" data-content></div>' +
      '</div>';

    const nav = container.querySelector('[data-nav]');
    const content = container.querySelector('[data-content]');

    function row(options) {
      const element = document.createElement('div');
      element.className = 'pyos-settings__row';
      element.innerHTML =
        '<div class="pyos-settings__row-info">' +
          '<div class="pyos-settings__row-title">' + Util.escapeHtml(options.title) + '</div>' +
          (options.description ? '<div class="pyos-settings__row-desc">' + Util.escapeHtml(options.description) + '</div>' : '') +

      const control = element.querySelector('[data-control]');
      if (options.control instanceof Node) control.appendChild(options.control);
      return element;

    function switchControl(value, onChange) {
      const label = document.createElement('label');
      label.className = 'pyos-switch';
      label.innerHTML = '<input type="checkbox"' + (value ? ' checked' : '') + '><span class="pyos-switch__track"><span class="pyos-switch__thumb"></span></span>';
      label.querySelector('input').addEventListener('change', function (event) { onChange(event.target.checked); });
      return label;
    }

    function sliderControl(value, min, max, step, onChange, formatter) {
      const wrapper = document.createElement('div');
      wrapper.style.cssText = 'display:flex;align-items:center;gap:10px;min-width:210px';
      const input = document.createElement('input');
      input.type = 'range';
      input.className = 'pyos-slider';
      input.min = min; input.max = max; input.step = step; input.value = value;
      const chip = document.createElement('span');
      chip.className = 'pyos-chip';
      chip.style.minWidth = '62px';
      chip.style.justifyContent = 'center';
      chip.textContent = formatter ? formatter(value) : value;

      input.addEventListener('input', function () {
        const next = Number(input.value);
        chip.textContent = formatter ? formatter(next) : next;
        onChange(next);
      });

      wrapper.appendChild(input);
      wrapper.appendChild(chip);
      return wrapper;
    }

    function selectControl(value, options, onChange) {
      const select = document.createElement('select');
      select.className = 'pyos-field';
      select.style.minWidth = '170px';
      options.forEach(function (option) {
        const element = document.createElement('option');
        element.value = option.value;
        element.textContent = option.label;
        if (option.value === value) element.selected = true;
        select.appendChild(element);
      });
      select.addEventListener('change', function () { onChange(select.value); });
      return select;
    }

    function buttonControl(label, icon, onClick, variant) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'pyos-button pyos-button--small' + (variant ? ' pyos-button--' + variant : '');
      button.innerHTML = (icon ? Icons.get(icon, 15) : '') + Util.escapeHtml(label);

      const element = document.createElement('section');

    }

        systemPrompt.addEventListener('change', function () { Config.set('gemini.systemPrompt', systemPrompt.value); });
        geminiCard.appendChild(row({ title: 'Системная инструкция', description: 'Задаёт роль и стиль ответов модели', control: systemPrompt }));

        geminiSection.appendChild(geminiCard);
        content.appendChild(geminiSection);
      }

      if (activeSection === 'python') {
        const pythonSection = section('Python', 'Исполнитель Pyodide работает полностью в браузере.');
        const pythonCard = card();
        pythonCard.appendChild(row({ title: 'Загружать среду автоматически', description: 'Pyodide весит около 10 МБ и загружается из CDN', control: switchControl(config.python.autoLoadRuntime, function (value) { Config.set('python.autoLoadRuntime', value); }) }));
        pythonCard.appendChild(row({
          title: 'Состояние исполнителя', description: 'Среда загружается по кнопке в окне Python',
          control: buttonControl('Открыть окно Python', 'python', function () { WindowManager.openApp('python'); })
        }));

/* ─────────────────────────────────────────────────────────────────────────
   МОДУЛЬ 25. ЗАГРУЗКА СИСТЕМЫ
   ───────────────────────────────────────────────────────────────────────── */
const Boot = (function () {
  const bootElement = document.getElementById('pyos-boot');
  const bar = document.getElementById('pyos-boot-bar');
  const status = document.getElementById('pyos-boot-status');

  const STEPS = [
    { label: 'Проверка хранилища и конфигурации', work: function () { Config.apply(); } },
    { label: 'Инициализация файловой системы', work: function () { FileSystem.stats(); } },
    { label: 'Регистрация приложений', work: function () { Dock.build(); } },
    { label: 'Сборка панели задач и рабочих столов', work: function () { Topbar.init(); initDesktopMenu(); } },
    { label: 'Подготовка оконного менеджера', work: function () { WindowManager.measureWorkArea(); } },
    { label: 'Оформление рабочего стола', work: function () { Wallpaper.setParticles(Config.get('particles')); } },
    { label: 'Восстановление прошлой сессии', work: function () { WindowManager.restoreSession(); } }
  ];

  function finish() {
    bootElement.classList.add('is-finished');
    setTimeout(function () { bootElement.remove(); }, 600);
  }

  function run() {
    if (!Config.get('bootAnimation')) {
      STEPS.forEach(function (step) { try { step.work(); } catch (error) { console.error('[PyOS] Ошибка шага загрузки', error); } });
      finish();
      afterBoot();
      return;
    }

    let index = 0;

    function next() {
      if (index >= STEPS.length) {
        bar.style.width = '100%';
        status.textContent = 'Готово к работе';
        setTimeout(function () { finish(); afterBoot(); }, 260);
        return;
      }

      const step = STEPS[index];
      status.textContent = step.label;
      bar.style.width = Math.round(((index + 1) / STEPS.length) * 100) + '%';

      setTimeout(function () {
        try { step.work(); } catch (error) { console.error('[PyOS] Ошибка шага загрузки', error); }
        index += 1;
        next();
      }, Util.prefersReducedMotion() ? 20 : 210);
    }

    next();
  }

  function afterBoot() {
    if (!WindowManager.count()) {
      WindowManager.openApp('editor');
      setTimeout(function () {
        if (Util.isSmallScreen()) return;
        WindowManager.openApp('files');
        const windows = WindowManager.list();
        if (windows.length >= 2) {
          windows.forEach(function (windowInstance) { WindowManager.setMode(windowInstance.id, 'tiled'); });
          WindowManager.applyTiling();
        }
      }, 700);
    }

    setTimeout(function () {
      Notifications.info('PyOS Studio готова', 'Перетащите окно за заголовок или подведите к краю экрана для прижатия');
    }, 900);

    window.addEventListener('beforeunload', function () { WindowManager.saveSession(); });
    document.addEventListener('visibilitychange', function () { if (document.hidden) WindowManager.saveSession(); });
    setInterval(function () { WindowManager.saveSession(); }, 20000);
  }

  return { run };
})();

<script>
(function(){
  const MODELS = [
    { v: 'gemini-3.6-flash', t: 'Gemini 3.6 Flash' },
    { v: 'gemini-3.6-pro', t: 'Gemini 3.6 Pro' },
    { v: 'gemini-3.6-flash-lite', t: 'Gemini 3.6 Flash Lite' },
    { v: 'gemini-3.5-flash', t: 'Gemini 3.5 Flash' },
    { v: 'gemini-3.5-pro', t: 'Gemini 3.5 Pro' },
    { v: 'gemini-3.0-flash', t: 'Gemini 3.0 Flash' },
    { v: 'gemini-2.5-flash', t: 'Gemini 2.5 Flash' },
    { v: 'gemini-2.5-pro', t: 'Gemini 2.5 Pro' },
    { v: 'gemini-2.0-flash', t: 'Gemini 2.0 Flash' },
    { v: 'gemini-2.0-flash-lite', t: 'Gemini 2.0 Flash Lite' },
    { v: 'gemini-1.5-flash', t: 'Gemini 1.5 Flash' },
    { v: 'gemini-1.5-pro', t: 'Gemini 1.5 Pro' }
  ];

  function inject(){
    document.querySelectorAll('select').forEach(sel => {
      const opts = Array.from(sel.options).map(o => o.value.toLowerCase());
      const isGemini = opts.some(v => /gemini|flash|pro/i.test(v));
      if(!isGemini) return;

      const existing = new Set(opts);
      const frag = document.createDocumentFragment();

      MODELS.forEach(m => {
        if(!existing.has(m.v.toLowerCase())){
          const o = document.createElement('option');
          o.value = m.v;
          o.textContent = m.t;
          frag.appendChild(o);
        }
      });

      if(frag.children.length){
        sel.insertBefore(frag, sel.firstChild);
        sel.value = 'gemini-3.6-flash';
        sel.dispatchEvent(new Event('change', { bubbles: true }));
      }
    });
  }

  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', inject);
  else inject();

  new MutationObserver(inject).observe(document.body, { childList: true, subtree: true });
  setTimeout(inject, 1500);
})();
</script>
<script>
(function(){
  const FIXED = new WeakSet();

  function fixEditor(textarea){
    if(FIXED.has(textarea)) return;
    FIXED.add(textarea);

    const parent = textarea.parentElement;
    const highlight = parent.querySelector('pre, .highlight, [data-highlight], code');
    if(!highlight) return;

    const pre = highlight.tagName === 'CODE' ? highlight.parentElement : highlight;

    parent.style.position = 'relative';
    parent.style.overflow = 'hidden';

    const applyStyles = (el) => {
      el.style.position = 'absolute';
      el.style.inset = '0';
      el.style.margin = '0';
      el.style.overflow = 'hidden';
      el.style.pointerEvents = 'none';
      el.style.whiteSpace = getComputedStyle(textarea).whiteSpace;
      el.style.wordBreak = getComputedStyle(textarea).wordBreak;
      el.style.tabSize = getComputedStyle(textarea).tabSize;
      el.style.lineHeight = getComputedStyle(textarea).lineHeight;
      el.style.fontSize = getComputedStyle(textarea).fontSize;
      el.style.fontFamily = getComputedStyle(textarea).fontFamily;
      el.style.padding = getComputedStyle(textarea).padding;
      el.style.border = 'none';
      el.style.background = 'transparent';
      el.style.width = '100%';
      el.style.height = '100%';
    };

    applyStyles(pre);
    textarea.style.position = 'absolute';
    textarea.style.inset = '0';
    textarea.style.background = 'transparent';
    textarea.style.color = 'transparent';
    textarea.style.caretColor = getComputedStyle(textarea).caretColor || '#7c6cff';
    textarea.style.resize = 'none';
    textarea.style.zIndex = '2';
    pre.style.zIndex = '1';

    let raf = null;
    function sync(){
      if(raf) return;
      raf = requestAnimationFrame(() => {
        raf = null;
        pre.scrollTop = textarea.scrollTop;
        pre.scrollLeft = textarea.scrollLeft;

        const cs = getComputedStyle(textarea);
        if(cs.whiteSpace === 'pre-wrap' || cs.whiteSpace === 'pre-line'){
          pre.scrollTop = textarea.scrollTop;
        } else {
          pre.style.transform = `translate(${-textarea.scrollLeft}px, ${-textarea.scrollTop}px)`;
          pre.style.width = textarea.scrollWidth + 'px';
          pre.style.height = textarea.scrollHeight + 'px';
        }
      });
    }

    textarea.addEventListener('scroll', sync, { passive: true });
    textarea.addEventListener('input', () => { requestAnimationFrame(sync); }, { passive: true });
    window.addEventListener('resize', sync, { passive: true });

    const ro = new ResizeObserver(sync);
    ro.observe(textarea);
    ro.observe(parent);

    sync();
    setTimeout(sync, 100);
    setTimeout(sync, 400);
  }

  function scan(){
    document.querySelectorAll('textarea').forEach(ta => {
      const p = ta.parentElement;
      if(!p) return;
      const hasPre = p.querySelector('pre, .highlight, [data-highlight], code');
      if(hasPre) fixEditor(ta);
    });
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', scan);
  } else {
    scan();
  }

  new MutationObserver(() => scan()).observe(document.body, { childList: true, subtree: true });
  setInterval(scan, 3000);
})();
</script>

function icon(name,size){
 if(window.PyOS&&PyOS.Icons&&PyOS.Icons.get){try{return PyOS.Icons.get(name,size||20);}catch(e){}}

/* ===== СИСТЕМА ПЛАГИНОВ ===== */
var pluginRegistry={};
var installedPlugins=[];
try{installedPlugins=JSON.parse(localStorage.getItem(PLUGINS_KEY)||'[]');}catch(e){installedPlugins=[];}
function savePlugins(){try{localStorage.setItem(PLUGINS_KEY,JSON.stringify(installedPlugins));}catch(e){}}

window.PyPlugins={
 define:function(p){if(p&&p.id)pluginRegistry[p.id]=p;},
 all:function(){return Object.keys(pluginRegistry).map(function(k){return pluginRegistry[k];});},
 get:function(id){return pluginRegistry[id];},
 installed:function(){return installedPlugins.map(function(id){return pluginRegistry[id];}).filter(Boolean);},
 isInstalled:function(id){return installedPlugins.indexOf(id)!==-1;},
 install:function(id){
   if(!pluginRegistry[id]||this.isInstalled(id))return false;
   installedPlugins.push(id);savePlugins();
   registerPluginAsApp(pluginRegistry[id]);
   renderDock();
   return true;
 },
 uninstall:function(id){
   var i=installedPlugins.indexOf(id);
   if(i===-1)return false;
   installedPlugins.splice(i,1);savePlugins();
   renderDock();
   return true;
 }
};

function registerPluginAsApp(p){
 if(window.PyOS&&PyOS.registerApp){
   try{
     if(!PyOS.Apps||!PyOS.Apps.get||!PyOS.Apps.get(p.id)){
       PyOS.registerApp({
         id:p.id,name:p.name,description:p.description||'',
         icon:p.icon||'grid',color:p.color||'#64748b',
         defaultWidth:p.width||720,defaultHeight:p.height||520,
         singleton:true,mount:p.mount
       });
     }
   }catch(e){}
 }
}

PyPlugins.define({
 id:'pl-timer',name:'Секундомер',icon:'clock',color:'#3b9dff',width:360,height:300,description:'Секундомер с кругами',
 mount:function(container){
   container.innerHTML='<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:18px;box-sizing:border-box">'+
     '<div id="plt-time" style="font-size:48px;font-weight:200;font-variant-numeric:tabular-nums">00:00.0</div>'+
     '<div style="display:flex;gap:10px"><button id="plt-start" type="button" class="pyos-button pyos-button--filled">Старт</button>'+
     '<button id="plt-lap" type="button" class="pyos-button">Круг</button>'+
     '<button id="plt-reset" type="button" class="pyos-button">Сброс</button></div>'+
     '<div id="plt-laps" style="max-height:80px;overflow-y:auto;font-size:12px;opacity:.7;display:flex;flex-direction:column;gap:3px"></div></div>';
   var timeEl=container.querySelector('#plt-time');
   var startBtn=container.querySelector('#plt-start');
   var lapBtn=container.querySelector('#plt-lap');
   var resetBtn=container.querySelector('#plt-reset');
   var lapsEl=container.querySelector('#plt-laps');
   var running=false,start=0,elapsed=0,raf=null,lapCount=0;
   function fmt(ms){
     var m=Math.floor(ms/60000),s=Math.floor(ms%60000/1000),d=Math.floor(ms%1000/100);
     return ('0'+m).slice(-2)+':'+('0'+s).slice(-2)+'.'+d;
   }
   function tick(){
     if(running){elapsed=Date.now()-start;timeEl.textContent=fmt(elapsed);raf=requestAnimationFrame(tick);}
   }
   startBtn.onclick=function(){
     running=!running;
     if(running){start=Date.now()-elapsed;startBtn.textContent='Пауза';tick();}
     else startBtn.textContent='Старт';
   };
   lapBtn.onclick=function(){if(elapsed>0){lapCount++;var d=document.createElement('div');d.textContent='Круг '+lapCount+': '+fmt(elapsed);lapsEl.prepend(d);}};
   resetBtn.onclick=function(){running=false;elapsed=0;start=0;lapCount=0;timeEl.textContent='00:00.0';startBtn.textContent='Старт';lapsEl.innerHTML='';};
 }
});

function getAppsList(){
 var apps=[];
 if(window.PyOS&&PyOS.Apps&&PyOS.Apps.all){
   try{apps=PyOS.Apps.all();}catch(e){apps=[];}
 }
 return apps;
}

function openAppSafe(app){
 if(window.PyOS&&PyOS.openApp){PyOS.openApp(app.id);return;}
 if(app.mount){
   var w=document.createElement('div');
   w.style.cssText='position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:'+(app.defaultWidth||600)+'px;height:'+(app.defaultHeight||400)+'px;background:var(--pyos-surface,#14141c);border:1px solid var(--pyos-border,rgba(255,255,255,.1));border-radius:16px;z-index:99995;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5)';
   w.innerHTML='<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--pyos-border,rgba(255,255,255,.08))">'+
     '<span style="font-weight:600;font-size:13px">'+app.name+'</span>'+
     '<button type="button" style="border:none;background:transparent;color:inherit;cursor:pointer;font-size:16px">✕</button></div>'+
     '<div style="flex:1;overflow:auto;position:relative"></div>';
   w.querySelector('button').onclick=function(){w.remove();};
   document.body.appendChild(w);
   try{app.mount(w.querySelector('div:last-child'),{});}catch(e){}
 }
}

function renderDock(){
 dock.innerHTML='';
 var apps=getAppsList();
 var plugins=PyPlugins.installed();

 /* кнопка меню пуск в доке */
 var sb=document.createElement('button');
 sb.type='button';sb.className='pys-dock-item';
 sb.innerHTML='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 3h8v8H3V3zm10 0h8v8h-8V3zM3 13h8v8H3v-8zm10 0h8v8h-8v-8z"/></svg>'+
   (cfg.showTips?'<span class="pys-dock-tip">Пуск</span>':'');
 sb.onclick=function(){toggleStartMenu();};
 dock.appendChild(sb);

 var sep=document.createElement('div');sep.className='pys-dock-sep';dock.appendChild(sep);

 apps.forEach(function(app){
   if(app.id==='plugin-store')return;
   var b=document.createElement('button');
   b.type='button';b.className='pys-dock-item';
   b.style.color=app.color||'inherit';
   b.innerHTML=icon(app.icon||'grid',22)+(cfg.showTips?'<span class="pys-dock-tip">'+app.name+'</span>':'');
   b.onclick=function(){openAppSafe(app);};
   dock.appendChild(b);
 });

 if(plugins.length){
   var sep2=document.createElement('div');sep2.className='pys-dock-sep';dock.appendChild(sep2);
   plugins.forEach(function(p){
     if(apps.some(function(a){return a.id===p.id;}))return;
     var b=document.createElement('button');
     b.type='button';b.className='pys-dock-item';
     b.style.color=p.color||'inherit';
     b.innerHTML=icon(p.icon||'grid',22)+(cfg.showTips?'<span class="pys-dock-tip">'+p.name+'</span>':'');
     b.onclick=function(){openAppSafe(p);};
     dock.appendChild(b);
   });
 }

 var sep3=document.createElement('div');sep3.className='pys-dock-sep';dock.appendChild(sep3);

 var storeBtn=document.createElement('button');
 storeBtn.type='button';storeBtn.className='pys-dock-item';
 storeBtn.style.color='#22c55e';
 storeBtn.innerHTML=icon('puzzle',22)+(cfg.showTips?'<span class="pys-dock-tip">Плагины</span>':'');
 storeBtn.onclick=function(){openAppSafe({id:'plugin-store',name:'Плагины',icon:'puzzle',mount:storeDef.mount,defaultWidth:760,defaultHeight:560});};
 dock.appendChild(storeBtn);

 var setBtn=document.createElement('button');
 setBtn.type='button';setBtn.className='pys-dock-item';
 setBtn.innerHTML=icon('settings',22)+(cfg.showTips?'<span class="pys-dock-tip">Настройки дока</span>':'');
 setBtn.onclick=function(){toggleDockPanel();};
 dock.appendChild(setBtn);

 updateRunningIndicators();

function updateRunningIndicators(){
 if(!window.PyOS||!PyOS.WindowManager)return;
 var active=PyOS.WindowManager.getActive?PyOS.WindowManager.getActive():null;
 var items=dock.querySelectorAll('.pys-dock-item');
 /* упрощённо: не отслеживаем без id на кнопках; пропускаем */
}

/* ===== ПРИМЕНИТЬ КОНФИГ ДОКА ===== */
function applyDock(){
 dock.className='';
 dock.classList.add('pys-pos-'+cfg.position);
 var vertical=(cfg.position==='left-center'||cfg.position==='right-center');
 if(vertical)dock.classList.add('pys-vertical');
 dock.style.setProperty('--pys-dock-icon',cfg.iconSize+'px');
 dock.style.setProperty('--pys-dock-gap',cfg.gap+'px');
 dock.style.setProperty('--pys-dock-pad',cfg.padding+'px');
 dock.style.setProperty('--pys-dock-radius',cfg.radius+'px');
 var st=DOCK_STYLES.find(function(s){return s.id===cfg.style;})||DOCK_STYLES[0];
 Object.keys(st.css).forEach(function(k){dock.style[k]=st.css[k];});
 startBtn.style.display=cfg.startBtn?'flex':'none';
 /* позиция кнопки пуск относительно дока */
 if(cfg.position.indexOf('bottom')===0){
   startBtn.style.bottom=(cfg.iconSize+cfg.padding*2+26)+'px';
   startBtn.style.top='auto';
 }else{
   startBtn.style.top='14px';startBtn.style.bottom='auto';
 }
 if(cfg.position==='bottom-left'||cfg.position==='top-left'){startBtn.style.left='14px';startBtn.style.right='auto';}
 else if(cfg.position==='bottom-right'||cfg.position==='top-right'){startBtn.style.right='14px';startBtn.style.left='auto';}
 else{startBtn.style.left='14px';startBtn.style.right='auto';}
 /* меню пуск рядом с кнопкой */
 positionStartMenu();
 /* авто-скрытие */
 if(cfg.autoHide){dock.classList.add('pys-hidden');}
 else dock.classList.remove('pys-hidden');
}

function positionStartMenu(){
 var r=startBtn.getBoundingClientRect();
 var menuW=400,menuH=Math.min(600,window.innerHeight-100);
 var left,top;
 if(r.top>window.innerHeight/2){top=r.top-menuH-12;}
 else{top=r.bottom+12;}
 if(r.left>window.innerWidth/2){left=r.right-menuW;}
 else{left=r.left;}
 left=Math.max(12,Math.min(left,window.innerWidth-menuW-12));
 top=Math.max(12,Math.min(top,window.innerHeight-menuH-12));
 startMenu.style.left=left+'px';
 startMenu.style.top=top+'px';
 startMenu.style.width=Math.min(menuW,window.innerWidth-24)+'px';
}

/* ===== АВТО-СКРЫТИЕ ДОКА ===== */
var hideTimer=null;
dock.addEventListener('mouseenter',function(){if(cfg.autoHide){clearTimeout(hideTimer);dock.classList.remove('pys-hidden');}});
dock.addEventListener('mouseleave',function(){
 if(cfg.autoHide){
   clearTimeout(hideTimer);
   hideTimer=setTimeout(function(){dock.classList.add('pys-hidden');},cfg.autoHideDelay);
 }
});
document.addEventListener('mousemove',function(e){
 if(!cfg.autoHide)return;
 var near=false;
 var p=cfg.position;
 if(p.indexOf('bottom')===0&&e.clientY>window.innerHeight-60)near=true;
 if(p.indexOf('top')===0&&e.clientY<60)near=true;
 if(p==='left-center'&&e.clientX<60)near=true;
 if(p==='right-center'&&e.clientX>window.innerWidth-60)near=true;
 if(near){clearTimeout(hideTimer);dock.classList.remove('pys-hidden');}
});

/* ===== МЕНЮ ПУСК ===== */
function renderStartApps(filter){
 var apps=getAppsList();
 var plugins=PyPlugins.installed();
 var list=apps.slice();
 plugins.forEach(function(p){if(!list.some(function(a){return a.id===p.id;}))list.push(p);});
 if(!window.PyOS||!PyOS.Apps){
   list.push({id:'youtube',name:'YouTube',icon:'play',color:'#ff0000',mount:ytDef.mount,defaultWidth:960,defaultHeight:640});
   list.push({id:'plugin-store',name:'Плагины',icon:'puzzle',color:'#22c55e',mount:storeDef.mount,defaultWidth:760,defaultHeight:560});
 }
 var q=(filter||'').toLowerCase();
 var f=list.filter(function(a){return !q||a.name.toLowerCase().indexOf(q)!==-1;});
 var el=document.getElementById('pys-sm-apps');
 el.innerHTML='';
 if(!f.length){el.innerHTML='<div class="pys-start-empty">Ничего не найдено</div>';return;}
 f.forEach(function(a){
   var b=document.createElement('button');
   b.type='button';b.className='pys-start-app';
   b.innerHTML='<div class="pys-start-app-icon" style="background:'+(a.color||'#64748b')+'">'+icon(a.icon||'grid',22)+'</div>'+
     '<div class="pys-start-app-name">'+a.name+'</div>';
   b.onclick=function(){toggleStartMenu(false);openAppSafe(a);};
   el.appendChild(b);
 });
}

function toggleStartMenu(force){
 var open=force!==undefined?force:!startMenu.classList.contains('pys-open');
 if(open){renderStartApps('');positionStartMenu();startMenu.classList.add('pys-open');}
 else startMenu.classList.remove('pys-open');
}
startBtn.addEventListener('click',function(){toggleStartMenu();});
document.addEventListener('click',function(e){
 if(startMenu.classList.contains('pys-open')&&!startMenu.contains(e.target)&&!startBtn.contains(e.target)){
   startMenu.classList.remove('pys-open');
 }
 if(dockPanel.classList.contains('pys-open')&&!dockPanel.contains(e.target)&&!e.target.closest('#pys-dock .pys-dock-item:last-child')){
   /* не закрываем сразу, пусть кнопка обрабатывает */
 }
});
document.getElementById('pys-sm-q').addEventListener('input',function(){renderStartApps(this.value);});

});

/* ===== ПАНЕЛЬ НАСТРОЕК ДОКА ===== */
function buildDockPanel(){
 var posOpts=[
  ['bottom-center','Внизу по центру'],['bottom-left','Внизу слева'],['bottom-right','Внизу справа'],
  ['top-center','Вверху по центру'],['top-left','Вверху слева'],['top-right','Вверху справа'],
  ['left-center','Слева по центру'],['right-center','Справа по центру']
 ];
 var html='<h3>Настройки дока <button id="pys-dp-close">×</button></h3>'+
 '<div class="pys-dp-row"><label>Позиция</label><select id="pdp-pos">'+posOpts.map(function(p){return '<option value="'+p[0]+'"'+(cfg.position===p[0]?' selected':'')+'>'+p[1]+'</option>';}).join('')+'</select></div>'+
 '<h3>Стиль</h3><div class="pys-dp-styles" id="pdp-styles"></div>'+
 '<div class="pys-dp-row"><label>Размер иконок</label><input type="range" id="pdp-size" min="36" max="72" step="2" value="'+cfg.iconSize+'"><span class="pys-dp-val" id="pdp-size-v">'+cfg.iconSize+'</span></div>'+
 '<div class="pys-dp-row"><label>Отступы</label><input type="range" id="pdp-gap" min="4" max="20" step="1" value="'+cfg.gap+'"><span class="pys-dp-val" id="pdp-gap-v">'+cfg.gap+'</span></div>'+
 '<div class="pys-dp-row"><label>Радиус</label><input type="range" id="pdp-radius" min="8" max="32" step="1" value="'+cfg.radius+'"><span class="pys-dp-val" id="pdp-radius-v">'+cfg.radius+'</span></div>'+
 '<div class="pys-dp-row"><label>Подсказки</label><input type="checkbox" id="pdp-tips"'+(cfg.showTips?' checked':'')+'></div>'+
 '<div class="pys-dp-row"><label>Авто-скрытие</label><input type="checkbox" id="pdp-hide"'+(cfg.autoHide?' checked':'')+'></div>'+
 '<div class="pys-dp-row"><label>Кнопка Пуск</label><input type="checkbox" id="pdp-start"'+(cfg.startBtn?' checked':'')+'></div>'+
 '<button class="pys-dp-reset" id="pdp-reset">Сбросить настройки дока</button>';
 dockPanel.innerHTML=html;

 var stylesEl=dockPanel.querySelector('#pdp-styles');
 DOCK_STYLES.forEach(function(s){
   var d=document.createElement('div');
   d.className='pys-dp-style'+(cfg.style===s.id?' pys-on':'');
   d.style.background=s.css.background;
   d.style.border=s.css.border||'none';
   d.title=s.n;
   d.onclick=function(){
     cfg.style=s.id;saveCfg();applyDock();buildDockPanel();
   };
   stylesEl.appendChild(d);
 });

 dockPanel.querySelector('#pdp-pos').onchange=function(){cfg.position=this.value;saveCfg();applyDock();};
 dockPanel.querySelector('#pdp-size').oninput=function(){cfg.iconSize=parseInt(this.value,10);dockPanel.querySelector('#pdp-size-v').textContent=this.value;saveCfg();applyDock();};
 dockPanel.querySelector('#pdp-gap').oninput=function(){cfg.gap=parseInt(this.value,10);dockPanel.querySelector('#pdp-gap-v').textContent=this.value;saveCfg();applyDock();};
 dockPanel.querySelector('#pdp-radius').oninput=function(){cfg.radius=parseInt(this.value,10);dockPanel.querySelector('#pdp-radius-v').textContent=this.value;saveCfg();applyDock();};
 dockPanel.querySelector('#pdp-tips').onchange=function(){cfg.showTips=this.checked;saveCfg();renderDock();applyDock();};
 dockPanel.querySelector('#pdp-hide').onchange=function(){cfg.autoHide=this.checked;saveCfg();applyDock();};
 dockPanel.querySelector('#pdp-start').onchange=function(){cfg.startBtn=this.checked;saveCfg();applyDock();};
 dockPanel.querySelector('#pdp-reset').onclick=function(){
   cfg=Object.assign({},DEF);saveCfg();applyDock();buildDockPanel();renderDock();
 };
 dockPanel.querySelector('#pys-dp-close').onclick=function(){dockPanel.classList.remove('pys-open');};
}
function toggleDockPanel(){
 var open=!dockPanel.classList.contains('pys-open');
 if(open)buildDockPanel();
 dockPanel.classList.toggle('pys-open',open);
}

/* ===== КОНТЕКСТНОЕ МЕНЮ ДОКА ===== */
dock.addEventListener('contextmenu',function(e){
 e.preventDefault();
 toggleDockPanel();
});

/* ===== ОБНОВЛЕНИЕ ИНДИКАТОРОВ ЗАПУЩЕННЫХ ПРИЛОЖЕНИЙ ===== */
if(window.PyOS&&PyOS.Bus){
 PyOS.Bus.on('window:created',updateRunningIndicators);
 PyOS.Bus.on('window:closed',updateRunningIndicators);
 PyOS.Bus.on('window:focused',updateRunningIndicators);
}

/* ===== ИНИЦИАЛИЗАЦИЯ ===== */
registerYouTube();
registerStore();
installedPlugins.forEach(function(id){
 if(pluginRegistry[id])registerPluginAsApp(pluginRegistry[id]);
});
renderDock();
applyDock();
window.addEventListener('resize',function(){if(startMenu.classList.contains('pys-open'))positionStartMenu();});
})();

    }
    var next = onWs[(idx + 1) % onWs.length];

        } catch (err) {
          if (window.PyOS && window.PyOS.Notifications && window.PyOS.Notifications.error) window.PyOS.Notifications.error('Ошибка', err.message || 'Не найден манифест в файле');
          else console.warn('[PyOS.Host]', err.message || 'Не найден манифест в файле');
        }
      };
      reader.readAsText(file);
    };
    input.click();
  }

  document.addEventListener('click', function (e) {
    var openBtn = e.target.closest('[data-ext-open]');
    var removeBtn = e.target.closest('[data-ext-remove]');
    if (openBtn) {
      e.preventDefault();
      host.openExternal(openBtn.dataset.extOpen);
    }
    if (removeBtn) {
      e.preventDefault();
      host.unregister(removeBtn.dataset.extRemove);
    }
  });

  host._injectSettingsUI = injectSettingsUI;
  host._renderExtList = renderExtList;

  registerHostCommand();
})();
</script>
<script>
(function () {
  'use strict';
  if (window.__pyosTelegramApp) return;
  window.__pyosTelegramApp = true;

  var TELEGRAM_URL = 'https://pyos-telegram.netlify.app/';

  var wait = setInterval(function () {
    if (!window.PyOS || !window.PyOS.registerApp) return;
    clearInterval(wait);

    window.PyOS.registerApp({
      id: 'telegram-client',
      name: 'Telegram',
      description: 'Настоящий Telegram-клиент через MTProto',
      icon: 'send',
      color: '#229ED9',
      singleton: true,
      defaultWidth: 1100,
      defaultHeight: 720,
      minWidth: 480,
      minHeight: 400,
      mount: function (container) {
        container.style.cssText = 'width:100%;height:100%;padding:0;margin:0;overflow:hidden';
        var frame = document.createElement('iframe');
        frame.src = TELEGRAM_URL;
        frame.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms allow-popups allow-modals allow-downloads allow-clipboard-write');
        frame.setAttribute('referrerpolicy', 'no-referrer');
        frame.style.cssText = 'width:100%;height:100%;border:none;display:block;background:#0a0a0f';
        container.appendChild(frame);
        return {
          unmount: function () {
            try { frame.src = 'about:blank'; } catch (e) {}
            frame.remove();
          }
        };
      }
    });
  }, 200);

  setTimeout(function () { clearInterval(wait); }, 10000);
})();
</script>
