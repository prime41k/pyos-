
<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="description" content="PyOS Studio — оконная операционная среда разработки Python с тайлингом в стиле Hyprland">
<title>PyOS Studio · Операционная среда разработки</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/roboto@latest/latin-400-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/roboto@latest/latin-500-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/roboto@latest/latin-700-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/jetbrains-mono@latest/latin-400-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/jetbrains-mono@latest/latin-700-normal.css">

<style>
/* ══════════════════════════════════════════════════════════════════════════
   РАЗДЕЛ 1. ПЕРЕМЕННЫЕ ТЕМЫ И БАЗОВЫЕ СТИЛИ
   ══════════════════════════════════════════════════════════════════════════ */
:root{
  --pyos-accent:#7c6cff;
  --pyos-accent-rgb:124,108,255;
  --pyos-accent-contrast:#ffffff;

  --pyos-radius-window:18px;
  --pyos-radius-panel:14px;
  --pyos-radius-control:12px;
  --pyos-radius-pill:999px;
  --pyos-gap:10px;

  --pyos-duration-fast:140ms;
  --pyos-duration-normal:240ms;
  --pyos-duration-slow:420ms;
  --pyos-easing:cubic-bezier(.2,.85,.25,1);
  --pyos-easing-soft:cubic-bezier(.4,0,.2,1);

  --pyos-font-ui:'Roboto','Segoe UI',system-ui,sans-serif;
  --pyos-font-code:'JetBrains Mono',ui-monospace,'Cascadia Code',Consolas,monospace;
  --pyos-font-size-ui:14px;
  --pyos-font-size-code:14px;
  --pyos-line-height:1.6;

  --pyos-topbar-height:52px;
  --pyos-dock-height:64px;

  --pyos-blur:18px;
  --pyos-wallpaper-opacity:1;

  --pyos-token-comment:#7d8598;
  --pyos-token-string:#9fe88d;
  --pyos-token-keyword:#c792ea;
  --pyos-token-builtin:#82aaff;
  --pyos-token-number:#f78c6c;
  --pyos-token-function:#ffcb6b;
  --pyos-token-operator:#89ddff;
  --pyos-token-punctuation:#a6accd;
  --pyos-token-tag:#ff7b9c;
  --pyos-token-attr:#ffcb6b;
  --pyos-token-constant:#f07178;
  --pyos-token-decorator:#f78c6c;
}

html[data-theme="dark"]{
  --pyos-bg:#080a0f;
  --pyos-surface:rgba(17,20,28,.80);
  --pyos-surface-solid:#11141c;
  --pyos-surface-2:rgba(26,30,42,.86);
  --pyos-surface-3:rgba(38,43,58,.9);
  --pyos-surface-hover:rgba(255,255,255,.07);
  --pyos-surface-active:rgba(var(--pyos-accent-rgb),.16);
  --pyos-text:#e9ecf5;
  --pyos-text-dim:#98a1b5;
  --pyos-text-faint:#6b7385;
  --pyos-border:rgba(255,255,255,.09);
  --pyos-border-strong:rgba(255,255,255,.16);
  --pyos-shadow:0 26px 70px rgba(0,0,0,.6),0 4px 14px rgba(0,0,0,.4);
  --pyos-shadow-soft:0 10px 30px rgba(0,0,0,.35);
  --pyos-overlay:rgba(4,6,10,.62);
  --pyos-success:#4ade80;
  --pyos-warning:#fbbf24;
  --pyos-danger:#f87171;
  --pyos-info:#60a5fa;
  --pyos-scrollbar:rgba(255,255,255,.16);
  --pyos-scrollbar-hover:rgba(255,255,255,.28);
  --pyos-code-bg:rgba(8,10,16,.55);
}

html[data-theme="light"]{
  --pyos-bg:#e9edf5;
  --pyos-surface:rgba(255,255,255,.82);
  --pyos-surface-solid:#ffffff;
  --pyos-surface-2:rgba(246,248,253,.92);
  --pyos-surface-3:rgba(233,238,248,.95);
  --pyos-surface-hover:rgba(16,22,40,.06);
  --pyos-surface-active:rgba(var(--pyos-accent-rgb),.14);
  --pyos-text:#131722;
  --pyos-text-dim:#5a6376;
  --pyos-text-faint:#838ca0;
  --pyos-border:rgba(14,20,36,.12);
  --pyos-border-strong:rgba(14,20,36,.22);
  --pyos-shadow:0 22px 55px rgba(24,32,56,.18),0 3px 10px rgba(24,32,56,.1);
  --pyos-shadow-soft:0 8px 24px rgba(24,32,56,.12);
  --pyos-overlay:rgba(226,232,244,.6);
  --pyos-success:#16a34a;
  --pyos-warning:#d97706;
  --pyos-danger:#dc2626;
  --pyos-info:#2563eb;
  --pyos-scrollbar:rgba(16,22,40,.18);
  --pyos-scrollbar-hover:rgba(16,22,40,.3);
  --pyos-code-bg:rgba(255,255,255,.6);
  --pyos-token-comment:#7b8397;
  --pyos-token-string:#1f8a4c;
  --pyos-token-keyword:#8b3fd6;
  --pyos-token-builtin:#1f6feb;
  --pyos-token-number:#c2410c;
  --pyos-token-function:#a16207;
  --pyos-token-operator:#0f766e;
  --pyos-token-punctuation:#475569;
  --pyos-token-tag:#be185d;
  --pyos-token-attr:#a16207;
  --pyos-token-constant:#b91c1c;
  --pyos-token-decorator:#c2410c;
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;padding:0;overflow:hidden}
body{
  font-family:var(--pyos-font-ui);
  font-size:var(--pyos-font-size-ui);
  line-height:1.45;
  color:var(--pyos-text);
  background:var(--pyos-bg);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
  overscroll-behavior:none;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none;padding:0}
a{color:var(--pyos-accent);text-decoration:none}
svg{display:block;flex:0 0 auto}
:focus-visible{outline:2px solid var(--pyos-accent);outline-offset:2px;border-radius:6px}

::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--pyos-scrollbar);border-radius:99px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--pyos-scrollbar-hover);background-clip:content-box}
::-webkit-scrollbar-corner{background:transparent}

.pyos-scroll{scrollbar-width:thin;scrollbar-color:var(--pyos-scrollbar) transparent}
.pyos-hidden{display:none !important}
.pyos-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ══════════════════════════════════════════════════════════════════════════
   РАЗДЕЛ 2. ЭКРАН ЗАГРУЗКИ
   ══════════════════════════════════════════════════════════════════════════ */
#pyos-boot{
  position:fixed;inset:0;z-index:100000;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;
  background:radial-gradient(1200px 700px at 50% 30%,rgba(var(--pyos-accent-rgb),.18),transparent 70%),#070910;
  transition:opacity var(--pyos-duration-slow) var(--pyos-easing),visibility var(--pyos-duration-slow);
}
#pyos-boot.is-finished{opacity:0;visibility:hidden;pointer-events:none}
.pyos-boot__logo{
  width:96px;height:96px;border-radius:28px;display:grid;place-items:center;
  background:linear-gradient(145deg,rgba(var(--pyos-accent-rgb),.95),rgba(var(--pyos-accent-rgb),.35));
  box-shadow:0 20px 60px rgba(var(--pyos-accent-rgb),.4);
  animation:pyosBootPulse 2.4s var(--pyos-easing-soft) infinite;
}
.pyos-boot__logo svg{width:52px;height:52px;color:#fff}
.pyos-boot__title{font-size:26px;font-weight:700;letter-spacing:.4px;color:#fff;margin:0}
.pyos-boot__subtitle{font-size:13px;color:rgba(255,255,255,.6);margin:-16px 0 0}
.pyos-boot__progress{width:min(340px,72vw);height:5px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
.pyos-boot__bar{height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,rgba(var(--pyos-accent-rgb),.6),var(--pyos-accent));transition:width .3s var(--pyos-easing)}
.pyos-boot__status{font-size:12.5px;color:rgba(255,255,255,.55);min-height:18px;text-align:center}
@keyframes pyosBootPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

/* ══════════════════════════════════════════════════════════════════════════
   РАЗДЕЛ 3. ОБОИ И ФОН
   ══════════════════════════════════════════════════════════════════════════ */
#pyos-wallpaper{position:fixed;inset:0;z-index:0;overflow:hidden;background:var(--pyos-bg);opacity:var(--pyos-wallpaper-opacity)}
#pyos-wallpaper::before,#pyos-wallpaper::after{
  content:'';position:absolute;border-radius:50%;filter:blur(90px);opacity:.55;
  will-change:transform;
}
#pyos-wallpaper::before{
  width:52vmax;height:52vmax;left:-12vmax;top:-14vmax;
  background:radial-gradient(circle at 30% 30%,rgba(var(--pyos-accent-rgb),.85),transparent 68%);
  animation:pyosAuroraOne 26s ease-in-out infinite alternate;
}
#pyos-wallpaper::after{
  width:46vmax;height:46vmax;right:-10vmax;bottom:-16vmax;
  background:radial-gradient(circle at 60% 40%,rgba(80,200,255,.5),transparent 66%);
  animation:pyosAuroraTwo 32s ease-in-out infinite alternate;
}
html[data-theme="light"] #pyos-wallpaper::before{opacity:.35}
html[data-theme="light"] #pyos-wallpaper::after{opacity:.3}
#pyos-wallpaper[data-style="solid"]::before,#pyos-wallpaper[data-style="solid"]::after{display:none}
#pyos-wallpaper[data-style="grid"]::before,#pyos-wallpaper[data-style="grid"]::after{display:none}
#pyos-wallpaper[data-style="grid"]{
  background-image:linear-gradient(rgba(var(--pyos-accent-rgb),.09) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(var(--pyos-accent-rgb),.09) 1px,transparent 1px);
  background-size:44px 44px;
}
#pyos-canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.55}
@keyframes pyosAuroraOne{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(14vw,10vh,0) scale(1.18)}}
@keyframes pyosAuroraTwo{from{transform:translate3d(0,0,0) scale(1.1)}to{transform:translate3d(-12vw,-8vh,0) scale(1)}}

/* ══════════════════════════════════════════════════════════════════════════
   РАЗДЕЛ 4. КНОПКИ, ПОЛЯ, ПЕРЕКЛЮЧАТЕЛИ
   ══════════════════════════════════════════════════════════════════════════ */
.pyos-button{
  position:relative;overflow:hidden;isolation:isolate;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  height:38px;padding:0 16px;border-radius:var(--pyos-radius-control);
  background:var(--pyos-surface-2);border:1px solid var(--pyos-border);
  color:var(--pyos-text);font-size:13.5px;font-weight:500;white-space:nowrap;
  transition:transform var(--pyos-duration-fast) var(--pyos-easing),
             background var(--pyos-duration-fast) var(--pyos-easing),
             border-color var(--pyos-duration-fast) var(--pyos-easing),
             box-shadow var(--pyos-duration-fast) var(--pyos-easing),
             opacity var(--pyos-duration-fast);
  user-select:none;-webkit-user-select:none;
}
.pyos-button:hover{background:var(--pyos-surface-3);border-color:var(--pyos-border-strong);transform:translateY(-1px)}
.pyos-button:active{transform:translateY(0) scale(.98)}
.pyos-button:disabled{opacity:.42;pointer-events:none}
.pyos-button--filled{background:var(--pyos-accent);border-color:transparent;color:var(--pyos-accent-contrast);box-shadow:0 6px 18px rgba(var(--pyos-accent-rgb),.34)}
.pyos-button--filled:hover{background:var(--pyos-accent);filter:brightness(1.08)}
.pyos-button--tonal{background:rgba(var(--pyos-accent-rgb),.14);border-color:rgba(var(--pyos-accent-rgb),.28);color:var(--pyos-accent)}
.pyos-button--tonal:hover{background:rgba(var(--pyos-accent-rgb),.22)}
.pyos-button--danger{background:rgba(248,113,113,.14);border-color:rgba(248,113,113,.3);color:var(--pyos-danger)}
.pyos-button--danger:hover{background:rgba(248,113,113,.24)}
.pyos-button--ghost{background:transparent;border-color:transparent}
.pyos-button--ghost:hover{background:var(--pyos-surface-hover)}
.pyos-button--icon{width:38px;padding:0}
.pyos-button--small{height:30px;padding:0 11px;font-size:12.5px;border-radius:10px}
.pyos-button--small.pyos-button--icon{width:30px}
.pyos-button--large{height:46px;padding:0 22px;font-size:15px}

.pyos-ripple{position:absolute;border-radius:50%;background:currentColor;opacity:.22;transform:scale(0);animation:pyosRipple 560ms var(--pyos-easing-soft) forwards;pointer-events:none;z-index:-1}
@keyframes pyosRipple{to{transform:scale(1);opacity:0}}

.pyos-field{
  width:100%;height:38px;padding:0 12px;border-radius:var(--pyos-radius-control);
  background:var(--pyos-surface-2);border:1px solid var(--pyos-border);color:var(--pyos-text);
  font-size:13.5px;outline:none;transition:border-color var(--pyos-duration-fast),box-shadow var(--pyos-duration-fast),background var(--pyos-duration-fast);
}
.pyos-field:hover{border-color:var(--pyos-border-strong)}
.pyos-field:focus{border-color:var(--pyos-accent);box-shadow:0 0 0 3px rgba(var(--pyos-accent-rgb),.18)}
textarea.pyos-field{height:auto;min-height:80px;padding:10px 12px;resize:vertical;line-height:1.55}
select.pyos-field{appearance:none;padding-right:32px;background-image:linear-gradient(45deg,transparent 50%,var(--pyos-text-dim) 50%),linear-gradient(135deg,var(--pyos-text-dim) 50%,transparent 50%);background-position:calc(100% - 17px) 17px,calc(100% - 12px) 17px;background-size:5px 5px,5px 5px;background-repeat:no-repeat;cursor:pointer}
.pyos-field--code{font-family:var(--pyos-font-code);font-size:var(--pyos-font-size-code)}

.pyos-switch{position:relative;display:inline-flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.pyos-switch input{position:absolute;opacity:0;width:0;height:0}
.pyos-switch__track{width:46px;height:26px;border-radius:99px;background:var(--pyos-surface-3);border:1px solid var(--pyos-border);transition:background var(--pyos-duration-normal) var(--pyos-easing),border-color var(--pyos-duration-normal);position:relative;flex:0 0 auto}
.pyos-switch__thumb{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--pyos-text-dim);transition:transform var(--pyos-duration-normal) var(--pyos-easing),background var(--pyos-duration-normal)}
.pyos-switch input:checked + .pyos-switch__track{background:var(--pyos-accent);border-color:transparent}
.pyos-switch input:checked + .pyos-switch__track .pyos-switch__thumb{transform:translateX(20px);background:#fff}
.pyos-switch input:focus-visible + .pyos-switch__track{box-shadow:0 0 0 3px rgba(var(--pyos-accent-rgb),.28)}

.pyos-slider{-webkit-appearance:none;appearance:none;width:100%;height:26px;background:transparent;cursor:pointer}
.pyos-slider::-webkit-slider-runnable-track{height:6px;border-radius:99px;background:var(--pyos-surface-3)}
.pyos-slider::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;margin-top:-6px;border-radius:50%;background:var(--pyos-accent);box-shadow:0 2px 8px rgba(var(--pyos-accent-rgb),.5);transition:transform var(--pyos-duration-fast)}
.pyos-slider::-webkit-slider-thumb:hover{transform:scale(1.15)}
.pyos-slider::-moz-range-track{height:6px;border-radius:99px;background:var(--pyos-surface-3)}
.pyos-slider::-moz-range-thumb{width:18px;height:18px;border:none;border-radius:50%;background:var(--pyos-accent)}

.pyos-chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:99px;background:var(--pyos-surface-2);border:1px solid var(--pyos-border);font-size:12px;color:var(--pyos-text-dim);white-space:nowrap;transition:all var(--pyos-duration-fast)}
.pyos-chip--active{background:rgba(var(--pyos-accent-rgb),.18);border-color:rgba(var(--pyos-accent-rgb),.4);color:var(--pyos-accent)}
.pyos-chip--button{cursor:pointer}
.pyos-chip--button:hover{border-color:var(--pyos-border-strong);color:var(--pyos-text)}

.pyos-badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--pyos-danger);color:#fff;font-size:11px;font-weight:700}

.pyos-divider{height:1px;background:var(--pyos-border);border:none;margin:0}
.pyos-divider--vertical{width:1px;height:22px;margin:0 2px}

.pyos-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:38px 20px;color:var(--pyos-text-faint);text-align:center}
.pyos-empty svg{width:44px;height:44px;opacity:.5}

.pyos-spinner{width:18px;height:18px;border-radius:50%;border:2px solid rgba(var(--pyos-accent-rgb),.25);border-top-color:var(--pyos-accent);animation:pyosSpin .8s linear infinite}
@keyframes pyosSpin{to{transform:rotate(360deg)}}

.pyos-progress{height:5px;border-radius:99px;background:var(--pyos-surface-3);overflow:hidden}
.pyos-progress__bar{height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,rgba(var(--pyos-accent-rgb),.55),var(--pyos-accent));transition:width var(--pyos-duration-normal) var(--pyos-easing)}

.pyos-skeleton{background:linear-gradient(90deg,var(--pyos-surface-2) 25%,var(--pyos-surface-3) 50%,var(--pyos-surface-2) 75%);background-size:200% 100%;animation:pyosShimmer 1.4s infinite;border-radius:8px}
@keyframes pyosShimmer{from{background-position:200% 0}to{background-position:-200% 0}}

/* ══════════════════════════════════════════════════════════════════════════
   РАЗДЕЛ 5. ВЕРХНЯЯ ПАНЕЛЬ
   ══════════════════════════════════════════════════════════════════════════ */
#pyos-topbar{
  position:fixed;top:0;left:0;right:0;height:var(--pyos-topbar-height);z-index:9000;
  display:flex;align-items:center;gap:10px;padding:0 10px;
  background:var(--pyos-surface);border-bottom:1px solid var(--pyos-border);
  backdrop-filter:blur(var(--pyos-blur));-webkit-backdrop-filter:blur(var(--pyos-blur));
  animation:pyosSlideDown var(--pyos-duration-slow) var(--pyos-easing) both;
}
@keyframes pyosSlideDown{from{transform:translateY(-100%);opacity:0}to{transform:none;opacity:1}}

.pyos-topbar__group{display:flex;align-items:center;gap:6px;min-width:0}
.pyos-topbar__spacer{flex:1}

.pyos-workspaces{display:flex;align-items:center;gap:4px;padding:3px;border-radius:var(--pyos-radius-pill);background:var(--pyos-surface-2);border:1px solid var(--pyos-border)}
.pyos-workspace{
  width:30px;height:26px;border-radius:99px;display:grid;place-items:center;
  font-size:12px;font-weight:600;color:var(--pyos-text-dim);position:relative;
  transition:all var(--pyos-duration-normal) var(--pyos-easing);
}
.pyos-workspace:hover{color:var(--pyos-text);background:var(--pyos-surface-hover)}
.pyos-workspace.is-active{background:var(--pyos-accent);color:var(--pyos-accent-contrast);box-shadow:0 3px 12px rgba(var(--pyos-accent-rgb),.45)}
.pyos-workspace.has-windows::after{content:'';position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--pyos-accent)}
.pyos-workspace.is-active.has-windows::after{background:var(--pyos-accent-contrast)}

.pyos-clock{display:flex;flex-direction:column;align-items:center;line-height:1.15;padding:0 6px;cursor:pointer;border-radius:var(--pyos-radius-control);transition:background var(--pyos-duration-fast)}
.pyos-clock:hover{background:var(--pyos-surface-hover)}
.pyos-clock__time{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.pyos-clock__date{font-size:10.5px;color:var(--pyos-text-dim)}

.pyos-status-chips{display:flex;align-items:center;gap:6px}

.pyos-icon-button{
  width:36px;height:36px;border-radius:var(--pyos-radius-control);display:grid;place-items:center;
  color:var(--pyos-text-dim);position:relative;
  transition:all var(--pyos-duration-fast) var(--pyos-easing);
}
.pyos-icon-button:hover{background:var(--pyos-surface-hover);color:var(--pyos-text);transform:translateY(-1px)}
.pyos-icon-button:active{transform:scale(.94)}
.pyos-icon-button.is-active{color:var(--pyos-accent);background:rgba(var(--pyos-accent-rgb),.14)}
.pyos-icon-button__badge{position:absolute;top:4px;right:4px;width:8px;height:8px;border-radius:50%;background:var(--pyos-danger);border:2px solid var(--pyos-surface-solid);animation:pyosPulseDot 1.8s infinite}
@keyframes pyosPulseDot{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.35);opacity:.7}}

/* ══════════════════════════════════════════════════════════════════════════
   РАЗДЕЛ 6. ДОК
   ══════════════════════════════════════════════════════════════════════════ */
#pyos-dock{
  position:fixed;bottom:10px;left:50%;transform:translateX(-50%);z-index:9000;
  display:flex;align-items:flex-end;gap:6px;padding:8px 10px;

/* ══════════════════════════════════════════════════════════════════════════

#pyos-desktop{position:fixed;inset:0;z-index:1000;overflow:hidden;contain:strict}

   РАЗДЕЛ 9. ЦЕНТР УВЕДОМЛЕНИЙ И БЫСТРЫЕ НАСТРОЙКИ
   ══════════════════════════════════════════════════════════════════════════ */

.pyos-editor__toolbar{display:flex;align-items:center;gap:6px;padding:7px 9px;border-bottom:1px solid var(--pyos-border);background:var(--pyos-surface-2);overflow-x:auto;scrollbar-width:none;flex:0 0 auto}
.pyos-editor__toolbar::-webkit-scrollbar{display:none}
.pyos-editor__tabs{display:flex;align-items:stretch;gap:4px;padding:6px 8px 0;border-bottom:1px solid var(--pyos-border);background:var(--pyos-surface-2);overflow-x:auto;scrollbar-width:none;flex:0 0 auto}
.pyos-editor__tabs::-webkit-scrollbar{display:none}
.pyos-editor__tab{
  display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:11px 11px 0 0;
  background:transparent;border:1px solid transparent;border-bottom:none;font-size:12.5px;color:var(--pyos-text-dim);
  white-space:nowrap;position:relative;transition:all var(--pyos-duration-fast) var(--pyos-easing);max-width:220px;
}
.pyos-editor__tab:hover{background:var(--pyos-surface-hover);color:var(--pyos-text)}
.pyos-editor__tab.is-active{background:var(--pyos-surface-solid);color:var(--pyos-text);border-color:var(--pyos-border);font-weight:600}
.pyos-editor__tab.is-active::after{content:'';position:absolute;left:0;right:0;top:-1px;height:2px;background:var(--pyos-accent);border-radius:2px}
.pyos-editor__tab-name{overflow:hidden;text-overflow:ellipsis}
.pyos-editor__tab-dot{width:7px;height:7px;border-radius:50%;background:var(--pyos-warning);flex:0 0 auto}
.pyos-editor__tab-close{width:18px;height:18px;border-radius:6px;display:grid;place-items:center;color:var(--pyos-text-faint);flex:0 0 auto}
.pyos-editor__tab-close:hover{background:var(--pyos-danger);color:#fff}

.pyos-editor__find{display:flex;align-items:center;gap:7px;padding:8px 10px;border-bottom:1px solid var(--pyos-border);background:var(--pyos-surface-2);flex-wrap:wrap;flex:0 0 auto;animation:pyosSlideDown var(--pyos-duration-normal) var(--pyos-easing) both}
.pyos-editor__find .pyos-field{width:auto;flex:1;min-width:130px;height:32px}

.pyos-editor__main{flex:1;min-height:0;display:flex;position:relative}
.pyos-editor__outline{width:230px;flex:0 0 auto;border-right:1px solid var(--pyos-border);background:var(--pyos-surface-2);overflow:auto;padding:8px;display:flex;flex-direction:column;gap:3px;animation:pyosSlideRight var(--pyos-duration-normal) var(--pyos-easing) both}
@keyframes pyosSlideRight{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
.pyos-editor__outline-title{font-size:10.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--pyos-text-faint);padding:6px 8px}
.pyos-editor__outline-item{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:9px;font-size:12.5px;color:var(--pyos-text-dim);text-align:left;width:100%;transition:all var(--pyos-duration-fast)}
.pyos-editor__outline-item:hover{background:var(--pyos-surface-hover);color:var(--pyos-text);padding-left:12px}
.pyos-editor__outline-item svg{width:15px;height:15px;color:var(--pyos-accent)}
.pyos-editor__outline-item.is-nested{padding-left:22px;font-size:12px}

.pyos-editor__area{flex:1;min-width:0;display:flex;position:relative;background:var(--pyos-code-bg)}
.pyos-editor__gutter{
  flex:0 0 auto;width:56px;padding:12px 10px 12px 0;text-align:right;overflow:hidden;
  font-family:var(--pyos-font-code);font-size:var(--pyos-font-size-code);line-height:var(--pyos-line-height);
  color:var(--pyos-text-faint);background:var(--pyos-surface-2);border-right:1px solid var(--pyos-border);
  user-select:none;-webkit-user-select:none;
}
.pyos-editor__gutter-line{height:calc(var(--pyos-font-size-code) * var(--pyos-line-height));font-variant-numeric:tabular-nums;transition:color var(--pyos-duration-fast)}
.pyos-editor__gutter-line.is-current{color:var(--pyos-accent);font-weight:700}
.pyos-editor__stack{position:relative;flex:1;min-width:0;overflow:hidden}
.pyos-editor__highlight,.pyos-editor__input{
  position:absolute;inset:0;margin:0;padding:12px 14px;
  font-family:var(--pyos-font-code);font-size:var(--pyos-font-size-code);line-height:var(--pyos-line-height);
  tab-size:var(--pyos-tab-size,4);letter-spacing:0;white-space:pre;word-break:normal;
  border:none;overflow:auto;
}
.pyos-editor__highlight{pointer-events:none;color:var(--pyos-text);z-index:1;scrollbar-width:none}
.pyos-editor__highlight::-webkit-scrollbar{display:none}
.pyos-editor__highlight code{font:inherit;background:none;padding:0}
.pyos-editor__input{
  z-index:2;background:transparent;color:transparent;caret-color:var(--pyos-accent);resize:none;outline:none;
  -webkit-text-fill-color:transparent;
}
.pyos-editor__input::selection{background:rgba(var(--pyos-accent-rgb),.32);-webkit-text-fill-color:transparent}
.pyos-editor.is-wrapped .pyos-editor__highlight,.pyos-editor.is-wrapped .pyos-editor__input{white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere}
.pyos-editor__active-line{position:absolute;left:0;right:0;height:calc(var(--pyos-font-size-code) * var(--pyos-line-height));background:rgba(var(--pyos-accent-rgb),.07);border-left:2px solid rgba(var(--pyos-accent-rgb),.55);pointer-events:none;z-index:0;transition:transform 90ms linear}
.pyos-editor__status{display:flex;align-items:center;gap:12px;padding:0 12px;height:30px;flex:0 0 auto;border-top:1px solid var(--pyos-border);background:var(--pyos-surface-2);font-size:11.5px;color:var(--pyos-text-dim);overflow-x:auto;scrollbar-width:none;white-space:nowrap}
.pyos-editor__status::-webkit-scrollbar{display:none}
.pyos-editor__status-item{display:flex;align-items:center;gap:5px}
.pyos-editor__status-item.is-accent{color:var(--pyos-accent);font-weight:600}
.pyos-editor__status-spacer{flex:1}

.tok-comment{color:var(--pyos-token-comment);font-style:italic}
.tok-string{color:var(--pyos-token-string)}
.tok-keyword{color:var(--pyos-token-keyword);font-weight:600}
.tok-builtin{color:var(--pyos-token-builtin)}
.tok-number{color:var(--pyos-token-number)}
.tok-function{color:var(--pyos-token-function)}
.tok-operator{color:var(--pyos-token-operator)}
.tok-punctuation{color:var(--pyos-token-punctuation)}
.tok-tag{color:var(--pyos-token-tag)}
.tok-attr{color:var(--pyos-token-attr)}
.tok-constant{color:var(--pyos-token-constant)}
.tok-decorator{color:var(--pyos-token-decorator)}
.tok-heading{color:var(--pyos-token-keyword);font-weight:700}
.tok-emphasis{font-style:italic;color:var(--pyos-token-function)}

/* ══════════════════════════════════════════════════════════════════════════
   РАЗДЕЛ 12. ПРИЛОЖЕНИЕ «ФАЙЛЫ»
   ══════════════════════════════════════════════════════════════════════════ */
.pyos-files{display:flex;height:100%;min-height:0}
.pyos-files__sidebar{width:236px;flex:0 0 auto;display:flex;flex-direction:column;border-right:1px solid var(--pyos-border);background:var(--pyos-surface-2);min-height:0}
.pyos-files__sidebar-header{padding:11px 12px;font-size:10.5px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:var(--pyos-text-faint);display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid var(--pyos-border)}
.pyos-files__tree{flex:1;overflow:auto;padding:7px}
.pyos-files__storage{padding:11px 12px;border-top:1px solid var(--pyos-border);display:grid;gap:7px}
.pyos-files__storage-label{display:flex;justify-content:space-between;font-size:11.5px;color:var(--pyos-text-dim)}

.pyos-tree__row{
  display:flex;align-items:center;gap:7px;width:100%;padding:6px 8px;border-radius:9px;
  font-size:12.5px;color:var(--pyos-text-dim);text-align:left;position:relative;
  transition:background var(--pyos-duration-fast),color var(--pyos-duration-fast),padding-left var(--pyos-duration-fast);
}
.pyos-tree__row:hover{background:var(--pyos-surface-hover);color:var(--pyos-text)}
.pyos-tree__row.is-active{background:rgba(var(--pyos-accent-rgb),.16);color:var(--pyos-accent);font-weight:600}
.pyos-tree__row.is-drop-target{box-shadow:inset 0 0 0 2px var(--pyos-accent);background:rgba(var(--pyos-accent-rgb),.1)}
.pyos-tree__row svg{width:16px;height:16px;flex:0 0 auto}
.pyos-tree__row-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pyos-tree__caret{width:16px;height:16px;transition:transform var(--pyos-duration-fast) var(--pyos-easing)}
.pyos-tree__caret.is-open{transform:rotate(90deg)}
.pyos-tree__children{margin-left:14px;border-left:1px dashed var(--pyos-border);padding-left:4px;display:flex;flex-direction:column;gap:1px}

.pyos-files__main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.pyos-files__toolbar{display:flex;align-items:center;gap:7px;padding:8px 10px;border-bottom:1px solid var(--pyos-border);background:var(--pyos-surface-2);flex-wrap:wrap;flex:0 0 auto}
.pyos-files__breadcrumbs{display:flex;align-items:center;gap:3px;flex:1;min-width:120px;overflow-x:auto;scrollbar-width:none}
.pyos-files__breadcrumbs::-webkit-scrollbar{display:none}
.pyos-files__crumb{display:flex;align-items:center;gap:5px;padding:5px 9px;border-radius:9px;font-size:12.5px;color:var(--pyos-text-dim);white-space:nowrap;transition:all var(--pyos-duration-fast)}
.pyos-files__crumb:hover{background:var(--pyos-surface-hover);color:var(--pyos-text)}
.pyos-files__crumb.is-current{color:var(--pyos-text);font-weight:600}
.pyos-files__crumb-separator{color:var(--pyos-text-faint);opacity:.6}

.pyos-files__list{flex:1;overflow:auto;padding:10px;display:grid;gap:6px;align-content:start}
.pyos-files__list.is-grid{grid-template-columns:repeat(auto-fill,minmax(126px,1fr));gap:11px}
.pyos-file-row{
  display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:12px;
  background:var(--pyos-surface-2);border:1px solid transparent;cursor:pointer;
  transition:all var(--pyos-duration-fast) var(--pyos-easing);animation:pyosFadeIn var(--pyos-duration-normal) var(--pyos-easing) both;
}
.pyos-file-row:hover{border-color:var(--pyos-border-strong);transform:translateY(-1px);box-shadow:var(--pyos-shadow-soft)}
.pyos-file-row.is-selected{border-color:rgba(var(--pyos-accent-rgb),.6);background:rgba(var(--pyos-accent-rgb),.12)}
.pyos-file-row.is-drop-target{border-color:var(--pyos-accent);box-shadow:inset 0 0 0 2px var(--pyos-accent)}
.pyos-file-row.is-dragging{opacity:.4}
.pyos-file-row__icon{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--pyos-surface-3);color:var(--pyos-accent);flex:0 0 auto}
.pyos-file-row__info{flex:1;min-width:0}
.pyos-file-row__name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pyos-file-row__meta{font-size:11px;color:var(--pyos-text-dim);margin-top:2px}
.pyos-file-row__actions{display:flex;gap:4px;opacity:0;transition:opacity var(--pyos-duration-fast)}
.pyos-file-row:hover .pyos-file-row__actions,.pyos-file-row.is-selected .pyos-file-row__actions{opacity:1}

.pyos-files__list.is-grid .pyos-file-row{flex-direction:column;text-align:center;padding:15px 9px;gap:9px}
.pyos-files__list.is-grid .pyos-file-row__icon{width:46px;height:46px;border-radius:15px}
.pyos-files__list.is-grid .pyos-file-row__icon svg{width:24px;height:24px}
.pyos-files__list.is-grid .pyos-file-row__actions{position:absolute;top:6px;right:6px}
.pyos-files__list.is-grid .pyos-file-row{position:relative}

.pyos-drag-ghost{
  position:fixed;z-index:99999;pointer-events:none;padding:7px 13px;border-radius:11px;
  background:var(--pyos-accent);color:var(--pyos-accent-contrast);font-size:12.5px;font-weight:600;
  box-shadow:0 12px 30px rgba(var(--pyos-accent-rgb),.45);transform:translate(-50%,-140%) scale(1.03);
  animation:pyosFadeIn var(--pyos-duration-fast) both;
}

/* ══════════════════════════════════════════════════════════════════════════
   РАЗДЕЛ 13. ПРИЛОЖЕНИЕ «ТЕРМИНАЛ»
   ══════════════════════════════════════════════════════════════════════════ */
.pyos-terminal{display:flex;flex-direction:column;height:100%;min-height:0;background:var(--pyos-code-bg)}
.pyos-terminal__toolbar{display:flex;align-items:center;gap:6px;padding:7px 9px;border-bottom:1px solid var(--pyos-border);background:var(--pyos-surface-2);overflow-x:auto;scrollbar-width:none;flex:0 0 auto}
.pyos-terminal__toolbar::-webkit-scrollbar{display:none}
.pyos-terminal__output{
  flex:1;min-height:0;overflow:auto;padding:12px 14px;margin:0;
  font-family:var(--pyos-font-code);font-size:13px;line-height:1.65;white-space:pre-wrap;word-break:break-word;
}
.pyos-terminal__line{animation:pyosTerminalLine var(--pyos-duration-normal) var(--pyos-easing) both}
@keyframes pyosTerminalLine{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.pyos-terminal__line--command{color:var(--pyos-text);font-weight:600}
.pyos-terminal__line--output{color:var(--pyos-text-dim)}
.pyos-terminal__line--error{color:var(--pyos-danger)}
.pyos-terminal__line--success{color:var(--pyos-success)}
.pyos-terminal__line--warning{color:var(--pyos-warning)}
.pyos-terminal__line--info{color:var(--pyos-info)}
.pyos-terminal__line--muted{color:var(--pyos-text-faint);font-style:italic}
.pyos-terminal__prompt{color:var(--pyos-accent);font-weight:700}
.pyos-terminal__input-row{display:flex;align-items:center;gap:9px;padding:9px 12px;border-top:1px solid var(--pyos-border);background:var(--pyos-surface-2);flex:0 0 auto}
.pyos-terminal__input{flex:1;height:36px;background:transparent;border:none;outline:none;font-family:var(--pyos-font-code);font-size:13px;color:var(--pyos-text)}
.pyos-terminal__suggest{position:absolute;bottom:56px;left:12px;right:12px;max-height:190px;overflow:auto;background:var(--pyos-surface-solid);border:1px solid var(--pyos-border);border-radius:12px;box-shadow:var(--pyos-shadow);z-index:30;padding:5px;animation:pyosPanelIn var(--pyos-duration-fast) var(--pyos-easing) both}
.pyos-terminal__suggest-item{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:8px;font-size:12.5px;cursor:pointer;width:100%;text-align:left}
.pyos-terminal__suggest-item:hover,.pyos-terminal__suggest-item.is-selected{background:rgba(var(--pyos-accent-rgb),.16);color:var(--pyos-accent)}
.pyos-terminal__suggest-item-name{font-family:var(--pyos-font-code);font-weight:600}
.pyos-terminal__suggest-item-desc{color:var(--pyos-text-dim);font-size:11.5px;margin-left:auto;text-align:right}

/* ══════════════════════════════════════════════════════════════════════════
   РАЗДЕЛ 14. ПРИЛОЖЕНИЕ «GEMINI»
   ══════════════════════════════════════════════════════════════════════════ */
.pyos-gemini{display:flex;height:100%;min-height:0}
.pyos-gemini__sidebar{width:224px;flex:0 0 auto;display:flex;flex-direction:column;border-right:1px solid var(--pyos-border);background:var(--pyos-surface-2);min-height:0}
.pyos-gemini__sidebar-header{padding:10px;display:flex;gap:7px;border-bottom:1px solid var(--pyos-border)}
.pyos-gemini__chats{flex:1;overflow:auto;padding:7px;display:flex;flex-direction:column;gap:5px}
.pyos-gemini__chat{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:11px;font-size:12.5px;color:var(--pyos-text-dim);text-align:left;width:100%;transition:all var(--pyos-duration-fast)}
.pyos-gemini__chat:hover{background:var(--pyos-surface-hover);color:var(--pyos-text)}
.pyos-gemini__chat.is-active{background:rgba(var(--pyos-accent-rgb),.16);color:var(--pyos-accent);font-weight:600}
.pyos-gemini__chat-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pyos-gemini__chat-delete{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;color:var(--pyos-text-faint);opacity:0;transition:opacity var(--pyos-duration-fast)}
.pyos-gemini__chat:hover .pyos-gemini__chat-delete{opacity:1}
.pyos-gemini__chat-delete:hover{background:var(--pyos-danger);color:#fff}

.pyos-gemini__main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.pyos-gemini__header{display:flex;align-items:center;gap:8px;padding:8px 11px;border-bottom:1px solid var(--pyos-border);background:var(--pyos-surface-2);flex:0 0 auto;flex-wrap:wrap}
.pyos-gemini__messages{flex:1;min-height:0;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:13px}
.pyos-gemini__message{display:flex;gap:10px;max-width:min(880px,100%);animation:pyosMessageIn var(--pyos-duration-slow) var(--pyos-easing) both}
@keyframes pyosMessageIn{from{opacity:0;transform:translateY(12px) scale(.985)}to{opacity:1;transform:none}}
.pyos-gemini__avatar{width:32px;height:32px;border-radius:11px;display:grid;place-items:center;flex:0 0 auto;color:#fff}
.pyos-gemini__message--user .pyos-gemini__avatar{background:linear-gradient(140deg,var(--pyos-accent),rgba(var(--pyos-accent-rgb),.55))}
.pyos-gemini__message--model .pyos-gemini__avatar{background:linear-gradient(140deg,#4f9dff,#8b5cf6)}
.pyos-gemini__bubble{flex:1;min-width:0;padding:12px 14px;border-radius:15px;background:var(--pyos-surface-2);border:1px solid var(--pyos-border);font-size:13.5px;line-height:1.65;word-break:break-word}
.pyos-gemini__message--user .pyos-gemini__bubble{background:rgba(var(--pyos-accent-rgb),.12);border-color:rgba(var(--pyos-accent-rgb),.26)}
.pyos-gemini__bubble p{margin:0 0 9px}
.pyos-gemini__bubble p:last-child{margin-bottom:0}
.pyos-gemini__bubble h1,.pyos-gemini__bubble h2,.pyos-gemini__bubble h3{margin:13px 0 7px;font-size:14.5px;line-height:1.35}
.pyos-gemini__bubble ul,.pyos-gemini__bubble ol{margin:7px 0;padding-left:20px}
.pyos-gemini__bubble li{margin-bottom:4px}
.pyos-gemini__bubble code{font-family:var(--pyos-font-code);font-size:12.5px;background:var(--pyos-surface-3);padding:2px 6px;border-radius:6px}
.pyos-gemini__code{margin:10px 0;border-radius:12px;overflow:hidden;border:1px solid var(--pyos-border);background:var(--pyos-code-bg)}
.pyos-gemini__code-header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 10px;background:var(--pyos-surface-2);border-bottom:1px solid var(--pyos-border);font-size:11.5px;color:var(--pyos-text-dim)}
.pyos-gemini__code-body{margin:0;padding:11px 13px;overflow:auto;font-family:var(--pyos-font-code);font-size:12.5px;line-height:1.6;max-height:340px}
.pyos-gemini__message-actions{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.pyos-gemini__typing{display:flex;gap:5px;padding:5px 0}
.pyos-gemini__typing span{width:8px;height:8px;border-radius:50%;background:var(--pyos-accent);animation:pyosTyping 1.2s infinite ease-in-out}
.pyos-gemini__typing span:nth-child(2){animation-delay:.18s}
.pyos-gemini__typing span:nth-child(3){animation-delay:.36s}
@keyframes pyosTyping{0%,80%,100%{opacity:.3;transform:scale(.8)}40%{opacity:1;transform:scale(1.1)}}
.pyos-gemini__composer{padding:11px;border-top:1px solid var(--pyos-border);background:var(--pyos-surface-2);flex:0 0 auto}
.pyos-gemini__composer-box{display:flex;align-items:flex-end;gap:9px;padding:9px;border-radius:16px;background:var(--pyos-surface-solid);border:1px solid var(--pyos-border);transition:border-color var(--pyos-duration-fast),box-shadow var(--pyos-duration-fast)}
.pyos-gemini__composer-box:focus-within{border-color:var(--pyos-accent);box-shadow:0 0 0 3px rgba(var(--pyos-accent-rgb),.14)}
.pyos-gemini__composer textarea{flex:1;min-height:42px;max-height:170px;background:transparent;border:none;outline:none;resize:none;font-size:13.5px;line-height:1.55;padding:9px 4px}
.pyos-gemini__meta{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:11px;color:var(--pyos-text-faint);flex-wrap:wrap}

/* ══════════════════════════════════════════════════════════════════════════
   РАЗДЕЛ 15. ПРИЛОЖЕНИЯ «PYTHON», «ПРЕДПРОСМОТР», «НАСТРОЙКИ», «О СИСТЕМЕ»
   ══════════════════════════════════════════════════════════════════════════ */
.pyos-python{display:flex;flex-direction:column;height:100%;min-height:0}
.pyos-python__toolbar{display:flex;align-items:center;gap:7px;padding:8px 10px;border-bottom:1px solid var(--pyos-border);background:var(--pyos-surface-2);flex-wrap:wrap;flex:0 0 auto}
.pyos-python__split{flex:1;min-height:0;display:flex;flex-direction:column}
.pyos-python__code{flex:1;min-height:0;border:none;outline:none;resize:none;padding:12px 14px;background:var(--pyos-code-bg);color:var(--pyos-text);font-family:var(--pyos-font-code);font-size:var(--pyos-font-size-code);line-height:1.6}
.pyos-python__output{height:38%;min-height:90px;border-top:1px solid var(--pyos-border);overflow:auto;padding:11px 13px;margin:0;font-family:var(--pyos-font-code);font-size:12.5px;line-height:1.6;white-space:pre-wrap;background:var(--pyos-code-bg)}
.pyos-python__variables{border-top:1px solid var(--pyos-border);max-height:150px;overflow:auto;padding:9px;background:var(--pyos-surface-2)}
.pyos-python__variable{display:flex;gap:9px;align-items:baseline;padding:5px 8px;border-radius:8px;font-size:12px;font-family:var(--pyos-font-code)}
.pyos-python__variable:nth-child(odd){background:var(--pyos-surface-hover)}
.pyos-python__variable-name{color:var(--pyos-accent);font-weight:600}
.pyos-python__variable-type{color:var(--pyos-text-faint);font-size:11px}
.pyos-python__variable-value{color:var(--pyos-text-dim);margin-left:auto;max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.pyos-preview{display:flex;flex-direction:column;height:100%;min-height:0}
.pyos-preview__toolbar{display:flex;align-items:center;gap:7px;padding:8px 10px;border-bottom:1px solid var(--pyos-border);background:var(--pyos-surface-2);flex-wrap:wrap;flex:0 0 auto}
.pyos-preview__stage{flex:1;min-height:0;display:grid;place-items:center;padding:14px;background:repeating-conic-gradient(var(--pyos-surface-2) 0% 25%,transparent 0% 50%) 50%/22px 22px;overflow:auto}
.pyos-preview__frame-wrapper{background:#fff;border-radius:12px;overflow:hidden;box-shadow:var(--pyos-shadow);transition:width var(--pyos-duration-normal) var(--pyos-easing);height:100%;width:100%}
.pyos-preview__frame{width:100%;height:100%;border:none;display:block;background:#fff}

.pyos-settings{display:flex;height:100%;min-height:0}
.pyos-settings__nav{width:206px;flex:0 0 auto;border-right:1px solid var(--pyos-border);background:var(--pyos-surface-2);overflow:auto;padding:8px;display:flex;flex-direction:column;gap:3px}
.pyos-settings__nav-item{display:flex;align-items:center;gap:10px;padding:10px 11px;border-radius:11px;font-size:13px;color:var(--pyos-text-dim);text-align:left;width:100%;transition:all var(--pyos-duration-fast) var(--pyos-easing)}
.pyos-settings__nav-item:hover{background:var(--pyos-surface-hover);color:var(--pyos-text);padding-left:14px}
.pyos-settings__nav-item.is-active{background:rgba(var(--pyos-accent-rgb),.16);color:var(--pyos-accent);font-weight:600}
.pyos-settings__content{flex:1;min-width:0;overflow:auto;padding:18px}
.pyos-settings__section{animation:pyosFadeIn var(--pyos-duration-normal) var(--pyos-easing) both;margin-bottom:26px}
.pyos-settings__section-title{font-size:16px;font-weight:700;margin:0 0 4px}
.pyos-settings__section-desc{font-size:12.5px;color:var(--pyos-text-dim);margin:0 0 15px;line-height:1.5}
.pyos-settings__card{background:var(--pyos-surface-2);border:1px solid var(--pyos-border);border-radius:var(--pyos-radius-panel);overflow:hidden;margin-bottom:12px}
.pyos-settings__row{display:flex;align-items:center;gap:14px;padding:13px 15px;border-bottom:1px solid var(--pyos-border);transition:background var(--pyos-duration-fast)}
.pyos-settings__row:last-child{border-bottom:none}
.pyos-settings__row:hover{background:var(--pyos-surface-hover)}
.pyos-settings__row-info{flex:1;min-width:0}
.pyos-settings__row-title{font-size:13.5px;font-weight:500}
.pyos-settings__row-desc{font-size:11.5px;color:var(--pyos-text-dim);margin-top:3px;line-height:1.45}
.pyos-settings__row-control{flex:0 0 auto;display:flex;align-items:center;gap:8px}
.pyos-settings__row-control .pyos-field{width:auto;min-width:150px}
.pyos-settings__accents{display:flex;gap:9px;flex-wrap:wrap}
.pyos-settings__accent{width:32px;height:32px;border-radius:11px;border:2px solid transparent;transition:transform var(--pyos-duration-fast) var(--pyos-easing),border-color var(--pyos-duration-fast)}
.pyos-settings__accent:hover{transform:scale(1.12)}
.pyos-settings__accent.is-active{border-color:var(--pyos-text);transform:scale(1.06)}

.pyos-about{height:100%;overflow:auto;padding:20px}
.pyos-about__hero{display:flex;align-items:center;gap:17px;padding:20px;border-radius:calc(var(--pyos-radius-window) + 2px);background:linear-gradient(135deg,rgba(var(--pyos-accent-rgb),.2),rgba(var(--pyos-accent-rgb),.04));border:1px solid rgba(var(--pyos-accent-rgb),.28);margin-bottom:17px;animation:pyosFadeIn var(--pyos-duration-slow) var(--pyos-easing) both}
.pyos-about__logo{width:66px;height:66px;border-radius:21px;display:grid;place-items:center;background:linear-gradient(145deg,var(--pyos-accent),rgba(var(--pyos-accent-rgb),.45));color:#fff;box-shadow:0 12px 30px rgba(var(--pyos-accent-rgb),.4);flex:0 0 auto;animation:pyosBootPulse 3.4s infinite}
.pyos-about__logo svg{width:36px;height:36px}
.pyos-about__title{font-size:21px;font-weight:700;margin:0}
.pyos-about__version{font-size:12.5px;color:var(--pyos-text-dim);margin-top:4px}
.pyos-about__grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(216px,1fr));gap:11px}
.pyos-about__card{padding:14px;border-radius:var(--pyos-radius-panel);background:var(--pyos-surface-2);border:1px solid var(--pyos-border);transition:transform var(--pyos-duration-normal) var(--pyos-easing),box-shadow var(--pyos-duration-normal)}
.pyos-about__card:hover{transform:translateY(-3px);box-shadow:var(--pyos-shadow-soft)}
.pyos-about__card-label{font-size:10.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--pyos-text-faint);display:flex;align-items:center;gap:6px}
.pyos-about__card-value{font-size:16px;font-weight:600;margin-top:7px;word-break:break-word}
.pyos-about__card-note{font-size:11.5px;color:var(--pyos-text-dim);margin-top:3px}
.pyos-about__list{display:grid;gap:6px;margin-top:10px}
.pyos-about__list-item{display:flex;gap:9px;align-items:center;font-size:12.5px;color:var(--pyos-text-dim);padding:7px 10px;border-radius:9px;background:var(--pyos-surface-2)}
.pyos-about__list-item svg{color:var(--pyos-success);width:16px;height:16px}

/* ══════════════════════════════════════════════════════════════════════════
   РАЗДЕЛ 16. АДАПТИВНОСТЬ (ПЛАНШЕТ И ТЕЛЕФОН)
   ══════════════════════════════════════════════════════════════════════════ */
@media (max-width:1080px){
  .pyos-editor__outline{width:196px}
  .pyos-files__sidebar{width:204px}
  .pyos-gemini__sidebar{width:196px}
  .pyos-settings__nav{width:180px}
}
@media (max-width:820px){
  :root{--pyos-topbar-height:48px;--pyos-dock-height:60px}
  .pyos-status-chips .pyos-chip[data-optional="true"]{display:none}
  .pyos-clock__date{display:none}
  .pyos-editor__outline,.pyos-files__sidebar,.pyos-gemini__sidebar{display:none}
  .pyos-settings__nav{width:56px;padding:6px}
  .pyos-settings__nav-item{justify-content:center;padding:11px 0}
  .pyos-settings__nav-item span{display:none}
  .pyos-window{min-width:260px}
  #pyos-dock{bottom:8px;padding:6px;gap:5px;border-radius:22px}
  .pyos-dock__item{width:44px;height:44px;border-radius:14px}
  .pyos-dock__label{display:none}
  .pyos-editor__gutter{width:42px}
}
@media (max-width:560px){
  .pyos-topbar__group[data-role="status"]{display:none}
  #pyos-notifications{left:10px;right:10px;width:auto}
  .pyos-modal{border-radius:20px}
  .pyos-launcher__grid{grid-template-columns:repeat(auto-fill,minmax(118px,1fr))}
  .pyos-settings__row{flex-direction:column;align-items:flex-start;gap:10px}
  .pyos-settings__row-control{width:100%}
  .pyos-settings__row-control .pyos-field{width:100%}
  .pyos-files__list.is-grid{grid-template-columns:repeat(auto-fill,minmax(100px,1fr))}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}
html[data-animations="false"] *,
html[data-animations="false"] *::before,
html[data-animations="false"] *::after{
  animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;
}
html[data-performance="high"] #pyos-wallpaper::before,
html[data-performance="high"] #pyos-wallpaper::after{animation:none}
html[data-performance="high"] .pyos-window{backdrop-filter:none;-webkit-backdrop-filter:none}
</style>
</head>

<body>

<div id="pyos-boot">
  <div class="pyos-boot__logo">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M9.4 16.6 4.8 12l4.6-4.6L8 6l-6 6 6 6zm5.2 0 4.6-4.6-4.6-4.6L16 6l6 6-6 6z"/></svg>
  </div>
  <h1 class="pyos-boot__title">PyOS Studio</h1>
  <p class="pyos-boot__subtitle">Операционная среда разработки Python</p>
  <div class="pyos-boot__progress"><div class="pyos-boot__bar" id="pyos-boot-bar"></div></div>
  <div class="pyos-boot__status" id="pyos-boot-status">Подготовка ядра…</div>
</div>

<div id="pyos-wallpaper" data-style="aurora"><canvas id="pyos-canvas"></canvas></div>
<div id="pyos-desktop"></div>
<div id="pyos-snap-preview"></div>

<header id="pyos-topbar">
  <div class="pyos-topbar__group">
    <button class="pyos-icon-button" id="pyos-launcher-button" type="button" data-tooltip="Панель запуска приложений"></button>
    <div class="pyos-workspaces" id="pyos-workspaces"></div>
  </div>

  <div class="pyos-topbar__spacer"></div>

  <div class="pyos-clock" id="pyos-clock" data-tooltip="Системные часы">
    <span class="pyos-clock__time" id="pyos-clock-time">--:--</span>
    <span class="pyos-clock__date" id="pyos-clock-date">—</span>
  </div>

  <div class="pyos-topbar__spacer"></div>

  <div class="pyos-topbar__group" data-role="status">
    <div class="pyos-status-chips" id="pyos-status-chips"></div>
  </div>

  <div class="pyos-topbar__group">
    <button class="pyos-icon-button" id="pyos-layout-button" type="button" data-tooltip="Схема расположения окон"></button>
    <button class="pyos-icon-button" id="pyos-quick-button" type="button" data-tooltip="Быстрые настройки"></button>
    <button class="pyos-icon-button" id="pyos-notifications-button" type="button" data-tooltip="Центр уведомлений"></button>
  </div>
</header>

<nav id="pyos-dock"></nav>
<div id="pyos-notifications"></div>
<div id="pyos-tooltip"></div>
<div id="pyos-overlay-layer"></div>

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   PyOS STUDIO — ЯДРО ОПЕРАЦИОННОЙ СРЕДЫ РАЗРАБОТКИ
   Модульная архитектура: Утилиты → Шина событий → Хранилище → Конфигурация →
   Иконки → Интерфейс → Подсветка → Файловая система → Оконный менеджер →
   Приложения → Загрузка системы
   ═══════════════════════════════════════════════════════════════════════════ */
(function () {
'use strict';

/* ─────────────────────────────────────────────────────────────────────────
   МОДУЛЬ 1. УТИЛИТЫ
   ───────────────────────────────────────────────────────────────────────── */
const Util = (function () {
  let uniqueCounter = 0;

  function uniqueId(prefix) {
    uniqueCounter += 1;
    return (prefix || 'id') + '_' + Date.now().toString(36) + '_' + uniqueCounter.toString(36);
  }

  function clamp(value, minimum, maximum) {
    return Math.min(Math.max(value, minimum), maximum);
  }

  function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, function (character) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[character];
    });
  }

  function escapeAttribute(value) {
    return escapeHtml(value);
  }

  function debounce(handler, delay) {
    let timer = null;
    return function () {
      const context = this;
      const args = arguments;
      clearTimeout(timer);
      timer = setTimeout(function () { handler.apply(context, args); }, delay || 200);
    };
  }

  function throttle(handler, interval) {
    let last = 0;
    let timer = null;
    return function () {
      const context = this;
      const args = arguments;
      const now = Date.now();
      const remaining = interval - (now - last);
      if (remaining <= 0) {
        clearTimeout(timer);
        timer = null;
        last = now;
        handler.apply(context, args);
      } else if (!timer) {
        timer = setTimeout(function () {
          last = Date.now();
          timer = null;
          handler.apply(context, args);
        }, remaining);
      }
    };
  }

  /* Пакетный планировщик кадров: объединяет множественные обновления в один кадр */
  const frameTasks = new Map();
  function scheduleFrame(key, task) {
    frameTasks.set(key, task);
    if (frameTasks.size === 1) {
      requestAnimationFrame(flushFrames);
    }
  }
  function flushFrames() {
    const tasks = Array.from(frameTasks.values());
    frameTasks.clear();
    for (let i = 0; i < tasks.length; i++) {
      try { tasks[i](); } catch (error) { console.error('[PyOS] Ошибка кадра:', error); }
    }
    if (frameTasks.size) requestAnimationFrame(flushFrames);
  }

  function formatBytes(bytes) {
    if (bytes === 0) return '0 байт';
    const units = ['байт', 'КБ', 'МБ', 'ГБ'];
    const index = Math.min(Math.floor(Math.log(bytes) / Math.log(1024)), units.length - 1);
    const value = bytes / Math.pow(1024, index);
    return (index === 0 ? value : value.toFixed(value < 10 ? 2 : 1)) + ' ' + units[index];
  }

  function formatDate(timestamp) {
    const date = new Date(timestamp);
    const now = new Date();
    const sameDay = date.toDateString() === now.toDateString();
    const time = date.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
    if (sameDay) return 'Сегодня, ' + time;
    return date.toLocaleDateString('ru-RU', { day: '2-digit', month: 'short' }) + ', ' + time;
  }

  function pluralize(count, one, few, many) {
    const mod10 = count % 10;
    const mod100 = count % 100;
    if (mod10 === 1 && mod100 !== 11) return one;
    if (mod10 >= 2 && mod10 <= 4 && (mod100 < 10 || mod100 >= 20)) return few;
    return many;
  }

  function isTouchDevice() {
    return window.matchMedia('(hover: none), (pointer: coarse)').matches;
  }

  function isSmallScreen() {
    return window.innerWidth <= 820;
  }

  function prefersReducedMotion() {
    return window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  }

  function downloadText(filename, text, mimeType) {
    const blob = new Blob([text], { type: mimeType || 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1200);
  }

  function readFile(file) {
    return new Promise(function (resolve, reject) {
      const reader = new FileReader();
      reader.onload = function () { resolve(String(reader.result)); };
      reader.onerror = function () { reject(reader.error); };
      reader.readAsText(file);
    });
  }

  async function copyText(text) {
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        return true;
      }
    } catch (error) { /* переходим к запасному способу */ }
    try {
      const area = document.createElement('textarea');
      area.value = text;
      area.setAttribute('readonly', '');
      area.style.position = 'fixed';
      area.style.left = '-9999px';
      document.body.appendChild(area);
      area.select();
      const ok = document.execCommand('copy');
      area.remove();
      return ok;
    } catch (error) {
      return false;
    }
  }

  function elementFromPoint(x, y, ignore) {
    const stack = [];
    let node = document.elementFromPoint(x, y);
    while (node && ignore && ignore.indexOf(node) !== -1) {
      stack.push(node);
      node.style.pointerEvents = 'none';
      node = document.elementFromPoint(x, y);
    }
    stack.forEach(function (n) { n.style.pointerEvents = ''; });
    return node;
  }

  function hexToRgb(hex) {
    let value = String(hex || '').replace('#', '').trim();
    if (value.length === 3) value = value.split('').map(function (c) { return c + c; }).join('');
    if (!/^[0-9a-fA-F]{6}$/.test(value)) return { r: 124, g: 108, b: 255 };
    return {
      r: parseInt(value.slice(0, 2), 16),
      g: parseInt(value.slice(2, 4), 16),
      b: parseInt(value.slice(4, 6), 16)
    };
  }

  function relativeLuminance(rgb) {
    const channel = function (v) {
      const s = v / 255;
      return s <= 0.03928 ? s / 12.92 : Math.pow((s + 0.055) / 1.055, 2.4);
    };
    return 0.2126 * channel(rgb.r) + 0.7152 * channel(rgb.g) + 0.0722 * channel(rgb.b);
  }

  function bestContrast(hex) {
    return relativeLuminance(hexToRgb(hex)) > 0.42 ? '#101322' : '#ffffff';
  }

  return {
    uniqueId, clamp, escapeHtml, escapeAttribute, debounce, throttle, scheduleFrame,
    formatBytes, formatDate, pluralize, isTouchDevice, isSmallScreen, prefersReducedMotion,
    downloadText, readFile, copyText, elementFromPoint, hexToRgb, bestContrast
  };
})();

/* ─────────────────────────────────────────────────────────────────────────
   МОДУЛЬ 2. ШИНА СОБЫТИЙ (основа кастомизации ядра)
   ───────────────────────────────────────────────────────────────────────── */
const Bus = (function () {
  const listeners = new Map();

  function on(event, handler) {
    if (!listeners.has(event)) listeners.set(event, new Set());
    listeners.get(event).add(handler);
    return function () { off(event, handler); };
  }

  function off(event, handler) {
    const set = listeners.get(event);
    if (set) set.delete(handler);
  }

  function emit(event, payload) {
    const set = listeners.get(event);
    if (!set) return;
    set.forEach(function (handler) {
      try { handler(payload); } catch (error) { console.error('[PyOS] Обработчик "' + event + '" упал:', error); }
    });
  }

  return { on, off, emit };
})();

/* ─────────────────────────────────────────────────────────────────────────
   МОДУЛЬ 3. ХРАНИЛИЩЕ (устойчивое к отказам localStorage)
   ───────────────────────────────────────────────────────────────────────── */
const Store = (function () {
  const PREFIX = 'pyos.v1.';
  let available = true;

  try {
    const probe = '__pyos_probe__';
    window.localStorage.setItem(probe, '1');
    window.localStorage.removeItem(probe);
  } catch (error) {
    available = false;
    console.warn('[PyOS] localStorage недоступен, используется память сессии');
  }

  const memory = new Map();

  function read(key) {
    try {
      return available ? window.localStorage.getItem(PREFIX + key) : (memory.get(key) ?? null);
    } catch (error) { return memory.get(key) ?? null; }
  }

  function write(key, value) {
    try {
      if (available) window.localStorage.setItem(PREFIX + key, value);
      else memory.set(key, value);
      return true;
    } catch (error) {
      memory.set(key, value);
      return false;
    }
  }

  function remove(key) {
    try { if (available) window.localStorage.removeItem(PREFIX + key); } catch (error) { /* игнорируем */ }
    memory.delete(key);
  }

  function getJson(key, fallback) {
    const raw = read(key);
    if (raw === null || raw === undefined) return fallback;
    try { return JSON.parse(raw); } catch (error) { return fallback; }
  }

  function setJson(key, value) {
    return write(key, JSON.stringify(value));
  }

  function getString(key, fallback) {
    const raw = read(key);
    return raw === null || raw === undefined ? fallback : raw;
  }

  function setString(key, value) { return write(key, String(value)); }

  function totalSize() {
    let bytes = 0;
    try {
      for (let i = 0; i < window.localStorage.length; i++) {
        const key = window.localStorage.key(i);
        if (key && key.indexOf(PREFIX) === 0) {
          bytes += (key.length + (window.localStorage.getItem(key) || '').length) * 2;
        }
      }
    } catch (error) { /* игнорируем */ }
    return bytes;
  }

  function clearAll() {
    try {
      const keys = [];
      for (let i = 0; i < window.localStorage.length; i++) {
        const key = window.localStorage.key(i);
        if (key && key.indexOf(PREFIX) === 0) keys.push(key);
      }
      keys.forEach(function (k) { window.localStorage.removeItem(k); });
    } catch (error) { /* игнорируем */ }
    memory.clear();
  }

  return { getJson, setJson, getString, setString, remove, totalSize, clearAll, isPersistent: available };
})();

/* ─────────────────────────────────────────────────────────────────────────
   МОДУЛЬ 4. КОНФИГУРАЦИЯ (единая точка кастомизации)
   ───────────────────────────────────────────────────────────────────────── */
const Config = (function () {
  const DEFAULTS = {
    theme: 'dark',
    accent: '#7c6cff',
    wallpaper: 'aurora',
    particles: false,
    blur: true,
    animations: true,
    performanceMode: false,
    radiusWindow: 18,
    radiusControl: 12,
    gap: 10,
    animationSpeed: 1,
    fontUI: 'Roboto',
    fontSizeUI: 14,
    fontCode: 'JetBrains Mono',
    fontSizeCode: 14,
    lineHeight: 1.6,
    tabSize: 4,
    wordWrap: false,
    autosave: true,
    autosaveDelay: 900,
    defaultWindowMode: 'float',
    tilingLayout: 'master',
    snapEnabled: true,
    restoreSession: true,
    mobileFullscreen: true,
    bootAnimation: true,
    notifications: true,

/* ─────────────────────────────────────────────────────────────────────────
   МОДУЛЬ 6. ПРИМИТИВЫ ИНТЕРФЕЙСА
   ───────────────────────────────────────────────────────────────────────── */
const UI = (function () {

  /* — 6.1. Волна нажатия (Material You) — */
  document.addEventListener('pointerdown', function (event) {
    const target = event.target.closest('.pyos-button, .pyos-dock__item, .pyos-chip--button, .pyos-window__control, .pyos-icon-button');
    if (!target || target.disabled) return;
    const rect = target.getBoundingClientRect();
    const diameter = Math.max(rect.width, rect.height) * 2.3;
    const ripple = document.createElement('span');
    ripple.className = 'pyos-ripple';
    ripple.style.width = ripple.style.height = diameter + 'px';
    ripple.style.left = (event.clientX - rect.left - diameter / 2) + 'px';
    ripple.style.top = (event.clientY - rect.top - diameter / 2) + 'px';
    target.appendChild(ripple);
    ripple.addEventListener('animationend', function () { ripple.remove(); });
  }, { passive: true });

  /* — 6.2. Подсказки — */
  const tooltipElement = document.getElementById('pyos-tooltip');
  let tooltipTimer = null;

  function showTooltip(text, x, y) {
    if (Util.isTouchDevice()) return;
    tooltipElement.textContent = text;
    tooltipElement.classList.add('is-visible');
    const rect = tooltipElement.getBoundingClientRect();
    const left = Util.clamp(x - rect.width / 2, 8, window.innerWidth - rect.width - 8);
    const top = y + 22 + rect.height > window.innerHeight ? y - rect.height - 12 : y + 14;
    tooltipElement.style.left = left + 'px';
    tooltipElement.style.top = top + 'px';
  }

  function hideTooltip() {
    tooltipElement.classList.remove('is-visible');
    clearTimeout(tooltipTimer);
    tooltipTimer = null;
  }

  document.addEventListener('pointerover', function (event) {
    const target = event.target.closest('[data-tooltip]');
    if (!target) return;
    if (tooltipTimer) clearTimeout(tooltipTimer);
    tooltipTimer = setTimeout(function () {
      const rect = target.getBoundingClientRect();
      showTooltip(target.getAttribute('data-tooltip'), rect.left + rect.width / 2, rect.bottom - 6);
    }, 480);
  }, { passive: true });

  document.addEventListener('pointerout', function (event) {
    if (event.target.closest && event.target.closest('[data-tooltip]')) hideTooltip();
  }, { passive: true });
  document.addEventListener('pointerdown', hideTooltip, { passive: true });
  window.addEventListener('resize', hideTooltip, { passive: true });

  /* — 6.3. Контекстное меню — */
  let activeMenu = null;

  function closeMenu() {
    if (!activeMenu) return;
    const menu = activeMenu;
    activeMenu = null;
    menu.classList.add('is-closing');
    setTimeout(function () { menu.remove(); }, 160);
    document.removeEventListener('pointerdown', onMenuOutside, true);
    window.removeEventListener('resize', closeMenu);
  }

  function onMenuOutside(event) {
    if (activeMenu && !activeMenu.contains(event.target)) closeMenu();
  }

  function openMenu(items, x, y) {
    closeMenu();
    const menu = document.createElement('div');
    menu.className = 'pyos-panel pyos-menu';
    menu.setAttribute('role', 'menu');

    items.forEach(function (item) {
      if (item === '-') {
        const separator = document.createElement('div');
        separator.className = 'pyos-menu__separator';
        menu.appendChild(separator);
        return;
      }
      if (item.type === 'title') {
        const title = document.createElement('div');
        title.className = 'pyos-menu__group-title';
        title.textContent = item.label;
        menu.appendChild(title);
        return;
      }
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'pyos-menu__item' + (item.active ? ' is-active' : '');
      button.setAttribute('role', 'menuitem');
      if (item.disabled) button.disabled = true;

      button.innerHTML =
        (item.icon ? '<span class="pyos-menu__item-icon">' + Icons.get(item.icon, 18) + '</span>' : '<span class="pyos-menu__item-icon"></span>') +
        '<span class="pyos-menu__item-label">' + Util.escapeHtml(item.label) + '</span>' +
        (item.hint ? '<span class="pyos-menu__item-hint">' + Util.escapeHtml(item.hint) + '</span>' : '') +
        (item.submenu ? '<span class="pyos-menu__submenu-arrow">' + Icons.get('chevron-right', 16) + '</span>' : '');

      button.addEventListener('click', function (event) {
        event.stopPropagation();
        if (item.submenu) {
          const rect = button.getBoundingClientRect();
          openMenu(item.submenu, rect.right - 6, rect.top - 6);
          return;
        }
        closeMenu();
        if (typeof item.action === 'function') item.action();
      });

      if (item.submenu) {
        button.addEventListener('pointerenter', function () {
          const rect = button.getBoundingClientRect();
          openMenu(item.submenu, rect.right - 6, rect.top - 6);
        });
      }

      menu.appendChild(button);
    });

    document.body.appendChild(menu);
    activeMenu = menu;

    const rect = menu.getBoundingClientRect();
    const left = Util.clamp(x, 8, window.innerWidth - rect.width - 8);
    const top = Util.clamp(y, 8, window.innerHeight - rect.height - 8);
    menu.style.left = left + 'px';
    menu.style.top = top + 'px';

    setTimeout(function () {
      document.addEventListener('pointerdown', onMenuOutside, true);
    }, 0);
    window.addEventListener('resize', closeMenu);
    return menu;
  }

  /* Долгое нажатие для сенсорных экранов */
  function attachLongPress(element, handler, delay) {
    let timer = null;
    let startX = 0;
    let startY = 0;
    let fired = false;

    element.addEventListener('pointerdown', function (event) {
      if (event.pointerType === 'mouse' && event.button !== 0) return;
      fired = false;
      startX = event.clientX;
      startY = event.clientY;
      timer = setTimeout(function () {
        fired = true;
        handler(event);
      }, delay || 480);
    });

    const cancel = function (event) {
      if (timer) clearTimeout(timer);
      timer = null;
      if (event && event.type === 'pointermove') {
        if (Math.abs(event.clientX - startX) > 12 || Math.abs(event.clientY - startY) > 12) {
          if (timer) clearTimeout(timer);
          timer = null;
        }
      }
    };

    element.addEventListener('pointermove', cancel);
    element.addEventListener('pointerup', function () { if (timer) clearTimeout(timer); timer = null; });
    element.addEventListener('pointercancel', function () { if (timer) clearTimeout(timer); timer = null; });

    return function () { return fired; };
  }

  /* — 6.4. Модальные окна — */
  function modal(options) {
    return new Promise(function (resolve) {
      const backdrop = document.createElement('div');
      backdrop.className = 'pyos-modal-backdrop';

      const dialog = document.createElement('div');
      dialog.className = 'pyos-modal' + (options.wide ? ' pyos-modal--wide' : '');
      dialog.setAttribute('role', 'dialog');
      dialog.setAttribute('aria-modal', 'true');

      dialog.innerHTML =
        '<div class="pyos-modal__header">' +
          (options.icon ? '<div class="pyos-modal__icon">' + Icons.get(options.icon, 20) + '</div>' : '') +
          '<div style="flex:1;min-width:0">' +
            '<h2 class="pyos-modal__title">' + Util.escapeHtml(options.title || '') + '</h2>' +
            (options.subtitle ? '<p class="pyos-modal__subtitle">' + Util.escapeHtml(options.subtitle) + '</p>' : '') +
          '</div>' +
          '<button type="button" class="pyos-icon-button" data-close="1" data-tooltip="Закрыть">' + Icons.get('close', 18) + '</button>' +
        '</div>' +
        '<div class="pyos-modal__body"></div>' +
        '<div class="pyos-modal__actions"></div>';

      const body = dialog.querySelector('.pyos-modal__body');
      const actions = dialog.querySelector('.pyos-modal__actions');

      if (typeof options.body === 'string') body.innerHTML = options.body;
      else if (options.body instanceof Node) body.appendChild(options.body);

      (options.actions || [{ label: 'Закрыть', value: false }]).forEach(function (action) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'pyos-button ' + (action.variant ? 'pyos-button--' + action.variant : '');
        button.textContent = action.label;
        button.addEventListener('click', function () {
          const result = typeof action.value === 'function' ? action.value(dialog) : action.value;
          if (result === 'keep') return;
          close(result);
        });
        actions.appendChild(button);
      });

      function close(result) {
        backdrop.classList.add('is-closing');
        setTimeout(function () { backdrop.remove(); }, 180);
        document.removeEventListener('keydown', onKey);
        resolve(result);
      }

      function onKey(event) {
        if (event.key === 'Escape') close(false);
      }

      backdrop.addEventListener('pointerdown', function (event) {
        if (event.target === backdrop && options.dismissable !== false) close(false);
      });
      dialog.querySelector('[data-close]').addEventListener('click', function () { close(false); });
      document.addEventListener('keydown', onKey);

      backdrop.appendChild(dialog);
      document.body.appendChild(backdrop);

      const focusTarget = dialog.querySelector('input,textarea,select,button.pyos-button--filled');
      if (focusTarget && !Util.isTouchDevice()) setTimeout(function () { focusTarget.focus(); }, 60);

      if (typeof options.onMount === 'function') options.onMount(dialog, close);
    });
  }

  function confirmDialog(title, message, confirmLabel, danger) {
    return modal({
      title: title,
      subtitle: message,
      icon: danger ? 'warning' : 'info',
      actions: [
        { label: 'Отмена', value: false },
        { label: confirmLabel || 'Подтвердить', value: true, variant: danger ? 'danger' : 'filled' }
      ]
    });
  }

  function promptDialog(title, placeholder, initialValue) {
    return new Promise(function (resolve) {
      const wrapper = document.createElement('div');
      wrapper.innerHTML = '<input class="pyos-field" type="text" placeholder="' + Util.escapeAttribute(placeholder || '') + '" value="' + Util.escapeAttribute(initialValue || '') + '">';
      const input = wrapper.querySelector('input');

      modal({
        title: title,
        icon: 'pencil',
        body: wrapper,
        onMount: function (dialog, close) {
          input.addEventListener('keydown', function (event) {
            if (event.key === 'Enter') { event.preventDefault(); close(input.value.trim() || null); }
          });
        },
        actions: [
          { label: 'Отмена', value: null },
          { label: 'Готово', variant: 'filled', value: function (dialog) { return dialog.querySelector('input').value.trim() || null; } }
        ]
      }).then(resolve);
    });
  }

  /* — 6.5. Выпадающий список — */
  function dropdown(anchor, items) {
    const rect = anchor.getBoundingClientRect();
    return openMenu(items, rect.left, rect.bottom + 6);
  }

  return { openMenu, closeMenu, attachLongPress, modal, confirmDialog, promptDialog, dropdown, showTooltip, hideTooltip };
})();

/* ─────────────────────────────────────────────────────────────────────────
   МОДУЛЬ 7. УВЕДОМЛЕНИЯ
   ───────────────────────────────────────────────────────────────────────── */
const Notifications = (function () {
  const container = document.getElementById('pyos-notifications');
  const history = [];
  const MAX_HISTORY = 60;
  const ICONS_BY_TYPE = { info: 'info', success: 'check', warning: 'warning', error: 'error' };

  function push(notification) {
    const record = {
      id: Util.uniqueId('notification'),
      type: notification.type || 'info',
      title: notification.title || 'Уведомление',
      message: notification.message || '',
      time: Date.now(),
      read: false
    };

    history.unshift(record);
    if (history.length > MAX_HISTORY) history.pop();
    Store.setJson('notifications', history.slice(0, MAX_HISTORY));
    Bus.emit('notifications:changed', history);

    if (!Config.get('notifications')) return record.id;

    const element = document.createElement('div');
    element.className = 'pyos-notification pyos-notification--' + record.type;
    element.setAttribute('role', 'status');

    const duration = notification.duration || Config.get('notificationDuration') || 4200;

    element.innerHTML =
      '<div class="pyos-notification__icon">' + Icons.get(ICONS_BY_TYPE[record.type] || 'info', 18) + '</div>' +
      '<div class="pyos-notification__content">' +
        '<div class="pyos-notification__title">' + Util.escapeHtml(record.title) + '</div>' +
        (record.message ? '<div class="pyos-notification__message">' + Util.escapeHtml(record.message) + '</div>' : '') +
        (notification.actionLabel ? '<div class="pyos-notification__action"><button type="button" class="pyos-button pyos-button--small pyos-button--tonal" data-action="1">' + Util.escapeHtml(notification.actionLabel) + '</button></div>' : '') +
      '</div>' +
      '<button type="button" class="pyos-notification__close" data-dismiss="1" aria-label="Закрыть уведомление">' + Icons.get('close', 14) + '</button>' +
      '<div class="pyos-notification__timer" style="animation-duration:' + duration + 'ms"></div>';

    function dismiss() {
      if (!element.isConnected) return;
      element.classList.add('is-leaving');
      setTimeout(function () { element.remove(); }, 240);
    }

    element.querySelector('[data-dismiss]').addEventListener('click', dismiss);
    const actionButton = element.querySelector('[data-action]');
    if (actionButton && typeof notification.onAction === 'function') {
      actionButton.addEventListener('click', function () { notification.onAction(); dismiss(); });
    }
    if (notification.windowId) {
      element.style.cursor = 'pointer';
      element.addEventListener('click', function (event) {
        if (event.target.closest('button')) return;
        WindowManager.focus(notification.windowId);
        dismiss();
      });
    }

    container.appendChild(element);
    setTimeout(dismiss, duration);

    while (container.children.length > 4) container.firstElementChild.remove();
    return record.id;
  }

  function info(title, message, extra) { return push(Object.assign({ type: 'info', title, message }, extra || {})); }
  function success(title, message, extra) { return push(Object.assign({ type: 'success', title, message }, extra || {})); }
  function warning(title, message, extra) { return push(Object.assign({ type: 'warning', title, message }, extra || {})); }
  function error(title, message, extra) { return push(Object.assign({ type: 'error', title, message }, extra || {})); }

  function getHistory() { return history; }

  function clearHistory() {
    history.length = 0;
    Store.remove('notifications');
    Bus.emit('notifications:changed', history);
  }

  function loadHistory() {
    const saved = Store.getJson('notifications', []);
    if (Array.isArray(saved)) saved.forEach(function (item) { history.push(item); });
  }

  loadHistory();
  return { push, info, success, warning, error, getHistory, clearHistory };
})();

const WindowManager = (function () {

    const topbar = document.getElementById('pyos-topbar');
    const dock = document.getElementById('pyos-dock');
    const gap = Number(Config.get('gap')) || 10;
    const topHeight = topbar ? topbar.offsetHeight : 52;
    const bottomHeight = dock ? dock.offsetHeight + 14 : 74;

    workArea = {
      x: gap,
      y: topHeight + gap,
      width: Math.max(200, window.innerWidth - gap * 2),

    };

    element.style.width = windowInstance.rect.w + 'px';
    element.style.height = windowInstance.rect.h + 'px';
    element.style.transform = 'translate3d(' + windowInstance.rect.x + 'px,' + windowInstance.rect.y + 'px,0)';
  }

    const area = workArea.width ? workArea : measureWorkArea();

      x: area.x + Math.max(0, (area.width - width) / 2),

      w: Math.min(width, area.width),
      h: Math.min(height, area.height)
    };
